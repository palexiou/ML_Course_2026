<body>
<main class="deck-viewport" aria-label="Machine learning for bioinformatics presentation"><div class="deck-stage" id="stage"></div></main>
<div class="edit-hotzone" id="editHotzone" aria-hidden="true"></div><button class="edit-toggle" id="editToggle" aria-label="Toggle text editing (E)" aria-pressed="false">Edit text</button><div class="save-status" id="saveStatus" role="status"></div>
<nav class="deck-controls" aria-label="Presentation controls"><button id="previous" aria-label="Previous slide">←</button><span id="counter" aria-hidden="true"></span><button id="next" aria-label="Next slide">→</button><select id="daySelect" aria-label="Jump to course day"><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option></select><button id="notesToggle" aria-label="Toggle instructor notes (N)" aria-pressed="false">Notes</button><button id="moreToggle" aria-label="More presentation controls" aria-expanded="false">•••</button><button class="toolbar-extra" id="fullscreen">Full screen</button><button class="toolbar-extra" id="export">Save HTML</button></nav>
<div class="progress" aria-hidden="true"><div id="progressBar"></div></div><div class="sr-only" id="announcement" aria-live="polite"></div>
<script>
const slides = [];
const panel = (title, body, tone = '') => `<div class="panel ${tone}"><h2>${title}</h2>${body}</div>`;
const columns = (left, right) => `<div class="columns">${left}${right}</div>`;
const list = (...items) => `<ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
const equation = (body, explanation = '') => `<div class="equation">${body}${explanation ? `<small>${explanation}</small>` : ''}</div>`;
const code = text => `<pre><code>${text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')}</code></pre>`;
const flow = (...nodes) => `<div class="flow">${nodes.map((node, index) => `${index ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<div class="node">${node}</div>`).join('')}</div>`;
const table = (headers, rows) => `<table><thead><tr>${headers.map(header => `<th scope="col">${header}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function add(day, time, title, subtitle, body, takeaway, notes, kind = '') { slides.push({day, time, title, subtitle, body, takeaway, notes, kind}); }
function pause(day, time, next) { add(day, time, 'Break · 10 minutes', 'Step away. Return at the time shown in the session plan.', `<div class="eyebrow">After the break</div><h2>${next}</h2><p>Leave model settings unchanged. Keep protected test results closed.</p>`, 'Questions and interpretation are protected teaching time.', 'Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.', 'break'); }
</script>
<script id="course-content">
add(1, '0–10 · startup', 'Machine learning for bioinformatics', 'Four in-person sessions · 180 minutes each · master’s bioinformatics', flow('<b>Day 1</b>Define & evaluate<span>4-mers · linear models · forests</span>', '<b>Day 2</b>Learn features<span>One-hot DNA · position-aware CNN</span>', '<b>Day 3</b>Reuse features<span>Frozen embeddings · planned reveal</span>', '<b>Day 4</b>Delegate & audit<span>Specification · evidence · limits</span>') + panel('Start here · no preparation required', '<p>Check Colab access now. Open <a href="../paste_ready/01_simple_signal.py">standalone code 01</a>, copy the entire file into a Python cell, and run it. Installation and startup belong inside these ten minutes.</p><p class="small">Local code verification is not a Colab rehearsal. If access fails, observe the instructor and use clearly identified saved outputs.</p>', 'blue'), 'Every day asks: what did the model see, and what does the evidence support?', 'Check access and startup, not prior knowledge. One instructor; pairs can discuss without paid accounts. Use instructor/guide.md for setup and instructor/exercises.md for missing-code snippets. Arrow keys navigate; N opens notes; E enables editing. No homework, exam, or submission.');
add(1, '10–16 · diagnostic', 'Prediction is a scientific experiment', 'Discuss first: what would make a sequence classifier convincing?', columns(panel('A biological motivation', list('A promoter is a useful motivation for sequence classification.', 'Our observations are simulated DNA sequences, not measured promoters.', 'Ask whether a model predicts labels in a new sample from the defined process.')), panel('Two-minute pair discussion', list('What is an observation? What is the label?', 'Could two different sample IDs still be related?', 'Would 95% accuracy prove promoter recognition?'), 'teal')), 'Prediction, generalization, and biological mechanism are different claims.', 'Ungraded diagnostic. Expected: observation is one sequence; label is simulation class; related sequences can share a family even with unique IDs; accuracy alone proves neither independence nor promoter function. Accept uncertainty. Transition: first define the experiment, then choose an algorithm.');
add(1, '16–24 · ML map', 'One map, four kinds of questions', 'Choose the learning problem before choosing the model.', table(['Learning setting', 'What is supplied?', 'Example question'], [['Supervised classification', 'Inputs and discrete labels', 'Which simulated class does this sequence belong to?'], ['Supervised regression', 'Inputs and numeric targets', 'What expression level is predicted?'], ['Unsupervised learning', 'Inputs without task labels', 'Which samples have similar representations?'], ['Self-supervised learning', 'Targets constructed from the inputs', 'Which masked DNA token is plausible in context?']]) + panel('In this course', '<p>Days 1–2 train supervised classifiers. Day 3 reuses a representation learned with self-supervision, then fits a supervised classifier.</p>', 'blue'), '“No hand labels in pretraining” does not mean “no training objective.”', 'Ask which row describes predicting a measured concentration: regression. Clustering labels after the fact is not automatically a valid classifier. Keep the map brief; do not survey algorithms. The same representation can support several downstream tasks.');
add(1, '24–34 · simulation', 'A noisy motif signal, not a perfect rule', 'Simple-signal variant · seed 2026 · 1,200 sequences · 160 bases each', columns(panel('How the data are generated', list('Start from independent uniform A/C/G/T backgrounds.', 'Balance labels: 600 class 0 and 600 class 1.', 'Plant <code>TATAAATG</code> at a random position with probability 0.9 in class 1 and 0.1 in class 0.')), panel('What a learner may see', list('Input: DNA sequence. Target: binary label.', 'IDs define identity and split membership, not predictive features.', 'Simulation truth records deliberate planting; incidental motif matches are different.'), 'teal')) + equation('P(planted | y = 1) = 0.9 ≠ 1', 'Some class-1 sequences lack the planted motif; some class-0 sequences contain it.'), 'Known simulation truth lets us test explanations without pretending to discover biology.', 'Have students predict whether a perfect motif detector gets every label right: no. Planting is stochastic, and background can contain incidental matches. Do not imply nuisance shifts or real promoter annotation exist in this implemented simple-signal variant.');
add(1, '34–42 · representation', 'Turn sequence into a bag of 4-mers', 'Overlapping windows become a fixed-length numeric representation.', code('ACGTAC  →  ACGT | CGTA | GTAC\n\n160 bases → 157 overlapping windows\n4 possible bases, length 4 → 4⁴ = 256 possible 4-mers') + columns(panel('What survives', '<p>How often each short word appears. A linear classifier can combine evidence from several overlapping pieces of a motif.</p>', 'blue'), panel('What disappears', '<p>The vector does not record which occurrence was at base 32, which was at base 80, or their long-range order.</p>')), 'A representation is a decision about which distinctions the model can make.', 'Ask students whether shifting a motif always preserves all counts: not necessarily, because the boundary windows change. The Day 2 controlled construction uses matching flanks to guarantee equal bags. Avoid treating arbitrary sequence permutations as count-preserving.');
add(1, '42–50 · practical', 'Inspect first, then encode', 'Pairs · six minutes to inspect, two minutes to compare interpretations.', columns(panel('Do this now', list('Inspect sequence length, alphabet, sample IDs, and class counts from <a href="../paste_ready/01_simple_signal.py">code 01</a>.', 'Use <a href="../instructor/exercises.md">Day 1 exercise</a>: complete the validation prediction step.', 'Predict whether a bag of 4-mers retains motif position.')), panel('Explain to your partner', list('Why is the target not simply “motif present”?', 'Why should IDs and simulation-truth fields stay out of the model?', 'Optional: enumerate the five overlapping 4-mers inside <code>TATAAATG</code>.'), 'teal')), 'Inspect the input contract before interpreting any metric.', 'Expected five windows: TATA, ATAA, TAAA, AAAT, AATG. Repeated or incidental matches are possible in full sequences. Target is the sampled binary class, not the planting flag. Optional extension stays validation-only; do not run a hyperparameter sweep.');
pause(1, '50–60 · break', 'Train, validation, and protected test identities');
add(1, '60–70 · evaluation design', 'Three partitions, three different jobs', 'Simple-signal split: stratified 60% / 20% / 20%, recorded once and reused.', flow('<b>Training · 720</b>Fit features and parameters<span>Only training data fit learned preprocessing</span>', '<b>Validation · 240</b>Develop and compare<span>Repeated use makes it development evidence</span>', '<b>Protected test · 240</b>One planned comparison<span>Freeze first; reveal on Day 3</span>') + panel('Boundary, not magic', '<p>Keep identities fixed across representations. Frozen, label-independent extraction may cache test-input embeddings. Protected test labels and scores must not guide development.</p>', 'warning'), 'A new representation does not authorize a new favorable split.', 'The main simple-signal data have independent sequence groups. Later interaction pairs remain together. Explain training-only vocabulary/scaling even when labels are not used by a transform. Cache access is not test-label access. Do not promise secrecy by file permissions: this is a declared teaching boundary.');
add(1, '70–80 · logistic regression', 'A weighted sum becomes a probability', 'The baseline learns which 4-mer features support class 1.', equation('z = b + Σⱼ wⱼxⱼ &nbsp;&nbsp;&nbsp; p(y = 1 | x) = 1 / (1 + e<sup>−z</sup>)', 'xⱼ: count for 4-mer j · wⱼ: learned weight · b: intercept') + columns(panel('Interpret a coefficient', '<p>A positive coefficient increases the score as that count increases, holding the other features fixed. Correlated overlapping words complicate interpretation.</p>'), panel('Worked prediction', '<p>For an illustrative <strong>z = 1.2</strong>, the sigmoid is approximately <strong>0.769</strong>. At threshold 0.5, predict class 1.</p><p class="small">Illustrative arithmetic, not an observed course prediction.</p>', 'teal')), 'A coefficient is conditional predictive evidence, not proof of a causal motif.', 'Ask what happens for z=0: p=0.5. Explain regularization as discouraging extreme weights rather than deriving the optimizer. A high probability is model output; calibration is a separate property. Do not interpret 0.769 as a measured biological probability.');
add(1, '80–90 · metrics', 'Rankings and decisions answer different questions', 'Declare ROC-AUC as the primary metric; threshold-based metrics use 0.5.', columns(panel('An illustrative confusion matrix', table(['Actual / predicted', 'Class 1', 'Class 0'], [['Class 1', 'TP = 8', 'FN = 2'], ['Class 0', 'FP = 3', 'TN = 7']]) + '<p class="small">Accuracy = 15/20 = 0.75 · precision = 8/11 ≈ 0.73 · recall = 8/10 = 0.80.</p>'), panel('Threshold-free summaries', list('ROC-AUC: probability a randomly selected positive outranks a negative, with half credit for ties.', 'Average precision summarizes the precision–recall curve; it is not trapezoidal PR-AUC.', 'A score without the split, metric, and sample population is incomplete.'), 'blue')), 'Changing a decision threshold can change precision and recall without changing ROC-AUC.', 'Ask whether high accuracy on 99% negative data suffices: an all-negative model can look accurate. Our main variants are balanced, but the distinction still matters. ROC-AUC 0.5 is a chance-ranking reference, not proof a model ignored every feature.');
add(1, '90–100 · practical', 'Fit only on training; predict by identity', 'Use the completed pipeline, then fill the small validation step.', code('pipeline.fit(train["sequence"], train["label"])\nprobabilities = pipeline.predict_proba(\n    validation["sequence"]\n)[:, 1]\n\nroc_auc_score(validation["label"], probabilities)') + panel('Pair task', '<p>Use <a href="../instructor/exercises.md">the Day 1 snippet</a>. Keep sample IDs attached to predictions. Explain why fitting a vocabulary or scaler before splitting violates the protocol, even without labels.</p>', 'teal'), 'Pipeline order and sample alignment are part of the scientific result.', 'This is a teaching extract, not a replacement script. Run the full standalone 01 for imports, data generation, metrics, and artifacts. Expected answer: evaluation inputs can influence learned preprocessing, violating training-only fitting; the magnitude of resulting optimism is not established by identifying the defect.');
pause(1, '100–110 · break', 'Trees, random forests, and evidence from validation');
add(1, '110–122 · trees and forests', 'A tree asks questions; a forest averages', 'Nonlinear prediction does not remove the need for a valid experiment.', flow('<b>A decision node</b>Is a 4-mer count above a threshold?<span>Split chosen using training data</span>', '<b>A tree</b>Follow a sequence of questions<span>Leaves summarize training labels</span>', '<b>A forest</b>Average many trees<span>Bootstrap samples and feature randomness</span>') + columns(panel('Why averaging helps', '<p>Individual deep trees can be unstable. Combining differently trained trees can reduce variance; it does not guarantee better validation performance.</p>'), panel('Use the supplied implementation', '<p><a href="../paste_ready/01_simple_signal.py">Code 01</a> includes logistic regression and a 100-tree random forest. Do not spend the class rebuilding a forest.</p>', 'blue')), 'A more flexible model can learn signal, noise, or a shortcut.', 'Optional detail: trees partition feature space and can capture conditional relationships between counts. Shorten this explanation first if delayed. The same declared split and metric policy applies to both models. Day 2 code 03 uses the same classical defaults.');
add(1, '122–140 · compare and interpret', 'What do these validation scores support?', 'Recorded default run · simple-signal variant · ROC-AUC · not test results', table(['Representation / model', 'Validation ROC-AUC', 'Defensible interpretation'], [['Bag of 4-mers / logistic regression', '0.801944', 'The counts contain useful class information.'], ['Bag of 4-mers / random forest', '0.906806', 'This fitted nonlinear model ranks better in this run.']]) + panel('Inspect, then challenge', '<p>Compare important 4-mers with the planted motif. Correlated windows can share importance. Ask: would the same importance pattern prove real promoter recognition?</p><p>Pair task: state one supported claim and one claim these scores do not support.</p>', 'teal'), 'A validation advantage is a result of this configuration, not a universal model ranking.', 'Use actual saved outputs only when clearly labeled as previous local execution. Students can inspect feature importance without assuming exact recovery. Supported: RF has higher validation ROC-AUC here. Unsupported: RF is always better; all important words are causal; this is a real promoter benchmark. Leave ten minutes for student interpretation rather than more tree theory.');
add(1, '140–150 · consolidate', 'What would falsify our explanation?', 'A good explanation predicts how evidence should change.', columns(panel('Check the experiment', list('Keep the split manifest and metric policy fixed.', 'Check prediction IDs, not only array lengths.', 'Compare feature importance with simulation truth; do not feed truth fields into training.')), panel('Make a prediction', list('If planting became less associated with labels, what should happen?', 'If IDs encoded labels, would high performance be reassuring?', 'If two representations use different validation IDs, is the comparison fair?'), 'teal')), 'Protect evaluation and interpretation before adding another model.', 'Expected: weaker label-associated planting should generally weaken usable signal, not dictate an exact score; label-coded IDs are a shortcut; different IDs confound comparison. These are discussion counterfactuals, not new reported runs. Transition to the separate leakage activity.');
add(1, '150–180 · leakage, discussion, buffer', 'A high score can answer the wrong question', 'Separate leakage investigation · do not alter the main course split.', flow('<b>Family background</b>Related sequence members<span>One randomly assigned family label</span>', '<b>Random row split</b>Families cross the boundary<span>Family recognition can look predictive</span>', '<b>Group split</b>Hold out whole families<span>Tests transfer to unseen families</span>') + columns(panel('Run or inspect', '<p>Use <a href="../paste_ready/02_split_leakage.py">standalone code 02</a>. Compare row-level and family-level splitting. Inspect group overlap before interpreting the scores.</p>', 'blue'), panel('Predict and explain', '<p>Family labels are random and unrelated to background. Why can related validation rows still receive useful predictions? What should transfer to a new family?</p>', 'teal')), 'Unique sample IDs do not guarantee independent evaluation units.', 'Suggested pacing: 3 minutes predict, 8 run/inspect, 9 compare evidence, 5 recap, 5 questions/buffer. Short route: inspect saved outputs and group-overlap diagnostics rather than rerun. Expected: family resemblance leaks family labels across row splits; arbitrary labels do not supply a transferable rule for new families. Do not promise an exact chance score in a finite sample. End with training-only fit, validation-only development, protected test comparison.');
add(2, '0–10 · recap', 'Day 2 · Learn the representation', 'Yesterday we chose the features. Today we fit features and a classifier together.', columns(panel('Retrieve yesterday’s experiment', list('What did a bag of 4-mers preserve?', 'Which data fitted the pipeline?', 'Why did the separate family leakage exercise need a group split?')), panel('Today’s question', '<p>Can a representation retain the position and order that a bag of 4-mers discards?</p><p>We will compare the same models on the same variants, not assign each model a favorable task.</p>', 'teal')) + flow('<b>Sequence</b>Same 160-base inputs', '<b>Representation</b>Fixed one-hot → learned features', '<b>Evaluation</b>Same IDs and boundary'), 'Learning a representation changes the hypothesis, not the evaluation contract.', 'Expected recap: counts survive, position does not; fit training only; families are evaluation units. Preserve 0–10 for student answers, not setup repetition. Open standalone code 03 but do not start tuning.');
add(2, '10–20 · neuron', 'A neuron starts with familiar arithmetic', 'Linear score → nonlinear activation → another learned transformation.', equation('a = ReLU(b + Σⱼ wⱼxⱼ) &nbsp;&nbsp;&nbsp; ReLU(z) = max(0, z)', 'An activation introduces nonlinearity; stacking only linear maps would remain linear.') + columns(panel('Worked hidden unit', '<p>Inputs (2, 1), weights (0.5, −1), bias 0.2 give <strong>z = 0.2</strong>, so <strong>a = 0.2</strong>.</p><p>Changing the second input to 2 gives z = −0.8, so a = 0.</p>', 'blue'), panel('Connect to prediction', '<p>The final layer produces a logit. The sigmoid converts that logit into a class-1 probability, just as in logistic regression.</p>')), 'Hidden units transform features; the output layer still answers a defined prediction question.', 'Ask students to compute both examples before revealing verbally. Explain that many hidden units can combine features. Do not imply an individual hidden unit has a biological meaning. No gradient derivation required.');
add(2, '20–30 · loss', 'The loss tells training what “wrong” means', 'Binary cross-entropy penalizes confident errors strongly.', equation('ℓ(y, p) = −[y log(p) + (1 − y) log(1 − p)]', 'Training averages this loss over examples. The implemented loss consumes logits for numerical stability.') + columns(panel('Two illustrative predictions', '<p>For y = 1: p = 0.8 gives loss ≈ 0.223; p = 0.2 gives loss ≈ 1.609.</p><p>Both concern one label; neither is a course-model result.</p>'), panel('Loss is not ROC-AUC', '<p>Loss provides a trainable objective. Validation ROC-AUC selects the saved CNN epoch in the supplied workflow.</p><p>Lower training loss alone does not establish better generalization.</p>', 'teal')), 'Separate the optimized training objective from the declared evaluation metric.', 'Natural logarithms in the examples. Ask why a confidently wrong prediction should cost more. Explain why sigmoid is used for prediction while BCEWithLogitsLoss handles it internally during training; do not apply sigmoid twice to the training logits.');
add(2, '30–40 · optimization', 'Training is repeated error correction', 'Backpropagation assigns local responsibility; an optimizer updates parameters.', flow('<b>Forward pass</b>Compute logits and loss<span>Current filters and classifier</span>', '<b>Backward pass</b>Compute loss gradients<span>Chain rule through operations</span>', '<b>Optimizer step</b>Update parameters<span>Repeat over minibatches and epochs</span>') + equation('θ ← θ − η ∇<sub>θ</sub>L &nbsp; (gradient-descent intuition)', 'θ: parameters · η: learning rate · actual optimizer may adapt step sizes') + panel('Read a training curve', '<p>Training loss falling while validation ranking worsens is a warning about overfitting. Keep the selected epoch and its validation evidence; do not select with test labels.</p>', 'warning'), 'Backpropagation is a method for computing derivatives, not a biological explanation.', 'Conceptual only. Ask what happens if learning rate is too large: unstable updates are possible. The formula is gradient-descent intuition, not a claim that the supplied optimizer is plain SGD. The supplied selection keeps highest validation ROC-AUC with earliest tie.');
add(2, '40–50 · one-hot DNA', 'One-hot DNA preserves each position', 'A fixed alphabet encoding is not yet a learned representation.', columns(panel('Encoding A C G T', table(['Channel / position', 'A', 'C', 'G', 'T'], [['A', '1', '0', '0', '0'], ['C', '0', '1', '0', '0'], ['G', '0', '0', '1', '0'], ['T', '0', '0', '0', '1']])), panel('Connect shape to code', list('One sequence: <code>(4, 160)</code>.', 'A batch: <code>(batch, 4, 160)</code>.', 'Unlike A=0, C=1, G=2, T=3, one-hot does not imply numeric distances between bases.', 'Pair task: encode <code>ACGT</code> and identify the position axis.'), 'teal')), 'One-hot preserves order; convolution learns which local patterns matter.', 'Use instructor/exercises.md Day 2 snippet. Expected channel order A,C,G,T. Course inputs contain only unambiguous uppercase bases; do not invent an unknown-base encoding. Optional faster-student extension: count the number of ones per position and per sequence.');
pause(2, '50–60 · break', 'Convolution, global max pooling, and a position-aware classifier');
add(2, '60–73 · convolution', 'A convolution applies one local detector repeatedly', 'Shared weights scan the position axis; different filters can detect different patterns.', equation('h<sub>f,t</sub> = ReLU(b<sub>f</sub> + Σ<sub>c,j</sub> W<sub>f,c,j</sub>x<sub>c,t+j</sub>)', 'f: filter · c: base channel · j: local offset · t: sequence position') + flow('<b>One-hot DNA</b>4 channels × 160 positions', '<b>16 filters</b>Width 7, padding 3', '<b>16 filters</b>Width 5, padding 2') + panel('What is learned?', '<p>Filter weights, not a supplied motif list. A high activation can indicate a useful local feature, but is not automatically a calibrated motif match or a causal binding event.</p>', 'blue'), 'Weight sharing provides a local-pattern bias; the final architecture determines what happens to position.', 'Explain padding preserves length in this implementation. Slide equation suppresses padding indexing for readability. Two convolutions with ReLU are the actual filters, not a generic single-layer cartoon. Ask what the same filter can do at two positions: reuse weights.');
add(2, '73–84 · architecture', 'This CNN deliberately keeps position', 'Flattened convolution map plus global max features → a small classifier.', flow('<b>Convolution map</b>16 × 160', '<b>Concatenate</b>Flatten: 2,560<br>Global max: 16', '<b>Classifier</b>2,576 → 32 → 1<br>ReLU then logit') + columns(panel('Flattened map', '<p>Retains which activation occurred at each fixed position. The classifier can assign different weights to base-32 and base-80 neighborhoods.</p>', 'teal'), panel('Global max branch', '<p>Keeps the strongest activation per channel without its location. Global max alone would discard the position cue this teaching construction uses.</p>')), 'The interaction result depends on a position-aware architecture, not “CNN” as a label.', 'Show course_inference.SequenceCNN if asked; forward concatenates features.flatten(1) and features.amax(dim=2). No dropout or generic pooling-only model should be described here. Position sensitivity is useful in this construction and can be a limitation when deployment shifts motifs.');
add(2, '84–100 · practical', 'Train the supplied CNN; inspect the boundary', 'Complete a small step, not an architecture from scratch.', columns(panel('Run and inspect', list('Use <a href="../paste_ready/03_representations.py">standalone code 03</a> and <a href="../instructor/exercises.md">the Day 2 snippet</a>.', 'Inspect one-hot shape and the two representation branches.', 'Run the simple-signal training and inspect validation predictions.', 'Track saved epoch, seed, metric, and sample IDs.')), panel('Before looking at results', list('Should a larger model necessarily beat the 4-mer baseline on 720 training samples?', 'What would overfitting look like?', 'If training is slow, inspect identified saved outputs rather than silently changing settings.'), 'blue')), 'A successful training loop is an engineering result; held-out prediction is a separate result.', 'Protect the full 16 minutes for running and interpreting. Use supplied completed code for slow students. Optional extension only: count learned parameters or inspect activations. Expected: no guaranteed advantage; model capacity and optimization differ, and validation can deteriorate while training improves. Local run timings are not a Colab classroom estimate.');
pause(2, '100–110 · break', 'A controlled fixed-position motif-order experiment');
add(2, '110–123 · interaction construction', 'Same ingredients; different fixed-position order', 'Interaction-signal variant · 240 independent pairs · 480 sequences · paired splits', panel('Illustrative pair · shared background within a pair', '<div class="dna"><span class="position">Class 1 · block 32</span><span>GGGGGG</span><span class="motif">TATAAATG</span><span>CCCCCC</span><span>…</span><span class="motif second">CGGACGTC</span></div><div class="dna"><span class="position">Class 0 · block 32</span><span>GGGGGG</span><span class="motif second">CGGACGTC</span><span>CCCCCC</span><span>…</span><span class="motif">TATAAATG</span></div><p class="small">The second full block starts at 80. Both blocks have six Gs before and six Cs after the motif. Starts 32 and 80 are zero-based block starts; motif starts are 38 and 86.</p>', 'blue') + list('Swap the motifs between the two fixed blocks, leaving shared background unchanged.', 'Both members of each pair stay in one partition: 144 / 48 / 48 pairs in train / validation / test.'), 'This is engineered fixed-position motif order, not a general biological grammar task.', 'The diagram abbreviates the second block; explain that both flanks are present at both positions. The code positions refer to the start of the flank+motif+flank block, not the motif itself. Do not imply realistic promoter architecture, learned spacing rules, or arbitrary long-range interactions.');
add(2, '123–132 · representation proof', 'Identical feature vectors force identical scores', 'A controlled impossibility result for any classifier using only these 4-mer bags.', equation('φ<sub>4-mer</sub>(sequence<sub>0</sub>) = φ<sub>4-mer</sub>(sequence<sub>1</sub>)', 'Matching flanks preserve boundary windows when the equal-length motif blocks are swapped.') + columns(panel('Why the bag cannot solve it', '<p>Each pair supplies the same vector with opposite labels. A deterministic classifier of that vector must assign the same score to both members.</p><p>The balanced paired evaluation therefore yields chance ROC-AUC.</p>'), panel('Why this CNN can distinguish them', '<p>Flattened activations retain fixed positions. A dense layer can use “motif A near the first block” versus “motif A near the second block.”</p><p>That does not show position-invariant reasoning.</p>', 'teal')), 'No hyperparameter search can recover information that the representation removed.', 'Ask students whether adding more trees can distinguish identical vectors: no. This exact equality relies on the construction, not all motif swaps. The paired balanced test structure is the mathematical control; do not inspect protected labels in class to check it.');
add(2, '132–140 · observed validation', 'The same comparison tells two different stories', 'Actual default validation ROC-AUC · fixed split identities · no promised ranking', table(['Method', 'Simple-signal', 'Interaction-signal'], [['4-mer logistic regression', '0.801944', '0.500000'], ['4-mer random forest', '0.906806', '0.500000'], ['Position-aware CNN', '0.564306', '1.000000']]) + panel('Interpret both columns', '<p>The CNN is weak on the noisy simple-signal run yet solves the engineered fixed-position control. The comparison demonstrates a representation distinction, not universal superiority.</p>', 'teal'), 'A controlled result can be informative without being a realistic biological benchmark.', 'These are supplied default local results, not fabricated examples or test results. If rerun changes configuration, clearly distinguish the new run. Ask students to explain why the CNN column does not invalidate the classical baseline or prove biological utility.');
add(2, '140–150 · controlled changes', 'Probe model behavior, not only its score', 'Predict a response before running a controlled change.', columns(panel('Use the Day 2 activity', list('Swap the two motif blocks in the paired construction.', 'Verify that the 4-mer vectors remain equal.', 'Compare predicted probabilities for the pair.', 'Inspect which position-aware signal the CNN could exploit.')), panel('Separate experiment from speculation', list('Expected control: same 4-mer input implies the same baseline score.', 'Observed CNN response is evidence about this fitted predictor.', 'New motif positions are an optional distribution-shift question, not a reported result.'), 'blue')), 'A prediction-change experiment can challenge an explanation; it does not establish biological causality.', 'Use instructor/completed/day2_representation.py for the focused activity. Ask whether a CNN response proves a motif is biologically functional: no. Keep unperformed moves, deletions, and randomizations labeled hypothetical. Any new experiment remains validation-only.');
add(2, '150–180 · synthesis and buffer', 'Choose an inductive bias you can defend', 'Discuss in pairs, report one limitation, then take questions.', table(['Choice', 'Exposes / retains', 'Limit to remember'], [['4-mer bag', 'Local composition; cheap, direct features', 'Fixed-position order is absent'], ['One-hot + this CNN', 'Local detectors and position-aware combination', 'Data/optimization cost; fixed-position reliance'], ['Tomorrow’s frozen embeddings', 'A representation learned before our task', 'Transfer is not guaranteed']]) + panel('Exit discussion', '<p>When would you prefer the simple model even if a flexible model can fit a constructed task? Which evidence would justify collecting biological data rather than trying another architecture?</p>', 'teal'), 'The scientific question and the information available determine what “better” means.', 'Suggested 8 minutes pairs, 10 debrief, 7 recap, 5 buffer. Expected preferences include cost, reproducibility, fewer samples, and transparent feature assumptions. Do not promise pretrained embeddings will improve tomorrow’s results. Protect interpretation over extra optimizer or transformer theory.');
add(3, '0–10 · recap', 'Day 3 · Reuse a pretrained representation', 'Can useful sequence features be learned before seeing our course labels?', flow('<b>Pretraining</b>Learn from sequences<span>A self-supervised objective</span>', '<b>Frozen encoder</b>Sequence → vector<span>No course-label gradient updates</span>', '<b>Small classifier</b>Vector → probability<span>Fit using training labels</span>') + panel('Retrieve yesterday’s lesson', '<p>Which representation solved fixed-position order? Which information did the 4-mer bag remove? Predict one reason a pretrained representation might fail to help on our artificial task.</p>', 'teal'), 'Pretraining changes where features come from; it does not remove evaluation.', 'Expected: position-aware CNN can use fixed order; bags remove location; pretraining may emphasize unrelated features or mismatch organism/context/objective. Open code 04 only after datasets from code 03 exist. Do not reveal test scores during setup.');
add(3, '10–20 · pretraining', 'Self-supervision manufactures a training question', 'Mask a token and predict it from context: the target comes from the original input.', code('Observed context:    … ACGTAC [MASK] GGATCC …\nSelf-supervised task: predict the original token\n\nCourse task:         predict a simulated binary label') + columns(panel('What may transfer', '<p>Statistical regularities useful for the pretraining objective may yield features useful for a downstream classifier.</p>', 'blue'), panel('What is not implied', '<p>Reusable features are not a guarantee of promoter recognition, causal knowledge, or improved validation performance on this simulation.</p>')), 'A pretraining objective and a downstream biological claim are not the same thing.', 'Explain the masking diagram is conceptual, not an actual tokenizer output or recorded prediction. Avoid claiming which motifs the encoder has learned. Pretraining corpus coverage and overlap are separate audit questions; we have not audited overlap.');
add(3, '20–30 · attention', 'Attention lets a token borrow context', 'A weighted combination changes a representation using other positions.', equation('Attention(Q, K, V) = softmax(QKᵀ / √d<sub>k</sub>)V', 'Queries ask, keys match, values contribute. Softmax weights sum to one within each attended row.') + columns(panel('Illustrative two-token arithmetic', '<p>If attention weights are (0.75, 0.25) and scalar values are (2, 6), their weighted sum is <strong>3</strong>.</p><p>Real hidden representations are vectors with multiple layers and heads.</p>'), panel('An interpretation limit', '<p>Attention can connect distant positions, but an attention weight is not direct evidence of biological causality or a complete explanation of a prediction.</p>', 'teal')), 'Context dependence is a mechanism; biological meaning must still be tested.', 'No transformer derivation. Ask students to calculate 0.75×2+0.25×6 before debrief. Diagram and numbers are illustrative, not extracted weights. Keep conceptual attention distinct from the downstream mean-pooling rule.');
add(3, '30–40 · frozen versus fine-tuned', 'Freeze the encoder, fit the classifier', 'Our practical extracts features; it does not fine-tune the DNA model.', table(['Stage', 'Frozen-embedding practical', 'Fine-tuning contrast'], [['Encoder parameters', 'Fixed pretrained weights', 'Some or all weights updated'], ['Course labels', 'Used by the small classifier only', 'Can update the encoder through loss'], ['Trainable workflow', 'Training-only scaler + logistic regression', 'A different optimization experiment'], ['Cost and provenance', 'Record extraction and classifier separately', 'Additional optimizer/checkpoint choices']]) + panel('Do not confuse two meanings of freeze', '<p><strong>Frozen encoder:</strong> no parameter updates during extraction. <strong>Workflow freeze:</strong> lock the developed analysis before the planned Day 3 test comparison.</p>', 'blue'), 'An encoder can be frozen long before the whole analysis is frozen.', 'Ask whether validation-selected classifier settings count as fine-tuning the encoder: no. The classifier is supervised even though extraction is label-independent. Fine-tuning is conceptual only; no extra training exercise is required.');
add(3, '40–50 · representation contract', 'What exactly is the embedding?', 'Pinned NT-v2 50M multispecies encoder · 512-component last-layer mean', flow('<b>160 bases</b>Tokenize without truncation<span>26 six-mers + 4 single bases + CLS</span>', '<b>Last hidden layer</b>Contextual token vectors<span>31 input tokens in this setting</span>', '<b>Masked mean</b>Average content tokens<span>Exclude special IDs and padding</span>') + equation('e = (Σ<sub>t ∈ content</sub> h<sub>t</sub>) / |content| &nbsp;&nbsp; ∈ ℝ<sup>512</sup>', 'Content membership is derived from token IDs. Labels are not passed to extraction.') + '<p class="small">Checkpoint: <code>InstaDeepAI/nucleotide-transformer-v2-50m-multi-species</code><br>Revision: <code>81b29e5786726d891dbf929404ef20adca5b36f1</code></p>', '“An embedding” is incomplete without model, revision, layer, pooling, and sample identity.', 'Source: docs/foundation-embedding-verification.md. Do not call tokenization overlapping 6-mers. State eval mode and inference_mode for extraction. The 31-token count applies to these unambiguous 160-base inputs, not arbitrary sequences. Pooled output is 512 components, not 31×512.');
pause(3, '50–60 · break', 'A small extraction, then the validated full-data cache');
add(3, '60–70 · execution and provenance', 'Run small before trusting the cache', 'Actual local verification exists; classroom Colab verification is separate.', columns(panel('Execution sequence', list('Open <a href="../paste_ready/04_foundation_embeddings.py">standalone code 04</a> after code 03.', 'Inspect extraction for two sequences, then use validated full-data caches.', 'Use frozen weights, evaluation mode, and inference mode.', 'Fit scaler and logistic regression on training embeddings only.')), panel('Recorded local evidence', '<p>CPU, Python 3.13.14, PyTorch 2.10.0+cpu, Transformers 4.57.1.</p><p>Two-sequence extraction: 0.226 s simple-signal, 0.187 s interaction-signal. Full simple-signal extraction + cache checks: 77.62 s.</p><p class="small">Excludes install/download. Not classroom network or Colab timings.</p>', 'blue')), 'Inspecting a previous output is not a live extraction; label it honestly.', 'Source docs/foundation-embedding-verification.md. Checkpoint initialization from downloaded weights took 2.60 s locally; do not add it to extraction and claim a classroom total. Actual Colab and full-session rehearsal remain unrun. If live extraction fails, name that failure and use identified caches without claiming the live requirement passed.');
add(3, '70–80 · loading safely', 'Pin executable code as well as model weights', 'The course uses a custom architecture; loading is a reproducibility and trust decision.', columns(panel('Declared loading contract', list('<code>AutoModelForMaskedLM</code> with the pinned custom model and code revision.', 'Model loading requires <code>trust_remote_code=True</code>; inspect the pinned source.', 'Tokenizer uses <code>trust_remote_code=False</code> and <code>use_fast=False</code>.')), panel('Do not overstate the checks', list('Safetensors avoids pickle-based weight loading; it does not stop custom model code executing.', 'Load only trusted, locally created joblib artifacts.', 'Weight license: CC-BY-NC-SA-4.0; check suitability before reuse outside this course.'), 'warning')), 'Reproducibility metadata and source inspection reduce uncertainty; neither is a security guarantee.', 'The custom model uses SwiGLU layers; a superficially similar built-in architecture is not interchangeable. Do not ask students for keys: local checkpoint download was public and ungated. The local source inspection is recorded, not a full security audit. Teaching software safety is bounded to this loading contract.');
add(3, '80–90 · cache audit', 'A correct shape is not enough', 'A cache row must describe the exact sequence attached to its sample ID.', table(['Check', 'Why it matters'], [['Unique IDs and exact coverage', 'No missing, duplicate, or substituted samples'], ['Sequence SHA-256 per ID', 'Same name cannot silently hide a changed sequence'], ['Model ID, revision, pooling policy', 'Representation must match the declared extraction'], ['Finite shape (n, 512)', 'Reject invalid vectors or incompatible dimensions'], ['Align by sample ID', 'File row order must not become a hidden assumption']]) + '<p class="small">Frozen label-independent extraction may cache test inputs. Test labels and scores remain protected development boundaries.</p>', 'Shape agreement is not identity agreement.', 'Use the actual load_embedding_cache contract. Ask whether shuffled rows invalidate embeddings: no, if IDs and sequence hashes are checked and correctly aligned; yes, if positional pairing silently changes samples. Never infer that caching an input grants permission to score its protected label.');
add(3, '90–100 · practical', 'Repair the alignment before fitting', 'Pairs · use the supplied missing-code activity and explain your checks.', columns(panel('Activity', list('Use <a href="../instructor/exercises.md">the Day 3 alignment exercise</a>.', 'Inspect the scrambled sample-ID order.', 'Align embeddings to the requested IDs after checking uniqueness and coverage.', 'Explain what would happen if a row were missing.')), panel('Expected behavior', list('Shuffling rows alone should not change aligned features.', 'A missing ID must cause a clear failure, not a guessed vector.', 'The downstream scaler must learn from training rows only.', 'Run the supplied full code for provenance checks.'), 'teal')), 'Fail on mismatched identity; do not manufacture a plausible replacement.', 'Expected solution in instructor/completed/day3_alignment.py. This focused exercise does not replace the full model/cache extraction. If time is short, work through three sample IDs on the board, but preserve the invariant. Stop a run with missing provenance rather than report an unverified comparison.');
pause(3, '100–110 · break', 'Compare validation evidence, then freeze the analysis');
add(3, '110–125 · validation comparison', 'Transfer is measured, not presumed', 'Actual default validation ROC-AUC · no protected test scores shown', table(['Method', 'Simple-signal', 'Interaction-signal'], [['4-mer logistic regression', '0.801944', '0.500000'], ['4-mer random forest', '0.906806', '0.500000'], ['Position-aware CNN', '0.564306', '1.000000'], ['Frozen NT-v2 embedding + logistic regression', '0.618333', '0.800347']]) + panel('Compare more than a number', '<p>Discuss extraction cost, classifier cost, identity/provenance checks, interpretability, and relevance to the target question. These runs support no universal method ranking.</p>', 'teal'), 'Pretraining helped distinguish this engineered order task imperfectly; it did not dominate the simple-signal run.', 'Foundation results source: docs/foundation-embedding-verification.md; classical/CNN from representation run. Ask whether comparing methods on different variants would isolate representation effects: no. Supporting average precision is available in recorded artifacts; do not relabel it PR-AUC. These are validation results, so discussion may guide development only before freeze.');
add(3, '125–138 · transfer and limits', 'What population does the claim concern?', 'A successful artificial-sequence result is still an artificial-sequence result.', columns(panel('Transfer questions', list('Do pretraining organisms, sequence lengths, and genomic contexts match the intended use?', 'Does the pooling rule preserve the needed signal?', 'Have pretraining overlaps been audited?', 'What independent biological measurement would test the claim?')), panel('Known limits here', list('The checkpoint card excludes plants and viruses from pretraining genomes.', 'Pretraining overlap has not been audited; do not claim none exists.', 'The planted motif and fixed-position controls do not establish real promoter utility.', 'Fine-tuning remains a different, unperformed practical.'), 'warning')), 'A plant-motivated question does not make this a verified plant promoter model.', 'The organism exclusion is documented in foundation-embedding-verification.md from the pinned card. Discuss why the motivation can be biologically meaningful while the experiment remains simplified. Shorten optional architecture detail before reducing this interpretation block.');
add(3, '138–150 · freeze gate', 'Stop development before the reveal', 'Make a reproducible record, then ask what evidence you expect to see.', flow('<b>Check</b>Split IDs, artifacts, provenance<span>Models and thresholds are final</span>', '<b>Freeze</b>Run standalone 05 once<span>Records the developed workflows</span>', '<b>Discuss</b>Predict, do not tune<span>No test scores calculated yet</span>') + code('Paste and run the complete 05_frozen_comparison.py file.\nThe standalone first execution freezes only.\n\nDo not call reveal_test yet.') + '<p><a href="../paste_ready/05_frozen_comparison.py">Open standalone code 05</a> · freeze preprocessing, models, selection decisions, metric policy, and thresholds (0.5).</p>', 'Freezing an encoder is not enough: freeze the entire developed analysis.', 'Use instructor/guide.md for the gate and preserve the frozen manifest. No actual test reveal has been performed for the slide implementation. Do not invent a table. If artifacts fail validation, stop and resolve the failure; do not bypass checks. Have students state a directional expectation without promising a ranking.');
add(3, '150–180 · explicit reveal and synthesis', 'One planned test comparison, only after freeze', 'Instructor gate · verify the frozen record before executing the explicit reveal.', code('reveal_test(\n    confirmation="REVEAL THE FROZEN TEST RESULTS"\n)') + columns(panel('Read the actual output together', list('Identify the variant, method, metric, and held-out IDs.', 'Compare with expectations and validation evidence.', 'Record surprises without changing settings to improve the test result.')), panel('No numbers are prefilled here', '<p>Protected test results are not available in this deck. Only the actual authorized run supplies them.</p><p>After this comparison, the same test cannot be fresh independent evidence for Day 4 tuning.</p>', 'warning')), 'A surprising test result is evidence to discuss, not permission to tune against it.', 'Pacing: 5 minutes gate and expectations, 8 actual comparison if ready, 10 conclusions, 7 recap/questions/buffer. Run only after an instructor-confirmed freeze. If no reveal is authorized or the gate fails, keep it closed and discuss the protocol; report the reveal as not run. Do not substitute validation scores as test scores.');
add(4, '0–10 · recap', 'Day 4 · Specify, delegate, and audit', 'A coding agent can execute an analysis. You still own its scientific claims.', columns(panel('Carry forward the contract', list('Same simulated task and fixed development identities.', 'Training-only fitting; validation-only development.', 'Previously revealed test results cannot choose a new approach.', 'Actual outputs, not plausible-looking conclusions.')), panel('Two equally valid participation routes', '<p><strong>Participate:</strong> use an available agent and keep the evidence.</p><p><strong>Observe:</strong> inspect prompts, code, artifacts, and the same audit questions.</p><p>No paid student access or student-run Agentomics is required.</p>', 'teal')), 'Delegation changes who executes the work, not who must justify the experiment.', 'Ask students to reconstruct the boundary from Day 3. Do not open protected labels during the Day 4 workshop. Agent access is optional; one instructor can demonstrate. Distinguish an authored fixture from a real agent run at every transition.');
add(4, '10–20 · context', 'A language model sees supplied context', 'An assistant can fill an ambiguity with a reasonable-sounding but consequential choice.', flow('<b>Context</b>Request, files, prior messages<span>Only what is supplied or retrieved</span>', '<b>Model output</b>Text or a proposed tool call<span>Not automatically verified</span>', '<b>Environment</b>Tools return observations<span>Files, code, logs, failures</span>') + columns(panel('What must be explicit?', '<p>Population, evaluation unit, target, features, splits, metrics, allowed fitting, forbidden test use, and evidence requirements.</p>'), panel('What remains your responsibility?', '<p>Check whether the available context contains the needed truth, whether decisions follow the specification, and whether the conclusions match actual evidence.</p>', 'blue')), 'Fluent completion is not a substitute for a scientific specification.', 'Use this as a concrete context model, not an exhaustive account of LLM internals. Ask which omitted choice could invalidate this exact course comparison: regrouping split IDs, tuning on test scores, or replacing the simulation with a claimed promoter dataset.');
add(4, '20–30 · agent loop', 'An agent is a loop with tools and boundaries', 'The loop can produce useful artifacts and repeat the same mistaken premise.', flow('<b>Inspect / plan</b>Choose a next action', '<b>Act</b>Read, edit, execute a tool', '<b>Observe</b>Read actual output', '<b>Revise / report</b>Continue or stop honestly') + columns(panel('Project instructions', '<p>Persistent project constraints: do not score protected test labels; preserve sample IDs; report blocked checks.</p>'), panel('A relevant skill', '<p>A reusable procedure for a bounded task, such as checking split integrity, prediction alignment, and claims against evidence.</p>', 'teal')), 'Instructions and skills constrain behavior; they do not certify correctness.', 'Ask where an agent should stop if cache hashes do not match: at the invalid input, reporting the failure. It should not invent vectors, silently change the dataset, or present cached outputs as new execution. This is a workflow concept, not an invented product capability.');
add(4, '30–40 · vague request', '“Find the best model” hides the experiment', 'Inspect the supplied vague request before providing the specification.', panel('The ambiguity to investigate', '<p>Which observations? Which target? What does “best” mean? Which split? Which preprocessing can see evaluation inputs? What supports a biological claim?</p>', 'blue') + columns(panel('Instructor demonstration route', '<p>Open <a href="../agent_workshop/vague-prompt.md">the vague prompt</a>. Inspect the actual <a href="../agent_workshop/actual_runs/2026-10-26/specified/run_report.md">specified-run report</a> and <a href="../agent_workshop/actual_runs/2026-10-26/vague/run_report.md">vague-run artifacts</a>; retain their execution and intervention records.</p>'), panel('Evidence status', '<p>The <strong>authored teaching fixture</strong> is distinct from the actual runs. Both development-only runs completed on October 26, 2026 and were scientifically cautious. Inspect their actual decisions after the break. A genuine screen recording remains pending.</p>', 'warning')), 'Do not claim an agent made a mistake unless an actual run records that mistake.', 'Ask students to note silent decisions before supplying the precise spec. No need for a live run to fail in exactly the authored way. If the service is blocked, use the explicitly labeled fixture for audit practice, and report the live demonstration as not run. Never call the fixture a recorded run.');
add(4, '40–50 · inspect the fixture', 'The authored fixture runs, but its claim fails', 'Read it as an audit exercise, not evidence about a model’s performance.', columns(panel('Inspect these artifacts', '<p><a href="../agent_workshop/fixture.md">Fixture description</a> · <a href="../agent_workshop/flawed_analysis.py">authored flawed analysis</a></p>' + list('Related groups cross train/validation.', 'The vocabulary is fitted before partitioning.', 'Prediction order differs from label order.', 'The conclusion claims learned promoter biology.')), panel('Pair task · five minutes', '<p>For each defect, write:</p><ol><li>What exact evidence reveals it?</li><li>Which conclusion becomes unsupported?</li><li>What repair is needed?</li></ol><p class="small">Do not repair the fixture by inventing better probabilities.</p>', 'teal')), 'Successful execution and valid inference are independent audit questions.', 'Expected answers are in agent_workshop/worked-audit.md. Keep the fixture’s four authored rows separate from the main experiment. Vocabulary leakage violates protocol, but finding it does not establish how much it changed performance. Transition: remove ambiguity before asking for a new clean run.');
pause(4, '50–60 · break', 'Explicit specification, project instructions, and an audit skill');
add(4, '60–73 · specification', 'Write the experiment the agent must preserve', 'Use the course specification, not a request for an attractive score.', table(['Specify', 'Concrete course requirement'], [['Question and data', 'Simulated binary sequence classification; no promoter-discovery claim'], ['Identity and partitions', 'Reuse fixed split manifest; respect related groups'], ['Features and fitting', 'Sequence-derived features; fit preprocessing and model on training only'], ['Development evidence', 'Validation ROC-AUC primary; average precision supporting; threshold 0.5'], ['Protected boundary', 'No test-label access or test-guided selection in this agent task'], ['Deliverables', 'Actual predictions by ID; code/configuration/provenance; failures and scientific audit']]) + '<p><a href="../agent_workshop/precise-spec.md">Open the complete precise specification</a>.</p>', 'A specification should make an invalid shortcut detectable, not merely discourage it.', 'Have pairs choose one requirement and explain its independent verification. Allowed label-independent test-input extraction does not authorize the agent to tune using labels or revealed scores. The agent task is development-only even if the Day 3 instructor comparison occurred.');
add(4, '73–85 · instructions and skill', 'Separate the experiment from reusable rules', 'Specification · what this analysis must do. Instructions · project constraints. Skill · how to audit.', columns(panel('Project-level constraints', '<p>Open <a href="../agent_workshop/example-project/AGENTS.md">the example AGENTS.md</a>.</p>' + list('Preserve evaluation and identity invariants.', 'Do not fabricate outputs or bypass failures.', 'Keep claims within the simulation evidence.')), panel('Scientific-audit procedure', '<p>Open <a href="../agent_workshop/example-project/skills/scientific-audit/SKILL.md">the scientific-audit skill</a>.</p>' + list('Inspect split and feature-fitting boundaries.', 'Check prediction coverage and alignment.', 'Trace each scientific claim to actual evidence.'), 'teal')), 'More instructions are useful only when they remove ambiguity and support checkable behavior.', 'Ask what belongs in the spec versus a reusable instruction: exact dataset/metric belongs in spec; report blocked checks can be project-wide. Use the actual supplied files; do not invent platform features. These files guide behavior but cannot guarantee compliance.');
add(4, '85–100 · actual-run comparison', 'Compare actual decisions, not presentation quality', 'Actual development-only runs · October 26, 2026 · both scientifically cautious', table(['Run', 'Actual approach', 'Validation ROC-AUC'], [['Vague request', 'Training-only group CV; 6 candidates by log loss; disclosed TATAAATG motif LR', '0.9041667'], ['Specified request', 'Declared bag-of-4-mers logistic regression', '0.8019444']]) + columns(panel('What the traces show', '<p>Inspect <a href="../agent_workshop/actual_runs/2026-10-26/vague/run_report.md">the vague run</a> and <a href="../agent_workshop/actual_runs/2026-10-26/specified/run_report.md">the specified run</a>. Both used the same provider/model and technical boundary, not a sandbox. The vague run needed a technical apply_patch intervention.</p>'), panel('Not a causal prompt-quality experiment', '<p>Objectives, features, and searches differ. Higher validation ROC-AUC does not show that a vague prompt is better. Both were scientifically cautious; no screen recording exists.</p>', 'warning')), 'The actual runs are evidence of different decisions, not a controlled comparison of prompt quality.', 'Use 15 minutes for the observation sheet and discussion. The vague run used training-only group CV to compare six candidates by log loss, then reported the disclosed motif-based logistic-regression model. The specified run reproduced the requested 4-mer baseline. Both were scientifically cautious; do not transfer the authored fixture defects onto them. Raw code, reports, and logs are under agent_workshop/actual_runs/2026-10-26/. Parent comparison/audit integration is separate. A genuine screen recording remains pending.');
pause(4, '100–110 · break', 'Scientific audit: split integrity, alignment, metrics, and claims');
add(4, '110–130 · scientific audit', 'Audit the inference, not just the code', 'Use evidence → consequence → repair for every finding.', columns(panel('Six questions to answer', list('Are evaluation units independent?', 'Did learned preprocessing fit training only?', 'Do predictions match the exact IDs?', 'Are metrics and baselines declared and comparable?', 'Can artifacts reproduce the reported result?', 'Does the claim stay within simulation truth?')), panel('Worked alignment failure', '<p>Validation IDs: [v1, v2], labels: [0, 1].</p><p>Prediction IDs: [v2, v1], probabilities: [0.1, 0.9].</p><p>Positional pairing appears 100% accurate. Correct ID alignment gives [0.9, 0.1]: <strong>0% accurate</strong>.</p><p class="small">Authored two-row illustration, not a fitted course model.</p>', 'teal')) + '<p><a href="../instructor/audit-checklist.html">Open the audit handout</a> · <a href="../paste_ready/06_scientific_audit.py">standalone audit code 06</a>.</p>', 'Equal lengths and plausible probabilities do not establish correct sample alignment.', 'Allow ten minutes independent/pair audit, then ten minutes evidence-based discussion. Unique sample IDs do not eliminate group leakage. Correct alignment repairs one error; it does not repair the group split, preprocessing, provenance, or causal overclaim. Use actual audit code, which loads functions without opening protected files.');
add(4, '130–150 · repair and interpretation', 'Repair the experiment before improving the score', 'Put the manual workflow and the agent workflow under the same scientific standard.', table(['Finding', 'Defensible next step'], [['Related groups cross splits in separate fixture', 'Rebuild that exercise with group-respecting development partitions; refit'], ['Vocabulary fitted on evaluation inputs', 'Fit the full pipeline using training data only'], ['Prediction IDs misaligned', 'Require unique exact coverage; join predictions by ID'], ['Scores lack a fitted predictor / provenance', 'Generate actual predictions; record code, inputs, configuration, versions'], ['Promoter-function claim from simulation', 'Limit conclusions to the stated artificial sequence task'], ['Selection uses previously revealed test scores', 'Do not claim independent confirmation; agree a new evaluation if needed']]) + '<p class="small"><a href="../agent_workshop/worked-audit.md">Worked audit and repair sequence</a> · Do not change the main fixed manifest to repair the separate authored fixture.</p>', 'One repaired defect is not a certificate that the whole inference is valid.', 'Use the remaining time for student-supported conclusions and questions. The four-row fixture cannot support a serious model ranking. The manual baseline must use identical validation IDs and the declared metric. If short of time, reduce optional code detail, not the audit. Reserve 150–170 and 170–180 exactly.');
add(4, '150–170 · reserved demonstration', 'Agentomics · instructor demonstration', 'Twenty minutes reserved · actual demo access, materials, and rehearsal are pending.', columns(panel('What to observe if the demo is available', list('Which scientific choices are explicit?', 'Where are split identities and fitting boundaries recorded?', 'Which actual artifacts support the comparison?', 'How are failure, provenance, and scientific claims audited?')), panel('Evidence boundary', '<p>No Agentomics features, screen sequence, outputs, or recording are asserted in this deck.</p><p>The instructor must supply actual access and materials. If unavailable, report the blocked demonstration; a discussion is not a completed demo.</p>', 'warning')) + '<p class="small">Use the same evaluation and audit questions, without introducing another required student platform.</p>', 'Automation must be inspected through actual evidence, not inferred from a product name.', 'This is a protected 20-minute allocation, not a fabricated product walkthrough. Missing actual access/materials is a real outstanding requirement. Ask the instructor to resolve it before teaching; do not mark this demo or its rehearsal complete. A clearly labeled contingency discussion does not satisfy the actual demonstration requirement.');
add(4, '170–180 · final discussion', 'What changed · and what never changed?', 'Ten minutes · final questions and course synthesis', flow('<b>Day 1</b>Choose features', '<b>Day 2</b>Learn features', '<b>Day 3</b>Reuse features', '<b>Day 4</b>Delegate execution') + panel('The invariant experiment', '<p>Define the question and evaluation unit. Keep identities aligned. Fit only where permitted. Develop on validation. Freeze before the planned reveal. Trace every claim to actual evidence.</p>', 'teal') + columns(panel('Discuss', '<p>Which representation would you try first for a new problem, and why? Which one audit check would you never delegate without reviewing?</p>'), panel('Take away', '<p><a href="../paste_ready/README.md">Standalone code and execution order</a><br><a href="../instructor/exercises.md">Exercises</a> · <a href="../instructor/answers.md">answers</a> · <a href="../instructor/audit-checklist.html">audit checklist</a></p>')), 'More automation increases the value of a precise question and an independent audit.', 'Leave the final ten minutes for students rather than extending the demo. No exam, required submission, or homework. Ask for one changed view and one unresolved question. Instructor guidance and recorded limitations are in instructor/guide.md; actual Colab/full-session rehearsal and Agentomics demo remain separate outstanding checks.');
</script>
<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-slide-edits-v1';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            this.edits = {...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `<section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" role="group" aria-roledescription="slide" aria-label="${index + 1} of ${slides.length}" aria-labelledby="title-${index + 1}"><div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; ${index + 1} / ${slides.length}</span></div><h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p><div class="content">${slide.body}</div><footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer><aside class="notes" aria-label="Instructor notes"><h2>Instructor notes · Day ${slide.day}</h2><p>${slide.notes}</p><div class="note-heading">Teaching resources</div><p><a href="../instructor/guide.md">Instructor guide</a> · <a href="../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timing is a teaching allocation, not a completed classroom rehearsal.</p></aside></section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            editable.forEach((element, elementIndex) => {
                const key = `${slideIndex}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#slide-${this.index + 1}`);
    }
    goDay(day) {
        this.go(slides.findIndex(slide => slide.day === day));
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'ml-bioinformatics-course-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it in slides/ so course links and the font resolve.');
    }
    bind() {
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
</script>
