d the disclosed motif-based logistic-regression model. The specified run reproduced the requested 4-mer baseline. Both were scientifically cautious; do not transfer the authored fixture defects onto them. Raw code, reports, and logs are under agent_workshop/actual_runs/2026-10-26/. Parent comparison/audit integration is separate. A genuine screen recording remains pending.","kind":""},{"day":4,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Scientific audit: split integrity, alignment, metrics, and claims\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":4,"time":"110–130 · scientific audit","title":"Audit the inference, not just the code","subtitle":"Use evidence → consequence → repair for every finding.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Six questions to answer\u003c/h2>\u003cul>\u003cli>Are evaluation units independent?\u003c/li>\u003cli>Did learned preprocessing fit training only?\u003c/li>\u003cli>Do predictions match the exact IDs?\u003c/li>\u003cli>Are metrics and baselines declared and comparable?\u003c/li>\u003cli>Can artifacts reproduce the reported result?\u003c/li>\u003cli>Does the claim stay within simulation truth?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Worked alignment failure\u003c/h2>\u003cp>Validation IDs: [v1, v2], labels: [0, 1].\u003c/p>\u003cp>Prediction IDs: [v2, v1], probabilities: [0.1, 0.9].\u003c/p>\u003cp>Positional pairing appears 100% accurate. Correct ID alignment gives [0.9, 0.1]: \u003cstrong>0% accurate\u003c/strong>.\u003c/p>\u003cp class=\"small\">Authored two-row illustration, not a fitted course model.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003ca href=\"../instructor/audit-checklist.html\">Open the audit handout\u003c/a> · \u003ca href=\"../paste_ready/06_scientific_audit.py\">standalone audit code 06\u003c/a>.\u003c/p>","takeaway":"Equal lengths and plausible probabilities do not establish correct sample alignment.","notes":"Allow ten minutes independent/pair audit, then ten minutes evidence-based discussion. Unique sample IDs do not eliminate group leakage. Correct alignment repairs one error; it does not repair the group split, preprocessing, provenance, or causal overclaim. Use actual audit code, which loads functions without opening protected files.","kind":""},{"day":4,"time":"130–150 · repair and interpretation","title":"Repair the experiment before improving the score","subtitle":"Put the manual workflow and the agent workflow under the same scientific standard.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Finding\u003c/th>\u003cth scope=\"col\">Defensible next step\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Related groups cross splits in separate fixture\u003c/td>\u003ctd>Rebuild that exercise with group-respecting development partitions; refit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vocabulary fitted on evaluation inputs\u003c/td>\u003ctd>Fit the full pipeline using training data only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prediction IDs misaligned\u003c/td>\u003ctd>Require unique exact coverage; join predictions by ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scores lack a fitted predictor / provenance\u003c/td>\u003ctd>Generate actual predictions; record code, inputs, configuration, versions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Promoter-function claim from simulation\u003c/td>\u003ctd>Limit conclusions to the stated artificial sequence task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Selection uses previously revealed test scores\u003c/td>\u003ctd>Do not claim independent confirmation; agree a new evaluation if needed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"small\">\u003ca href=\"../agent_workshop/worked-audit.md\">Worked audit and repair sequence\u003c/a> · Do not change the main fixed manifest to repair the separate authored fixture.\u003c/p>","takeaway":"One repaired defect is not a certificate that the whole inference is valid.","notes":"Use the remaining time for student-supported conclusions and questions. The four-row fixture cannot support a serious model ranking. The manual baseline must use identical validation IDs and the declared metric. If short of time, reduce optional code detail, not the audit. Reserve 150–170 and 170–180 exactly.","kind":""},{"day":4,"time":"150–170 · reserved demonstration","title":"Agentomics · instructor demonstration","subtitle":"Twenty minutes reserved · actual demo access, materials, and rehearsal are pending.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What to observe if the demo is available\u003c/h2>\u003cul>\u003cli>Which scientific choices are explicit?\u003c/li>\u003cli>Where are split identities and fitting boundaries recorded?\u003c/li>\u003cli>Which actual artifacts support the comparison?\u003c/li>\u003cli>How are failure, provenance, and scientific claims audited?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Evidence boundary\u003c/h2>\u003cp>No Agentomics features, screen sequence, outputs, or recording are asserted in this deck.\u003c/p>\u003cp>The instructor must supply actual access and materials. If unavailable, report the blocked demonstration; a discussion is not a completed demo.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"small\">Use the same evaluation and audit questions, without introducing another required student platform.\u003c/p>","takeaway":"Automation must be inspected through actual evidence, not inferred from a product name.","notes":"This is a protected 20-minute allocation, not a fabricated product walkthrough. Missing actual access/materials is a real outstanding requirement. Ask the instructor to resolve it before teaching; do not mark this demo or its rehearsal complete. A clearly labeled contingency discussion does not satisfy the actual demonstration requirement.","kind":""},{"day":4,"time":"170–180 · final discussion","title":"What changed · and what never changed?","subtitle":"Ten minutes · final questions and course synthesis","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Day 1\u003c/b>Choose features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 2\u003c/b>Learn features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 3\u003c/b>Reuse features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 4\u003c/b>Delegate execution\u003c/div>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>The invariant experiment\u003c/h2>\u003cp>Define the question and evaluation unit. Keep identities aligned. Fit only where permitted. Develop on validation. Freeze before the planned reveal. Trace every claim to actual evidence.\u003c/p>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Discuss\u003c/h2>\u003cp>Which representation would you try first for a new problem, and why? Which one audit check would you never delegate without reviewing?\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>Take away\u003c/h2>\u003cp>\u003ca href=\"../paste_ready/README.md\">Standalone code and execution order\u003c/a>\u003cbr>\u003ca href=\"../instructor/exercises.md\">Exercises\u003c/a> · \u003ca href=\"../instructor/answers.md\">answers\u003c/a> · \u003ca href=\"../instructor/audit-checklist.html\">audit checklist\u003c/a>\u003c/p>\u003c/div>\u003c/div>","takeaway":"More automation increases the value of a precise question and an independent audit.","notes":"Leave the final ten minutes for students rather than extending the demo. No exam, required submission, or homework. Ask for one changed view and one unresolved question. Instructor guidance and recorded limitations are in instructor/guide.md; actual Colab/full-session rehearsal and Agentomics demo remain separate outstanding checks.","kind":""}]</script>

const task = (href, label, text) => `<div class="story-task"><span class="eyebrow">Try it together</span><p>${text}</p><a href="${href}">${label} ↗</a></div>`;
const pair = (a, b) => columns(panel(a[0], `<p>${a[1]}</p>`, 'blue'), panel(b[0], `<p>${b[1]}</p>`, 'teal'));
const sequencePair = () => `<div class="sequence-pair" role="img" aria-label="Class 1 has motif A at position 38 and B at 86; class 0 reverses them. Shared backgrounds and matching flanks give identical 4-mer bags."><div class="sequence-axis"><span></span><span>motif start 38</span><span>motif start 86</span></div><div><b>Class 1</b><span class="motif">TATAAATG</span><span class="motif second">CGGACGTC</span></div><div><b>Class 0</b><span class="motif second">CGGACGTC</span><span class="motif">TATAAATG</span></div></div><p class="story-caption">Shared background · matching flanks · each pair stays in one split</p>`;
function scores(groups, labels) {
    const colors = ['#234e70', '#216869'];
    const rowHeight = labels.length === 1 ? 96 : 126;
    const height = groups.length * rowHeight + 72;
    let svg = `<svg class="score-chart" viewBox="0 0 1640 ${height}" role="img" aria-label="Recorded local validation ROC-AUC, on a zero-to-one axis. ${groups.map(g => `${g[0]}: ${g[1].map((v,i) => `${labels[i]} ${v.toFixed(3)}`).join(', ')}`).join('; ')}"><line x1="1025" x2="1025" y1="8" y2="${height-48}" stroke="#8c9ba8" stroke-width="2" stroke-dasharray="7 7"/>`;
    groups.forEach(([name, values], r) => {
        const y = r * rowHeight + 20;
        svg += `<text x="0" y="${y+30}" class="chart-label">${name}</text>`;
        values.forEach((v,i) => {
            const top = y + i * 43;
            svg += `<rect x="500" y="${top}" width="1050" height="30" rx="6" fill="#edf1f5"/><rect x="500" y="${top}" width="${v*1050}" height="30" rx="6" fill="${colors[i]}"/><text x="${Math.min(500+v*1050+12,1565)}" y="${top+25}" class="chart-value">${v.toFixed(3)}</text>`;
        });
    });
    svg += `<text x="500" y="${height-15}" class="chart-axis">0</text><text x="1025" y="${height-15}" text-anchor="middle" class="chart-axis">0.5 · chance ranking</text><text x="1550" y="${height-15}" text-anchor="end" class="chart-axis">1.0</text></svg>`;
    return `<div class="chart-legend">${labels.map((label,i)=>`<span><i style="background:${colors[i]}"></i>${label}</span>`).join('')}</div>${svg}`;
}
function scene(number, title, subtitle, body, takeaway, kind = '') {

        reference: {title: ref.title, subtitle: ref.subtitle, body: ref.body, takeaway: ref.takeaway}});
}

slides.push(...JSON.parse(document.getElementById("day-one-data").textContent));

scene(19, 'A confident mistake should hurt.', 'For an actual positive, compare two predictions.', pair(['p = 0.8', 'Loss ≈ 0.223'], ['p = 0.2', 'Loss ≈ 1.609']) + equation('loss = −log(p) &nbsp; when y = 1'), 'Training minimizes cross-entropy; validation ROC-AUC selects the saved epoch.');
scene(20, 'How does the model improve?', 'Repeat small updates using training examples.', flow('<b>Predict</b>Compute the loss', '<b>Backpropagate</b>Compute gradients', '<b>Update</b>Adjust parameters') + prompt('Training improves. Validation worsens. What now?'), 'Lower training loss alone does not establish generalization.');

scene(30, 'Swap the motifs. Predict the response.', 'A controlled change tests an explanation.', sequencePair() + task('../instructor/exercises.md', 'Open the Day 2 exercise', 'Check equal 4-mer vectors. Compare the fitted models’ predictions.'), 'Observed sensitivity supports a claim about this predictor, not biological causality.');

scene(36, 'What comes out of the encoder?', 'Pinned NT-v2 50M model · last-layer content-token mean', flow('<b>160 DNA bases</b>Tokenize', '<b>Contextual vectors</b>Encode', '<b>512 numbers</b>Pool') + prompt('What information could averaging lose?'), 'Record model revision, layer, pooling, and sample identity; details are in Notes.');

scene(41, 'Repair the join.', 'Shuffling a file should not change the aligned features.', task('../instructor/exercises.md', 'Open the Day 3 exercise', 'Align vectors by sample ID. Make missing or duplicate IDs fail clearly.') + prompt('Would you rather stop, or guess a missing vector?'), 'Fit the downstream scaler on training rows only.');
scene(42, 'Break · 10 minutes', 'Next: compare all three ways of representing DNA.', prompt('Will the borrowed features win?'), 'Return at minute 110.');
scene(43, 'Borrowed features do not win by default.', 'Recorded local validation · ROC-AUC · same variants and split identities', scores([['4-mer logistic regression',[0.801944,0.5]],['4-mer random forest',[0.906806,0.5]],['Position-aware CNN',[0.564306,1]],['Frozen embeddings + LR',[0.618333,0.800347]]], ['Simple-signal','Interaction-signal']), 'Compare cost, interpretability, and transfer as well as predictive ranking.');
scene(44, 'Would this work on real promoters?', 'We have evaluated a controlled simulation.', prompt('What evidence is still missing?') + pair(['Transfer', 'Organisms, contexts, lengths, and tasks may differ.'], ['Biology', 'Independent measurements must support biological claims.']), 'Pretraining overlap has not been audited; real promoter utility is unverified.');
scene(45, 'Make your prediction. Then freeze.', 'Stop changing the workflow before opening the final comparison.', flow('<b>Check</b>IDs and provenance', '<b>Freeze</b>Models, preprocessing, metrics', '<b>Predict</b>What do you expect?') + task('../paste_ready/05_frozen_comparison.py', 'Open code 05', 'Run once to freeze. No test scores are calculated yet.'), 'Fix model-selection decisions and thresholds before the reveal.');
scene(46, 'Now open the sealed answer.', 'Instructor gate · only after the frozen record passes its checks', code('reveal_test(\n    confirmation="REVEAL THE FROZEN TEST RESULTS"\n)') + prompt('What surprised you? What can you conclude?'), 'No test results are prefilled. After reveal, discuss surprises without tuning against them.');

// Day 4: handing over execution does not hand over scientific responsibility.
scene(47, 'Who owns the claim when an agent writes the code?', 'Day 4 · specify, delegate, and audit', statement('The agent runs the analysis.<br>You defend the experiment.') + prompt('What would you insist it preserve?'), 'Participate with an available agent, or inspect the same evidence as an observer.');
scene(48, 'What did we leave unsaid?', 'A model works with the context supplied or retrieved.', prompt('“Build the best model.”') + flow('<b>Best for whom?</b>Population', '<b>Best by what?</b>Metric', '<b>Tested how?</b>Evaluation'), 'Omitted scientific choices still get made.');
scene(49, 'An agent can act on its assumptions.', 'Tools turn proposed actions into files, code, and results.', flow('<b>Inspect</b>Read the context', '<b>Act</b>Use a tool', '<b>Observe</b>Read the result', '<b>Revise</b>Continue or report') + prompt('Where should it stop if an input is wrong?'), 'Instructions guide the loop; actual artifacts show what happened.');
scene(50, 'Ask vaguely. Inspect the choices.', 'A genuine development-only run, saved for observation.', statement('“Build the best model to predict promoters.”') + task('../agent_workshop/actual_runs/2026-10-26/vague/run_report.md', 'Inspect the vague run', 'Which features, metric, and search did it choose? Which biology did it claim?'), 'This actual run was scientifically cautious. Do not invent a failure.');
scene(51, 'This one runs. Its claim still fails.', 'A separate, authored audit fixture · not an observed agent failure', task('../agent_workshop/fixture.md', 'Open the fixture', 'Find evidence that the score or conclusion is misleading.') + prompt('Relatives cross splits. Predictions change order. What breaks?'), 'Inspect preprocessing and biological claims too; working code is only the first check.');
scene(52, 'Break · 10 minutes', 'Next: specify the experiment before asking for another analysis.', prompt('Which choices should never be left implicit?'), 'Return at minute 60.');
scene(53, 'Specify the experiment.', 'Make important choices explicit and checkable.', flow('<b>Question</b>Data, target, features', '<b>Protocol</b>Splits, fitting, metrics', '<b>Evidence</b>Predictions, provenance, limits') + task('../agent_workshop/precise-spec.md', 'Open the specification', 'Choose one requirement. How would you verify it independently?'), 'The agent task remains development-only, including after Day 3’s test reveal.');
scene(54, 'Give each instruction a job.', 'One analysis, project-wide constraints, and a reusable procedure.', flow('<b>Specification</b>What this analysis must do', '<b>AGENTS.md</b>Project constraints', '<b>Skill</b>How to perform an audit') + '<p class="story-links"><a href="../agent_workshop/example-project/AGENTS.md">Project instructions ↗</a> &nbsp; <a href="../agent_workshop/example-project/skills/scientific-audit/SKILL.md">Audit skill ↗</a></p>', 'Clear instructions make behavior checkable; they do not certify correctness.');
scene(55, 'The vague run scored higher. Why?', 'Actual local validation · ROC-AUC · both runs were scientifically cautious', scores([['Vague · motif features + search',[0.9041667]],['Specified · fixed 4-mer baseline',[0.8019444]]], ['Simple-signal']) + prompt('Did we compare prompts—or different experiments?'), 'Objectives, features, and search differed. This pair cannot establish a prompt-quality effect.');
scene(56, 'Break · 10 minutes', 'Next: put the analysis on trial.', statement('Evidence → consequence → repair'), 'Return at minute 110.');
scene(57, 'Join by ID. Then judge the predictions.', 'An authored two-row example', code('labels:       v1 → 0     v2 → 1\npredictions:  v2 → 0.1   v1 → 0.9') + pair(['Pair by position', '100% accuracy'], ['Align by ID', '0% accuracy']), 'Equal lengths and plausible numbers do not establish correct alignment.');
scene(58, 'Repair the experiment before the score.', 'Use the same standard for manual and agent-written analyses.', flow('<b>Evidence</b>What exactly failed?', '<b>Consequence</b>Which claim is unsupported?', '<b>Repair</b>What must be rerun?') + task('../instructor/audit-checklist.html', 'Open the audit checklist', 'Audit split integrity, fitting, alignment, metrics, reproducibility, and claims.'), 'One repaired defect does not certify the whole analysis.');
scene(59, 'Follow the evidence through Agentomics.', 'Reserved instructor demonstration · 20 minutes', prompt('Where do the scientific choices become visible?') + flow('<b>Question</b>What is being tested?', '<b>Workflow</b>What actually runs?', '<b>Evidence</b>What supports the claim?') + '<p class="story-caption">Preparation pending: actual access, example, materials, and rehearsal.</p>', 'Use the actual demonstration; no product behavior or outputs are assumed here.');
scene(60, 'What would you trust now?', 'One question carried through four days.', flow('<b>Count</b>Choose information', '<b>Learn</b>Test representation', '<b>Reuse</b>Check transfer', '<b>Delegate</b>Audit evidence') + prompt('One claim you can defend.<br>One limitation you would report.') + '<p class="story-links"><a href="../paste_ready/README.md">Code ↗</a> &nbsp; <a href="../instructor/exercises.md">Exercises ↗</a> &nbsp; <a href="../instructor/answers.md">Answers ↗</a></p>', 'A better model is useful only inside an experiment you can defend.');

</script>
<script id="day-one-interactions">
// Teaching examples are invented, deterministic data; no course model is run here.
const dayOneToyScores = [
    ...Array.from({length:30},(_,i)=>({y:1,p:0.55+i*0.4/29})),
    ...Array.from({length:20},(_,i)=>({y:1,p:0.10+i*0.35/19})),
    ...Array.from({length:10},(_,i)=>({y:0,p:0.55+i*0.30/9})),
    ...Array.from({length:40},(_,i)=>({y:0,p:0.05+i*0.40/39}))
];
function dayOneMetrics(threshold) {
    let tp=0,fp=0,fn=0,tn=0;
    for (const {y,p} of dayOneToyScores) {
        if (p>=threshold) { if(y) tp++; else fp++; }
        else { if(y) fn++; else tn++; }
    }
    return {tp,fp,fn,tn,accuracy:(tp+tn)/100,precision:tp+fp?tp/(tp+fp):null,recall:tp/(tp+fn),f1:2*tp+fp+fn?2*tp/(2*tp+fp+fn):null};
}
const d1Percent = x => x===null ? 'undefined' : `${Math.round(x*100)}%`;
function d1SVG(body,label,width=1200,height=360) {
    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${label}">${body}</svg>`;
}
function updateSigmoid(root) {
    const z=Number(root.querySelector('[data-score]').value),p=1/(1+Math.exp(-z));
    const X=z=>140+(z+6)/12*850,Y=p=>290-p*240;
    const points=Array.from({length:121},(_,i)=>{const v=-6+i/10;return `${i?'L':'M'}${X(v)},${Y(1/(1+Math.exp(-v)))}`;}).join(' ');
    root.querySelector('[data-sigmoid-plot]').innerHTML=d1SVG(`<path d="M140 40 V290 H1010" fill="none" stroke="#8399aa" stroke-width="3"/><path d="M140 170 H990 M565 50 V290" stroke="#bbcbd6" stroke-dasharray="7 7" stroke-width="2"/><path d="${points}" fill="none" stroke="#216869" stroke-width="8"/><path d="M${X(z)} 290 V${Y(p)} H140" fill="none" stroke="#b6782d" stroke-width="3" stroke-dasharray="8 6"/><circle cx="${X(z)}" cy="${Y(p)}" r="12" fill="#b6782d" stroke="#fff" stroke-width="3"/><text x="105" y="60" text-anchor="end" class="v-caption">1.0</text><text x="105" y="178" text-anchor="end" class="v-caption">0.5</text><text x="105" y="295" text-anchor="end" class="v-caption">0</text><text x="140" y="330" text-anchor="middle" class="v-caption">−6</text><text x="565" y="330" text-anchor="middle" class="v-caption">0</text><text x="990" y="330" text-anchor="middle" class="v-caption">6</text><text x="1140" y="175" text-anchor="middle" class="v-title">p(class 1)</text>`,`Sigmoid: score ${z.toFixed(1)} gives probability ${p.toFixed(3)}.`);
    root.querySelector('[data-score-value]').textContent=z.toFixed(1);
    root.querySelector('[data-sigmoid-value]').textContent=`z = ${z.toFixed(1)} → p(class 1) = ${p.toFixed(3)}`;
}
function updateThreshold(root) {
    const threshold=Number(root.querySelector('[data-threshold]').value),m=dayOneMetrics(threshold),x=p=>245+p*880;
    let plot='<text x="15" y="70" class="v-caption">Actual positives</text><text x="15" y="178" class="v-caption">Actual negatives</text>';
    dayOneToyScores.forEach(({y,p},i)=>{const cy=(y?48:150)+(i%4)*13;plot+=`<circle cx="${x(p)}" cy="${cy}" r="6" fill="${y?'#216869':'#234e70'}" opacity="${p>=threshold?1:0.3}"/>`;});
    plot+=`<line x1="${x(threshold)}" x2="${x(threshold)}" y1="12" y2="220" stroke="#b6782d" stroke-width="5"/><path d="M245 230 H1125" stroke="#8399aa" stroke-width="2"/><text x="245" y="266" text-anchor="middle" class="v-caption">0</text><text x="685" y="266" text-anchor="middle" class="v-caption">Model probability</text><text x="1125" y="266" text-anchor="middle" class="v-caption">1</text>`;
    root.querySelector('[data-threshold-plot]').innerHTML=d1SVG(plot,'Illustrative probabilities by actual class. Scores at or above the threshold predict class 1.',1200,280);
    root.querySelector('[data-threshold-value]').textContent=threshold.toFixed(2);
    root.querySelector('[data-threshold-readout]').innerHTML=`<div class="threshold-counts">TP ${m.tp} · FP ${m.fp} · FN ${m.fn} · TN ${m.tn}</div><div class="threshold-metrics"><span>Accuracy <b>${d1Percent(m.accuracy)}</b></span><span>Precision <b>${d1Percent(m.precision)}</b></span><span>Recall <b>${d1Percent(m.recall)}</b></span><span>F1 <b>${d1Percent(m.f1)}</b></span></div>`;
}
function toyCurve(kind) {
    const thresholds=[Infinity,...[...new Set(dayOneToyScores.map(x=>x.p))].sort((a,b)=>b-a)];
    const ms=thresholds.map(dayOneMetrics),X=v=>170+v*860,Y=v=>330-v*275;
    const pts=ms.map(m=>kind==='roc'?[m.fp/50,m.tp/50]:[m.recall,m.precision===null?1:m.precision]);
    const path=pts.map(([x,y],i)=>`${i?'L':'M'}${X(x)} ${Y(y)}`).join(' ');
    const baseline=kind==='roc'?`M${X(0)} ${Y(0)} L${X(1)} ${Y(1)}`:`M${X(0)} ${Y(.5)} H${X(1)}`;
    return d1SVG(`<path d="M170 40 V330 H1050" fill="none" stroke="#8399aa" stroke-width="3"/><path d="${baseline}" fill="none" stroke="#b5c0c9" stroke-width="3" stroke-dasharray="9 8"/><path d="${path}" fill="none" stroke="#216869" stroke-width="5"/><text x="600" y="390" text-anchor="middle" class="v-caption">${kind==='roc'?'False-positive rate = FP / actual negatives':'Recall'}</text><text x="55" y="190" text-anchor="middle" transform="rotate(-90 55 190)" class="v-caption">${kind==='roc'?'True-positive rate (recall)':'Precision'}</text><text x="140" y="337" text-anchor="end" class="v-caption">0</text><text x="140" y="65" text-anchor="end" class="v-caption">1</text><text x="170" y="365" text-anchor="middle" class="v-caption">0</text><text x="1030" y="365" text-anchor="middle" class="v-caption">1</text><text x="1220" y="170" text-anchor="middle" class="v-caption">Illustrative scores</text><text x="1220" y="210" text-anchor="middle" class="v-caption">50 positives / 50 negatives</text>`,`Illustrative ${kind==='roc'?'ROC':'precision–recall'} curve calculated from the same 100 scores as the threshold demonstration.`,1460,420);
}
function updateTree(root) {
    const a=Number(root.querySelector('[data-tree-a]').value),b=Number(root.querySelector('[data-tree-b]').value);
    const step=Number(root.dataset.step||0),first=a>=2,second=b<2;
    const active = id => id==='root'||(step>=1&&id===(first?'second':'low'))||(step>=2&&first&&id===(second?'high':'mid'));
    const box=(id,x,y,w,title,caption='')=>`<g data-tree-node="${id}" data-active="${active(id)}"><rect x="${x}" y="${y}" width="${w}" height="80" rx="15" fill="${active(id)?'#d9ece7':'#f4f7f9'}" stroke="${active(id)?'#216869':'#cdd8e0'}" stroke-width="3"/><text x="${x+w/2}" y="${y+35}" text-anchor="middle" class="v-title">${title}</text><text x="${x+w/2}" y="${y+65}" text-anchor="middle" class="v-caption">${caption}</text></g>`;
    const edge=(x1,y1,x2,y2,active,label)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${active?'#216869':'#cdd8e0'}" stroke-width="${active?6:3}"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle" class="v-caption">${label}</text>`;
    let s=edge(720,90,280,175,step>=1&&!first,'No')+edge(720,90,1050,175,step>=1&&first,'Yes')+edge(1050,255,850,335,step>=2&&first&&second,'Yes')+edge(1050,255,1260,335,step>=2&&first&&!second,'No');
    s+=box('root',510,10,420,'TATA count ≥ 2?')+box('low',90,175,380,'p(class 1) = 0.20','predict class 0')+box('second',840,175,420,'CGCG count < 2?')+box('high',665,335,370,'p(class 1) = 0.90','predict class 1')+box('mid',1075,335,370,'p(class 1) = 0.55','predict class 1');
    root.querySelector('[data-tree-plot]').innerHTML=d1SVG(s,'Illustrative decision tree. First split: TATA count at least two. The yes branch tests whether CGCG count is below two.',1500,430);
    const complete=step>=(first?2:1);
    root.querySelector('[data-tree-step]').disabled=complete;
    root.querySelector('[data-tree-answer]').textContent=complete?`Reached a leaf: probability ${first?(second?'0.90':'0.55'):'0.20'}.`:(step===0?`TATA = ${a}. Predict the first branch.`:`CGCG = ${b}. Predict the second branch.`);
}
function bindDayOneInteractions() {
    document.querySelectorAll('[data-demo="sigmoid"]').forEach(root=>{updateSigmoid(root);root.querySelector('input').addEventListener('input',()=>updateSigmoid(root));});
    document.querySelectorAll('[data-demo="threshold"]').forEach(root=>{updateThreshold(root);root.querySelector('input').addEventListener('input',()=>updateThreshold(root));});
    document.querySelectorAll('[data-toy-curve]').forEach(el=>{el.innerHTML=toyCurve(el.dataset.toyCurve);});
    document.querySelectorAll('[data-demo="tree"]').forEach(root=>{
        updateTree(root);
        root.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{input.value=Math.max(0,Math.min(5,Math.round(Number(input.value)||0)));root.dataset.step='0';updateTree(root);}));
        root.querySelector('[data-tree-step]').addEventListener('click',()=>{root.dataset.step=String(Number(root.dataset.step||0)+1);updateTree(root);});
        root.querySelector('[data-tree-reset]').addEventListener('click',()=>{root.dataset.step='0';updateTree(root);});
    });
}

</script>
<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day1-teaching-v3';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            this.edits = {...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = `day-${slide.day}-slide-${slide.local}`;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    ${slide.cues ? '<div class="note-heading">Say / explain</div>' : ''}<p>${slide.notes}</p>
                    ${slide.cues ? `<dl class="speaker-cues">${slide.cues.ask ? `<dt>Ask the class</dt><dd>${slide.cues.ask}</dd><dt>Expected answer</dt><dd>${slide.cues.answer}</dd>` : ''}<dt>Next slide</dt><dd>${slide.cues.next}</dd></dl><p class="day1-guide-link"><a href="day1-teaching-guide.md">Day 1 speaking guide</a> · <a href="../instructor/day1-practical.md">Practical instructions</a></p>` : ''}
                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../instructor/guide.md">Instructor guide</a> · <a href="../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch) this.go(Math.max(0, slides.findIndex(s => s.day === Number(localMatch[1]) && s.local === Number(localMatch[2]))), false);
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        this.go(slides.findIndex(slide => slide.day === day));
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'ml-bioinformatics-course-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it in slides/ so course links and the font resolve.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of [1,2,3,4]) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
bindDayOneInteractions();
</script>
