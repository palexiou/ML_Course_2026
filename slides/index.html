<script>
const slides = [];
const panel = (title, body, tone = '') => `<div class="panel ${tone}"><h2>${title}</h2>${body}</div>`;
const columns = (left, right) => `<div class="columns">${left}${right}</div>`;
const list = (...items) => `<ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
const equation = (body, explanation = '') => `<div class="equation">${body}${explanation ? `<small>${explanation}</small>` : ''}</div>`;
const code = text => `<pre><code>${text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')}</code></pre>`;
const flow = (...nodes) => `<div class="flow">${nodes.map((node, index) => `${index ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<div class="node">${node}</div>`).join('')}</div>`;
const table = (headers, rows) => `<table><thead><tr>${headers.map(header => `<th scope="col">${header}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function add(day, time, title, subtitle, body, takeaway, notes, kind = '') { slides.push({day, time, title, subtitle, body, takeaway, notes, kind}); }
function pause(day, time, next) { add(day, time, 'Break · 10 minutes', 'Step away. Return at the time shown in the session plan.', `<div class="eyebrow">After the break</div><h2>${next}</h2><p>Leave model settings unchanged. Keep protected test results closed.</p>`, 'Questions and interpretation are protected teaching time.', 'Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.', 'break'); }
</script>
<script id="teaching-reference" type="application/json">[{"day":1,"time":"0–10 · startup","title":"Machine learning for bioinformatics","subtitle":"Four in-person sessions · 180 minutes each · master’s bioinformatics","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Day 1\u003c/b>Define & evaluate\u003cspan>4-mers · linear models · forests\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 2\u003c/b>Learn features\u003cspan>One-hot DNA · position-aware CNN\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 3\u003c/b>Reuse features\u003cspan>Frozen embeddings · planned reveal\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 4\u003c/b>Delegate & audit\u003cspan>Specification · evidence · limits\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Start here · no preparation required\u003c/h2>\u003cp>Check Colab access now. Open \u003ca href=\"../paste_ready/01_simple_signal.py\">standalone code 01\u003c/a>, copy the entire file into a Python cell, and run it. Installation and startup belong inside these ten minutes.\u003c/p>\u003cp class=\"small\">Local code verification is not a Colab rehearsal. If access fails, observe the instructor and use clearly identified saved outputs.\u003c/p>\u003c/div>","takeaway":"Every day asks: what did the model see, and what does the evidence support?","notes":"Check access and startup, not prior knowledge. One instructor; pairs can discuss without paid accounts. Use instructor/guide.md for setup and instructor/exercises.md for missing-code snippets. Arrow keys navigate; N opens notes; E enables editing. No homework, exam, or submission.","kind":""},{"day":1,"time":"10–16 · diagnostic","title":"Prediction is a scientific experiment","subtitle":"Discuss first: what would make a sequence classifier convincing?","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>A biological motivation\u003c/h2>\u003cul>\u003cli>A promoter is a useful motivation for sequence classification.\u003c/li>\u003cli>Our observations are simulated DNA sequences, not measured promoters.\u003c/li>\u003cli>Ask whether a model predicts labels in a new sample from the defined process.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Two-minute pair discussion\u003c/h2>\u003cul>\u003cli>What is an observation? What is the label?\u003c/li>\u003cli>Could two different sample IDs still be related?\u003c/li>\u003cli>Would 95% accuracy prove promoter recognition?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Prediction, generalization, and biological mechanism are different claims.","notes":"Ungraded diagnostic. Expected: observation is one sequence; label is simulation class; related sequences can share a family even with unique IDs; accuracy alone proves neither independence nor promoter function. Accept uncertainty. Transition: first define the experiment, then choose an algorithm.","kind":""},{"day":1,"time":"16–24 · ML map","title":"One map, four kinds of questions","subtitle":"Choose the learning problem before choosing the model.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Learning setting\u003c/th>\u003cth scope=\"col\">What is supplied?\u003c/th>\u003cth scope=\"col\">Example question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Supervised classification\u003c/td>\u003ctd>Inputs and discrete labels\u003c/td>\u003ctd>Which simulated class does this sequence belong to?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Supervised regression\u003c/td>\u003ctd>Inputs and numeric targets\u003c/td>\u003ctd>What expression level is predicted?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unsupervised learning\u003c/td>\u003ctd>Inputs without task labels\u003c/td>\u003ctd>Which samples have similar representations?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Self-supervised learning\u003c/td>\u003ctd>Targets constructed from the inputs\u003c/td>\u003ctd>Which masked DNA token is plausible in context?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel blue\">\u003ch2>In this course\u003c/h2>\u003cp>Days 1–2 train supervised classifiers. Day 3 reuses a representation learned with self-supervision, then fits a supervised classifier.\u003c/p>\u003c/div>","takeaway":"“No hand labels in pretraining” does not mean “no training objective.”","notes":"Ask which row describes predicting a measured concentration: regression. Clustering labels after the fact is not automatically a valid classifier. Keep the map brief; do not survey algorithms. The same representation can support several downstream tasks.","kind":""},{"day":1,"time":"24–34 · simulation","title":"A noisy motif signal, not a perfect rule","subtitle":"Simple-signal variant · seed 2026 · 1,200 sequences · 160 bases each","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>How the data are generated\u003c/h2>\u003cul>\u003cli>Start from independent uniform A/C/G/T backgrounds.\u003c/li>\u003cli>Balance labels: 600 class 0 and 600 class 1.\u003c/li>\u003cli>Plant \u003ccode>TATAAATG\u003c/code> at a random position with probability 0.9 in class 1 and 0.1 in class 0.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>What a learner may see\u003c/h2>\u003cul>\u003cli>Input: DNA sequence. Target: binary label.\u003c/li>\u003cli>IDs define identity and split membership, not predictive features.\u003c/li>\u003cli>Simulation truth records deliberate planting; incidental motif matches are different.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">P(planted | y = 1) = 0.9 ≠ 1\u003csmall>Some class-1 sequences lack the planted motif; some class-0 sequences contain it.\u003c/small>\u003c/div>","takeaway":"Known simulation truth lets us test explanations without pretending to discover biology.","notes":"Have students predict whether a perfect motif detector gets every label right: no. Planting is stochastic, and background can contain incidental matches. Do not imply nuisance shifts or real promoter annotation exist in this implemented simple-signal variant.","kind":""},{"day":1,"time":"34–42 · representation","title":"Turn sequence into a bag of 4-mers","subtitle":"Overlapping windows become a fixed-length numeric representation.","body":"\u003cpre>\u003ccode>ACGTAC  →  ACGT | CGTA | GTAC\n\n160 bases → 157 overlapping windows\n4 possible bases, length 4 → 4⁴ = 256 possible 4-mers\u003c/code>\u003c/pre>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>What survives\u003c/h2>\u003cp>How often each short word appears. A linear classifier can combine evidence from several overlapping pieces of a motif.\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>What disappears\u003c/h2>\u003cp>The vector does not record which occurrence was at base 32, which was at base 80, or their long-range order.\u003c/p>\u003c/div>\u003c/div>","takeaway":"A representation is a decision about which distinctions the model can make.","notes":"Ask students whether shifting a motif always preserves all counts: not necessarily, because the boundary windows change. The Day 2 controlled construction uses matching flanks to guarantee equal bags. Avoid treating arbitrary sequence permutations as count-preserving.","kind":""},{"day":1,"time":"42–50 · practical","title":"Inspect first, then encode","subtitle":"Pairs · six minutes to inspect, two minutes to compare interpretations.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Do this now\u003c/h2>\u003cul>\u003cli>Inspect sequence length, alphabet, sample IDs, and class counts from \u003ca href=\"../paste_ready/01_simple_signal.py\">code 01\u003c/a>.\u003c/li>\u003cli>Use \u003ca href=\"../instructor/exercises.md\">Day 1 exercise\u003c/a>: complete the validation prediction step.\u003c/li>\u003cli>Predict whether a bag of 4-mers retains motif position.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Explain to your partner\u003c/h2>\u003cul>\u003cli>Why is the target not simply “motif present”?\u003c/li>\u003cli>Why should IDs and simulation-truth fields stay out of the model?\u003c/li>\u003cli>Optional: enumerate the five overlapping 4-mers inside \u003ccode>TATAAATG\u003c/code>.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Inspect the input contract before interpreting any metric.","notes":"Expected five windows: TATA, ATAA, TAAA, AAAT, AATG. Repeated or incidental matches are possible in full sequences. Target is the sampled binary class, not the planting flag. Optional extension stays validation-only; do not run a hyperparameter sweep.","kind":""},{"day":1,"time":"50–60 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Train, validation, and protected test identities\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":1,"time":"60–70 · evaluation design","title":"Three partitions, three different jobs","subtitle":"Simple-signal split: stratified 60% / 20% / 20%, recorded once and reused.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Training · 720\u003c/b>Fit features and parameters\u003cspan>Only training data fit learned preprocessing\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Validation · 240\u003c/b>Develop and compare\u003cspan>Repeated use makes it development evidence\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Protected test · 240\u003c/b>One planned comparison\u003cspan>Freeze first; reveal on Day 3\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Boundary, not magic\u003c/h2>\u003cp>Keep identities fixed across representations. Frozen, label-independent extraction may cache test-input embeddings. Protected test labels and scores must not guide development.\u003c/p>\u003c/div>","takeaway":"A new representation does not authorize a new favorable split.","notes":"The main simple-signal data have independent sequence groups. Later interaction pairs remain together. Explain training-only vocabulary/scaling even when labels are not used by a transform. Cache access is not test-label access. Do not promise secrecy by file permissions: this is a declared teaching boundary.","kind":""},{"day":1,"time":"70–80 · logistic regression","title":"A weighted sum becomes a probability","subtitle":"The baseline learns which 4-mer features support class 1.","body":"\u003cdiv class=\"equation\">z = b + Σⱼ wⱼxⱼ &nbsp;&nbsp;&nbsp; p(y = 1 | x) = 1 / (1 + e\u003csup>−z\u003c/sup>)\u003csmall>xⱼ: count for 4-mer j · wⱼ: learned weight · b: intercept\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Interpret a coefficient\u003c/h2>\u003cp>A positive coefficient increases the score as that count increases, holding the other features fixed. Correlated overlapping words complicate interpretation.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Worked prediction\u003c/h2>\u003cp>For an illustrative \u003cstrong>z = 1.2\u003c/strong>, the sigmoid is approximately \u003cstrong>0.769\u003c/strong>. At threshold 0.5, predict class 1.\u003c/p>\u003cp class=\"small\">Illustrative arithmetic, not an observed course prediction.\u003c/p>\u003c/div>\u003c/div>","takeaway":"A coefficient is conditional predictive evidence, not proof of a causal motif.","notes":"Ask what happens for z=0: p=0.5. Explain regularization as discouraging extreme weights rather than deriving the optimizer. A high probability is model output; calibration is a separate property. Do not interpret 0.769 as a measured biological probability.","kind":""},{"day":1,"time":"80–90 · metrics","title":"Rankings and decisions answer different questions","subtitle":"Declare ROC-AUC as the primary metric; threshold-based metrics use 0.5.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>An illustrative confusion matrix\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Actual / predicted\u003c/th>\u003cth scope=\"col\">Class 1\u003c/th>\u003cth scope=\"col\">Class 0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Class 1\u003c/td>\u003ctd>TP = 8\u003c/td>\u003ctd>FN = 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Class 0\u003c/td>\u003ctd>FP = 3\u003c/td>\u003ctd>TN = 7\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"small\">Accuracy = 15/20 = 0.75 · precision = 8/11 ≈ 0.73 · recall = 8/10 = 0.80.\u003c/p>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Threshold-free summaries\u003c/h2>\u003cul>\u003cli>ROC-AUC: probability a randomly selected positive outranks a negative, with half credit for ties.\u003c/li>\u003cli>Average precision summarizes the precision–recall curve; it is not trapezoidal PR-AUC.\u003c/li>\u003cli>A score without the split, metric, and sample population is incomplete.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Changing a decision threshold can change precision and recall without changing ROC-AUC.","notes":"Ask whether high accuracy on 99% negative data suffices: an all-negative model can look accurate. Our main variants are balanced, but the distinction still matters. ROC-AUC 0.5 is a chance-ranking reference, not proof a model ignored every feature.","kind":""},{"day":1,"time":"90–100 · practical","title":"Fit only on training; predict by identity","subtitle":"Use the completed pipeline, then fill the small validation step.","body":"\u003cpre>\u003ccode>pipeline.fit(train[\"sequence\"], train[\"label\"])\nprobabilities = pipeline.predict_proba(\n    validation[\"sequence\"]\n)[:, 1]\n\nroc_auc_score(validation[\"label\"], probabilities)\u003c/code>\u003c/pre>\u003cdiv class=\"panel teal\">\u003ch2>Pair task\u003c/h2>\u003cp>Use \u003ca href=\"../instructor/exercises.md\">the Day 1 snippet\u003c/a>. Keep sample IDs attached to predictions. Explain why fitting a vocabulary or scaler before splitting violates the protocol, even without labels.\u003c/p>\u003c/div>","takeaway":"Pipeline order and sample alignment are part of the scientific result.","notes":"This is a teaching extract, not a replacement script. Run the full standalone 01 for imports, data generation, metrics, and artifacts. Expected answer: evaluation inputs can influence learned preprocessing, violating training-only fitting; the magnitude of resulting optimism is not established by identifying the defect.","kind":""},{"day":1,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Trees, random forests, and evidence from validation\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":1,"time":"110–122 · trees and forests","title":"A tree asks questions; a forest averages","subtitle":"Nonlinear prediction does not remove the need for a valid experiment.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>A decision node\u003c/b>Is a 4-mer count above a threshold?\u003cspan>Split chosen using training data\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>A tree\u003c/b>Follow a sequence of questions\u003cspan>Leaves summarize training labels\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>A forest\u003c/b>Average many trees\u003cspan>Bootstrap samples and feature randomness\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Why averaging helps\u003c/h2>\u003cp>Individual deep trees can be unstable. Combining differently trained trees can reduce variance; it does not guarantee better validation performance.\u003c/p>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Use the supplied implementation\u003c/h2>\u003cp>\u003ca href=\"../paste_ready/01_simple_signal.py\">Code 01\u003c/a> includes logistic regression and a 100-tree random forest. Do not spend the class rebuilding a forest.\u003c/p>\u003c/div>\u003c/div>","takeaway":"A more flexible model can learn signal, noise, or a shortcut.","notes":"Optional detail: trees partition feature space and can capture conditional relationships between counts. Shorten this explanation first if delayed. The same declared split and metric policy applies to both models. Day 2 code 03 uses the same classical defaults.","kind":""},{"day":1,"time":"122–140 · compare and interpret","title":"What do these validation scores support?","subtitle":"Recorded default run · simple-signal variant · ROC-AUC · not test results","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Representation / model\u003c/th>\u003cth scope=\"col\">Validation ROC-AUC\u003c/th>\u003cth scope=\"col\">Defensible interpretation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bag of 4-mers / logistic regression\u003c/td>\u003ctd>0.801944\u003c/td>\u003ctd>The counts contain useful class information.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bag of 4-mers / random forest\u003c/td>\u003ctd>0.906806\u003c/td>\u003ctd>This fitted nonlinear model ranks better in this run.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Inspect, then challenge\u003c/h2>\u003cp>Compare important 4-mers with the planted motif. Correlated windows can share importance. Ask: would the same importance pattern prove real promoter recognition?\u003c/p>\u003cp>Pair task: state one supported claim and one claim these scores do not support.\u003c/p>\u003c/div>","takeaway":"A validation advantage is a result of this configuration, not a universal model ranking.","notes":"Use actual saved outputs only when clearly labeled as previous local execution. Students can inspect feature importance without assuming exact recovery. Supported: RF has higher validation ROC-AUC here. Unsupported: RF is always better; all important words are causal; this is a real promoter benchmark. Leave ten minutes for student interpretation rather than more tree theory.","kind":""},{"day":1,"time":"140–150 · consolidate","title":"What would falsify our explanation?","subtitle":"A good explanation predicts how evidence should change.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Check the experiment\u003c/h2>\u003cul>\u003cli>Keep the split manifest and metric policy fixed.\u003c/li>\u003cli>Check prediction IDs, not only array lengths.\u003c/li>\u003cli>Compare feature importance with simulation truth; do not feed truth fields into training.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Make a prediction\u003c/h2>\u003cul>\u003cli>If planting became less associated with labels, what should happen?\u003c/li>\u003cli>If IDs encoded labels, would high performance be reassuring?\u003c/li>\u003cli>If two representations use different validation IDs, is the comparison fair?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Protect evaluation and interpretation before adding another model.","notes":"Expected: weaker label-associated planting should generally weaken usable signal, not dictate an exact score; label-coded IDs are a shortcut; different IDs confound comparison. These are discussion counterfactuals, not new reported runs. Transition to the separate leakage activity.","kind":""},{"day":1,"time":"150–180 · leakage, discussion, buffer","title":"A high score can answer the wrong question","subtitle":"Separate leakage investigation · do not alter the main course split.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Family background\u003c/b>Related sequence members\u003cspan>One randomly assigned family label\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Random row split\u003c/b>Families cross the boundary\u003cspan>Family recognition can look predictive\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Group split\u003c/b>Hold out whole families\u003cspan>Tests transfer to unseen families\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>Run or inspect\u003c/h2>\u003cp>Use \u003ca href=\"../paste_ready/02_split_leakage.py\">standalone code 02\u003c/a>. Compare row-level and family-level splitting. Inspect group overlap before interpreting the scores.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Predict and explain\u003c/h2>\u003cp>Family labels are random and unrelated to background. Why can related validation rows still receive useful predictions? What should transfer to a new family?\u003c/p>\u003c/div>\u003c/div>","takeaway":"Unique sample IDs do not guarantee independent evaluation units.","notes":"Suggested pacing: 3 minutes predict, 8 run/inspect, 9 compare evidence, 5 recap, 5 questions/buffer. Short route: inspect saved outputs and group-overlap diagnostics rather than rerun. Expected: family resemblance leaks family labels across row splits; arbitrary labels do not supply a transferable rule for new families. Do not promise an exact chance score in a finite sample. End with training-only fit, validation-only development, protected test comparison.","kind":""},{"day":2,"time":"0–10 · recap","title":"Day 2 · Learn the representation","subtitle":"Yesterday we chose the features. Today we fit features and a classifier together.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Retrieve yesterday’s experiment\u003c/h2>\u003cul>\u003cli>What did a bag of 4-mers preserve?\u003c/li>\u003cli>Which data fitted the pipeline?\u003c/li>\u003cli>Why did the separate family leakage exercise need a group split?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Today’s question\u003c/h2>\u003cp>Can a representation retain the position and order that a bag of 4-mers discards?\u003c/p>\u003cp>We will compare the same models on the same variants, not assign each model a favorable task.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Sequence\u003c/b>Same 160-base inputs\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Representation\u003c/b>Fixed one-hot → learned features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Evaluation\u003c/b>Same IDs and boundary\u003c/div>\u003c/div>","takeaway":"Learning a representation changes the hypothesis, not the evaluation contract.","notes":"Expected recap: counts survive, position does not; fit training only; families are evaluation units. Preserve 0–10 for student answers, not setup repetition. Open standalone code 03 but do not start tuning.","kind":""},{"day":2,"time":"10–20 · neuron","title":"A neuron starts with familiar arithmetic","subtitle":"Linear score → nonlinear activation → another learned transformation.","body":"\u003cdiv class=\"equation\">a = ReLU(b + Σⱼ wⱼxⱼ) &nbsp;&nbsp;&nbsp; ReLU(z) = max(0, z)\u003csmall>An activation introduces nonlinearity; stacking only linear maps would remain linear.\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>Worked hidden unit\u003c/h2>\u003cp>Inputs (2, 1), weights (0.5, −1), bias 0.2 give \u003cstrong>z = 0.2\u003c/strong>, so \u003cstrong>a = 0.2\u003c/strong>.\u003c/p>\u003cp>Changing the second input to 2 gives z = −0.8, so a = 0.\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>Connect to prediction\u003c/h2>\u003cp>The final layer produces a logit. The sigmoid converts that logit into a class-1 probability, just as in logistic regression.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Hidden units transform features; the output layer still answers a defined prediction question.","notes":"Ask students to compute both examples before revealing verbally. Explain that many hidden units can combine features. Do not imply an individual hidden unit has a biological meaning. No gradient derivation required.","kind":""},{"day":2,"time":"20–30 · loss","title":"The loss tells training what “wrong” means","subtitle":"Binary cross-entropy penalizes confident errors strongly.","body":"\u003cdiv class=\"equation\">ℓ(y, p) = −[y log(p) + (1 − y) log(1 − p)]\u003csmall>Training averages this loss over examples. The implemented loss consumes logits for numerical stability.\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Two illustrative predictions\u003c/h2>\u003cp>For y = 1: p = 0.8 gives loss ≈ 0.223; p = 0.2 gives loss ≈ 1.609.\u003c/p>\u003cp>Both concern one label; neither is a course-model result.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Loss is not ROC-AUC\u003c/h2>\u003cp>Loss provides a trainable objective. Validation ROC-AUC selects the saved CNN epoch in the supplied workflow.\u003c/p>\u003cp>Lower training loss alone does not establish better generalization.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Separate the optimized training objective from the declared evaluation metric.","notes":"Natural logarithms in the examples. Ask why a confidently wrong prediction should cost more. Explain why sigmoid is used for prediction while BCEWithLogitsLoss handles it internally during training; do not apply sigmoid twice to the training logits.","kind":""},{"day":2,"time":"30–40 · optimization","title":"Training is repeated error correction","subtitle":"Backpropagation assigns local responsibility; an optimizer updates parameters.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Forward pass\u003c/b>Compute logits and loss\u003cspan>Current filters and classifier\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Backward pass\u003c/b>Compute loss gradients\u003cspan>Chain rule through operations\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Optimizer step\u003c/b>Update parameters\u003cspan>Repeat over minibatches and epochs\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">θ ← θ − η ∇\u003csub>θ\u003c/sub>L &nbsp; (gradient-descent intuition)\u003csmall>θ: parameters · η: learning rate · actual optimizer may adapt step sizes\u003c/small>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Read a training curve\u003c/h2>\u003cp>Training loss falling while validation ranking worsens is a warning about overfitting. Keep the selected epoch and its validation evidence; do not select with test labels.\u003c/p>\u003c/div>","takeaway":"Backpropagation is a method for computing derivatives, not a biological explanation.","notes":"Conceptual only. Ask what happens if learning rate is too large: unstable updates are possible. The formula is gradient-descent intuition, not a claim that the supplied optimizer is plain SGD. The supplied selection keeps highest validation ROC-AUC with earliest tie.","kind":""},{"day":2,"time":"40–50 · one-hot DNA","title":"One-hot DNA preserves each position","subtitle":"A fixed alphabet encoding is not yet a learned representation.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Encoding A C G T\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Channel / position\u003c/th>\u003cth scope=\"col\">A\u003c/th>\u003cth scope=\"col\">C\u003c/th>\u003cth scope=\"col\">G\u003c/th>\u003cth scope=\"col\">T\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Connect shape to code\u003c/h2>\u003cul>\u003cli>One sequence: \u003ccode>(4, 160)\u003c/code>.\u003c/li>\u003cli>A batch: \u003ccode>(batch, 4, 160)\u003c/code>.\u003c/li>\u003cli>Unlike A=0, C=1, G=2, T=3, one-hot does not imply numeric distances between bases.\u003c/li>\u003cli>Pair task: encode \u003ccode>ACGT\u003c/code> and identify the position axis.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"One-hot preserves order; convolution learns which local patterns matter.","notes":"Use instructor/exercises.md Day 2 snippet. Expected channel order A,C,G,T. Course inputs contain only unambiguous uppercase bases; do not invent an unknown-base encoding. Optional faster-student extension: count the number of ones per position and per sequence.","kind":""},{"day":2,"time":"50–60 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Convolution, global max pooling, and a position-aware classifier\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":2,"time":"60–73 · convolution","title":"A convolution applies one local detector repeatedly","subtitle":"Shared weights scan the position axis; different filters can detect different patterns.","body":"\u003cdiv class=\"equation\">h\u003csub>f,t\u003c/sub> = ReLU(b\u003csub>f\u003c/sub> + Σ\u003csub>c,j\u003c/sub> W\u003csub>f,c,j\u003c/sub>x\u003csub>c,t+j\u003c/sub>)\u003csmall>f: filter · c: base channel · j: local offset · t: sequence position\u003c/small>\u003c/div>\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>One-hot DNA\u003c/b>4 channels × 160 positions\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>16 filters\u003c/b>Width 7, padding 3\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>16 filters\u003c/b>Width 5, padding 2\u003c/div>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>What is learned?\u003c/h2>\u003cp>Filter weights, not a supplied motif list. A high activation can indicate a useful local feature, but is not automatically a calibrated motif match or a causal binding event.\u003c/p>\u003c/div>","takeaway":"Weight sharing provides a local-pattern bias; the final architecture determines what happens to position.","notes":"Explain padding preserves length in this implementation. Slide equation suppresses padding indexing for readability. Two convolutions with ReLU are the actual filters, not a generic single-layer cartoon. Ask what the same filter can do at two positions: reuse weights.","kind":""},{"day":2,"time":"73–84 · architecture","title":"This CNN deliberately keeps position","subtitle":"Flattened convolution map plus global max features → a small classifier.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Convolution map\u003c/b>16 × 160\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Concatenate\u003c/b>Flatten: 2,560\u003cbr>Global max: 16\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Classifier\u003c/b>2,576 → 32 → 1\u003cbr>ReLU then logit\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel teal\">\u003ch2>Flattened map\u003c/h2>\u003cp>Retains which activation occurred at each fixed position. The classifier can assign different weights to base-32 and base-80 neighborhoods.\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>Global max branch\u003c/h2>\u003cp>Keeps the strongest activation per channel without its location. Global max alone would discard the position cue this teaching construction uses.\u003c/p>\u003c/div>\u003c/div>","takeaway":"The interaction result depends on a position-aware architecture, not “CNN” as a label.","notes":"Show course_inference.SequenceCNN if asked; forward concatenates features.flatten(1) and features.amax(dim=2). No dropout or generic pooling-only model should be described here. Position sensitivity is useful in this construction and can be a limitation when deployment shifts motifs.","kind":""},{"day":2,"time":"84–100 · practical","title":"Train the supplied CNN; inspect the boundary","subtitle":"Complete a small step, not an architecture from scratch.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Run and inspect\u003c/h2>\u003cul>\u003cli>Use \u003ca href=\"../paste_ready/03_representations.py\">standalone code 03\u003c/a> and \u003ca href=\"../instructor/exercises.md\">the Day 2 snippet\u003c/a>.\u003c/li>\u003cli>Inspect one-hot shape and the two representation branches.\u003c/li>\u003cli>Run the simple-signal training and inspect validation predictions.\u003c/li>\u003cli>Track saved epoch, seed, metric, and sample IDs.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Before looking at results\u003c/h2>\u003cul>\u003cli>Should a larger model necessarily beat the 4-mer baseline on 720 training samples?\u003c/li>\u003cli>What would overfitting look like?\u003c/li>\u003cli>If training is slow, inspect identified saved outputs rather than silently changing settings.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"A successful training loop is an engineering result; held-out prediction is a separate result.","notes":"Protect the full 16 minutes for running and interpreting. Use supplied completed code for slow students. Optional extension only: count learned parameters or inspect activations. Expected: no guaranteed advantage; model capacity and optimization differ, and validation can deteriorate while training improves. Local run timings are not a Colab classroom estimate.","kind":""},{"day":2,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>A controlled fixed-position motif-order experiment\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":2,"time":"110–123 · interaction construction","title":"Same ingredients; different fixed-position order","subtitle":"Interaction-signal variant · 240 independent pairs · 480 sequences · paired splits","body":"\u003cdiv class=\"panel blue\">\u003ch2>Illustrative pair · shared background within a pair\u003c/h2>\u003cdiv class=\"dna\">\u003cspan class=\"position\">Class 1 · block 32\u003c/span>\u003cspan>GGGGGG\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003cspan>CCCCCC\u003c/span>\u003cspan>…\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003c/div>\u003cdiv class=\"dna\">\u003cspan class=\"position\">Class 0 · block 32\u003c/span>\u003cspan>GGGGGG\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003cspan>CCCCCC\u003c/span>\u003cspan>…\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003c/div>\u003cp class=\"small\">The second full block starts at 80. Both blocks have six Gs before and six Cs after the motif. Starts 32 and 80 are zero-based block starts; motif starts are 38 and 86.\u003c/p>\u003c/div>\u003cul>\u003cli>Swap the motifs between the two fixed blocks, leaving shared background unchanged.\u003c/li>\u003cli>Both members of each pair stay in one partition: 144 / 48 / 48 pairs in train / validation / test.\u003c/li>\u003c/ul>","takeaway":"This is engineered fixed-position motif order, not a general biological grammar task.","notes":"The diagram abbreviates the second block; explain that both flanks are present at both positions. The code positions refer to the start of the flank+motif+flank block, not the motif itself. Do not imply realistic promoter architecture, learned spacing rules, or arbitrary long-range interactions.","kind":""},{"day":2,"time":"123–132 · representation proof","title":"Identical feature vectors force identical scores","subtitle":"A controlled impossibility result for any classifier using only these 4-mer bags.","body":"\u003cdiv class=\"equation\">φ\u003csub>4-mer\u003c/sub>(sequence\u003csub>0\u003c/sub>) = φ\u003csub>4-mer\u003c/sub>(sequence\u003csub>1\u003c/sub>)\u003csmall>Matching flanks preserve boundary windows when the equal-length motif blocks are swapped.\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Why the bag cannot solve it\u003c/h2>\u003cp>Each pair supplies the same vector with opposite labels. A deterministic classifier of that vector must assign the same score to both members.\u003c/p>\u003cp>The balanced paired evaluation therefore yields chance ROC-AUC.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Why this CNN can distinguish them\u003c/h2>\u003cp>Flattened activations retain fixed positions. A dense layer can use “motif A near the first block” versus “motif A near the second block.”\u003c/p>\u003cp>That does not show position-invariant reasoning.\u003c/p>\u003c/div>\u003c/div>","takeaway":"No hyperparameter search can recover information that the representation removed.","notes":"Ask students whether adding more trees can distinguish identical vectors: no. This exact equality relies on the construction, not all motif swaps. The paired balanced test structure is the mathematical control; do not inspect protected labels in class to check it.","kind":""},{"day":2,"time":"132–140 · observed validation","title":"The same comparison tells two different stories","subtitle":"Actual default validation ROC-AUC · fixed split identities · no promised ranking","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Method\u003c/th>\u003cth scope=\"col\">Simple-signal\u003c/th>\u003cth scope=\"col\">Interaction-signal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4-mer logistic regression\u003c/td>\u003ctd>0.801944\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4-mer random forest\u003c/td>\u003ctd>0.906806\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Position-aware CNN\u003c/td>\u003ctd>0.564306\u003c/td>\u003ctd>1.000000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Interpret both columns\u003c/h2>\u003cp>The CNN is weak on the noisy simple-signal run yet solves the engineered fixed-position control. The comparison demonstrates a representation distinction, not universal superiority.\u003c/p>\u003c/div>","takeaway":"A controlled result can be informative without being a realistic biological benchmark.","notes":"These are supplied default local results, not fabricated examples or test results. If rerun changes configuration, clearly distinguish the new run. Ask students to explain why the CNN column does not invalidate the classical baseline or prove biological utility.","kind":""},{"day":2,"time":"140–150 · controlled changes","title":"Probe model behavior, not only its score","subtitle":"Predict a response before running a controlled change.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Use the Day 2 activity\u003c/h2>\u003cul>\u003cli>Swap the two motif blocks in the paired construction.\u003c/li>\u003cli>Verify that the 4-mer vectors remain equal.\u003c/li>\u003cli>Compare predicted probabilities for the pair.\u003c/li>\u003cli>Inspect which position-aware signal the CNN could exploit.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Separate experiment from speculation\u003c/h2>\u003cul>\u003cli>Expected control: same 4-mer input implies the same baseline score.\u003c/li>\u003cli>Observed CNN response is evidence about this fitted predictor.\u003c/li>\u003cli>New motif positions are an optional distribution-shift question, not a reported result.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"A prediction-change experiment can challenge an explanation; it does not establish biological causality.","notes":"Use instructor/completed/day2_representation.py for the focused activity. Ask whether a CNN response proves a motif is biologically functional: no. Keep unperformed moves, deletions, and randomizations labeled hypothetical. Any new experiment remains validation-only.","kind":""},{"day":2,"time":"150–180 · synthesis and buffer","title":"Choose an inductive bias you can defend","subtitle":"Discuss in pairs, report one limitation, then take questions.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Choice\u003c/th>\u003cth scope=\"col\">Exposes / retains\u003c/th>\u003cth scope=\"col\">Limit to remember\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4-mer bag\u003c/td>\u003ctd>Local composition; cheap, direct features\u003c/td>\u003ctd>Fixed-position order is absent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One-hot + this CNN\u003c/td>\u003ctd>Local detectors and position-aware combination\u003c/td>\u003ctd>Data/optimization cost; fixed-position reliance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tomorrow’s frozen embeddings\u003c/td>\u003ctd>A representation learned before our task\u003c/td>\u003ctd>Transfer is not guaranteed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Exit discussion\u003c/h2>\u003cp>When would you prefer the simple model even if a flexible model can fit a constructed task? Which evidence would justify collecting biological data rather than trying another architecture?\u003c/p>\u003c/div>","takeaway":"The scientific question and the information available determine what “better” means.","notes":"Suggested 8 minutes pairs, 10 debrief, 7 recap, 5 buffer. Expected preferences include cost, reproducibility, fewer samples, and transparent feature assumptions. Do not promise pretrained embeddings will improve tomorrow’s results. Protect interpretation over extra optimizer or transformer theory.","kind":""},{"day":3,"time":"0–10 · recap","title":"Day 3 · Reuse a pretrained representation","subtitle":"Can useful sequence features be learned before seeing our course labels?","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Pretraining\u003c/b>Learn from sequences\u003cspan>A self-supervised objective\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Frozen encoder\u003c/b>Sequence → vector\u003cspan>No course-label gradient updates\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Small classifier\u003c/b>Vector → probability\u003cspan>Fit using training labels\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Retrieve yesterday’s lesson\u003c/h2>\u003cp>Which representation solved fixed-position order? Which information did the 4-mer bag remove? Predict one reason a pretrained representation might fail to help on our artificial task.\u003c/p>\u003c/div>","takeaway":"Pretraining changes where features come from; it does not remove evaluation.","notes":"Expected: position-aware CNN can use fixed order; bags remove location; pretraining may emphasize unrelated features or mismatch organism/context/objective. Open code 04 only after datasets from code 03 exist. Do not reveal test scores during setup.","kind":""},{"day":3,"time":"10–20 · pretraining","title":"Self-supervision manufactures a training question","subtitle":"Mask a token and predict it from context: the target comes from the original input.","body":"\u003cpre>\u003ccode>Observed context:    … ACGTAC [MASK] GGATCC …\nSelf-supervised task: predict the original token\n\nCourse task:         predict a simulated binary label\u003c/code>\u003c/pre>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>What may transfer\u003c/h2>\u003cp>Statistical regularities useful for the pretraining objective may yield features useful for a downstream classifier.\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>What is not implied\u003c/h2>\u003cp>Reusable features are not a guarantee of promoter recognition, causal knowledge, or improved validation performance on this simulation.\u003c/p>\u003c/div>\u003c/div>","takeaway":"A pretraining objective and a downstream biological claim are not the same thing.","notes":"Explain the masking diagram is conceptual, not an actual tokenizer output or recorded prediction. Avoid claiming which motifs the encoder has learned. Pretraining corpus coverage and overlap are separate audit questions; we have not audited overlap.","kind":""},{"day":3,"time":"20–30 · attention","title":"Attention lets a token borrow context","subtitle":"A weighted combination changes a representation using other positions.","body":"\u003cdiv class=\"equation\">Attention(Q, K, V) = softmax(QKᵀ / √d\u003csub>k\u003c/sub>)V\u003csmall>Queries ask, keys match, values contribute. Softmax weights sum to one within each attended row.\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Illustrative two-token arithmetic\u003c/h2>\u003cp>If attention weights are (0.75, 0.25) and scalar values are (2, 6), their weighted sum is \u003cstrong>3\u003c/strong>.\u003c/p>\u003cp>Real hidden representations are vectors with multiple layers and heads.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>An interpretation limit\u003c/h2>\u003cp>Attention can connect distant positions, but an attention weight is not direct evidence of biological causality or a complete explanation of a prediction.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Context dependence is a mechanism; biological meaning must still be tested.","notes":"No transformer derivation. Ask students to calculate 0.75×2+0.25×6 before debrief. Diagram and numbers are illustrative, not extracted weights. Keep conceptual attention distinct from the downstream mean-pooling rule.","kind":""},{"day":3,"time":"30–40 · frozen versus fine-tuned","title":"Freeze the encoder, fit the classifier","subtitle":"Our practical extracts features; it does not fine-tune the DNA model.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Stage\u003c/th>\u003cth scope=\"col\">Frozen-embedding practical\u003c/th>\u003cth scope=\"col\">Fine-tuning contrast\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Encoder parameters\u003c/td>\u003ctd>Fixed pretrained weights\u003c/td>\u003ctd>Some or all weights updated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Course labels\u003c/td>\u003ctd>Used by the small classifier only\u003c/td>\u003ctd>Can update the encoder through loss\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trainable workflow\u003c/td>\u003ctd>Training-only scaler + logistic regression\u003c/td>\u003ctd>A different optimization experiment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost and provenance\u003c/td>\u003ctd>Record extraction and classifier separately\u003c/td>\u003ctd>Additional optimizer/checkpoint choices\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel blue\">\u003ch2>Do not confuse two meanings of freeze\u003c/h2>\u003cp>\u003cstrong>Frozen encoder:\u003c/strong> no parameter updates during extraction. \u003cstrong>Workflow freeze:\u003c/strong> lock the developed analysis before the planned Day 3 test comparison.\u003c/p>\u003c/div>","takeaway":"An encoder can be frozen long before the whole analysis is frozen.","notes":"Ask whether validation-selected classifier settings count as fine-tuning the encoder: no. The classifier is supervised even though extraction is label-independent. Fine-tuning is conceptual only; no extra training exercise is required.","kind":""},{"day":3,"time":"40–50 · representation contract","title":"What exactly is the embedding?","subtitle":"Pinned NT-v2 50M multispecies encoder · 512-component last-layer mean","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>160 bases\u003c/b>Tokenize without truncation\u003cspan>26 six-mers + 4 single bases + CLS\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Last hidden layer\u003c/b>Contextual token vectors\u003cspan>31 input tokens in this setting\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Masked mean\u003c/b>Average content tokens\u003cspan>Exclude special IDs and padding\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">e = (Σ\u003csub>t ∈ content\u003c/sub> h\u003csub>t\u003c/sub>) / |content| &nbsp;&nbsp; ∈ ℝ\u003csup>512\u003c/sup>\u003csmall>Content membership is derived from token IDs. Labels are not passed to extraction.\u003c/small>\u003c/div>\u003cp class=\"small\">Checkpoint: \u003ccode>InstaDeepAI/nucleotide-transformer-v2-50m-multi-species\u003c/code>\u003cbr>Revision: \u003ccode>81b29e5786726d891dbf929404ef20adca5b36f1\u003c/code>\u003c/p>","takeaway":"“An embedding” is incomplete without model, revision, layer, pooling, and sample identity.","notes":"Source: docs/foundation-embedding-verification.md. Do not call tokenization overlapping 6-mers. State eval mode and inference_mode for extraction. The 31-token count applies to these unambiguous 160-base inputs, not arbitrary sequences. Pooled output is 512 components, not 31×512.","kind":""},{"day":3,"time":"50–60 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>A small extraction, then the validated full-data cache\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":3,"time":"60–70 · execution and provenance","title":"Run small before trusting the cache","subtitle":"Actual local verification exists; classroom Colab verification is separate.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Execution sequence\u003c/h2>\u003cul>\u003cli>Open \u003ca href=\"../paste_ready/04_foundation_embeddings.py\">standalone code 04\u003c/a> after code 03.\u003c/li>\u003cli>Inspect extraction for two sequences, then use validated full-data caches.\u003c/li>\u003cli>Use frozen weights, evaluation mode, and inference mode.\u003c/li>\u003cli>Fit scaler and logistic regression on training embeddings only.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Recorded local evidence\u003c/h2>\u003cp>CPU, Python 3.13.14, PyTorch 2.10.0+cpu, Transformers 4.57.1.\u003c/p>\u003cp>Two-sequence extraction: 0.226 s simple-signal, 0.187 s interaction-signal. Full simple-signal extraction + cache checks: 77.62 s.\u003c/p>\u003cp class=\"small\">Excludes install/download. Not classroom network or Colab timings.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Inspecting a previous output is not a live extraction; label it honestly.","notes":"Source docs/foundation-embedding-verification.md. Checkpoint initialization from downloaded weights took 2.60 s locally; do not add it to extraction and claim a classroom total. Actual Colab and full-session rehearsal remain unrun. If live extraction fails, name that failure and use identified caches without claiming the live requirement passed.","kind":""},{"day":3,"time":"70–80 · loading safely","title":"Pin executable code as well as model weights","subtitle":"The course uses a custom architecture; loading is a reproducibility and trust decision.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Declared loading contract\u003c/h2>\u003cul>\u003cli>\u003ccode>AutoModelForMaskedLM\u003c/code> with the pinned custom model and code revision.\u003c/li>\u003cli>Model loading requires \u003ccode>trust_remote_code=True\u003c/code>; inspect the pinned source.\u003c/li>\u003cli>Tokenizer uses \u003ccode>trust_remote_code=False\u003c/code> and \u003ccode>use_fast=False\u003c/code>.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Do not overstate the checks\u003c/h2>\u003cul>\u003cli>Safetensors avoids pickle-based weight loading; it does not stop custom model code executing.\u003c/li>\u003cli>Load only trusted, locally created joblib artifacts.\u003c/li>\u003cli>Weight license: CC-BY-NC-SA-4.0; check suitability before reuse outside this course.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Reproducibility metadata and source inspection reduce uncertainty; neither is a security guarantee.","notes":"The custom model uses SwiGLU layers; a superficially similar built-in architecture is not interchangeable. Do not ask students for keys: local checkpoint download was public and ungated. The local source inspection is recorded, not a full security audit. Teaching software safety is bounded to this loading contract.","kind":""},{"day":3,"time":"80–90 · cache audit","title":"A correct shape is not enough","subtitle":"A cache row must describe the exact sequence attached to its sample ID.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Check\u003c/th>\u003cth scope=\"col\">Why it matters\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Unique IDs and exact coverage\u003c/td>\u003ctd>No missing, duplicate, or substituted samples\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sequence SHA-256 per ID\u003c/td>\u003ctd>Same name cannot silently hide a changed sequence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model ID, revision, pooling policy\u003c/td>\u003ctd>Representation must match the declared extraction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finite shape (n, 512)\u003c/td>\u003ctd>Reject invalid vectors or incompatible dimensions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Align by sample ID\u003c/td>\u003ctd>File row order must not become a hidden assumption\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"small\">Frozen label-independent extraction may cache test inputs. Test labels and scores remain protected development boundaries.\u003c/p>","takeaway":"Shape agreement is not identity agreement.","notes":"Use the actual load_embedding_cache contract. Ask whether shuffled rows invalidate embeddings: no, if IDs and sequence hashes are checked and correctly aligned; yes, if positional pairing silently changes samples. Never infer that caching an input grants permission to score its protected label.","kind":""},{"day":3,"time":"90–100 · practical","title":"Repair the alignment before fitting","subtitle":"Pairs · use the supplied missing-code activity and explain your checks.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Activity\u003c/h2>\u003cul>\u003cli>Use \u003ca href=\"../instructor/exercises.md\">the Day 3 alignment exercise\u003c/a>.\u003c/li>\u003cli>Inspect the scrambled sample-ID order.\u003c/li>\u003cli>Align embeddings to the requested IDs after checking uniqueness and coverage.\u003c/li>\u003cli>Explain what would happen if a row were missing.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Expected behavior\u003c/h2>\u003cul>\u003cli>Shuffling rows alone should not change aligned features.\u003c/li>\u003cli>A missing ID must cause a clear failure, not a guessed vector.\u003c/li>\u003cli>The downstream scaler must learn from training rows only.\u003c/li>\u003cli>Run the supplied full code for provenance checks.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"Fail on mismatched identity; do not manufacture a plausible replacement.","notes":"Expected solution in instructor/completed/day3_alignment.py. This focused exercise does not replace the full model/cache extraction. If time is short, work through three sample IDs on the board, but preserve the invariant. Stop a run with missing provenance rather than report an unverified comparison.","kind":""},{"day":3,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Compare validation evidence, then freeze the analysis\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":3,"time":"110–125 · validation comparison","title":"Transfer is measured, not presumed","subtitle":"Actual default validation ROC-AUC · no protected test scores shown","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Method\u003c/th>\u003cth scope=\"col\">Simple-signal\u003c/th>\u003cth scope=\"col\">Interaction-signal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4-mer logistic regression\u003c/td>\u003ctd>0.801944\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4-mer random forest\u003c/td>\u003ctd>0.906806\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Position-aware CNN\u003c/td>\u003ctd>0.564306\u003c/td>\u003ctd>1.000000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Frozen NT-v2 embedding + logistic regression\u003c/td>\u003ctd>0.618333\u003c/td>\u003ctd>0.800347\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Compare more than a number\u003c/h2>\u003cp>Discuss extraction cost, classifier cost, identity/provenance checks, interpretability, and relevance to the target question. These runs support no universal method ranking.\u003c/p>\u003c/div>","takeaway":"Pretraining helped distinguish this engineered order task imperfectly; it did not dominate the simple-signal run.","notes":"Foundation results source: docs/foundation-embedding-verification.md; classical/CNN from representation run. Ask whether comparing methods on different variants would isolate representation effects: no. Supporting average precision is available in recorded artifacts; do not relabel it PR-AUC. These are validation results, so discussion may guide development only before freeze.","kind":""},{"day":3,"time":"125–138 · transfer and limits","title":"What population does the claim concern?","subtitle":"A successful artificial-sequence result is still an artificial-sequence result.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Transfer questions\u003c/h2>\u003cul>\u003cli>Do pretraining organisms, sequence lengths, and genomic contexts match the intended use?\u003c/li>\u003cli>Does the pooling rule preserve the needed signal?\u003c/li>\u003cli>Have pretraining overlaps been audited?\u003c/li>\u003cli>What independent biological measurement would test the claim?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Known limits here\u003c/h2>\u003cul>\u003cli>The checkpoint card excludes plants and viruses from pretraining genomes.\u003c/li>\u003cli>Pretraining overlap has not been audited; do not claim none exists.\u003c/li>\u003cli>The planted motif and fixed-position controls do not establish real promoter utility.\u003c/li>\u003cli>Fine-tuning remains a different, unperformed practical.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"A plant-motivated question does not make this a verified plant promoter model.","notes":"The organism exclusion is documented in foundation-embedding-verification.md from the pinned card. Discuss why the motivation can be biologically meaningful while the experiment remains simplified. Shorten optional architecture detail before reducing this interpretation block.","kind":""},{"day":3,"time":"138–150 · freeze gate","title":"Stop development before the reveal","subtitle":"Make a reproducible record, then ask what evidence you expect to see.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Check\u003c/b>Split IDs, artifacts, provenance\u003cspan>Models and thresholds are final\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Freeze\u003c/b>Run standalone 05 once\u003cspan>Records the developed workflows\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Discuss\u003c/b>Predict, do not tune\u003cspan>No test scores calculated yet\u003c/span>\u003c/div>\u003c/div>\u003cpre>\u003ccode>Paste and run the complete 05_frozen_comparison.py file.\nThe standalone first execution freezes only.\n\nDo not call reveal_test yet.\u003c/code>\u003c/pre>\u003cp>\u003ca href=\"../paste_ready/05_frozen_comparison.py\">Open standalone code 05\u003c/a> · freeze preprocessing, models, selection decisions, metric policy, and thresholds (0.5).\u003c/p>","takeaway":"Freezing an encoder is not enough: freeze the entire developed analysis.","notes":"Use instructor/guide.md for the gate and preserve the frozen manifest. No actual test reveal has been performed for the slide implementation. Do not invent a table. If artifacts fail validation, stop and resolve the failure; do not bypass checks. Have students state a directional expectation without promising a ranking.","kind":""},{"day":3,"time":"150–180 · explicit reveal and synthesis","title":"One planned test comparison, only after freeze","subtitle":"Instructor gate · verify the frozen record before executing the explicit reveal.","body":"\u003cpre>\u003ccode>reveal_test(\n    confirmation=\"REVEAL THE FROZEN TEST RESULTS\"\n)\u003c/code>\u003c/pre>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Read the actual output together\u003c/h2>\u003cul>\u003cli>Identify the variant, method, metric, and held-out IDs.\u003c/li>\u003cli>Compare with expectations and validation evidence.\u003c/li>\u003cli>Record surprises without changing settings to improve the test result.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>No numbers are prefilled here\u003c/h2>\u003cp>Protected test results are not available in this deck. Only the actual authorized run supplies them.\u003c/p>\u003cp>After this comparison, the same test cannot be fresh independent evidence for Day 4 tuning.\u003c/p>\u003c/div>\u003c/div>","takeaway":"A surprising test result is evidence to discuss, not permission to tune against it.","notes":"Pacing: 5 minutes gate and expectations, 8 actual comparison if ready, 10 conclusions, 7 recap/questions/buffer. Run only after an instructor-confirmed freeze. If no reveal is authorized or the gate fails, keep it closed and discuss the protocol; report the reveal as not run. Do not substitute validation scores as test scores.","kind":""},{"day":4,"time":"0–10 · recap","title":"Day 4 · Specify, delegate, and audit","subtitle":"A coding agent can execute an analysis. You still own its scientific claims.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Carry forward the contract\u003c/h2>\u003cul>\u003cli>Same simulated task and fixed development identities.\u003c/li>\u003cli>Training-only fitting; validation-only development.\u003c/li>\u003cli>Previously revealed test results cannot choose a new approach.\u003c/li>\u003cli>Actual outputs, not plausible-looking conclusions.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Two equally valid participation routes\u003c/h2>\u003cp>\u003cstrong>Participate:\u003c/strong> use an available agent and keep the evidence.\u003c/p>\u003cp>\u003cstrong>Observe:\u003c/strong> inspect prompts, code, artifacts, and the same audit questions.\u003c/p>\u003cp>No paid student access or student-run Agentomics is required.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Delegation changes who executes the work, not who must justify the experiment.","notes":"Ask students to reconstruct the boundary from Day 3. Do not open protected labels during the Day 4 workshop. Agent access is optional; one instructor can demonstrate. Distinguish an authored fixture from a real agent run at every transition.","kind":""},{"day":4,"time":"10–20 · context","title":"A language model sees supplied context","subtitle":"An assistant can fill an ambiguity with a reasonable-sounding but consequential choice.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Context\u003c/b>Request, files, prior messages\u003cspan>Only what is supplied or retrieved\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Model output\u003c/b>Text or a proposed tool call\u003cspan>Not automatically verified\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Environment\u003c/b>Tools return observations\u003cspan>Files, code, logs, failures\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What must be explicit?\u003c/h2>\u003cp>Population, evaluation unit, target, features, splits, metrics, allowed fitting, forbidden test use, and evidence requirements.\u003c/p>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>What remains your responsibility?\u003c/h2>\u003cp>Check whether the available context contains the needed truth, whether decisions follow the specification, and whether the conclusions match actual evidence.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Fluent completion is not a substitute for a scientific specification.","notes":"Use this as a concrete context model, not an exhaustive account of LLM internals. Ask which omitted choice could invalidate this exact course comparison: regrouping split IDs, tuning on test scores, or replacing the simulation with a claimed promoter dataset.","kind":""},{"day":4,"time":"20–30 · agent loop","title":"An agent is a loop with tools and boundaries","subtitle":"The loop can produce useful artifacts and repeat the same mistaken premise.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Inspect / plan\u003c/b>Choose a next action\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Act\u003c/b>Read, edit, execute a tool\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Observe\u003c/b>Read actual output\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Revise / report\u003c/b>Continue or stop honestly\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Project instructions\u003c/h2>\u003cp>Persistent project constraints: do not score protected test labels; preserve sample IDs; report blocked checks.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>A relevant skill\u003c/h2>\u003cp>A reusable procedure for a bounded task, such as checking split integrity, prediction alignment, and claims against evidence.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Instructions and skills constrain behavior; they do not certify correctness.","notes":"Ask where an agent should stop if cache hashes do not match: at the invalid input, reporting the failure. It should not invent vectors, silently change the dataset, or present cached outputs as new execution. This is a workflow concept, not an invented product capability.","kind":""},{"day":4,"time":"30–40 · vague request","title":"“Find the best model” hides the experiment","subtitle":"Inspect the supplied vague request before providing the specification.","body":"\u003cdiv class=\"panel blue\">\u003ch2>The ambiguity to investigate\u003c/h2>\u003cp>Which observations? Which target? What does “best” mean? Which split? Which preprocessing can see evaluation inputs? What supports a biological claim?\u003c/p>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Instructor demonstration route\u003c/h2>\u003cp>Open \u003ca href=\"../agent_workshop/vague-prompt.md\">the vague prompt\u003c/a>. Inspect the actual \u003ca href=\"../agent_workshop/actual_runs/2026-10-26/specified/run_report.md\">specified-run report\u003c/a> and \u003ca href=\"../agent_workshop/actual_runs/2026-10-26/vague/run_report.md\">vague-run artifacts\u003c/a>; retain their execution and intervention records.\u003c/p>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Evidence status\u003c/h2>\u003cp>The \u003cstrong>authored teaching fixture\u003c/strong> is distinct from the actual runs. Both development-only runs completed on October 26, 2026 and were scientifically cautious. Inspect their actual decisions after the break. A genuine screen recording remains pending.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Do not claim an agent made a mistake unless an actual run records that mistake.","notes":"Ask students to note silent decisions before supplying the precise spec. No need for a live run to fail in exactly the authored way. If the service is blocked, use the explicitly labeled fixture for audit practice, and report the live demonstration as not run. Never call the fixture a recorded run.","kind":""},{"day":4,"time":"40–50 · inspect the fixture","title":"The authored fixture runs, but its claim fails","subtitle":"Read it as an audit exercise, not evidence about a model’s performance.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Inspect these artifacts\u003c/h2>\u003cp>\u003ca href=\"../agent_workshop/fixture.md\">Fixture description\u003c/a> · \u003ca href=\"../agent_workshop/flawed_analysis.py\">authored flawed analysis\u003c/a>\u003c/p>\u003cul>\u003cli>Related groups cross train/validation.\u003c/li>\u003cli>The vocabulary is fitted before partitioning.\u003c/li>\u003cli>Prediction order differs from label order.\u003c/li>\u003cli>The conclusion claims learned promoter biology.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Pair task · five minutes\u003c/h2>\u003cp>For each defect, write:\u003c/p>\u003col>\u003cli>What exact evidence reveals it?\u003c/li>\u003cli>Which conclusion becomes unsupported?\u003c/li>\u003cli>What repair is needed?\u003c/li>\u003c/ol>\u003cp class=\"small\">Do not repair the fixture by inventing better probabilities.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Successful execution and valid inference are independent audit questions.","notes":"Expected answers are in agent_workshop/worked-audit.md. Keep the fixture’s four authored rows separate from the main experiment. Vocabulary leakage violates protocol, but finding it does not establish how much it changed performance. Transition: remove ambiguity before asking for a new clean run.","kind":""},{"day":4,"time":"50–60 · break","title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Explicit specification, project instructions, and an audit skill\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break"},{"day":4,"time":"60–73 · specification","title":"Write the experiment the agent must preserve","subtitle":"Use the course specification, not a request for an attractive score.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Specify\u003c/th>\u003cth scope=\"col\">Concrete course requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Question and data\u003c/td>\u003ctd>Simulated binary sequence classification; no promoter-discovery claim\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identity and partitions\u003c/td>\u003ctd>Reuse fixed split manifest; respect related groups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Features and fitting\u003c/td>\u003ctd>Sequence-derived features; fit preprocessing and model on training only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Development evidence\u003c/td>\u003ctd>Validation ROC-AUC primary; average precision supporting; threshold 0.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protected boundary\u003c/td>\u003ctd>No test-label access or test-guided selection in this agent task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deliverables\u003c/td>\u003ctd>Actual predictions by ID; code/configuration/provenance; failures and scientific audit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003ca href=\"../agent_workshop/precise-spec.md\">Open the complete precise specification\u003c/a>.\u003c/p>","takeaway":"A specification should make an invalid shortcut detectable, not merely discourage it.","notes":"Have pairs choose one requirement and explain its independent verification. Allowed label-independent test-input extraction does not authorize the agent to tune using labels or revealed scores. The agent task is development-only even if the Day 3 instructor comparison occurred.","kind":""},{"day":4,"time":"73–85 · instructions and skill","title":"Separate the experiment from reusable rules","subtitle":"Specification · what this analysis must do. Instructions · project constraints. Skill · how to audit.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Project-level constraints\u003c/h2>\u003cp>Open \u003ca href=\"../agent_workshop/example-project/AGENTS.md\">the example AGENTS.md\u003c/a>.\u003c/p>\u003cul>\u003cli>Preserve evaluation and identity invariants.\u003c/li>\u003cli>Do not fabricate outputs or bypass failures.\u003c/li>\u003cli>Keep claims within the simulation evidence.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Scientific-audit procedure\u003c/h2>\u003cp>Open \u003ca href=\"../agent_workshop/example-project/skills/scientific-audit/SKILL.md\">the scientific-audit skill\u003c/a>.\u003c/p>\u003cul>\u003cli>Inspect split and feature-fitting boundaries.\u003c/li>\u003cli>Check prediction coverage and alignment.\u003c/li>\u003cli>Trace each scientific claim to actual evidence.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"More instructions are useful only when they remove ambiguity and support checkable behavior.","notes":"Ask what belongs in the spec versus a reusable instruction: exact dataset/metric belongs in spec; report blocked checks can be project-wide. Use the actual supplied files; do not invent platform features. These files guide behavior but cannot guarantee compliance.","kind":""},{"day":4,"time":"85–100 · actual-run comparison","title":"Compare actual decisions, not presentation quality","subtitle":"Actual development-only runs · October 26, 2026 · both scientifically cautious","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Run\u003c/th>\u003cth scope=\"col\">Actual approach\u003c/th>\u003cth scope=\"col\">Validation ROC-AUC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Vague request\u003c/td>\u003ctd>Training-only group CV; 6 candidates by log loss; disclosed TATAAATG motif LR\u003c/td>\u003ctd>0.9041667\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Specified request\u003c/td>\u003ctd>Declared bag-of-4-mers logistic regression\u003c/td>\u003ctd>0.8019444\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What the traces show\u003c/h2>\u003cp>Inspect \u003ca href=\"../agent_workshop/actual_runs/2026-10-26/vague/run_report.md\">the vague run\u003c/a> and \u003ca href=\"../agent_workshop/actual_runs/2026-10-26/specified/run_report.md\">the specified run\u003c/a>. Both used the same provider/model and technical boundary, not a sandbox. The vague run needed a technical apply_patch intervention.\u003c/p>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Not a causal prompt-quality experiment\u003c/h2>\u003cp>Objectives, features, and searches differ. Higher validation ROC-AUC does not show that a vague prompt is better. Both were scientifically cautious; no screen recording exists.\u003c/p>\u003c/div>\u003c/div>","takeaway":"The actual runs are evidence of different decisions, not a controlled comparison of prompt quality.","notes":"Use 15 minutes for the observation sheet and discussion. The vague run used training-only group CV to compare six candidates by log loss, then reporte
