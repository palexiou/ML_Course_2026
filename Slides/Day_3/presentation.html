:root{--ink:#14213d;--muted:#536476;--line:#dbe3ea;--soft:#f7f9fb;--accent:#234e70;--teal:#216869;--slide-bg:#fff;--stage-bg:#e8eef3;--radius:18px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{transition:none!important;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:Inter,sans-serif;color:var(--ink)}
.slide{padding:64px 90px 112px;background:linear-gradient(135deg,#fff 65%,#f5f9fc);border-top:10px solid var(--accent)}
.slide-top{display:flex;justify-content:space-between;align-items:center;height:42px;margin-bottom:28px;color:var(--accent);font-size:21px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.slide-top .timing{font-size:19px;letter-spacing:.5px;color:var(--muted)}
h1{font-size:70px;line-height:1.09;letter-spacing:-2.4px;max-width:1650px;margin:0 0 22px;font-weight:760}.subtitle{font-size:30px;line-height:1.4;color:var(--muted);margin:0 0 28px;max-width:1630px}.content{height:650px;display:flex;flex-direction:column;gap:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{padding:28px 32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);min-width:0}.panel.blue{background:#edf5fb;border-color:#bfd3e3}.panel.teal{background:#edf7f5;border-color:#b7d8d1}.panel.warning{background:#fff6e9;border-color:#e9cc9d}
h2{font-size:34px;letter-spacing:-.6px;line-height:1.2;margin:0 0 18px;color:var(--accent)}p,li{font-size:29px;line-height:1.43;margin:0 0 17px}ul,ol{margin:0;padding-left:35px}li:last-child,p:last-child{margin-bottom:0}strong{font-weight:750}.small{font-size:24px;color:var(--muted);line-height:1.4}.eyebrow{font-size:23px;color:var(--teal);font-weight:750;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.equation{padding:28px 32px;font-size:42px;line-height:1.4;border-left:6px solid var(--teal);background:#edf7f5;border-radius:0 15px 15px 0}.equation small{display:block;font-size:26px;margin-top:10px;color:var(--muted)}
code,pre,.dna{font-family:Consolas,monospace}code{font-size:.9em;color:#174d74;background:#edf3f7;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}pre{font-size:27px;line-height:1.5;background:#142c43;color:#fff;border-radius:16px;padding:28px 32px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}pre code{background:none;color:inherit;padding:0;font-size:inherit}table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.4}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}th{color:var(--accent);background:#edf3f7;font-weight:750}td strong{color:var(--teal)}
.takeaway{position:absolute;left:90px;right:90px;bottom:42px;border-top:2px solid var(--line);padding-top:16px;display:grid;grid-template-columns:145px 1fr;gap:20px;font-size:25px;line-height:1.35}.takeaway strong{color:var(--accent)}.flow{display:flex;align-items:stretch;gap:18px}.flow .node{flex:1;padding:28px 22px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:16px;text-align:center;font-size:29px;line-height:1.4;min-width:0}.flow .arrow{align-self:center;color:var(--teal);font-size:40px}.node b{display:block;color:var(--accent);margin-bottom:12px}.node span{font-size:24px;color:var(--muted)}
.break h1{font-size:126px;max-width:1350px}.break .subtitle{font-size:42px}.break .content{justify-content:center;height:600px}.break{background:linear-gradient(110deg,#edf5fb,#fff 75%)}.dna{display:flex;align-items:center;gap:12px;font-size:28px;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.motif{padding:9px 14px;background:#d9ece7;color:#164f45;border-radius:8px;font-weight:750}.motif.second{background:#d9e9f6;color:#1d4e73}.position{font:22px Inter,sans-serif;color:var(--muted)}
.notes{display:none;position:absolute;inset:40px;z-index:10;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:55px;overflow:auto}.notes.show{display:block}.notes h2{font-size:46px}.notes p{font-size:32px;line-height:1.55}.notes .note-heading{font-size:24px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:750;margin-top:30px}
.deck-controls{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#fff;border:1px solid #c5d3df;border-radius:14px;box-shadow:0 6px 22px #14213d1c;max-width:calc(100vw - 12px);bottom:8px;white-space:nowrap}button,select{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:36px;padding:6px 10px}button:hover,select:hover{background:#edf3f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #216869;outline-offset:2px}button[aria-pressed=true]{background:#d9ece7}#counter{font-size:12px;min-width:46px;text-align:center;color:var(--muted)}#daySelect{width:88px}
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:70px;z-index:1002}.edit-toggle{position:fixed;left:12px;top:12px;z-index:1003;opacity:0;pointer-events:none;border:1px solid var(--line);transition:opacity .2s}.edit-toggle.show,.edit-toggle.active,.edit-toggle:focus{opacity:1;pointer-events:auto}.editing [data-edit]{outline:2px dashed #216869;outline-offset:3px;cursor:text}.save-status{position:fixed;top:12px;right:12px;background:#fff;padding:8px 15px;border-radius:8px;color:#234e70;font-size:13px;z-index:1001}.save-status:empty{display:none}.progress{position:fixed;bottom:0;left:0;width:100%;height:4px;background:#dbe3ea;z-index:1001}.progress div{height:100%;background:var(--accent);transition:width .15s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:#175c8e;text-decoration-thickness:2px;text-underline-offset:5px}.toolbar-extra{display:none}body.controls-expanded .toolbar-extra{display:inline-block}
@media(max-width:600px){.deck-controls{gap:1px;padding:4px}button,select{padding:4px 6px;min-height:34px;font-size:12px}#daySelect{width:69px}#counter{min-width:36px;font-size:10px}}
@media print{.slide{background:#fff}.notes,.edit-hotzone,.edit-toggle,.save-status,.progress,.sr-only{display:none!important}@page{size:20in 11.25in;margin:0}}
.node span{display:block;margin-top:10px}.takeaway{bottom:90px}.slide[data-day="4"]:last-child .content{gap:18px}.slide[data-day="4"]:last-child .content .panel{padding:22px 28px}.deck-controls{flex-wrap:wrap;width:max-content;justify-content:center}

/* Story scenes: one question or visual, with teaching depth in Notes. */
.slide{display:flex;flex-direction:column;padding:58px 90px 54px}
.slide-top{flex-shrink:0;margin-bottom:30px}
h1{font-size:82px;line-height:1.06;letter-spacing:-2.8px;margin-bottom:18px}
.subtitle{font-size:29px;line-height:1.35;margin-bottom:22px;flex-shrink:0}
.content{height:auto;min-height:0;flex:1;justify-content:center;gap:30px}
.takeaway{position:static;flex-shrink:0;margin-top:28px;font-size:25px;padding-top:18px}
.story-question{font-size:58px;line-height:1.2;letter-spacing:-1.5px;font-weight:650;color:var(--teal);max-width:1600px;margin:0}
.story-statement{font-size:74px;line-height:1.2;letter-spacing:-2px;font-weight:680;color:var(--accent)}
.story-caption{font-size:28px;color:var(--muted);margin:0;line-height:1.45}
.story-task{border-left:6px solid var(--teal);padding:18px 30px;background:#edf7f5;border-radius:0 14px 14px 0}
.story-task p{font-size:33px;margin-bottom:15px;max-width:1480px}.story-task a,.story-links{font-size:27px}
.content .panel{padding:30px 34px}.content .panel p{font-size:34px;line-height:1.4}.content .panel h2{font-size:31px}
.content .flow .node{padding:34px 24px;font-size:32px}.content .node b{font-size:34px}
.content pre{font-size:36px;line-height:1.5}.content .equation{font-size:48px;padding:24px 30px}
.sequence-pair{display:flex;flex-direction:column;gap:26px}.sequence-pair>div{display:grid;grid-template-columns:220px 1fr 1fr;gap:40px;align-items:center;padding:15px 0;font-size:36px}
.sequence-pair .motif{text-align:center;font:600 50px Consolas,monospace;padding:26px 20px}.sequence-pair .sequence-axis{font-size:26px;color:var(--muted);text-align:center;padding:0}
.score-chart{width:100%;max-height:510px;overflow:visible;flex-shrink:1;min-height:0}.chart-label{font:500 29px Inter,sans-serif;fill:#14213d}.chart-value{font:600 25px Inter,sans-serif;fill:#14213d}.chart-axis{font:400 24px Inter,sans-serif;fill:#536476}
.chart-legend{display:flex;gap:34px;font-size:27px;color:var(--muted)}.chart-legend span{display:flex;align-items:center;gap:12px}.chart-legend i{width:25px;height:16px;border-radius:3px}
.break .content{height:auto}.break h1{font-size:110px}.break .subtitle{font-size:36px}.break .story-statement{font-size:64px}
.notes h2{font-size:38px}.notes p{font-size:29px}.notes details{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.notes summary{font-size:28px;color:var(--accent);font-weight:650;cursor:pointer}.reference{margin-top:24px}.reference p,.reference li{font-size:27px}.reference .flow{margin:22px 0}.reference .panel{margin-bottom:22px}.reference h3{font-size:30px}.reference .equation{font-size:34px}.reference pre{font-size:25px}.reference .dna{white-space:normal;flex-wrap:wrap}
.slide[data-day="4"]:last-child .content{gap:30px}.slide[data-day="4"]:last-child .content .panel{padding:30px 34px}
@media print{*,*::before,*::after{transition:none!important;animation:none!important}.slide{display:flex!important}.notes{display:none!important}}

/text>\u003ccircle cx=\"965\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"965\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ccircle cx=\"1022\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1022\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003ccircle cx=\"1079\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1079\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ccircle cx=\"1136\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1136\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ccircle cx=\"1193\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1193\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ccircle cx=\"1250\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1250\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003ccircle cx=\"1307\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1307\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ccircle cx=\"1364\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1364\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ccircle cx=\"1421\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1421\" y=\"540\" font-size=\"35\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ccircle cx=\"1478\" cy=\"525\" r=\"32\" fill=\"#7B4FA3\" fill-opacity=\".09\"/>\u003ctext x=\"1478\" y=\"540\" font-size=\"35\" a-metric>Show average precision\u003c/button>\u003c/div>\u003c/div>","subtitle":"","takeaway":"","notes":"Paired sequences have identical 4-mer counts, so any count-based model is at chance by construction. The current position-keeping CNN separates the fixed-slot control on validation. Inspect whether the current frozen embeddings carry useful order information; read the current record rather than assuming a historical ranking. That fits Section 2&#x27;s question about averaging: pooling compressed the context but did not erase it here.","point":"Reveal the count bars first, then the CNN, then the embeddings.","transition":"A score is only one column of the decision.\n","sourceNote":"Native SVG conceptual figures and small attention/masking numbers are constructions, not fitted outputs. Actual live components, configuration, timings and current matched validation results: instructor/verification/day3-current.json, local CPU2threads, 2026-11-03. Stage03 seed2026/24epochs, current 15-position PPM and separate paired order control; no retuning. Model InstaDeepAI/nucleotide-transformer-v2-50m-multi-species; revision 81b29e5786726d891dbf929404ef20adca5b36f1; last-layer mean excluding special/padding tokens; 512 dimensions. StandardScaler uses training inputs, logistic regression uses training labels. Test labels unscored. Test panels start empty and accept only instructor-imported classroom results; importing does not execute a reveal or independently verify the manifest. Colab, classroom timing and projector readability unverified."},{"day":3,"id":"day-3-s5-tradeoff-table","anchor":"day-3-s5-tradeoff-table","sectionSequence":true,"sectionNumber":5,"kind":"day-three","title":"Beyond the score","time":"120:00–122:30 (2:30)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Representation tradeoffs beyond a single validation score\">\u003ctitle>Representation tradeoffs beyond a single validation score\u003c/title>\u0     const methods=[['logistic_regression','Counts + logistic',B],['random_forest','Counts + forest',O],['cnn','CNN',P],['foundation','Frozen NT + logistic',G]];
    const ns='http://www.w3.org/2000/svg';
    function node(parent, tag, attrs, value) {
        const e=document.createElementNS(ns,tag);
        Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));
        if(value!==undefined)e.textContent=value;
        parent.appendChild(e);return e;
    }
    function label(parent,x,y,value,color=G,size=36,anchor='start') {
        return node(parent,'text',{x,y,fill:color,'font-size':size,'text-anchor':anchor},value);
    }
    function stem(parent,x,y,width,color,height=28) {
        return node(parent,'rect',{x,y:y-height/2,width:Math.max(width,0),height,fill:color,rx:2});
    }
    document.querySelectorAll('[data-d3="mask"]').forEach(panel=> {
        panel.querySelector('button').addEventListener('click',()=> {
            const answer=panel.querySelector('[data-mask-answer]');
            const show=!answer.classList.contains('revealed');answer.classList.toggle('revealed',show);
            panel.querySelector('button').textContent=show?'Hide the target':'Reveal the hidden target';
            panel.querySelector('button').setAttribute('aria-pressed',String(show));
        });
    });
    document.querySelectorAll('[data-d3="attention"]').forEach(panel=> {
        const slider=panel.querySelector('[data-weight]');
        function update(){
            const a=Number(slider.value)/100,b=1-a,result=a*2+b*6;
            panel.querySelector('[data-attention-equation]').textContent=`${a.toFixed(2)} × 2 + ${b.toFixed(2)} × 6 = ${result.toFixed(2)}`;
            panel.querySelector('[data-readout]').textContent=`Weights ${a.toFixed(2)} + ${b.toFixed(2)} = 1 · values stay 2 and 6`;
            slider.setAttribute('aria-valuetext',`${a.toFixed(2)} on two; ${b.toFixed(2)} on six; output ${result.toFixed(2)}`);
        }
        slider.addEventListener('input',update);update();
    });
    document.querySelectorAll('[data-d3="alignment"]').forEach(panel=> {
        let aligned=false;
        panel.querySelector('button').addEventListener('click',()=> {
            aligned=!aligned;panel.querySelector('[data-cache-drawing]').innerHTML=evidence[aligned?'aligned':'misaligned'];
            panel.querySelector('button').textContent=aligned?'Show positional failure':'Align by sample ID';
            panel.querySelector('button').setAttribute('aria-pressed',String(aligned));
            panel.querySelector('[data-readout]').textContent=aligned?'Same disk rows, correct correspondence by ID':'Same shape, wrong samples under a positional join';
        });
    });
    document.querySelectorAll('.d3-results').forEach(panel=> {
        let metric='roc_auc';
        panel.querySelector('button').addEventListener('click',()=> {
            metric=metric==='roc_auc'?'average_precision':'roc_auc';
            const plot=panel.querySelector('svg');plot.replaceChildren();
            node(plot,'title',{},`Current validation ${metric==='roc_auc'?'ROC-AUC':'average precision'}`);
            methods.forEach(([key,name,color],i)=> {
                const row=evidence.metrics.find(r=>r.variant===panel.dataset.variant&&r.method===key),v=row[metric],y=100+i*135;
                label(plot,470,y+15,name,color,43,'end');stem(plot,560,y,v*950,color,35);
                label(plot,585+v*950,y+15,v.toFixed(3),color,39);
            });
            [0,.5,1].forEach(v=>label(plot,560+v*950,620,String(v),G,30,'middle'));
            node(plot,'path',{d:'M1035 45 V560',stroke:'#bdcbd6','stroke-width':3,'stroke-dasharray':'10 10',fill:'none'});
            plot.setAttribute('aria-label',`Current validation ${metric==='roc_auc'?'ROC-AUC':'average precision'}`);
            panel.querySelector('button').textContent=metric==='roc_auc'?'Show average precision':'Show ROC-AUC';
        });
    });
    let imported=null,variant='simple';
    const testPanel=document.querySelector('[data-test-comparison]');
    function testChart(){
        const plot=testPanel.querySelector('svg');plot.replaceChildren();
        node(plot,'title',{},'Validation and instructor-imported test ROC-AUC; blank test slots until import');
        methods.forEach(([key,name],i)=> {
            const y=85+i*115,v=evidence.metrics.find(r=>r.variant===variant&&r.method===key).roc_auc;
            label(plot,440,y+10,name,G,39,'end');stem(plot,500,y-15,v*1000,B,22);
            if(imported){
                const t=imported.find(r=>r.variant===variant&&r.method===key).roc_auc;
                stem(plot,500,y+20,t*1000,O,22);label(plot,1515,y+30,t.toFixed(3),O,30);
            } else label(plot,540,y+31,'Test not revealed',G,29);
        });
        label(plot,600,540,'Validation',B,32);label(plot,1000,540,'Test',O,32);
        [0,.5,1].forEach(v=>label(plot,500+v*1000,495,String(v),G,27,'middle'));
        const size=variant==='simple'?240:96;
        testPanel.querySelector('[data-test-status]').textContent=`${variant==='simple'?'Primary':'Order control'} · validation ${size} / test ${size} · ${imported?'classroom file imported':'test not revealed'}`;
    }
    testPanel.querySelector('button').addEventListener('click',()=> {
        variant=variant==='simple'?'interaction':'simple';
        testPanel.querySelector('button').textContent=variant==='simple'?'Show order control':'Show primary PPM';testChart();
    });
    testChart();
    document.querySelector('[data-test-import]').addEventListener('change',async event=> {
        const status=document.querySelector('.d3-test [data-test-status]');
        const file=event.target.files?.[0];if(!file)return;
        try {
            if(file.size>1000000)throw new Error('Result file is too large.');
            const payload=JSON.parse(await file.text());
            if(typeof payload.revealed_utc!=='string'||!/^[a-f0-9]{64}$/.test(payload.frozen_manifest_sha256))throw new Error('Expected a saved test_results.json with a freeze reference.');
            if(!Array.isArray(payload.results)||payload.results.length!==8)throw new Error('Expected eight result rows.');
            const seen=new Set();
            payload.results.forEach(row=> {
                const key=row.variant+'|'+row.method;
                if(!['simple','interaction'].includes(row.variant)||!methods.some(m=>m[0]===row.method)||seen.has(key))throw new Error('Duplicate or unexpected variant/method.');
                seen.add(key);
                if(row.evaluation_split!=='test'||row.sample_count!==(row.variant==='simple'?240:96)||row.decision_threshold!==0.5)throw new Error('Unexpected split, sample count or threshold.');
                ['roc_auc','average_precision'].forEach(k=> {if(typeof row[k]!=='number'||!Number.isFinite(row[k])||row[k]<0||row[k]>1)throw new Error('Invalid metric.');});
            });
            imported=payload.results;
            document.querySelectorAll('[data-test-value]').forEach(cell=> {
                const [v,m,k]=cell.dataset.testValue.split('|');cell.textContent=imported.find(r=>r.variant===v&&r.method===m)[k].toFixed(3);
            });
            status.textContent='Classroom result imported · inspect provenance in the notebook; no model ran in this page.';
            testChart();
        } catch(error){status.textContent='Import refused: '+error.message;}
        event.target.value='';
    });
}

<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day-3-edits-v2';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            const oldEdits = JSON.parse(localStorage.getItem('ml-course-2026-day1-teaching-v3') || '{}');
            const migrated = Object.fromEntries(Object.entries(oldEdits).filter(([key]) => key.startsWith('day-3-')));
            this.edits = {...migrated, ...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = slide.id || slide.anchor || `day-${slide.day}-slide-${slide.local}`;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    ${slide.sectionOne || slide.sectionLearning || slide.sectionSequence ? `<p><strong>SAY:</strong> ${slide.notes}</p><p><strong>POINT:</strong> ${slide.point}</p><p><strong>TRANSITION:</strong> ${slide.transition}</p><p class="small"><strong>Timing:</strong> ${slide.time}</p><p class="small">${slide.sourceNote}</p><p><a href="story.md#section-${slide.sectionNumber || (slide.sectionLearning ? 2 : 1)}">Section ${slide.sectionNumber || (slide.sectionLearning ? 2 : 1)} story</a></p>` : `<p>${slide.notes}</p>`}

                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../index.html">All days</a> · <a href="../../instructor/guide.md">Instructor guide</a> · <a href="../../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo, .d2-live')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const openingAliases = {"#day-3-slide-1": "day-3-s1-welcome", "#day-3-slide-2": "day-3-s2-borrowing-context", "#day-3-slide-3": "day-3-s1-masked-lm", "#day-3-slide-4": "day-3-s2-mean-pooling", "#day-3-slide-5": "day-3-s3-roadmap", "#day-3-slide-6": "day-3-break-1", "#day-3-slide-7": "day-3-s3-notebook-open", "#day-3-slide-8": "day-3-s4-silent-failure", "#day-3-slide-9": "day-3-s4-alignment-practical", "#day-3-slide-10": "day-3-break-2", "#day-3-slide-11": "day-3-s5-primary-results", "#day-3-slide-12": "day-3-s5-why-not-crush", "#day-3-slide-13": "day-3-s6-checklist-aloud", "#day-3-slide-14": "day-3-s6-test-results-table", "#day-3-slide-15": "day-3-s6-synthesis"};
        const target = openingAliases[location.hash] || location.hash.slice(1);
        const exact = slides.findIndex(slide => slide.anchor === target);
        if (exact >= 0) { this.go(exact, false); return; }
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch && Number(localMatch[1]) !== 3) { location.href = `../Day_${localMatch[1]}/presentation.html${location.hash}`; return; }
        if (localMatch) this.go(Math.max(0, slides.findIndex(s => s.day === Number(localMatch[1]) && s.local === Number(localMatch[2]))), false);
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        if (day === 3) this.go(0);
        else location.href = `../Day_${day}/presentation.html`;
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'day-3-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it beside presentation.html for linked course resources.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of new Set(slides.map(slide => slide.day))) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo, .d2-live')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, .d2-live, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
bindDayThree();
