:root{--ink:#14213d;--muted:#536476;--line:#dbe3ea;--soft:#f7f9fb;--accent:#234e70;--teal:#216869;--slide-bg:#fff;--stage-bg:#e8eef3;--radius:18px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{transition:none!important;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:Inter,sans-serif;color:var(--ink)}
.slide{padding:64px 90px 112px;background:linear-gradient(135deg,#fff 65%,#f5f9fc);border-top:10px solid var(--accent)}
.slide-top{display:flex;justify-content:space-between;align-items:center;height:42px;margin-bottom:28px;color:var(--accent);font-size:21px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.slide-top .timing{font-size:19px;letter-spacing:.5px;color:var(--muted)}
h1{font-size:70px;line-height:1.09;letter-spacing:-2.4px;max-width:1650px;margin:0 0 22px;font-weight:760}.subtitle{font-size:30px;line-height:1.4;color:var(--muted);margin:0 0 28px;max-width:1630px}.content{height:650px;display:flex;flex-direction:column;gap:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{padding:28px 32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);min-width:0}.panel.blue{background:#edf5fb;border-color:#bfd3e3}.panel.teal{background:#edf7f5;border-color:#b7d8d1}.panel.warning{background:#fff6e9;border-color:#e9cc9d}
h2{font-size:34px;letter-spacing:-.6px;line-height:1.2;margin:0 0 18px;color:var(--accent)}p,li{font-size:29px;line-height:1.43;margin:0 0 17px}ul,ol{margin:0;padding-left:35px}li:last-child,p:last-child{margin-bottom:0}strong{font-weight:750}.small{font-size:24px;color:var(--muted);line-height:1.4}.eyebrow{font-size:23px;color:var(--teal);font-weight:750;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.equation{padding:28px 32px;font-size:42px;line-height:1.4;border-left:6px solid var(--teal);background:#edf7f5;border-radius:0 15px 15px 0}.equation small{display:block;font-size:26px;margin-top:10px;color:var(--muted)}
code,pre,.dna{font-family:Consolas,monospace}code{font-size:.9em;color:#174d74;background:#edf3f7;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}pre{font-size:27px;line-height:1.5;background:#142c43;color:#fff;border-radius:16px;padding:28px 32px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}pre code{background:none;color:inherit;padding:0;font-size:inherit}table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.4}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}th{color:var(--accent);background:#edf3f7;font-weight:750}td strong{color:var(--teal)}
.takeaway{position:absolute;left:90px;right:90px;bottom:42px;border-top:2px solid var(--line);padding-top:16px;display:grid;grid-template-columns:145px 1fr;gap:20px;font-size:25px;line-height:1.35}.takeaway strong{color:var(--accent)}.flow{display:flex;align-items:stretch;gap:18px}.flow .node{flex:1;padding:28px 22px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:16px;text-align:center;font-size:29px;line-height:1.4;min-width:0}.flow .arrow{align-self:center;color:var(--teal);font-size:40px}.node b{display:block;color:var(--accent);margin-bottom:12px}.node span{font-size:24px;color:var(--muted)}
.break h1{font-size:126px;max-width:1350px}.break .subtitle{font-size:42px}.break .content{justify-content:center;height:600px}.break{background:linear-gradient(110deg,#edf5fb,#fff 75%)}.dna{display:flex;align-items:center;gap:12px;font-size:28px;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.motif{padding:9px 14px;background:#d9ece7;color:#164f45;border-radius:8px;font-weight:750}.motif.second{background:#d9e9f6;color:#1d4e73}.position{font:22px Inter,sans-serif;color:var(--muted)}
.notes{display:none;position:absolute;inset:40px;z-index:10;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:55px;overflow:auto}.notes.show{display:block}.notes h2{font-size:46px}.notes p{font-size:32px;line-height:1.55}.notes .note-heading{font-size:24px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:750;margin-top:30px}
.deck-controls{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#fff;border:1px solid #c5d3df;border-radius:14px;box-shadow:0 6px 22px #14213d1c;max-width:calc(100vw - 12px);bottom:8px;white-space:nowrap}button,select{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:36px;padding:6px 10px}button:hover,select:hover{background:#edf3f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #216869;outline-offset:2px}button[aria-pressed=true]{background:#d9ece7}#counter{font-size:12px;min-width:46px;text-align:center;color:var(--muted)}#daySelect{width:88px}
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:70px;z-index:1002}.edit-toggle{position:fixed;left:12px;top:12px;z-index:1003;opacity:0;pointer-events:none;border:1px solid var(--line);transition:opacity .2s}.edit-toggle.show,.edit-toggle.active,.edit-toggle:focus{opacity:1;pointer-events:auto}.editing [data-edit]{outline:2px dashed #216869;outline-offset:3px;cursor:text}.save-status{position:fixed;top:12px;right:12px;background:#fff;padding:8px 15px;border-radius:8px;color:#234e70;font-size:13px;z-index:1001}.save-status:empty{display:none}.progress{position:fixed;bottom:0;left:0;width:100%;height:4px;background:#dbe3ea;z-index:1001}.progress div{height:100%;background:var(--accent);transition:width .15s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:#175c8e;text-decoration-thickness:2px;text-underline-offset:5px}.toolbar-extra{display:none}body.controls-expanded .toolbar-extra{display:inline-block}
@media(max-width:600px){.deck-controls{gap:1px;padding:4px}button,select{padding:4px 6px;min-height:34px;font-size:12px}#daySelect{width:69px}#counter{min-width:36px;font-size:10px}}
@media print{.slide{background:#fff}.notes,.edit-hotzone,.edit-toggle,.save-status,.progress,.sr-only{display:none!important}@page{size:20in 11.25in;margin:0}}
.node span{display:block;margin-top:10px}.takeaway{bottom:90px}.slide[data-day="4"]:last-child .content{gap:18px}.slide[data-day="4"]:last-child .content .panel{padding:22px 28px}.deck-controls{flex-wrap:wrap;width:max-content;justify-content:center}

/* Story scenes: one question or visual, with teaching depth in Notes. */
.slide{display:flex;flex-direction:column;padding:58px 90px 54px}
.slide-top{flex-shrink:0;margin-bottom:30px}
h1{font-size:82px;line-height:1.06;letter-spacing:-2.8px;margin-bottom:18px}
.subtitle{font-size:29px;line-height:1.35;margin-bottom:22px;flex-shrink:0}
.content{height:auto;min-height:0;flex:1;justify-content:center;gap:30px}
.takeaway{position:static;flex-shrink:0;margin-top:28px;font-size:25px;padding-top:18px}
.story-question{font-size:58px;line-height:1.2;letter-spacing:-1.5px;font-weight:650;color:var(--teal);max-width:1600px;margin:0}
.story-statement{font-size:74px;line-height:1.2;letter-spacing:-2px;font-weight:680;color:var(--accent)}
.story-caption{font-size:28px;color:var(--muted);margin:0;line-height:1.45}
.story-task{border-left:6px solid var(--teal);padding:18px 30px;background:#edf7f5;border-radius:0 14px 14px 0}
.story-task p{font-size:33px;margin-bottom:15px;max-width:1480px}.story-task a,.story-links{font-size:27px}
.content .panel{padding:30px 34px}.content .panel p{font-size:34px;line-height:1.4}.content .panel h2{font-size:31px}
.content .flow .node{padding:34px 24px;font-size:32px}.content .node b{font-size:34px}
.content pre{font-size:36px;line-height:1.5}.content .equation{font-size:48px;padding:24px 30px}
.sequence-pair{display:flex;flex-direction:column;gap:26px}.sequence-pair>div{display:grid;grid-template-columns:220px 1fr 1fr;gap:40px;align-items:center;padding:15px 0;font-size:36px}

<script id="day-data" type="application/json">[{"day":4,"time":"0–10 · recap","title":"Who owns the claim when an agent writes the code?","subtitle":"Day 4 · specify, delegate, and audit","body":"\u003cdiv class=\"story-statement\">The agent runs the analysis.\u003cbr>You defend the experiment.\u003c/div>\u003cp class=\"story-question\">What would you insist it preserve?\u003c/p>","takeaway":"Participate with an available agent, or inspect the same evidence as an observer.","notes":"Ask students to reconstruct the boundary from Day 3. Do not open protected labels during the Day 4 workshop. Agent access is optional; one instructor can demonstrate. Distinguish an authored fixture from a real agent run at every transition.","kind":"","reference":{"title":"Day 4 · Specify, delegate, and audit","subtitle":"A coding agent can execute an analysis. You still own its scientific claims.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Carry forward the contract\u003c/h2>\u003cul>\u003cli>Same simulated task and fixed development identities.\u003c/li>\u003cli>Training-only fitting; validation-only development.\u003c/li>\u003cli>Previously revealed test results cannot choose a new approach.\u003c/li>\u003cli>Actual outputs, not plausible-looking conclusions.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Two equally valid participation routes\u003c/h2>\u003cp>\u003cstrong>Participate:\u003c/strong> use an available agent and keep the evidence.\u003c/p>\u003cp>\u003cstrong>Observe:\u003c/strong> inspect prompts, code, artifacts, and the same audit questions.\u003c/p>\u003cp>No paid student access or student-run Agentomics is required.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Delegation changes who executes the work, not who must justify the experiment."},"local":1,"anchor":"day-4-slide-1"},{"day":4,"time":"10–20 · context","title":"What did we leave unsaid?","subtitle":"A model works with the context supplied or retrieved.","body":"\u003cp class=\"story-question\">“Build the best model.”\u003c/p>\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Best for whom?\u003c/b>Population\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Best by what?\u003c/b>Metric\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Tested how?\u003c/b>Evaluation\u003c/div>\u003c/div>","takeaway":"Omitted scientific choices still get made.","notes":"Use this as a concrete context model, not an exhaustive account of LLM internals. Ask which omitted choice could invalidate this exact course comparison: regrouping split IDs, tuning on test scores, or replacing the simulation with a claimed promoter dataset.","kind":"","reference":{"title":"A language model sees supplied context","subtitle":"An assistant can fill an ambiguity with a reasonable-sounding but consequential choice.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Context\u003c/b>Request, files, prior messages\u003cspan>Only what is supplied or retrieved\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Model output\u003c/b>Text or a proposed tool call\u003cspan>Not automatically verified\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Environment\u003c/b>Tools return observations\u003cspan>Files, code, logs, failures\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What must be explicit?\u003c/h2>\u003cp>Population, evaluation unit, target, features, splits, metrics, allowed fitting, forbidden test use, and evidence requirements.\u003c/p>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>What remains your responsibility?\u003c/h2>\u003cp>Check whether the available context contains the needed truth, whether decisions follow the specification, and whether the conclusions match actual evidence.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Fluent completion is not a substitute for a scientific specification."},"local":2,"anchor":"day-4-slide-2"},{"day":4,"time":"20–30 · agent loop","title":"An agent can act on its assumptions.","subtitle":"Tools turn proposed actions into files, code, and results.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Inspect\u003c/b>Read the context\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Act\u003c/b>Use a tool\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Observe\u003c/b>Read the result\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Revise\u003c/b>Continue or report\u003c/div>\u003c/div>\u003cp class=\"story-question\">Where should it stop if an input is wrong?\u003c/p>","takeaway":"Instructions guide the loop; actual artifacts show what happened.","notes":"Ask where an agent should stop if cache hashes do not match: at the invalid input, reporting the failure. It should not invent vectors, silently change the dataset, or present cached outputs as new execution. This is a workflow concept, not an invented product capability.","kind":"","reference":{"title":"An agent is a loop with tools and boundaries","subtitle":"The loop can produce useful artifacts and repeat the same mistaken premise.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Inspect / plan\u003c/b>Choose a next action\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Act\u003c/b>Read, edit, execute a tool\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Observe\u003c/b>Read actual output\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Revise / report\u003c/b>Continue or stop honestly\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Project instructions\u003c/h2>\u003cp>Persistent project constraints: do not score protected test labels; preserve sample IDs; report blocked checks.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>A relevant skill\u003c/h2>\u003cp>A reusable procedure for a bounded task, such as checking split integrity, prediction alignment, and claims against evidence.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Instructions and skills constrain behavior; they do not certify correctness."},"local":3,"anchor":"day-4-slide-3"},{"day":4,"time":"30–40 · vague request","title":"Ask vaguely. Inspect the choices.","subtitle":"A genuine development-only run, saved for observation.","body":"\u003cdiv class=\"story-statement\">“Build the best model to predict promoters.”\u003c/div>\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Which features, metric, and search did it choose? Which biology did it claim?\u003c/p>\u003ca href=\"../../agent_workshop/actual_runs/2026-10-26/vague/run_report.md\">Inspect the vague run ↗\u003c/a>\u003c/div>","takeaway":"This actual run was scientifically cautious. Do not invent a failure.","notes":"Ask students to note silent decisions before supplying the precise spec. No need for a live run to fail in exactly the authored way. If the service is blocked, use the explicitly labeled fixture for audit practice, and report the live demonstration as not run. Never call the fixture a recorded run.","kind":"","reference":{"title":"“Find the best model” hides the experiment","subtitle":"Inspect the supplied vague request before providing the specification.","body":"\u003cdiv class=\"panel blue\">\u003ch2>The ambiguity to investigate\u003c/h2>\u003cp>Which observations? Which target? What does “best” mean? Which split? Which preprocessing can see evaluation inputs? What supports a biological claim?\u003c/p>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Instructor demonstration route\u003c/h2>\u003cp>Open \u003ca href=\"../../agent_workshop/vague-prompt.md\">the vague prompt\u003c/a>. Inspect the actual \u003ca href=\"../../agent_workshop/actual_runs/2026-10-26/specified/run_report.md\">specified-run report\u003c/a> and \u003ca href=\"../../agent_workshop/actual_runs/2026-10-26/vague/run_report.md\">vague-run artifacts\u003c/a>; retain their execution and intervention records.\u003c/p>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Evidence status\u003c/h2>\u003cp>The \u003cstrong>authored teaching fixture\u003c/strong> is distinct from the actual runs. Both development-only runs completed on October 26, 2026 and were scientifically cautious. Inspect their actual decisions after the break. A genuine screen recording remains pending.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Do not claim an agent made a mistake unless an actual run records that mistake."},"local":4,"anchor":"day-4-slide-4"},{"day":4,"time":"40–50 · inspect the fixture","title":"This one runs. Its claim still fails.","subtitle":"A separate, authored audit fixture · not an observed agent failure","body":"\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Find evidence that the score or conclusion is misleading.\u003c/p>\u003ca href=\"../../agent_workshop/fixture.md\">Open the fixture ↗\u003c/a>\u003c/div>\u003cp class=\"story-question\">Relatives cross splits. Predictions change order. What breaks?\u003c/p>","takeaway":"Inspect preprocessing and biological claims too; working code is only the first check.","notes":"Expected answers are in agent_workshop/worked-audit.md. Keep the fixture’s four authored rows separate from the main experiment. Vocabulary leakage violates protocol, but finding it does not establish how much it changed performance. Transition: remove ambiguity before asking for a new clean run.","kind":"","reference":{"title":"The authored fixture runs, but its claim fails","subtitle":"Read it as an audit exercise, not evidence about a model’s performance.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Inspect these artifacts\u003c/h2>\u003cp>\u003ca href=\"../../agent_workshop/fixture.md\">Fixture description\u003c/a> · \u003ca href=\"../../agent_workshop/flawed_analysis.py\">authored flawed analysis\u003c/a>\u003c/p>\u003cul>\u003cli>Related groups cross train/validation.\u003c/li>\u003cli>The vocabulary is fitted before partitioning.\u003c/li>\u003cli>Prediction order differs from label order.\u003c/li>\u003cli>The conclusion claims learned promoter biology.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Pair task · five minutes\u003c/h2>\u003cp>For each defect, write:\u003c/p>\u003col>\u003cli>What exact evidence reveals it?\u003c/li>\u003cli>Which conclusion becomes unsupported?\u003c/li>\u003cli>What repair is needed?\u003c/li>\u003c/ol>\u003cp class=\"small\">Do not repair the fixture by inventing better probabilities.\u003c/p>\u003c/div>\u003c/div>","takeaway":"Successful execution and valid inference are independent audit questions."},"local":5,"anchor":"day-4-slide-5"},{"day":4,"time":"50–60 · break","title":"Break · 10 minutes","subtitle":"Next: specify the experiment before asking for another analysis.","body":"\u003cp class=\"story-question\">Which choices should never be left implicit?\u003c/p>","takeaway":"Return at minute 60.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break","reference":{"title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Explicit specification, project instructions, and an audit skill\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time."},"local":6,"anchor":"day-4-slide-6"},{"day":4,"time":"60–73 · specification","title":"Specify the experiment.","subtitle":"Make important choices explicit and checkable.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Question\u003c/b>Data, target, features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Protocol\u003c/b>Splits, fitting, metrics\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Evidence\u003c/b>Predictions, provenance, limits\u003c/div>\u003c/div>\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Choose one requirement. How would you verify it independently?\u003c/p>\u003ca href=\"../../agent_workshop/precise-spec.md\">Open the specification ↗\u003c/a>\u003c/div>","takeaway":"The agent task remains development-only, including after Day 3’s test reveal.","notes":"Have pairs choose one requirement and explain its independent verification. Allowed label-independent test-input extraction does not authorize the agent to tune using labels or revealed scores. The agent task is development-only even if the Day 3 instructor comparison occurred.","kind":"","reference":{"title":"Write the experiment the agent must preserve","subtitle":"Use the course specification, not a request for an attractive score.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Specify\u003c/th>\u003cth scope=\"col\">Concrete course requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Question and data\u003c/td>\u003ctd>Simulated binary sequence classification; no promoter-discovery claim\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identity and partitions\u003c/td>\u003ctd>Reuse fixed split manifest; respect related groups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Features and fitting\u003c/td>\u003ctd>Sequence-derived features; fit preprocessing and model on training only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Development evidence\u003c/td>\u003ctd>Validation ROC-AUC primary; average precision supporting; threshold 0.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protected boundary\u003c/td>\u003ctd>No test-label access or test-guided selection in this agent task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deliverables\u003c/td>\u003ctd>Actual predictions by ID; code/configuration/provenance; failures and scientific audit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003ca href=\"../../agent_workshop/precise-spec.md\">Open the complete precise specification\u003c/a>.\u003c/p>","takeaway":"A specification should make an invalid shortcut detectable, not merely discourage it."},"local":7,"anchor":"day-4-slide-7"},{"day":4,"time":"73–85 · instructions and skill","title":"Give each instruction a job.","subtitle":"One analysis, project-wide constraints, and a reusable procedure.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Specification\u003c/b>What this analysis must do\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>AGENTS.md\u003c/b>Project constraints\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Skill\u003c/b>How to perform an audit\u003c/div>\u003c/div>\u003cp class=\"story-links\">\u003ca href=\"../../agent_workshop/example-project/AGENTS.md\">Project instructions ↗\u003c/a> &nbsp; \u003ca href=\"../../agent_workshop/example-project/skills/scientific-audit/SKILL.md\">Audit skill ↗\u003c/a>\u003c/p>","takeaway":"Clear instructions make behavior checkable; they do not certify correctness.","notes":"Ask what belongs in the spec versus a reusable instruction: exact dataset/metric belongs in spec; report blocked checks can be project-wide. Use the actual supplied files; do not invent platform features. These files guide behavior but cannot guarantee compliance.","kind":"","reference":{"title":"Separate the experiment from reusable rules","subtitle":"Specification · what this analysis must do. Instructions · project constraints. Skill · how to audit.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Project-level constraints\u003c/h2>\u003cp>Open \u003ca href=\"../../agent_workshop/example-project/AGENTS.md\">the example AGENTS.md\u003c/a>.\u003c/p>\u003cul>\u003cli>Preserve evaluation and identity invariants.\u003c/li>\u003cli>Do not fabricate outputs or bypass failures.\u003c/li>\u003cli>Keep claims within the simulation evidence.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Scientific-audit procedure\u003c/h2>\u003cp>Open \u003ca href=\"../../agent_workshop/example-project/skills/scientific-audit/SKILL.md\">the scientific-audit skill\u003c/a>.\u003c/p>\u003cul>\u003cli>Inspect split and feature-fitting boundaries.\u003c/li>\u003cli>Check prediction coverage and alignment.\u003c/li>\u003cli>Trace each scientific claim to actual evidence.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"More instructions are useful only when they remove ambiguity and support checkable behavior."},"local":8,"anchor":"day-4-slide-8"},{"day":4,"time":"85–100 · actual-run comparison","title":"The vague run scored higher. Why?","subtitle":"Actual local validation · ROC-AUC · both runs were scientifically cautious","body":"\u003cdiv class=\"chart-legend\">\u003cspan>\u003ci style=\"background:#234e70\">\u003c/i>Simple-signal\u003c/span>\u003c/div>\u003csvg class=\"score-chart\" viewBox=\"0 0 1640 264\" role=\"img\" aria-label=\"Recorded local validation ROC-AUC, on a zero-to-one axis. Vague · motif features + search: Simple-signal 0.904; Specified · fixed 4-mer baseline: Simple-signal 0.802\">\u003cline x1=\"1025\" x2=\"1025\" y1=\"8\" y2=\"216\" stroke=\"#8c9ba8\" stroke-width=\"2\" stroke-dasharray=\"7 7\"/>\u003ctext x=\"0\" y=\"50\" class=\"chart-label\">Vague · motif features + search\u003c/text>\u003crect x=\"500\" y=\"20\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"20\" width=\"949.375035\" height=\"30\" rx=\"6\" fill=\"#234e70\"/>\u003ctext x=\"1461.375035\" y=\"45\" class=\"chart-value\">0.904\u003c/text>\u003ctext x=\"0\" y=\"146\" class=\"chart-label\">Specified · fixed 4-mer baseline\u003c/text>\u003crect x=\"500\" y=\"116\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"116\" width=\"842.04162\" height=\"30\" rx=\"6\" fill=\"#234e70\"/>\u003ctext x=\"1354.04162\" y=\"141\" class=\"chart-value\">0.802\u003c/text>\u003ctext x=\"500\" y=\"249\" class=\"chart-axis\">0\u003c/text>\u003ctext x=\"1025\" y=\"249\" text-anchor=\"middle\" class=\"chart-axis\">0.5 · chance ranking\u003c/text>\u003ctext x=\"1550\" y=\"249\" text-anchor=\"end\" class=\"chart-axis\">1.0\u003c/text>\u003c/svg>\u003cp class=\"story-question\">Did we compare prompts—or different experiments?\u003c/p>","takeaway":"Objectives, features, and search differed. This pair cannot establish a prompt-quality effect.","notes":"Use 15 minutes for the observation sheet and discussion. The vague run used training-only group CV to compare six candidates by log loss, then reported the disclosed motif-based logistic-regression model. The specified run reproduced the requested 4-mer baseline. Both were scientifically cautious; do not transfer the authored fixture defects onto them. Raw code, reports, and logs are under agent_workshop/actual_runs/2026-10-26/. Parent comparison/audit integration is separate. A genuine screen recording remains pending.","kind":"","reference":{"title":"Compare actual decisions, not presentation quality","subtitle":"Actual development-only runs · October 26, 2026 · both scientifically cautious","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Run\u003c/th>\u003cth scope=\"col\">Actual approach\u003c/th>\u003cth scope=\"col\">Validation ROC-AUC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Vague request\u003c/td>\u003ctd>Training-only group CV; 6 candidates by log loss; disclosed TATAAATG motif LR\u003c/td>\u003ctd>0.9041667\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Specified request\u003c/td>\u003ctd>Declared bag-of-4-mers logistic regression\u003c/td>\u003ctd>0.8019444\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What the traces show\u003c/h2>\u003cp>Inspect \u003ca href=\"../../agent_workshop/actual_runs/2026-10-26/vague/run_report.md\">the vague run\u003c/a> and \u003ca href=\"../../agent_workshop/actual_runs/2026-10-26/specified/run_report.md\">the specified run\u003c/a>. Both used the same provider/model and technical boundary, not a sandbox. The vague run needed a technical apply_patch intervention.\u003c/p>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Not a causal prompt-quality experiment\u003c/h2>\u003cp>Objectives, features, and searches differ. Higher validation ROC-AUC does not show that a vague prompt is better. Both were scientifically cautious; no screen recording exists.\u003c/p>\u003c/div>\u003c/div>","takeaway":"The actual runs are evidence of different decisions, not a controlled comparison of prompt quality."},"local":9,"anchor":"day-4-slide-9"},{"day":4,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Next: put the analysis on trial.","body":"\u003cdiv class=\"story-statement\">Evidence → consequence → repair\u003c/div>","takeaway":"Return at minute 110.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break","reference":{"title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>Scientific audit: split integrity, alignment, metrics, and claims\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time."},"local":10,"anchor":"day-4-slide-10"},{"day":4,"time":"110–130 · scientific audit","title":"Join by ID. Then judge the predictions.","subtitle":"An authored two-row example","body":"\u003cpre>\u003ccode>labels:       v1 → 0     v2 → 1\npredictions:  v2 → 0.1   v1 → 0.9\u003c/code>\u003c/pre>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>Pair by position\u003c/h2>\u003cp>100% accuracy\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Align by ID\u003c/h2>\u003cp>0% accuracy\u003c/p>\u003c/div>\u003c/div>","takeaway":"Equal lengths and plausible numbers do not establish correct alignment.","notes":"Allow ten minutes independent/pair audit, then ten minutes evidence-based discussion. Unique sample IDs do not eliminate group leakage. Correct alignment repairs one error; it does not repair the group split, preprocessing, provenance, or causal overclaim. Use actual audit code, which loads functions without opening protected files.","kind":"","reference":{"title":"Audit the inference, not just the code","subtitle":"Use evidence → consequence → repair for every finding.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Six questions to answer\u003c/h2>\u003cul>\u003cli>Are evaluation units independent?\u003c/li>\u003cli>Did learned preprocessing fit training only?\u003c/li>\u003cli>Do predictions match the exact IDs?\u003c/li>\u003cli>Are metrics and baselines declared and comparable?\u003c/li>\u003cli>Can artifacts reproduce the reported result?\u003c/li>\u003cli>Does the claim stay within simulation truth?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Worked alignment failure\u003c/h2>\u003cp>Validation IDs: [v1, v2], labels: [0, 1].\u003c/p>\u003cp>Prediction IDs: [v2, v1], probabilities: [0.1, 0.9].\u003c/p>\u003cp>Positional pairing appears 100% accurate. Correct ID alignment gives [0.9, 0.1]: \u003cstrong>0% accurate\u003c/strong>.\u003c/p>\u003cp class=\"small\">Authored two-row illustration, not a fitted course model.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003ca href=\"../../instructor/audit-checklist.html\">Open the audit handout\u003c/a> · \u003ca href=\"../../notebooks/06_scientific_audit.ipynb\">standalone audit code 06\u003c/a>.\u003c/p>","takeaway":"Equal lengths and plausible probabilities do not establish correct sample alignment."},"local":11,"anchor":"day-4-slide-11"},{"day":4,"time":"130–150 · repair and interpretation","title":"Repair the experiment before the score.","subtitle":"Use the same standard for manual and agent-written analyses.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Evidence\u003c/b>What exactly failed?\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Consequence\u003c/b>Which claim is unsupported?\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Repair\u003c/b>What must be rerun?\u003c/div>\u003c/div>\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Audit split integrity, fitting, alignment, metrics, reproducibility, and claims.\u003c/p>\u003ca href=\"../../instructor/audit-checklist.html\">Open the audit checklist ↗\u003c/a>\u003c/div>","takeaway":"One repaired defect does not certify the whole analysis.","notes":"Use the remaining time for student-supported conclusions and questions. The four-row fixture cannot support a serious model ranking. The manual baseline must use identical validation IDs and the declared metric. If short of time, reduce optional code detail, not the audit. Reserve 150–170 and 170–180 exactly.","kind":"","reference":{"title":"Repair the experiment before improving the score","subtitle":"Put the manual workflow and the agent workflow under the same scientific standard.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Finding\u003c/th>\u003cth scope=\"col\">Defensible next step\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Related groups cross splits in separate fixture\u003c/td>\u003ctd>Rebuild that exercise with group-respecting development partitions; refit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vocabulary fitted on evaluation inputs\u003c/td>\u003ctd>Fit the full pipeline using training data only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prediction IDs misaligned\u003c/td>\u003ctd>Require unique exact coverage; join predictions by ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scores lack a fitted predictor / provenance\u003c/td>\u003ctd>Generate actual predictions; record code, inputs, configuration, versions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Promoter-function claim from simulation\u003c/td>\u003ctd>Limit conclusions to the stated artificial sequence task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Selection uses previously revealed test scores\u003c/td>\u003ctd>Do not claim independent confirmation; agree a new evaluation if needed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"small\">\u003ca href=\"../../agent_workshop/worked-audit.md\">Worked audit and repair sequence\u003c/a> · Do not change the main fixed manifest to repair the separate authored fixture.\u003c/p>","takeaway":"One repaired defect is not a certificate that the whole inference is valid."},"local":12,"anchor":"day-4-slide-12"},{"day":4,"time":"150–170 · reserved demonstration","title":"Follow the evidence through Agentomics.","subtitle":"Reserved instructor demonstration · 20 minutes","body":"\u003cp class=\"story-question\">Where do the scientific choices become visible?\u003c/p>\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Question\u003c/b>What is being tested?\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Workflow\u003c/b>What actually runs?\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Evidence\u003c/b>What supports the claim?\u003c/div>\u003c/div>\u003cp class=\"story-caption\">Preparation pending: actual access, example, materials, and rehearsal.\u003c/p>","takeaway":"Use the actual demonstration; no product behavior or outputs are assumed here.","notes":"This is a protected 20-minute allocation, not a fabricated product walkthrough. Missing actual access/materials is a real outstanding requirement. Ask the instructor to resolve it before teaching; do not mark this demo or its rehearsal complete. A clearly labeled contingency discussion does not satisfy the actual demonstration requirement.","kind":"","reference":{"title":"Agentomics · instructor demonstration","subtitle":"Twenty minutes reserved · actual demo access, materials, and rehearsal are pending.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>What to observe if the demo is available\u003c/h2>\u003cul>\u003cli>Which scientific choices are explicit?\u003c/li>\u003cli>Where are split identities and fitting boundaries recorded?\u003c/li>\u003cli>Which actual artifacts support the comparison?\u003c/li>\u003cli>How are failure, provenance, and scientific claims audited?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel warning\">\u003ch2>Evidence boundary\u003c/h2>\u003cp>No Agentomics features, screen sequence, outputs, or recording are asserted in this deck.\u003c/p>\u003cp>The instructor must supply actual access and materials. If unavailable, report the blocked demonstration; a discussion is not a completed demo.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"small\">Use the same evaluation and audit questions, without introducing another required student platform.\u003c/p>","takeaway":"Automation must be inspected through actual evidence, not inferred from a product name."},"local":13,"anchor":"day-4-slide-13"},{"day":4,"time":"170–180 · final discussion","title":"What would you trust now?","subtitle":"One question carried through four days.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Count\u003c/b>Choose information\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Learn\u003c/b>Test representation\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Reuse\u003c/b>Check transfer\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Delegate\u003c/b>Audit evidence\u003c/div>\u003c/div>\u003cp class=\"story-question\">One claim you can defend.\u003cbr>One limitation you would report.\u003c/p>\u003cp class=\"story-links\">\u003ca href=\"../../notebooks/README.md\">Code ↗\u003c/a> &nbsp; \u003ca href=\"../../instructor/practicals.md\">Exercises ↗\u003c/a> &nbsp; \u003ca href=\"../../instructor/answers.md\">Answers ↗\u003c/a>\u003c/p>","takeaway":"A better model is useful only inside an experiment you can defend.","notes":"Leave the final ten minutes for students rather than extending the demo. No exam, required submission, or homework. Ask for one changed view and one unresolved question. Instructor guidance and recorded limitations are in instructor/guide.md; actual Colab/full-session rehearsal and Agentomics demo remain separate outstanding checks.","kind":"","reference":{"title":"What changed · and what never changed?","subtitle":"Ten minutes · final questions and course synthesis","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Day 1\u003c/b>Choose features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 2\u003c/b>Learn features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 3\u003c/b>Reuse features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Day 4\u003c/b>Delegate execution\u003c/div>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>The invariant experiment\u003c/h2>\u003cp>Define the question and evaluation unit. Keep identities aligned. Fit only where permitted. Develop on validation. Freeze before the planned reveal. Trace every claim to actual evidence.\u003c/p>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Discuss\u003c/h2>\u003cp>Which representation would you try first for a new problem, and why? Which one audit check would you never delegate without reviewing?\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>Take away\u003c/h2>\u003cp>\u003ca href=\"../../notebooks/README.md\">Completed notebooks and execution order\u003c/a>\u003cbr>\u003ca href=\"../../instructor/practicals.md\">Exercises\u003c/a> · \u003ca href=\"../../instructor/answers.md\">answers\u003c/a> · \u003ca href=\"../../instructor/audit-checklist.html\">audit checklist\u003c/a>\u003c/p>\u003c/div>\u003c/div>","takeaway":"More automation increases the value of a precise question and an independent audit."},"local":14,"anchor":"day-4-slide-14"}]</script>
<script>const slides=JSON.parse(document.getElementById('day-data').textContent);</script>
<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day-4-edits-v1';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            const oldEdits = JSON.parse(localStorage.getItem('ml-course-2026-day1-teaching-v3') || '{}');
            const migrated = Object.fromEntries(Object.entries(oldEdits).filter(([key]) => key.startsWith('day-4-')));
            this.edits = {...migrated, ...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = `day-${slide.day}-slide-${slide.local}`;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    <p>${slide.notes}</p>

                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../index.html">All days</a> · <a href="../../instructor/guide.md">Instructor guide</a> · <a href="../../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch && Number(localMatch[1]) !== 4) { location.href = `../Day_${localMatch[1]}/presentation.html${location.hash}`; return; }
        if (localMatch) this.go(Math.max(0, slides.findIndex(s => s.day === Number(localMatch[1]) && s.local === Number(localMatch[2]))), false);
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        if (day === 4) this.go(0);
        else location.href = `../Day_${day}/presentation.html`;
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'day-4-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it beside presentation.html for linked course resources.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of new Set(slides.map(slide => slide.day))) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
</script>
