:root{--ink:#14213d;--muted:#536476;--line:#dbe3ea;--soft:#f7f9fb;--accent:#234e70;--teal:#216869;--slide-bg:#fff;--stage-bg:#e8eef3;--radius:18px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{transition:none!important;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:Inter,sans-serif;color:var(--ink)}
.slide{padding:64px 90px 112px;background:linear-gradient(135deg,#fff 65%,#f5f9fc);border-top:10px solid var(--accent)}
.slide-top{display:flex;justify-content:space-between;align-items:center;height:42px;margin-bottom:28px;color:var(--accent);font-size:21px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.slide-top .timing{font-size:19px;letter-spacing:.5px;color:var(--muted)}
h1{font-size:70px;line-height:1.09;letter-spacing:-2.4px;max-width:1650px;margin:0 0 22px;font-weight:760}.subtitle{font-size:30px;line-height:1.4;color:var(--muted);margin:0 0 28px;max-width:1630px}.content{height:650px;display:flex;flex-direction:column;gap:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{padding:28px 32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);min-width:0}.panel.blue{background:#edf5fb;border-color:#bfd3e3}.panel.teal{background:#edf7f5;border-color:#b7d8d1}.panel.warning{background:#fff6e9;border-color:#e9cc9d}
h2{font-size:34px;letter-spacing:-.6px;line-height:1.2;margin:0 0 18px;color:var(--accent)}p,li{font-size:29px;line-height:1.43;margin:0 0 17px}ul,ol{margin:0;padding-left:35px}li:last-child,p:last-child{margin-bottom:0}strong{font-weight:750}.small{font-size:24px;color:var(--muted);line-height:1.4}.eyebrow{font-size:23px;color:var(--teal);font-weight:750;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.equation{padding:28px 32px;font-size:42px;line-height:1.4;border-left:6px solid var(--teal);background:#edf7f5;border-radius:0 15px 15px 0}.equation small{display:block;font-size:26px;margin-top:10px;color:var(--muted)}
code,pre,.dna{font-family:Consolas,monospace}code{font-size:.9em;color:#174d74;background:#edf3f7;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}pre{font-size:27px;line-height:1.5;background:#142c43;color:#fff;border-radius:16px;padding:28px 32px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}pre code{background:none;color:inherit;padding:0;font-size:inherit}table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.4}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}th{color:var(--accent);background:#edf3f7;font-weight:750}td strong{color:var(--teal)}
.takeaway{position:absolute;left:90px;right:90px;bottom:42px;border-top:2px solid var(--line);padding-top:16px;display:grid;grid-template-columns:145px 1fr;gap:20px;font-size:25px;line-height:1.35}.takeaway strong{color:var(--accent)}.flow{display:flex;align-items:stretch;gap:18px}.flow .node{flex:1;padding:28px 22px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:16px;text-align:center;font-size:29px;line-height:1.4;min-width:0}.flow .arrow{align-self:center;color:var(--teal);font-size:40px}.node b{display:block;color:var(--accent);margin-bottom:12px}.node span{font-size:24px;color:var(--muted)}
.break h1{font-size:126px;max-width:1350px}.break .subtitle{font-size:42px}.break .content{justify-content:center;height:600px}.break{background:linear-gradient(110deg,#edf5fb,#fff 75%)}.dna{display:flex;align-items:center;gap:12px;font-size:28px;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.motif{padding:9px 14px;background:#d9ece7;color:#164f45;border-radius:8px;font-weight:750}.motif.second{background:#d9e9f6;color:#1d4e73}.position{font:22px Inter,sans-serif;color:var(--muted)}
.notes{display:none;position:absolute;inset:40px;z-index:10;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:55px;overflow:auto}.notes.show{display:block}.notes h2{font-size:46px}.notes p{font-size:32px;line-height:1.55}.notes .note-heading{font-size:24px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:750;margin-top:30px}
.deck-controls{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#fff;border:1px solid #c5d3df;border-radius:14px;box-shadow:0 6px 22px #14213d1c;max-width:calc(100vw - 12px);bottom:8px;white-space:nowrap}button,select{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:36px;padding:6px 10px}button:hover,select:hover{background:#edf3f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #216869;outline-offset:2px}button[aria-pressed=true]{background:#d9ece7}#counter{font-size:12px;min-width:46px;text-align:center;color:var(--muted)}#daySelect{width:88px}
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:70px;z-index:1002}.edit-toggle{position:fixed;left:12px;top:12px;z-index:1003;opacity:0;pointer-events:none;border:1px solid var(--line);transition:opacity .2s}.edit-toggle.show,.edit-toggle.active,.edit-toggle:focus{opacity:1;pointer-events:auto}.editing [data-edit]{outline:2px dashed #216869;outline-offset:3px;cursor:text}.save-status{position:fixed;top:12px;right:12px;background:#fff;padding:8px 15px;border-radius:8px;color:#234e70;font-size:13px;z-index:1001}.save-status:empty{display:none}.progress{position:fixed;bottom:0;left:0;width:100%;height:4px;background:#dbe3ea;z-index:1001}.progress div{height:100%;background:var(--accent);transition:width .15s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:#175c8e;text-decoration-thickness:2px;text-underline-offset:5px}.toolbar-extra{display:none}body.controls-expanded .toolbar-extra{display:inline-block}
@media(max-width:600px){.deck-controls{gap:1px;padding:4px}button,select{padding:4px 6px;min-height:34px;font-size:12px}#daySelect{width:69px}#counter{min-width:36px;font-size:10px}}
@media print{.slide{background:#fff}.notes,.edit-hotzone,.edit-toggle,.save-status,.progress,.sr-only{display:none!important}@page{size:20in 11.25in;margin:0}}
.node span{display:block;margin-top:10px}.takeaway{bottom:90px}.slide[data-day="4"]:last-child .content{gap:18px}.slide[data-day="4"]:last-child .content .panel{padding:22px 28px}.deck-controls{flex-wrap:wrap;width:max-content;justify-content:center}

/* Story scenes: one question or visual, with teaching depth in Notes. */
.slide{display:flex;flex-direction:column;padding:58px 90px 54px}
.slide-top{flex-shrink:0;margin-bottom:30px}
h1{font-size:82px;line-height:1.06;letter-spacing:-2.8px;margin-bottom:18px}
.subtitle{font-size:29px;line-height:1.35;margin-bottom:22px;flex-shrink:0}
.content{height:auto;min-height:0;flex:1;justify-content:center;gap:30px}
.takeaway{position:static;flex-shrink:0;margin-top:28px;font-size:25px;padding-top:18px}
.story-question{font-size:58px;line-height:1.2;letter-spacing:-1.5px;font-weight:650;color:var(--teal);max-width:1600px;margin:0}
.story-statement{font-size:74px;line-height:1.2;letter-spacing:-2px;font-weight:680;color:var(--accent)}
.story-caption{font-size:28px;color:var(--muted);margin:0;line-height:1.45}
.story-task{border-left:6px solid var(--teal);padding:18px 30px;background:#edf7f5;border-radius:0 14px 14px 0}
.story-task p{font-size:33px;margin-bottom:15px;max-width:1480px}.story-task a,.story-links{font-size:27px}
.content .panel{padding:30px 34px}.content .panel p{font-size:34px;line-height:1.4}.content .panel h2{font-size:31px}
.content .flow .node{padding:34px 24px;font-size:32px}.content .node b{font-size:34px}
.content pre{font-size:36px;line-height:1.5}.content .equation{font-size:48px;padding:24px 30px}
.sequence-pair{display:flex;flex-direction:column;gap:26px}.sequence-pair>div{display:grid;grid-template-columns:220px 1fr 1fr;gap:40px;align-items:center;padding:15px 0;font-size:36px}
.sequence-pair .motif{text-align:center;font:600 50px Consolas,monospace;padding:26px 20px}.sequence-pair .sequence-axis{font-size:26px;color:var(--muted);text-align:center;padding:0}
.score-chart{width:100%;max-height:510px;overflow:visible;flex-shrink:1;min-height:0}.chart-label{font:500 29px Inter,sans-serif;fill:#14213d}.chart-value{font:600 25px Inter,sans-serif;fill:#14213d}.chart-axis{font:400 24px Inter,sans-serif;fill:#536476}
.chart-legend{display:flex;gap:34px;font-size:27px;color:var(--muted)}.chart-legend span{display:flex;align-items:center;gap:12px}.chart-legend i{width:25px;height:16px;border-radius:3px}
.break .content{height:auto}.break h1{font-size:110px}.break .subtitle{font-size:36px}.break .story-statement{font-size:64px}
.notes h2{font-size:38px}.notes p{font-size:29px}.notes details{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.notes summary{font-size:28px;color:var(--accent);font-weight:650;cursor:pointer}.reference{margin-top:24px}.reference p,.reference li{font-size:27px}.reference .flow{margin:22px 0}.reference .panel{margin-bottom:22px}.reference h3{font-size:30px}.reference .equation{font-size:34px}.reference pre{font-size:25px}.reference .dna{white-space:normal;flex-wrap:wrap}
.slide[data-day="4"]:last-child .content{gap:30px}.slide[data-day="4"]:last-child .content .panel{padding:30px 34px}
@media print{*,*::before,*::after{transition:none!important;animation:none!important}.slide{display:flex!important}.notes{display:none!important}}

F matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s1-participation-routes","anchor":"day-4-s1-participation-routes","sectionSequence":true,"sectionNumber":1,"kind":"day-four","title":"Two ways to participate","time":"20:00–22:30 (2:30)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Observation route and optional existing-access operation have the same ungraded evidence questions\">\u003ctitle>Observation route and optional existing-access operation have the same ungraded evidence questions\u003c/title>\u003cpath d=\"M255 90 h180 l50 50 v230 h-230 Z M435 90 v50 h50\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\"/>\u003cpath d=\"M290 180.0 L450 180.0\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M290 213.6 L415 213.6\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M290 247.2 L450 247.2\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M290 280.8 L415 280.8\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003ctext x=\"370.0\" y=\"435\" font-size=\"39\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Observe saved evidence\u003c/text>\u003crect x=\"1020\" y=\"100\" width=\"580\" height=\"250\" rx=\"14\" fill=\"#f8fafc\" stroke=\"#D55E00\" stroke-width=\"5\"/>\u003cpath d=\"M1020 145 L1600 145\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"3\" />\u003ccircle cx=\"1047\" cy=\"123\" r=\"6\" fill=\"#D55E00\"/>\u003ccircle cx=\"1070\" cy=\"123\" r=\"6\" fill=\"#D55E00\"/>\u003ccircle cx=\"1093\" cy=\"123\" r=\"6\" fill=\"#D55E00\"/>\u003ctext x=\"1055\" y=\"205\" font-size=\"37\" fill=\"#18344b\" text-anchor=\"s not inevitable\">\u003ctitle>Missing decisions create different possible experiments; failure is not inevitable\u003c/title>\u003ctext x=\"864\" y=\"70\" font-size=\"58\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\" >One vague request\u003c/text>\u003cpath d=\"M864 140 L330 260\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M330 260 L343.52006820128065 248.11691303437027\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M330 260 L347.30419691617277 264.9562858156402\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003ccircle cx=\"330\" cy=\"300\" r=\"50\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"330\" y=\"316.0\" font-size=\"50\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >?\u003c/text>\u003ctext x=\"330\" y=\"435\" font-size=\"52\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Split?\u003c/text>\u003ctext x=\"330\" y=\"540\" font-size=\"39\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Rows / groups\u003c/text>\u003cpath d=\"M864 140 L864 260\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003cpath d=\"M864 260 L855.3703403051244 244.20351388597328\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003cpath d=\"M864 260 L872.6296596948756 244.20351388597328\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003ccircle cx=\"864\" cy=\"300\" r=\"50\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"864\" y=\"316.0\" font-size=\"50\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >?\u003c/text>\u003ctext x=\"864\" y=\"435\" font-size=\"52\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Success?\u003c/text>\u003ctext x=\"864\" y=\"540\" font-size=\"39\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Accuracy / ROC-AUC\u003c/text>\u003cpath d=\"M864 140 L1400 260\" fill=\"none\" stroke=\"#7B4FA3\" stroke-width=\"4\" />\u003cpath d=\"M1400 26 e endings; reconstructed CRLF matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s2-fixture-intro","anchor":"day-4-s2-fixture-intro","sectionSequence":true,"sectionNumber":2,"kind":"day-four","title":"An authored teaching fixture","time":"33:30–36:30 (3:00)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"An authored teaching fixture with invented probabilities, distinct from genuine previous agent runs\">\u003ctitle>An authored teaching fixture with invented probabilities, distinct from genuine previous agent runs\u003c/title>\u003cpath d=\"M280 90 h180 l50 50 v230 h-230 Z M460 90 v50 h50\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\"/>\u003cpath d=\"M315 180.0 L475 180.0\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003cpath d=\"M315 213.6 L440 213.6\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003cpath d=\"M315 247.2 L475 247.2\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003cpath d=\"M315 280.8 L440 280.8\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" />\u003ctext x=\"395.0\" y=\"435\" font-size=\"39\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Four authored rows\u003c/text>\u003ctext x=\"1180\" y=\"200\" font-size=\"60\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Invented probabilities\u003c/text>\u003ctext x=\"1180\" y=\"320\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Not an agent transcript\u003c/text>\u003ctext x=\"1180\" y=\"450\" font-size=\"47\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Read → predict → audit\u003c/text>\u003c/svg>","subtitle":"","takeawa t x=\"460\" y=\"90\" font-size=\"51\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Training\u003c/text>\u003ctext x=\"1280\" y=\"90\" font-size=\"51\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Validation\u003c/text>\u003ccircle cx=\"295\" cy=\"240\" r=\"30\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"295\" y=\"240.0\" font-size=\"0\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ctext x=\"460\" y=\"250\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >train-01\u003c/text>\u003ctext x=\"460\" y=\"315\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\" >group-a\u003c/text>\u003ccircle cx=\"295\" cy=\"440\" r=\"30\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"295\" y=\"440.0\" font-size=\"0\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ctext x=\"460\" y=\"450\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >train-02\u003c/text>\u003ctext x=\"460\" y=\"515\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\" >group-b\u003c/text>\u003ccircle cx=\"1115\" cy=\"240\" r=\"30\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1115\" y=\"240.0\" font-size=\"0\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ctext x=\"1280\" y=\"250\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >validation-01\u003c/text>\u003ctext x=\"1280\" y=\"315\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\" >group-a\u003c/text>\u003ccircle cx=\"1115\" cy=\"440\" r=\"30\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1115\" y=\"440.0\" font-size=\"0\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ctext x=\"1280\" y=\"450\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >validation-02\u003c/text>\u003ctext x=\"1280\" y=\"515\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\" >group-c\u003c/text>\u003cpath d=\"M660 310 L1080 310\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"7\" />\u003ctext x=\"864\" y=\"620\" font-size=\"51\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Unique samples ≠ independent groups\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"The sample IDs are distinct, but group-a appears in both splits. New-group generalization is therefore unsupported. Related sequences can let a model exploit family similarity; the fixture has no fitted model, so we cannot claim to have observed memorization here.","point":"Trace group-a across the two columns, despite distinct sample IDs.","transition":"Flaw number two: look at where feature extraction happened.","sourceNote":"Figures are native teaching constructions. Fixture probabilities 0.1/0.9 are deliberately authored, not fitted model output or observed agent failure. The local notebook audit checks identity and saved validation metrics; it cannot infer correct fitting or test-access history from prediction tables. Historical actual runs: October 26, 2026, Codex/gpt-6.1-sol, fixed-string motif input, 720 training / 240 validation rows; not current PPM scores. Vague arm used a disclosed TATAAATG prior and six-candidate training-only group CV, not motif discovery. Specified arm is fixed 4-mer/logistic baseline, max_iter=2000, no scaler. Both received technical tool corrections. Current Git files have LF line endings; reconstructed CRLF matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s2-flaw-preprocessing","anchor":"day-4-s2-flaw-preprocessing","sectionSequence":true,"sectionNumber":2,"kind":"day-four","title":"The vocabulary saw validation","time":"39:30–42:30 (3:00)","body":"\u003cdiv class=\"d3-code\">\u003cpre>vectorizer.fit(samples[&quot;sequence&quot;])\u003c/pre>\u003cp>Training + validation informed the vocabulary\u003c/p>\u003c/div>","subtitle":"","takeaway":"","notes":"Flaw number two: Preprocessing leakage. Look at the vectorizer call. The vocabulary is fitted on the entire DataFrame, including validation sequences. Even without labels, the model&#x27;s feature space is informed by validation sequence words before training begins. A pipeline must fit vocabulary on training rows only.","point":"Point to samples[&quot;sequence&quot;] and identify which rows it includes.","transition":"Flaw number three: look at how predictions were matched to labels.","sourceNote":"Figures are native teaching constructions. Fixture probabilities 0.1/0.9 are deliberately authored, not fitted model output or observed agent failure. The local notebook audit checks identity and saved validation metrics; it cannot infer correct fitting or test-access history from prediction tables. Historical actual runs: October 26, 2026, Codex/gpt-6.1-sol, fixed-string motif input, 720 training / 240 validation rows; not current PPM scores. Vague arm used a disclosed TATAAATG prior and six-candidate training-only group CV, not motif discovery. Specified arm is fixed 4-mer/logistic baseline, max_iter=2000, no scaler. Both received technical tool corrections. Current Git files have LF line endings; reconstructed CRLF matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s2-flaw-inverted-join","anchor":"day-4-s2-flaw-inverted-join","sectionSequence":true,"sectionNumber":2,"kind":"day-four","title":"Right numbers, wrong samples","time":"42:30–46:00 (3:30)","body":"\u003cdiv class=\"d2-live d3-live\" data-d4=\"alignment\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 560\" role=\"img\" aria-label=\"alignment\">\u003ctitle>alignment\u003c/title>\u003cg data-alignment>\u003ctext x=\"330\" y=\"70\" font-size=\"46\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Validation labels\u003c/text>\u003ctext x=\"1260\" y=\"70\" font-size=\"46\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Probability rows\u003c/text>\u003ctext x=\"180\" y=\"190\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >validation-01\u003c/text>\u003ccircle cx=\"495\" cy=\"178\" r=\"35\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"495\" y=\"190.16\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >0\u003c/text>\u003ctext x=\"180\" y=\"350\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >validation-02\u003c/text>\u003ccircle cx=\"495\" cy=\"338\" r=\"35\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"495\" y=\"350.16\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >1\u003c/text>\u003ccircle cx=\"1090\" cy=\"178\" r=\"45\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1090\" y=\"189.84\" font-size=\"37\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >0.1\u003c/text>\u003ctext x=\"1400\" y=\"190\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >validation-02\u003c/text>\u003ccircle cx=\"1090\" cy=\"338\" r=\"45\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1090\" y=\"349.84\" font-size=\"37\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >0.9\u003c/text>\u003cte  from prediction tables. Historical actual runs: October 26, 2026, Codex/gpt-6.1-sol, fixed-string motif input, 720 training / 240 validation rows; not current PPM scores. Vague arm used a disclosed TATAAATG prior and six-candidate training-only group CV, not motif discovery. Specified arm is fixed 4-mer/logistic baseline, max_iter=2000, no scaler. Both received technical tool corrections. Current Git files have LF line endings; reconstructed CRLF matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s2-flaw-overclaim","anchor":"day-4-s2-flaw-overclaim","sectionSequence":true,"sectionNumber":2,"kind":"day-four","title":"The claim outruns the evidence","time":"46:00–48:30 (2:30)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Authored unsupported biological claim and proposed post-reveal selection, without evidence of an actual test read\">\u003ctitle>Authored unsupported biological claim and proposed post-reveal selection, without evidence of an actual test read\u003c/title>\u003ctext x=\"864\" y=\"130\" font-size=\"64\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >“Learned promoter biology”\u003c/text>\u003ctext x=\"864\" y=\"235\" font-size=\"47\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >No biological validation\u003c/text>\u003cpath d=\"M220 315 L1510 315\" fill=\"none\" stroke=\"#dce5eb\" stroke-width=\"3\" />\u003ctext x=\"864\" y=\"435\" font-size=\"60\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >“Choose using the Day 3 test”\u003c/text>\u003ctext x=\"864\" y=\"540\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Proposed misuse ≠ observed test access\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"The authored report makes an unsupported biological claim and proposes selecting against the Day 3 test. The proposal violates our evaluation policy. No test-access log is supplied; do not turn the proposed misuse into an assertion that test data was actually read.","point":"Read each claim and its evidence limit. Distinguish proposed misuse from actual access.","transition":"What is the overarching lesson of this fixture?","sourceNote":"Figures are native teaching constructions. Fixture probabilities 0.1/0.9 are deliberately authored, not fitted model output or observed agent failure. The local notebook audit checks identity and saved validation metrics; it cannot infer correct fitting or test-access history from prediction tables. Historical actual runs: October 26, 2026, Codex/gpt-6.1-sol, fixed-string motif input, 720 training / 240 validation rows; not current PPM scores. Vague arm used a disclosed TATAAATG prior and six-candidate training-only group CV, not motif discovery. Specified arm is fixed 4-mer/logistic baseline, max_iter=2000, no scaler. Both received technical tool corrections. Current Git files have LF line endings; reconstructed CRLF matches original Windows input hashes. Source-bound evidence: instructor/verification/day4-current.json. No new agent call, classifier fitting, protected test access or reveal. Instructor selected Agentomics audit-discussion fallback; no product demo or capability claim is verified. Colab, pacing and projector readability unverified."},{"day":4,"id":"day-4-s2-discussion","anchor":"day-4-s2-discussion","sectionSequence":true,"sectionNumber":2,"kind":"day-four","title":"What would you inspect first?","time":"48:30–50:00 (1:30)","body":"\u003cdiv class=\"d3-prompt\">\u003cp>The script runs.\u003c/p>\u003cp class=\"secondary\">Which evidence would you inspect first?\u003c/p>\u003c/div>","subtitle":"","takeaway":"","notes":"A progr function bindDayFour() {
    const evidence=JSON.parse(document.getElementById('day-four-evidence').textContent);
    const B='#0072B2',O='#D55E00',G='#697782',ns='http://www.w3.org/2000/svg';
    function node(parent,tag,attrs,value){
        const el=document.createElementNS(ns,tag);
        Object.entries(attrs).forEach(([key,val])=>el.setAttribute(key,String(val)));
        if(value!==undefined)el.textContent=value;
        parent.appendChild(el);return el;
    }
    function label(parent,x,y,value,color=B,size=46,anchor='middle'){
        return node(parent,'text',{x,y,fill:color,'font-size':size,'text-anchor':anchor},value);
    }
    function clear(panel,title){
        const plot=panel.querySelector('svg');plot.replaceChildren();
        node(plot,'title',{},title);plot.setAttribute('aria-label',title);return plot;
    }
    document.querySelectorAll('[data-d4="loop"]').forEach(panel=>{
        let current=0;
        const phrases=['Inspect the current task and available files','Act with an appropriate tool','Observe the tool result and inspect its evidence','Revise the plan or report the result and its limits'];
        function update(){
            panel.querySelectorAll('[data-loop-step]').forEach(el=>el.classList.toggle('current',Number(el.dataset.loopStep)===current));
            panel.querySelector('[data-readout]').textContent=phrases[current];
        }
        panel.querySelector('button').addEventListener('click',()=>{current=(current+1)%4;update();});update();
    });
    document.querySelectorAll('[data-d4="exit"]').forEach(panel=>{
        const button=panel.querySelector('button'),defects=panel.querySelector('[data-exit-defects]');
        button.setAttribute('aria-pressed','false');
        button.addEventListener('click',()=>{
            const revealed=defects.classList.toggle('revealed');button.setAttribute('aria-pressed',String(revealed));
            button.textContent=revealed?'Hide the findings':'Inspect what ran';
            panel.querySelector('[data-readout]').textContent=revealed?'Authored fixture: a clean exit coexists with an invalid analysis':'What does this output actually establish?';
        });
    });
    document.querySelectorAll('[data-d4="decisions"]').forEach(panel=>{
        let group=0;
        const sets=[
            ['Task and data','What does the label mean?','Which files are allowed?','Which samples belong together?','How are splits assigned?'],
            ['Model and success','Which representation?','Which model or search?','Which primary metric?','Which decision threshold?'],
            ['Evaluation and provenance','Where may selection happen?','What stays protected?','Which outputs are required?','Which claims can we defend?']
        ];
        function update(){
            const [name,...questions]=sets[group],plot=clear(panel,'Missing experiment decisions: '+name);
            questions.forEach((question,i)=>{
                const x=i%2===0?430:1290,y=i<2?140:400;
                label(plot,x,y-65,String(group*4+i+1),G,33);label(plot,x,y,question,i%2?O:B,43);
            });
            panel.querySelector('[data-readout]').textContent=`${name} · ${group+1} of 3`;
        }
        panel.querySelector('button').addEventListener('click',()=>{group=(group+1)%3;update();});update();
    });
    document.querySelectorAll('[data-d4="alignment"]').forEach(panel=>{
        let aligned=false;const button=panel.querySelector('button');button.setAttribute('aria-pressed','false');
        button.addEventListener('click',()=>{
            aligned=!aligned;panel.querySelector('[data-alignment]').innerHTML=evidence[aligned?'aligned':'positional'];
            button.textContent=aligned?'Show positional pairing':'Join by sample ID';button.setAttribute('aria-pressed',String(aligned));
        });
    });
    document.querySelectorAll('[data-d4="scores"]').forEach(panel=>{
        let metric='roc_auc';const button=panel.querySelector('button');
        function update(){
            const plot=clear(panel,'Historical validation '+(metric==='roc_auc'?'ROC-AUC':'average precision'));
            label(plot,1030,55,metric==='roc_auc'?'Validation ROC-AUC':'Validation average precision',G,42);
            [['vague','Vague request',O],['specified','Specified baseline',B]].forEach(([key,name,color],i)=>{
                const value=evidence.historical[key].metrics[metric],y=170+i*210;
                label(plot,440,y+16,name,color,48,'end');
                node(plot,'rect',{x:530,y:y-21,width:1000*value,height:42,fill:color});
                label(plot,565+1000*value,y+16,value.toFixed(3),color,46,'start');
            });
            [0,.5,1].forEach(value=>label(plot,530+1000*value,505,String(value),G,31));
            button.textContent=metric==='roc_auc'?'Show average precision':'Show ROC-AUC';
        }
        button.addEventListener('click',()=>{metric=metric==='roc_auc'?'average_precision':'roc_auc';update();});update();
    });
    document.querySelectorAll('[data-d4="findings"]').forEach(panel=>{
        let current=0;
        const findings=[
            ['FAIL','Group separation','group-a occurs in training and validation',O],
            ['FAIL','Training-only vocabulary','Source: fit(samples["sequence"]) includes validation',O],
            ['FAIL','Metric correspondence','ID join changes accuracy from 100% to 0%',O],
            ['FAIL','Biological claim scope','An authored simulation does not validate promoter biology',O],
            ['UNVERIFIED','A fitted predictor','Probabilities were authored; no training evidence',G],
            ['UNVERIFIED','Actual test-access history','A proposed misuse does not establish a file read',G]
        ];
        function update(){
            const [status,title,detail,color]=findings[current],plot=clear(panel,`${status}: ${title}`);
            label(plot,864,105,status,color,48);label(plot,864,270,title,color,70);label(plot,864,430,detail,G,42);
            panel.querySelector('[data-readout]').textContent=`Finding ${current+1} of ${findings.length} · observed defects and missing evidence differ`;
        }
        panel.querySelector('button').addEventListener('click',()=>{current=(current+1)%findings.length;update();});update();
    });
    // Optional discussion timer. It never advances slides; leaving pauses it.
    // Kept local and transient: no storage, imports, network or scientific work.
    document.querySelectorAll('[data-timer]').forEach(panel=>{
        const output=panel.querySelector('output'),start=panel.querySelector('[data-timer-start]'),reset=panel.querySelector('[data-timer-reset]');
        let remaining=300000,deadline=0,interval=null;
        function paint(){const seconds=Math.ceil(remaining/1000);output.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
        function pause(){
            if(interval!==null){remaining=Math.max(0,deadline-Date.now());clearInterval(interval);interval=null;}
            start.textContent=remaining===0?'Restart':remaining===300000?'Start':'Resume';paint();
        }
        function tick(){remaining=Math.max(0,deadline-Date.now());paint();if(remaining===0){pause();start.textContent='Restart';}}
        start.addEventListener('click',()=>{
            if(interval!==null){pause();return;}
            if(remaining===0)remaining=300000;
            deadline=Date.now()+remaining;interval=setInterval(tick,200);start.textContent='Pause';tick();
        });
        reset.addEventListener('click',()=>{pause();remaining=300000;start.textContent='Start';paint();});
        new MutationObserver(()=>{if(!panel.closest('.slide').classList.contains('active'))pause();}).observe(panel.closest('.slide'),{attributes:true,attributeFilter:['class']});
        document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
        window.addEventListener('beforeprint',pause);paint();
    });
}

<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day-4-edits-v2';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            const oldEdits = JSON.parse(localStorage.getItem('ml-course-2026-day1-teaching-v3') || '{}');
            const migrated = Object.fromEntries(Object.entries(oldEdits).filter(([key]) => key.startsWith('day-4-')));
            this.edits = {...migrated, ...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = slide.id || slide.anchor || `day-${slide.day}-slide-${slide.local}`;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    ${slide.sectionOne || slide.sectionLearning || slide.sectionSequence ? `<p><strong>SAY:</strong> ${slide.notes}</p><p><strong>POINT:</strong> ${slide.point}</p><p><strong>TRANSITION:</strong> ${slide.transition}</p><p class="small"><strong>Timing:</strong> ${slide.time}</p><p class="small">${slide.sourceNote}</p><p><a href="story.md#section-${slide.sectionNumber || (slide.sectionLearning ? 2 : 1)}">Section ${slide.sectionNumber || (slide.sectionLearning ? 2 : 1)} story</a></p>` : `<p>${slide.notes}</p>`}

                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../index.html">All days</a> · <a href="../../instructor/guide.md">Instructor guide</a> · <a href="../../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo, .d2-live')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const openingAliases = {"#day-4-slide-1": "day-4-s1-welcome", "#day-4-slide-2": "day-4-s1-llm-basics", "#day-4-slide-3": "day-4-s2-vague-prompt", "#day-4-slide-4": "day-4-s2-fixture-intro", "#day-4-slide-5": "day-4-break-1", "#day-4-slide-6": "day-4-s3-spec-concept", "#day-4-slide-7": "day-4-s4-three-tiers", "#day-4-slide-8": "day-4-s4-actual-runs-intro", "#day-4-slide-9": "day-4-break-2", "#day-4-slide-10": "day-4-s5-checklist-activity", "#day-4-slide-11": "day-4-s5-repair-framework", "#day-4-slide-12": "day-4-s6-agentomics-demo", "#day-4-slide-13": "day-4-s6-human-responsibility", "#day-4-slide-14": "day-4-s6-final-discussion"};
        const target = openingAliases[location.hash] || location.hash.slice(1);
        const exact = slides.findIndex(slide => slide.anchor === target);
        if (exact >= 0) { this.go(exact, false); return; }
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch && Number(localMatch[1]) !== 4) { location.href = `../Day_${localMatch[1]}/presentation.html${location.hash}`; return; }
        if (localMatch) this.go(Math.max(0, slides.findIndex(s => s.day === Number(localMatch[1]) && s.local === Number(localMatch[2]))), false);
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        if (day === 4) this.go(0);
        else location.href = `../Day_${day}/presentation.html`;
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'day-4-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it beside presentation.html for linked course resources.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of new Set(slides.map(slide => slide.day))) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo, .d2-live')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, .d2-live, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
bindDayFour();
