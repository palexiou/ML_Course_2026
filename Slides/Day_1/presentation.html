\"0.35\"/>\u003crect x=\"409\" y=\"346\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.85\"/>\u003crect x=\"446\" y=\"346\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.55\"/>\u003crect x=\"483\" y=\"346\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.25\"/>\u003crect x=\"520\" y=\"346\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.75\"/>\u003crect x=\"557\" y=\"346\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.44999999999999996\"/>\u003crect x=\"150\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.85\"/>\u003crect x=\"187\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.55\"/>\u003crect x=\"224\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.25\"/>\u003crect x=\"261\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.75\"/>\u003crect x=\"298\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.44999999999999996\"/>\u003crect x=\"335\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.15\"/>\u003crect x=\"372\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.65\"/>\u003crect x=\"409\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.35\"/>\u003crect x=\"446\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.85\"/>\u003crect x=\"483\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.55\"/>\u003crect x=\"520\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.25\"/>\u003crect x=\"557\" y=\"395\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.75\"/>\u003ctext x=\"360\" y=\"555\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Many measurements\u003c/text>\u003cpath d=\"M680 305 L1010 305\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M995 295 L1010 305 L995 315\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ccircle cx=\"1179\" cy=\"426\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1218\" cy=\"463\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1218\" cy=\"389\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1257\" cy=\"426\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1296\" cy=\"426\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1335\" cy=\"315\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1374\" cy=\"352\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1413\" cy=\"278\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1452\" cy=\"315\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1413\" cy=\"204\" r=\"13\" fill=\"#0072B2\"/>\u003ctext x=\"1370\" y=\"555\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Compact representation\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Another useful output is a representation: a numerical description that keeps selected useful structure in a form we can work with. For example, many expression measurements might become a smaller set of coordinates. We may use those coordinates to visualize, compare examples, or feed another model. Compression loses information; a useful representation depends on what we want to do next. Representation learning can also use supervised or self-supervised signals.","point":"Trace rows of many measurements into the compact point view. The right-hand drawing is schematic; do not claim it is a computed projection of the left.","transition":"How might we learn when the inputs can supply their own targets?","sourceNote":"Representation learning is a capability across learning settings, not exclusively unsupervised. Both matrix and coordinates are constructed schematics.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":18,"id":"day-1-intro-self-supervised","sectionOne":true,"time":"90 seconds","title":"Create the target from the input","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Self-supervised masked-word training: hide treatment in a sentence and use the original word as the target.\">\u003ctext x=\"130\" y=\"150\" font-size=\"39\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">Original input\u003c/text>\u003ctext x=\"130\" y=\"235\" font-size=\"61\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">The cell responds to treatment.\u003c/text>\u003cpath d=\"M130 300 L1590 300\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"130\" y=\"390\" font-size=\"39\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">Training input\u003c/text>\u003ctext x=\"130\" y=\"475\" font-size=\"61\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">The cell responds to\u003c/text>\u003crect x=\"675\" y=\"418\" width=\"360\" height=\"82\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"855.0\" y=\"475.17\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"600\">[masked]\u003c/text>\u003cpath d=\"M1070 459 L1220 459\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1205 449 L1220 459 L1205 469\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1270\" y=\"475\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">treatment\u003c/text>\u003ctext x=\"1290\" y=\"565\" font-size=\"34\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Target from the input\u003c/text>\u003ctext x=\"864\" y=\"680\" font-size=\"36\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Often grouped broadly under unsupervised learning\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Self-supervised learning constructs a training problem from the input. Here we hide a word and ask the model to predict it, using the original word as the target. A human does not have to label every sentence with the missing word. There is still a target and a learning objective; the difference is where the target comes from. The model may learn representations useful beyond this exact word-prediction problem. Self-supervision is often treated as a broad form of unsupervised learning.","point":"Compare the original sentence with the masked training input; follow the arrow to the withheld word. Make the source of the target explicit.","transition":"Now change lenses: what can a model produce after training?","sourceNote":"D2L, Pretraining BERT: masked language modeling creates targets from input, https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html. This is a toy sentence, not a trained model result.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":19,"id":"day-1-intro-generation","sectionOne":true,"time":"75 seconds","title":"Generative models produce content","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A text prompt enters a generative model and produces a possible new text response.\">\u003crect x=\"90\" y=\"245\" width=\"520\" height=\"160\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"350.0\" y=\"337.87\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">“Describe a resting cell.”\u003c/text>\u003cpath d=\"M640 325 L780 325\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M765 315 L780 325 L765 335\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"810\" y=\"245\" width=\"330\" height=\"160\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"975.0\" y=\"337.54\" font-size=\"38\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Generative model\u003c/text>\u003cpath d=\"M1170 325 L1270 325\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1255 315 L1270 325 L1255 335\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1310\" y=\"285\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">“A resting cell\u003c/text>\u003ctext x=\"1310\" y=\"347\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">maintains its\u003c/text>\u003ctext x=\"1310\" y=\"409\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">normal functions.”\u003c/text>\u003ctext x=\"864\" y=\"585\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Produce new content from learned patterns\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: A generative model learns patterns that can be used to produce content such as text or images. Here a text prompt leads to one possible sentence. This is an authored example, not a captured model output or a factual biology lesson. Generated content may be plausible while being wrong. Generation tells us about a model capability or objective; it does not by itself tell us where the training targets came from.","point":"Trace prompt → model → new text. Point to the multiple-word output rather than a category or numeric target.","transition":"Generation can also be guided by supplied labels or conditions.","sourceNote":"Goodfellow, Bengio and Courville, Deep Learning, ch. 20, https://www.deeplearningbook.org/contents/generative_models.html. The book treats generative modeling separately from the supervised/unsupervised label split. Generated text shown is authored, not observed output.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":20,"id":"day-1-intro-conditional-generation","sectionOne":true,"time":"60 seconds","title":"Generation can be guided","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Conditional generation: a blue-circle description guides an image generator; paired text and images can supply training supervision.\">\u003ctext x=\"110\" y=\"145\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">Condition\u003c/text>\u003crect x=\"110\" y=\"210\" width=\"400\" height=\"100\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"310.0\" y=\"275.18\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">“a blue circle”\u003c/text>\u003cpath d=\"M540 260 L760 260\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M745 250 L760 260 L745 270\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"790\" y=\"195\" width=\"390\" height=\"130\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"985.0\" y=\"273.86\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Image generator\u003c/text>\u003cpath d=\"M1210 260 L1380 260\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1365 250 L1380 260 L1365 270\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ccircle cx=\"1510\" cy=\"260\" r=\"70\" fill=\"#0072B2\"/>\u003ctext x=\"864\" y=\"515\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Training may use paired descriptions and images\u003c/text>\u003ctext x=\"864\" y=\"600\" font-size=\"40\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Self-supervised or externally supervised objectives\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: A generator can be conditioned on text, a class label, or another input. Paired descriptions and images can supply supervision during training; a label-conditioned generator can use external class labels. Other generators learn with self-supervised objectives. Training pipelines can combine several stages and objectives. So generative and supervised are not mutually exclusive choices. The circle here is a geometric explanation, not the result of an image-generation service.","point":"Trace the requested description to the blue circle. Then point at the training line and distinguish the condition used at generation time from the training data used earlier.","transition":"A language model makes the overlap especially concrete.","sourceNote":"Mirza and Osindero, Conditional Generative Adversarial Nets (2014), https://arxiv.org/abs/1411.1784 introduces conditioning on class labels and demonstrates text/image conditioning. Supplied class labels or paired conditions can coexist with a generative objective. No actual generated image is claimed.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":21,"id":"day-1-intro-next-token","sectionOne":true,"time":"90 seconds","title":"One language model, two descriptions","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Next-token language modeling: self-supervised next-token targets during training; repeated next-token prediction during generative use.\">\u003ctext x=\"110\" y=\"110\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Next-token training\u003c/text>\u003ctext x=\"110\" y=\"195\" font-size=\"58\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">The cell responds to\u003c/text>\u003cpath d=\"M720 175 L930 175\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M915 165 L930 175 L915 185\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"970\" y=\"123\" width=\"400\" height=\"88\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1170.0\" y=\"184.49\" font-size=\"53\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"600\">treatment\u003c/text>\u003ctext x=\"1460\" y=\"190\" font-size=\"35\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">target\u003c/text>\u003cpath d=\"M110 290 L1610 290\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"110\" y=\"390\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Generate one token at a time\u003c/text>\u003ctext x=\"110\" y=\"485\" font-size=\"58\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">The cell\u003c/text>\u003cpath d=\"M385 465 L540 465\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M525 455 L540 465 L525 475\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"585\" y=\"485\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">responds\u003c/text>\u003cpath d=\"M850 465 L1000 465\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M985 455 L1000 465 L985 475\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1045\" y=\"485\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">to\u003c/text>\u003cpath d=\"M1130 465 L1270 465\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1255 455 L1270 465 L1255 475\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1310\" y=\"485\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">treatment\u003c/text>\u003ctext x=\"864\" y=\"640\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"600\">Self-supervised training · generative use\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: For next-token training, take a text prefix and use the following token from the original text as the target. That is self-supervised training. When generating, choose a next token, append it, and repeat; that is generative use. The same model can therefore be described as self-supervised by its training signal and generative by its use. Tokens are units of text and are not always whole words; these whole words make the idea easier to see. Real language models often have additional instruction and preference training stages.","point":"Point to the training target obtained from the original sentence. Then trace the growing prefix in the lower row; keep training and generation distinct.","transition":"Another training setting learns from actions and rewards rather than a fixed target for each input.","sourceNote":"D2L, Language Models, https://d2l.ai/chapter_recurrent-neural-networks/language-model.html and Text Generation, https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html. Sequence is authored; no actual model or probability is displayed. Next-token training is predictive at token level and supports generative use by repeated prediction.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":22,"id":"day-1-intro-reinforcement","sectionOne":true,"time":"90 seconds","title":"Reinforcement learning uses rewards","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A reinforcement-learning loop: an agent acts in an environment, receives observations and reward, and learns action choices from experience.\">\u003crect x=\"190\" y=\"200\" width=\"500\" height=\"160\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"440.0\" y=\"294.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Learning agent\u003c/text>\u003cpath d=\"M720 280 L1080 280\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1065 270 L1080 280 L1065 290\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1110\" y=\"200\" width=\"440\" height=\"160\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1330.0\" y=\"294.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Environment\u003c/text>\u003ctext x=\"895\" y=\"240\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Action\u003c/text>\u003cpath d=\"M1330 390 V535 H440 V390\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"885\" y=\"602\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Observation + reward\u003c/text>\u003ctext x=\"864\" y=\"100\" font-size=\"47\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Try an action → learn from its consequences\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Reinforcement learning trains an agent to choose actions through interaction with an environment and a reward signal. For example, a robot can choose a movement, observe what happened and receive reward related to completing a task. Learning aims at accumulated reward, including consequences that may arrive later. Unlike a supplied correct target for each input, feedback depends on actions taken. This learning-agent diagram describes a training setup. A coding assistant using tools is not inherently training by reinforcement learning, and its model weights do not ordinarily change just because you use it.","point":"Follow action across the top and observation plus reward back along the bottom. Explain one robot movement verbally; the diagram is the only main visual.","transition":"We now have two different ways to describe the same system: its training signal and what it does.","sourceNote":"Sutton and Barto, Reinforcement Learning: An Introduction, 2nd ed., ch. 3: http://incompleteideas.net/book/the-book-2nd.html. RL is a learning setting, not a claim that all interactive agents learn weights online.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":23,"id":"day-1-intro-two-lenses","sectionOne":true,"time":"60 seconds","title":"Describe the signal and the task","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Training signals and common task pairings, with overlap: external targets for classification or regression; unlabeled structure for clustering or representation; input-derived targets for representation or generation; rewards for action selection.\">\u003ctext x=\"110\" y=\"100\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Training signal\u003c/text>\u003ctext x=\"720\" y=\"100\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Task / capability\u003c/text>\u003ctext x=\"110\" y=\"220\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">External targets\u003c/text>\u003cpath d=\"M625 205 L685 205\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M670 195 L685 205 L670 215\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"720\" y=\"220\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Classification / regression\u003c/text>\u003ctext x=\"110\" y=\"335\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Structure without task labels\u003c/text>\u003cpath d=\"M625 320 L685 320\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M670 310 L685 320 L670 330\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"720\" y=\"335\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Clustering / representation\u003c/text>\u003ctext x=\"110\" y=\"450\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Input-derived targets\u003c/text>\u003cpath d=\"M625 435 L685 435\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M670 425 L685 435 L670 445\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"720\" y=\"450\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Representation / generation\u003c/text>\u003ctext x=\"110\" y=\"565\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Actions + rewards\u003c/text>\u003cpath d=\"M625 550 L685 550\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M670 540 L685 550 L670 560\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"720\" y=\"565\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Action selection\u003c/text>\u003cpath d=\"M110 640 L1610 640\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"864\" y=\"710\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Useful pairings, with overlap between rows\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Use two questions: where did the learning signal come from, and what do we want the system to do? These rows show common pairings, not exclusive ownership. A supervised encoder learns representations; a conditional generator can use external targets; next-token prediction is self-supervised training with generative use. Classification and regression are tasks under supervised learning; clustering is an unsupervised task. Deep learning describes neural-network methods. Transfer learning describes reuse. Foundation models describe broadly pretrained models that can be adapted. Those are overlapping descriptions, not more disjoint branches of this map.","point":"Read the two column headings first. Revisit the self-supervised language-model row and the externally conditioned generator. Keep the caveats spoken, not extra slide boxes.","transition":"Invite the audience to connect this map to their own interests.","sourceNote":"D2L introduction and the next-token/conditional-generation sources cited in the preceding notes. Semi-supervised methods mix labeled and unlabeled data; no extra taxonomy layer is required on screen. The mappings are intentionally nonexclusive.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":24,"id":"day-1-intro-discussion","sectionOne":true,"time":"120 seconds","title":"What would you like to explore?","subtitle":"","body":"\u003cdiv class=\"s1-discussion\">\u003cp>Where could learning from data\u003cbr>help in your own work?\u003c/p>\u003cp>What would you want to understand\u003cbr>about its output?\u003c/p>\u003c/div>","takeaway":"","notes":"SAY: I would like to hear what brought you here. Share an interest, an experience, or something you hope to be able to do. Take a few seconds to think, then invite a few voices. Listen without evaluating their answers; ask a gentle follow-up about their data or desired output if useful. Connect their examples to the course goal and the four-day route. Participation is welcome, not compulsory.","point":"Leave the invitation visible. Look toward the audience, listen, and briefly acknowledge each contribution.","transition":"Thank you. Let us now build our first working example from biological input to a feature table. Section 2 is the first introduction of the DNA example.","sourceNote":"This is an open audience discussion with no expected correct answer, grading, metric-familiarity test, or hidden diagnostic.","discussion":true,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"id":"day-1-dna-section","anchor":"day-1-dna-section","kind":"section-two","sectionTwo":true,"time":"15 seconds · 25:00–25:15","title":"Sequence Regulatory Patterns","body":"\u003cdiv class=\"s2-title-rule\">\u003c/div>","notes":"This is our first DNA example. We will connect regulatory sequence patterns to a supervised classification task, decide how to represent a sequence, and define what each evaluation partition is for.","point":"The section title.","transition":"First, why might a short DNA pattern matter?","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-motivation","anchor":"day-1-dna-motivation","kind":"section-two","sectionTwo":true,"time":"75 seconds · 25:15–26:30","title":"A protein can recognize a DNA pattern","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Oval transcription factor binding a short DNA region near a gene; regulatory activity depends on context.\">\u003crect x=\"110\" y=\"360\" width=\"1500\" height=\"24\" rx=\"4\" fill=\"#c8d8e2\" stroke=\"none\" stroke-width=\"3\"/>\u003crect x=\"450\" y=\"339\" width=\"350\" height=\"66\" rx=\"8\" fill=\"#FBE9D9\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"625\" y=\"387\" font-size=\"39\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">A C G T A C\u003c/text>\u003cellipse cx=\"625\" cy=\"223\" rx=\"155\" ry=\"86\" fill=\"#eaf3f8\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"625\" y=\"240\" font-size=\"60\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">TF\u003c/text>\u003cpath d=\"M625,312 L625,337\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\"/>\u003cpath d=\"M625,337 L615.5916298792481,321.6545586029289\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\"/>\u003cpath d=\"M625,337 L634.4083701207519,321.6545586029289\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\"/>\u003crect x=\"1170\" y=\"332\" width=\"335\" height=\"80\" rx=\"10\" fill=\"#eaf3f8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1337\" y=\"389\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">gene\u003c/text>\u003cpath d=\"M1290,280 L1530,280\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1530,280 L1514.654558602929,289.40837012075184\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1530,280 L1514.654558602929,270.59162987924816\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1410\" y=\"240\" font-size=\"35\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">transcription\u003c/text>\u003ctext x=\"625\" y=\"485\" font-size=\"39\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">binding site\u003c/text>\u003ctext x=\"864\" y=\"620\" font-size=\"40\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Binding and regulatory activity depend on context.\u003c/text>\u003c/svg>","notes":"A transcription factor, or TF, is a protein; the motif is a sequence pattern, not the protein. A TF can bind a short DNA region and contribute to regulating transcription. The oval is deliberately a schematic protein. Binding also depends on accessibility, cofactors and cellular conditions. A motif match alone establishes neither binding nor promoter activity, and regulatory sites can occur outside promoters.","point":"Oval → short binding site → gene.","transition":"A TF usually tolerates more than one exact sequence.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-binding-preferences","a \" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003crect x=\"225\" y=\"312\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"270\" y=\"361\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"325\" y=\"312\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#F5CBA7\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"370\" y=\"361\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0.75\u003c/text>\u003crect x=\"425\" y=\"312\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"470\" y=\"361\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"525\" y=\"312\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"570\" y=\"361\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003ctext x=\"155\" y=\"458\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003crect x=\"225\" y=\"402\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"270\" y=\"451\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"325\" y=\"402\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"370\" y=\"451\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"425\" y=\"402\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#F5CBA7\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"470\" y=\"451\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0.75\u003c/text>\u003crect x=\"525\" y=\"402\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"570\" y=\"451\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003ctext x=\"155\" y=\"548\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003crect x=\"225\" y=\"492\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"270\" y=\"541\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"325\" y=\"492\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"370\" y=\"541\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0.25\u003c/text>\u003crect x=\"425\" y=\"492\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"470\" y=\"541\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003crect x=\"525\" y=\"492\" width=\"90\" height=\"72\" rx=\"6\" fill=\"#F5CBA7\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"570\" y=\"541\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">0.75\u003c/text>\u003cpath d=\"M720,360 L880,360\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M880,360 L864.6545586029289,369.40837012075184\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M880,360 L864.6545586029289,350.59162987924816\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"1260\" y=\"130\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">Compare with background\u003c/text>\u003ctext x=\"1260\" y=\"242\" font-size=\"47\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">PWM: log-odds weights\u003c/text>\u003crect x=\"945\" y=\"310\" width=\"170\" height=\"125\" rx=\"10\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"1030\" y=\"397\" font-size=\"75\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"700\">−\u003c/text>\u003crect x=\"1175\" y=\"310\" width=\"170\" height=\"125\" rx=\"10\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"1260\" y=\"397\" font-size=\"75\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"700\">0\u003c/text>\u003crect x=\"1405\" y=\"310\" width=\"170\" height=\"125\" rx=\"10\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"1490\" y=\"397\" font-size=\"75\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">+\u003c/text>\u003ctext x=\"1260\" y=\"515\" font-size=\"36\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">less / same / more preferred\u003c/text>\u003ctext x=\"864\" y=\"658\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Probabilities describe bases. Weights score against a background.\u003c/text>\u003c/svg>","notes":"Counting bases in each aligned column gives a position frequency matrix; dividing by the column total gives the probabilities shown on the left. Those raw probabilities are not log-odds weights. A scoring PWM compares a smoothed probability with a background frequency: positive means more favored than background, negative less. Raw zeros can occur in this four-site illustration because it is tiny; smoothing avoids taking a logarithm of zero. Our course generator instead uses a specified 15-position probability matrix with no zero entries and samples sites from it. We store probabilities for generation, not these log-odds scores.","point":"One probability column sums to one; then point across to the signed weights, keeping the two meanings distinct.","transition":"We can use such a probability model to create a controlled classification task.","sourceNote":"Toy four-site probability matrix, not the course matrix. Notes/source distinguish frequency counts, probabilities and smoothed log-odds PWM scoring; no measured binding affinities are implied.","local":0},{"d dth=\"4\"/>\u003cpath d=\"M1145,530 L1135.591629879248,514.6545586029289\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1145,530 L1154.408370120752,514.6545586029289\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"1145\" y=\"610\" font-size=\"43\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">class probability → class\u003c/text>\u003ctext x=\"475\" y=\"650\" font-size=\"36\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Simulated DNA · one sequence = one example\u003c/text>\u003c/svg>","notes":"Our supervised task is binary classification of an entire sequence, not a separate prediction at every base or chromosome scanning. Training examples pair a sequence with its assigned class, and a fitted model will infer a probability for another sequence. In the primary course dataset the classes are simulation labels, not experimental TF binding, promoter annotations or measured regulatory activity. These abbreviated cards are schematic, not generator records. Course sequences have 160 bases.","point":"One sequence card and its given label, then the new-sequence arrow.","transition":"Here is how we generate a statistical relationship between sequence and label.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-signal","anchor":"day-1-dna-signal","kind":"section-two","sectionTwo":true,"time":"105 seconds · 30:15–32:00","title":"Plant variable sites, not one fixed word","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Fifteen probability columns produce newly sampled sites, planted at uniformly random valid starts with chance .95 in class 1 and .05 in class 0.\">\u003ctext x=\"280\" y=\"100\" font-size=\"47\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">15 positions\u003c/text>\u003crect x=\"80\" y=\"152\" width=\"27\" height=\"33\" rx=\"2\" fill=\"#e "middle\" font-weight=\"400\">plant with chance 0.95\u003c/text>\u003ctext x=\"275\" y=\"680\" font-size=\"47\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">class 0\u003c/text>\u003ctext x=\"580\" y=\"680\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">plant with chance 0.05\u003c/text>\u003ctext x=\"1360\" y=\"595\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">random valid\u003c/text>\u003ctext x=\"1360\" y=\"680\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">location\u003c/text>\u003ctext x=\"52\" y=\"179\" font-size=\"22\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"52\" y=\"216\" font-size=\"22\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"52\" y=\"253\" font-size=\"22\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"52\" y=\"290\" font-size=\"22\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003c/svg>","notes":"The instructor has changed the primary simulation: assign balanced class labels and generate backgrounds, then decide whether to plant a site with probability 0.95 for class 1 and 0.05 for class 0. For each planting, independently sample one nucleotide from each of 15 position distributions to obtain a fresh site and insert it at a uniformly random valid start. All four probabilities at each position are strictly positive, sum to one and have a maximum at least 0.5. The zoomed column is position 5 of the current canonical matrix: A/C/G/T = 0.50/0.40/0.05/0.05. The left heatmap shows all 15 columns; color intensity encodes probability, while the base order is A/C/G/T from top to bottom. Labels are not the planting flag: a class-1 sequence can have no insertion and class 0 can receive one. There is no one fixed secret word defining the signal, and incidental matches are possible. No biological conclusion follows from this simulation.","point":"The four alternatives in one column, then 0.95 versus 0.05 and the random insertion location.","transition":"Now we have sequences and labels. How could we present the sequences to a model?","sourceNote":"New authoritative instructor decision, 2026-11-03: 15-position positive probability distributions, independent per-position sampling, class-conditional planting .95/.05. Read-only inspection of current SimulationConfig confirms the plotted 15-position matrix and position-5 probabilities .50/.40/.05/.05. See story source notes for the observed source hash; no classifier was fitted.","local":0},{"day":1,"id":"day-1-dna-numeric-features","anchor":"day-1-dna-numeric-features","kind":"section-two","sectionTwo":true,"time":"90 seconds · 32:00–33:30","title":"How could we represent a sequence?","body":"\u003cdiv class=\"s2-discussion\">\u003cp>How could we present a sequence\u003cbr>to a model?\u003c/p>\u003cp>What information would we preserve?\u003c/p>\u003c/div>","notes":"Invite different representations and listen for what each retains. There is no expected correct answer: a student might preserve every position, emphasize local words, summarize composition, or suggest another approach. Ask them to describe the information they would keep. If useful, point to an imagined word near the start versus near the end, without teaching one-hot encoding or CNNs yet. We will try one representation whose input is easy to inspect.","point":"Both prompts; gesture along an imagined sequence as students explain their choices.","transition":"Let us try counting local words as a deliberately simple starting point.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-worked-sequence","anchor":"day-1-dna-worked-sequence","kind":"section-two","sectionTwo":true,"time":"30 seconds · 33:30–34:00","title":"Keep one example in
