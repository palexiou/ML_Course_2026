<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Day 1 · Machine learning for bioinformatics</title><style>/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

:root{--ink:#14213d;--muted:#536476;--line:#dbe3ea;--soft:#f7f9fb;--accent:#0072B2;--teal:#D55E00;--slide-bg:#fff;--stage-bg:#e8eef3;--radius:18px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{transition:none!important;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:Inter,sans-serif;color:var(--ink)}
.slide{padding:64px 90px 112px;background:linear-gradient(135deg,#fff 65%,#f5f9fc);border-top:10px solid var(--accent)}
.slide-top{display:flex;justify-content:space-between;align-items:center;height:42px;margin-bottom:28px;color:var(--accent);font-size:21px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.slide-top .timing{font-size:19px;letter-spacing:.5px;color:var(--muted)}
h1{font-size:70px;line-height:1.09;letter-spacing:-2.4px;max-width:1650px;margin:0 0 22px;font-weight:760}.subtitle{font-size:30px;line-height:1.4;color:var(--muted);margin:0 0 28px;max-width:1630px}.content{height:650px;display:flex;flex-direction:column;gap:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{padding:28px 32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);min-width:0}.panel.blue{background:#edf5fb;border-color:#bfd3e3}.panel.teal{background:#FFF4E8;border-color:#EDC6A0}.panel.warning{background:#fff6e9;border-color:#e9cc9d}
h2{font-size:34px;letter-spacing:-.6px;line-height:1.2;margin:0 0 18px;color:var(--accent)}p,li{font-size:29px;line-height:1.43;margin:0 0 17px}ul,ol{margin:0;padding-left:35px}li:last-child,p:last-child{margin-bottom:0}strong{font-weight:750}.small{font-size:24px;color:var(--muted);line-height:1.4}.eyebrow{font-size:23px;color:var(--teal);font-weight:750;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.equation{padding:28px 32px;font-size:42px;line-height:1.4;border-left:6px solid var(--teal);background:#FFF4E8;border-radius:0 15px 15px 0}.equation small{display:block;font-size:26px;margin-top:10px;color:var(--muted)}
code,pre,.dna{font-family:Consolas,monospace}code{font-size:.9em;color:#0072B2;background:#edf3f7;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}pre{font-size:27px;line-height:1.5;background:#142c43;color:#fff;border-radius:16px;padding:28px 32px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}pre code{background:none;color:inherit;padding:0;font-size:inherit}table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.4}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}th{color:var(--accent);background:#edf3f7;font-weight:750}td strong{color:var(--teal)}
.takeaway{position:absolute;left:90px;right:90px;bottom:42px;border-top:2px solid var(--line);padding-top:16px;display:grid;grid-template-columns:145px 1fr;gap:20px;font-size:25px;line-height:1.35}.takeaway strong{color:var(--accent)}.flow{display:flex;align-items:stretch;gap:18px}.flow .node{flex:1;padding:28px 22px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:16px;text-align:center;font-size:29px;line-height:1.4;min-width:0}.flow .arrow{align-self:center;color:var(--teal);font-size:40px}.node b{display:block;color:var(--accent);margin-bottom:12px}.node span{font-size:24px;color:var(--muted)}
.break h1{font-size:126px;max-width:1350px}.break .subtitle{font-size:42px}.break .content{justify-content:center;height:600px}.break{background:linear-gradient(110deg,#edf5fb,#fff 75%)}.dna{display:flex;align-items:center;gap:12px;font-size:28px;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.motif{padding:9px 14px;background:#FBE9D9;color:#9C4300;border-radius:8px;font-weight:750}.motif.second{background:#D9EDF8;color:#1d4e73}.position{font:22px Inter,sans-serif;color:var(--muted)}
.notes{display:none;position:absolute;inset:40px;z-index:10;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:55px;overflow:auto}.notes.show{display:block}.notes h2{font-size:46px}.notes p{font-size:32px;line-height:1.55}.notes .note-heading{font-size:24px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:750;margin-top:30px}
.deck-controls{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#fff;border:1px solid #c5d3df;border-radius:14px;box-shadow:0 6px 22px #14213d1c;max-width:calc(100vw - 12px);bottom:8px;white-space:nowrap}button,select{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:36px;padding:6px 10px}button:hover,select:hover{background:#edf3f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #D55E00;outline-offset:2px}button[aria-pressed=true]{background:#FBE9D9}#counter{font-size:12px;min-width:46px;text-align:center;color:var(--muted)}#daySelect{width:88px}
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:70px;z-index:1002}.edit-toggle{position:fixed;left:12px;top:12px;z-index:1003;opacity:0;pointer-events:none;border:1px solid var(--line);transition:opacity .2s}.edit-toggle.show,.edit-toggle.active,.edit-toggle:focus{opacity:1;pointer-events:auto}.editing [data-edit]{outline:2px dashed #D55E00;outline-offset:3px;cursor:text}.save-status{position:fixed;top:12px;right:12px;background:#fff;padding:8px 15px;border-radius:8px;color:#0072B2;font-size:13px;z-index:1001}.save-status:empty{display:none}.progress{position:fixed;bottom:0;left:0;width:100%;height:4px;background:#dbe3ea;z-index:1001}.progress div{height:100%;background:var(--accent);transition:width .15s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:#175c8e;text-decoration-thickness:2px;text-underline-offset:5px}.toolbar-extra{display:none}body.controls-expanded .toolbar-extra{display:inline-block}
@media(max-width:600px){.deck-controls{gap:1px;padding:4px}button,select{padding:4px 6px;min-height:34px;font-size:12px}#daySelect{width:69px}#counter{min-width:36px;font-size:10px}}
@media print{.slide{background:#fff}.notes,.edit-hotzone,.edit-toggle,.save-status,.progress,.sr-only{display:none!important}@page{size:20in 11.25in;margin:0}}
.node span{display:block;margin-top:10px}.takeaway{bottom:90px}.slide[data-day="4"]:last-child .content{gap:18px}.slide[data-day="4"]:last-child .content .panel{padding:22px 28px}.deck-controls{flex-wrap:wrap;width:max-content;justify-content:center}

/* Story scenes: one question or visual, with teaching depth in Notes. */
.slide{display:flex;flex-direction:column;padding:58px 90px 54px}
.slide-top{flex-shrink:0;margin-bottom:30px}
h1{font-size:82px;line-height:1.06;letter-spacing:-2.8px;margin-bottom:18px}
.subtitle{font-size:29px;line-height:1.35;margin-bottom:22px;flex-shrink:0}
.content{height:auto;min-height:0;flex:1;justify-content:center;gap:30px}
.takeaway{position:static;flex-shrink:0;margin-top:28px;font-size:25px;padding-top:18px}
.story-question{font-size:58px;line-height:1.2;letter-spacing:-1.5px;font-weight:650;color:var(--teal);max-width:1600px;margin:0}
.story-statement{font-size:74px;line-height:1.2;letter-spacing:-2px;font-weight:680;color:var(--accent)}
.story-caption{font-size:28px;color:var(--muted);margin:0;line-height:1.45}
.story-task{border-left:6px solid var(--teal);padding:18px 30px;background:#FFF4E8;border-radius:0 14px 14px 0}
.story-task p{font-size:33px;margin-bottom:15px;max-width:1480px}.story-task a,.story-links{font-size:27px}
.content .panel{padding:30px 34px}.content .panel p{font-size:34px;line-height:1.4}.content .panel h2{font-size:31px}
.content .flow .node{padding:34px 24px;font-size:32px}.content .node b{font-size:34px}
.content pre{font-size:36px;line-height:1.5}.content .equation{font-size:48px;padding:24px 30px}
.sequence-pair{display:flex;flex-direction:column;gap:26px}.sequence-pair>div{display:grid;grid-template-columns:220px 1fr 1fr;gap:40px;align-items:center;padding:15px 0;font-size:36px}
.sequence-pair .motif{text-align:center;font:600 50px Consolas,monospace;padding:26px 20px}.sequence-pair .sequence-axis{font-size:26px;color:var(--muted);text-align:center;padding:0}
.score-chart{width:100%;max-height:510px;overflow:visible;flex-shrink:1;min-height:0}.chart-label{font:500 29px Inter,sans-serif;fill:#14213d}.chart-value{font:600 25px Inter,sans-serif;fill:#14213d}.chart-axis{font:400 24px Inter,sans-serif;fill:#536476}
.chart-legend{display:flex;gap:34px;font-size:27px;color:var(--muted)}.chart-legend span{display:flex;align-items:center;gap:12px}.chart-legend i{width:25px;height:16px;border-radius:3px}
.break .content{height:auto}.break h1{font-size:110px}.break .subtitle{font-size:36px}.break .story-statement{font-size:64px}
.notes h2{font-size:38px}.notes p{font-size:29px}.notes details{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.notes summary{font-size:28px;color:var(--accent);font-weight:650;cursor:pointer}.reference{margin-top:24px}.reference p,.reference li{font-size:27px}.reference .flow{margin:22px 0}.reference .panel{margin-bottom:22px}.reference h3{font-size:30px}.reference .equation{font-size:34px}.reference pre{font-size:25px}.reference .dna{white-space:normal;flex-wrap:wrap}
.slide[data-day="4"]:last-child .content{gap:30px}.slide[data-day="4"]:last-child .content .panel{padding:30px 34px}
@media print{*,*::before,*::after{transition:none!important;animation:none!important}.slide{display:flex!important}.notes{display:none!important}}
/* Day 1: short teaching steps with a single main visual per slide. */
.day-one h1{font-size:76px;line-height:1.08}.day-one .content{gap:26px}.day-one .subtitle{font-size:29px}
.day-one .d1-big{font-size:66px;line-height:1.25;font-weight:680;letter-spacing:-1.6px;color:var(--accent)}
.day-one .d1-caption{font-size:28px;color:var(--muted);line-height:1.4;margin:8px 0 0}
.d1-question{font-size:56px;line-height:1.25;font-weight:650;color:var(--teal);margin:0}
.d1-cards{display:flex;gap:28px}.d1-card{flex:1;min-width:0;padding:34px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:18px}.d1-card:nth-child(even){background:#FFF4E8;border-color:#EDC6A0}.d1-card h2{font-size:33px}.d1-card p{font-size:34px;line-height:1.4}
.d1-steps{display:flex;flex-direction:column;gap:24px}.d1-steps>div{display:flex;gap:26px;align-items:center}.d1-steps span{display:grid;place-items:center;flex:0 0 60px;height:60px;border-radius:50%;background:#FBE9D9;color:#9C4300;font-size:30px;font-weight:700}.d1-steps p{font-size:37px;line-height:1.35;margin:0}
.d1-practical{padding:34px 40px;border-left:7px solid var(--teal);background:#FFF4E8;border-radius:0 18px 18px 0}.d1-practical>b{font-size:27px;text-transform:uppercase;letter-spacing:1px;color:var(--teal)}.d1-practical p{font-size:39px;line-height:1.4;margin:20px 0}.d1-practical a{font-size:29px}
.d1-visual{width:100%;height:440px;flex-shrink:1;min-height:0}.v-title{font:600 29px Inter,sans-serif;fill:#14213d}.v-caption{font:400 25px Inter,sans-serif;fill:#536476}
.d1-split{display:flex;gap:15px}.d1-split>div{padding:38px 15px;background:#0072B2;color:white;text-align:center;font-size:35px;border-radius:16px}.d1-split>div:nth-child(2){background:#D55E00}.d1-split>div:nth-child(3){background:#596877}.d1-split strong{display:block;font-size:65px;margin-top:20px}
.d1-contributions{display:flex;gap:24px}.d1-contributions>div{flex:1;background:#f4f7f9;border:1px solid #dbe3ea;border-radius:16px;padding:25px;text-align:center}.d1-contributions b{display:block;font:600 34px Consolas,monospace}.d1-contributions span{display:block;font-size:30px;margin:20px 0}.d1-contributions strong{font-size:54px;color:var(--teal)}.d1-contributions>div:nth-child(n+3) strong{color:#7B4FA3}
.d1-matrix{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:1050px;max-width:100%;align-self:center}.matrix-cell{display:grid;grid-template-columns:1fr auto;gap:7px;padding:18px 30px;background:#edf5fb;border:2px solid #bfd3e3;border-radius:16px}.matrix-cell span{font-size:25px;grid-column:1 / -1}.matrix-cell strong{font-size:53px;line-height:1.15}.matrix-cell b{font-size:30px;align-self:center}.matrix-cell.focus{background:#FBE9D9;border-color:#E69F00}.matrix-cell.muted{opacity:.38}
.d1-demo{padding:12px 20px;background:#f7f9fb;border:1px solid var(--line);border-radius:18px}.d1-demo svg{display:block;width:100%}.d1-demo [data-sigmoid-plot] svg{height:350px}.d1-demo [data-threshold-plot] svg{height:270px}.d1-demo [data-tree-plot] svg{height:365px}
.d1-control{display:flex;align-items:center;gap:25px;font-size:29px;padding:15px 30px}.d1-control input{flex:1;min-width:0;accent-color:var(--teal);height:30px}.d1-control output{min-width:85px;font-weight:700}.d1-demo-readout{font-size:35px;font-weight:650;text-align:center;color:var(--teal);padding:10px}
.threshold-counts{text-align:center;font-size:28px;padding:5px 0 18px}.threshold-metrics{display:flex;gap:24px;justify-content:center;font-size:28px;padding-bottom:15px}.threshold-metrics b{color:var(--teal)}
[data-toy-curve] svg{width:100%;height:440px}.tree-controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px;font-size:27px}.tree-controls label{display:flex;align-items:center;gap:12px}.tree-controls input{width:75px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}.tree-controls button{font-size:25px;min-height:52px;padding:10px 18px;border:1px solid #EDC6A0;background:#e6f0f5}.tree-controls button:disabled{opacity:.5;cursor:default}.tree-answer{text-align:center;font-size:30px!important;color:var(--teal);margin:10px 0!important;min-height:44px}
.d1-bars{display:flex;flex-direction:column;gap:35px}.d1-bars>div{display:flex;align-items:center;gap:28px;font-size:33px}.d1-bars b{flex:0 0 390px;font-weight:550}.d1-bars>div>span{height:52px;background:#e8eef3;border-radius:9px;flex:1}.d1-bars i{display:block;height:100%;background:#0072B2;border-radius:9px}.d1-bars>div:nth-child(2) i{background:#D55E00}.d1-bars strong{flex:0 0 120px;color:var(--accent)}.d1-bars p{display:flex;justify-content:space-between;margin:0 148px 0 418px;font-size:25px;color:var(--muted)}
.d1-families{display:grid;grid-template-columns:1fr 1fr;gap:45px}.d1-families>div,.d1-family-groups>div{padding:35px;background:#f4f7f9;border:1px solid #dbe3ea;border-radius:18px}.d1-family-groups{display:flex;gap:25px}.d1-family-groups>div{flex:1}.family-chip{display:inline-block;padding:22px 25px;border-radius:12px;margin:12px 9px;font-size:42px;font-weight:650}.family-A{background:#D9EDF8;color:#0072B2}.family-B{background:#FBE9D9;color:#D55E00}.family-C{background:#f6e6ca;color:#7B4FA3}
.day-one.break .takeaway{display:none}.day-one.break .content{justify-content:center}.day-one.break .d1-big{font-size:90px}.day-one.break h1{font-size:120px}
.notes .speaker-cues{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.notes .speaker-cues dt{font-size:23px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--teal);margin:20px 0 8px}.notes .speaker-cues dd{font-size:29px;line-height:1.5;margin:0}.notes .day1-guide-link{font-size:25px}
#slideSelect{width:205px;max-width:34vw}
@media(max-width:600px){#slideSelect{width:140px}}
@media print{.d1-demo{break-inside:avoid}.d1-control input{display:none}.tree-controls button{display:none}}

","notes":"SAY: Our goal is to understand what an ML analysis is doing, use it for a biological question, and explain its output and limits. By the end, a prediction should be something you can reason about, rather than simply accept because software produced it. We will connect concepts to working analyses.","point":"Read the three verbs slowly as one goal. Leave the biological-data line in view.","transition":"Here is how we build toward that goal over four days.","sourceNote":"","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":3,"id":"day-1-intro-day-1","sectionOne":true,"time":"30 seconds","title":"Day 1: classical ML","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Four-day route. Day 1 highlighted: Classical ML. Explain a prediction.\">\u003ca href=\"../Day_1/presentation.html\" aria-label=\"Open Day 1\">\u003ctext x=\"80\" y=\"110\" font-size=\"36\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Day 1\u003c/text>\u003ctext x=\"80\" y=\"175\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Classical ML\u003c/text>\u003cpath d=\"M80 215 L420 215\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"7\"/>\u003c/a>\u003ca href=\"../Day_2/presentation.html\" aria-label=\"Open Day 2\">\u003ctext x=\"505\" y=\"110\" font-size=\"36\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Day 2\u003c/text>\u003ctext x=\"505\" y=\"175\" font-size=\"43\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Neural networks\u003c/text>\u003cpath d=\"M505 215 L845 215\" fill=\"none\" stroke=\"#6b757d\" stroke-width=\"2\"/>\u003c/a>\u003ca href=\"../Day_3/presentation.html\" aria-label=\"Open Day 3\">\u003ctext x=\"930\" y=\"110\" font-size=\"36\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Day 3\u003c/text>\u003ctext x=\"930\" y=\"175\" font-size=\"43\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Pretrained models\u003c/tex  models. An embedding is a numerical representation that can become the input to a new analysis. Pretraining and evaluation conditions still matter.","point":"Point to Day 3, then trace its central visual. The other days stay gray and legible. Day labels link to their independent decks.","transition":"Move the highlight to the next day.","sourceNote":"Links are relative to this file and require the neighboring Day_N folders. Keep an exported HTML beside this presentation. A standalone copy retains the slide content and font, but the other-day decks must travel with it for navigation.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":6,"id":"day-1-intro-day-4","sectionOne":true,"time":"30 seconds","title":"Day 4: coding agents","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Four-day route. Day 4 highlighted: Coding agents. Specify and audit an analysis.\">\u003ca href=\"../Day_1/presentation.html\" aria-label=\"Open Day 1\">\u003ctext x=\"80\" y=\"110\" font-size=\"36\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Day 1\u003c/text>\u003ctext x=\"80\" y=\"175\" font-size=\"43\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Classical ML\u003c/text>\u003cpath d=\"M80 215 L420 215\" fill=\"none\" stroke=\"#6b757d\" stroke-width=\"2\"/>\u003c/a>\u003ca href=\"../Day_2/presentation.html\" aria-label=\"Open Day 2\">\u003ctext x=\"505\" y=\"110\" font-size=\"36\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Day 2\u003c/text>\u003ctext x=\"505\" y=\"175\" font-size=\"43\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Neural networks\u003c/text>\u003cpath d=\"M505 215 L845 215\" fill=\"none\" stroke=\"#6b757d\" stroke-width=\"2\"/>\u003c/a>\u003ca href=\"../Day_3/presentation.html\" aria-label=\"Open Day 3\">\u003ctext x=\"930\" y=\"110\" font-size=\"36\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Day 3\u003c/text>\u003ctext x=\"930\" y=\"175\" font-size=\"43\" fill=\"#6b757d\" text-anchor=\"start\" font-weight=\"600\">Pretrained models\u003c/text>\u003cpath d=\"M930 215 L1270 215\" fill=\"none\" stroke=\"#6b757d\" stroke-width=\"2\"/>\u003c/a>\u003ca href=\"../Day_4/presentation.html\" aria-label=\"Open Day 4\">\u003ctext x=\"1355\" y=\"110\" font-size=\"36\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Day 4\u003c/text>\u003ctext x=\"1355\" y=\"175\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Coding agents\u003c/text>\u003cpath d=\"M1355 215 L1695 215\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"7\"/>\u003c/a>\u003crect x=\"80\" y=\"360\" width=\"390\" height=\"140\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"275.0\" y=\"444.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Your specification\u003c/text>\u003cpath d=\"M495 430 L625 430\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M610 420 L625 430 L610 440\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"655\" y=\"360\" width=\"380\" height=\"140\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"845.0\" y=\"444.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Agent + tools\u003c/text>\u003cpath d=\"M1060 430 L1190 430\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1175 420 L1190 430 L1175 440\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1220\" y=\"360\" width=\"420\" height=\"140\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1430.0\" y=\"444.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Your scientific audit\u003c/text>\u003ctext x=\"864\" y=\"710\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"600\">Specify and audit an analysis\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: On Day 4 we use coding agents to help build analyses from clear specifications, then audit the resulting work. Tool use and code execution do not themselves mean an agent is learning new model weights.","point":"Point to Day 4, then trace its central visual. The other days stay gray and legible. Day labels link to their independent decks.","transition":"Before the algorithms, what do we mean by machine learning?","sourceNote":"Links are relative to this file and require the neighboring Day_N folders. Keep an exported HTML beside this presentation. A standalone copy retains the slide content and font, but the other-day decks must travel with it for navigation.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":7,"id":"day-1-intro-what-is-ml","sectionOne":true,"time":"60 seconds","title":"What is machine learning?","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Machine learning learns useful patterns from data and applies a learned model to new input.\">\u003ctext x=\"120\" y=\"175\" font-size=\"66\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Learn useful patterns from data\u003c/text>\u003crect x=\"70\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"265.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Examples\u003c/text>\u003cpath d=\"M485 295 L645 295\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M630 285 L645 295 L630 305\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"670\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"865.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Learned model\u003c/text>\u003cpath d=\"M1085 295 L1245 295\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1230 285 L1245 295 L1230 305\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1270\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1465.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">New input → output\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Machine learning builds models that learn useful patterns from data. Those patterns can support predictions, representations, or generation. We choose the task, data and learning procedure; training estimates useful behavior from examples rather than specifying every input-to-output rule by hand. Not every ML setup receives external target labels.","point":"Start with the sentence. Trace examples into a learned model, then distinguish the new-input step on the right.","transition":"Let us separate the moment of learning from the moment of using a model.","sourceNote":"Definition synthesis: Dive into Deep Learning, Introduction, https://d2l.ai/chapter_introduction/index.html. The scope includes representation learning and generation, not only labeled prediction.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":8,"id":"day-1-intro-fit","sectionOne":true,"time":"60 seconds","title":"Fitting learns from examples","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"During fitting, examples and a training signal guide adjustments to the model.\">\u003crect x=\"110\" y=\"250\" width=\"470\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"345.0\" y=\"339.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Training examples\u003c/text>\u003cpath d=\"M610 325 L780 325\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M765 315 L780 325 L765 335\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"810\" y=\"250\" width=\"350\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"985.0\" y=\"339.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Fit\u003c/text>\u003cpath d=\"M1190 325 L1315 325\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1300 315 L1315 325 L1300 335\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1345\" y=\"250\" width=\"300\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1495.0\" y=\"339.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Model\u003c/text>\u003ctext x=\"984\" y=\"610\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Adjust what the model has learned\u003c/text>\u003cpath d=\"M1120 425 C1120 580 830 580 830 425\" stroke=\"#0072B2\" stroke-width=\"4\" fill=\"none\"/>\u003ctext x=\"984\" y=\"685\" font-size=\"36\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">The training signal guides the adjustment\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Fitting, or training, changes the model using examples and a learning signal. In a supervised task this includes supplied targets and prediction error. Other learning settings obtain signals differently. The resulting fitted model is something we can reuse; we do not refit from scratch for every new input.","point":"Trace examples → fit → model. Follow the curved adjustment loop. Emphasize that the loop belongs to training.","transition":"Now hold the learned model fixed and use it.","sourceNote":"","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":9,"id":"day-1-intro-apply","sectionOne":true,"time":"60 seconds","title":"Using applies a learned model","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A new input passes through a fixed learned model to produce a prediction, representation or generated output.\">\u003crect x=\"70\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"265.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">New input\u003c/text>\u003cpath d=\"M485 295 L645 295\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M630 285 L645 295 L630 305\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"670\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"865.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Fixed model\u003c/text>\u003cpath d=\"M1085 295 L1245 295\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1230 285 L1245 295 L1230 305\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1270\" y=\"220\" width=\"390\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1465.0\" y=\"309.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Output\u003c/text>\u003ctext x=\"864\" y=\"640\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Prediction · representation · generation\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: When using a fitted model, a new input passes through what has already been learned. A classifier might return a category; an encoder a representation; a generative model might produce text or an image. The model can be wrong, and new data can differ from training data. Input to an application is not automatically another training update.","point":"Trace the new input through the fixed model. Point at the three possible output roles. No adjustment loop appears here.","transition":"We can make this concrete with one simple cell example.","sourceNote":"","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":10,"id":"day-1-intro-cell-examples","sectionOne":true,"time":"90 seconds","title":"Learn from labeled cells","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Two expression markers for cells, with externally supplied resting or activated state labels.\">\u003cpath d=\"M175.0 95.0 L175.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M175.0 500.0 L815.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"495.0\" y=\"558.0\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Marker 1 expression\u003c/text>\u003ctext transform=\"translate(122.0 297.5) rotate(-90)\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\">Marker 2 expression\u003c/text>\u003ccircle cx=\"239.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"303.0\" cy=\"459.5\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"303.0\" cy=\"378.5\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"367.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"431.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"495.0\" cy=\"297.5\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"559.0\" cy=\"338.0\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"623.0\" cy=\"257.0\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"687.0\" cy=\"297.5\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"623.0\" cy=\"176.0\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"1120\" cy=\"190\" r=\"15\" fill=\"#0072B2\"/>\u003ctext x=\"1160\" y=\"202\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">Resting\u003c/text>\u003ccircle cx=\"1120\" cy=\"270\" r=\"15\" fill=\"#D55E00\"/>\u003ctext x=\"1160\" y=\"282\" font-size=\"42\" fill=\"#D55E00\" text-anchor=\"start\" font-weight=\"400\">Activated\u003c/text>\u003ctext x=\"1100\" y=\"435\" font-size=\"36\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Inputs: two expression values\u003c/text>\u003ctext x=\"1100\" y=\"505\" font-size=\"36\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Target: measured cell state\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Imagine cells described by two expression measurements. Each dot is a cell; its position is the input. Separate measurements have supplied resting or activated state labels, shown by color. The supervised learning problem is to learn a relationship between those input measurements and those labels. A label is a chosen target, not a universal truth about everything a cell does. These are constructed coordinates for teaching, not measured findings.","point":"Point to one dot, its two axis coordinates, then its color. Contrast the measurements used as inputs with the separate state target. Keep this same picture stable over the next slide.","transition":"After fitting on these examples, what happens for a cell without a supplied state label?","sourceNote":"All points, marker values and labels in Section 1 are invented for illustration. Axes have arbitrary units. No claim about real marker performance or observed cell populations is made.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":11,"id":"day-1-intro-new-cell","sectionOne":true,"time":"90 seconds","title":"Apply it to a new cell","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"The same training cells and a learned boundary. A new cell is predicted activated; its observed state is not supplied.\">\u003cpath d=\"M175.0 95.0 L175.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M175.0 500.0 L815.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"495.0\" y=\"558.0\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Marker 1 expression\u003c/text>\u003ctext transform=\"translate(122.0 297.5) rotate(-90)\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\">Marker 2 expression\u003c/text>\u003ccircle cx=\"239.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"303.0\" cy=\"459.5\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"303.0\" cy=\"378.5\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"367.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"431.0\" cy=\"419.0\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"495.0\" cy=\"297.5\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"559.0\" cy=\"338.0\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"623.0\" cy=\"257.0\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"687.0\" cy=\"297.5\" r=\"15\" fill=\"#D55E00\"/>\u003ccircle cx=\"623.0\" cy=\"176.0\" r=\"15\" fill=\"#D55E00\"/>\u003cpath d=\"M175.0 176.0 L687.0 500.0\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" stroke-dasharray=\"10 9\"/>\u003ccircle cx=\"559.0\" cy=\"265.1\" r=\"24\" fill=\"white\" stroke=\"#18344b\" stroke-width=\"6\"/>\u003ctext x=\"601.0\" y=\"275.1\" font-size=\"32\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">new cell\u003c/text>\u003ctext x=\"1100\" y=\"180\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">Learn a separating pattern\u003c/text>\u003ctext x=\"1100\" y=\"300\" font-size=\"36\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">New expression measurements\u003c/text>\u003cpath d=\"M1110 350 L1450 350\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1435 340 L1450 350 L1435 360\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"1100\" y=\"435\" font-size=\"42\" fill=\"#D55E00\" text-anchor=\"start\" font-weight=\"600\">Predicted state: activated\u003c/text>\u003ctext x=\"1100\" y=\"530\" font-size=\"36\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">Observed state: not supplied\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: A fitted classifier has learned a separating pattern from these examples. Freeze it. The outlined cell brings new input measurements and receives a predicted activated state. That prediction is not its observed label. A useful model should capture a pattern that also works beyond its fitting examples; simply remembering the training dots would not establish that. The drawn boundary was chosen for clarity, not fitted by running an algorithm, and its apparent separation is not performance evidence.","point":"Trace the dashed boundary, point to the outlined cell, then read predicted versus observed state. Return to the training points to distinguish the data used to learn from the new input used here.","transition":"Where do training signals come from when we do not have labels like these?","sourceNote":"The same constructed dots are reused. The dashed separator and new point are teaching constructions; no model accuracy, validation result or biological inference is asserted.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":12,"id":"day-1-intro-signals","sectionOne":true,"time":"60 seconds","title":"Where does the training signal come from?","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Four training-signal lenses: external targets, unlabeled structure, input-derived targets, and actions with rewards.\">\u003ctext x=\"110\" y=\"135\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Supervised\u003c/text>\u003cpath d=\"M650 120 L810 120\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M795 110 L810 120 L795 130\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"865\" y=\"135\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Externally supplied targets\u003c/text>\u003ctext x=\"110\" y=\"280\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Unsupervised\u003c/text>\u003cpath d=\"M650 265 L810 265\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M795 255 L810 265 L795 275\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"865\" y=\"280\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Structure without task labels\u003c/text>\u003ctext x=\"110\" y=\"425\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Self-supervised\u003c/text>\u003cpath d=\"M650 410 L810 410\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M795 400 L810 410 L795 420\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"865\" y=\"425\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Targets formed from the input\u003c/text>\u003ctext x=\"110\" y=\"570\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">Reinforcement\u003c/text>\u003cpath d=\"M650 555 L810 555\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M795 545 L810 555 L795 565\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ctext x=\"865\" y=\"570\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Actions and rewards\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: These names describe the source and organization of the learning signal. Supervised learning uses externally supplied targets. Unsupervised learning seeks structure without supplied task labels. Self-supervised learning builds targets from the data itself and is often grouped broadly under unsupervised learning. Reinforcement learning learns from interaction and reward. This is a useful map, not four disjoint boxes into which every system must fit.","point":"Read each row from left to right. Link supervised back to the cell-state colors. Do not draw a mutually exclusive hierarchy.","transition":"First look at two common tasks when external targets are supplied.","sourceNote":"Dive into Deep Learning, Introduction, supervised/unsupervised/reinforcement sections: https://d2l.ai/chapter_introduction/index.html. Self-supervision is commonly treated broadly as unsupervised; see https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html. Semi-supervised learning combines labeled and unlabeled examples; omit another branch on screen at this beginner stage.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":13,"id":"day-1-intro-classification","sectionOne":true,"time":"60 seconds","title":"Classification predicts a category","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Classification maps cell expression to a category using supplied category targets during training.\">\u003crect x=\"90\" y=\"255\" width=\"480\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"330.0\" y=\"344.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Cell expression\u003c/text>\u003cpath d=\"M600 330 L760 330\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M745 320 L760 330 L745 340\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"790\" y=\"255\" width=\"360\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"970.0\" y=\"344.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Classifier\u003c/text>\u003cpath d=\"M1180 330 L1310 330\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cpath d=\"M1295 320 L1310 330 L1295 340\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003crect x=\"1340\" y=\"255\" width=\"290\" height=\"150\" rx=\"8\" fill=\"#e6f1f7\"/>\u003ctext x=\"1485.0\" y=\"344.52\" font-size=\"44\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\">Activated\u003c/text>\u003ctext x=\"864\" y=\"525\" font-size=\"46\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Training targets: resting / activated\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Classification is a supervised task when the supplied targets are categories. In our constructed example, the target is resting or activated. A classifier estimates which category applies to a new cell. Some classifiers return probabilities before a category is chosen; we will examine that later. The task is defined by the output we want, not by the name of the algorithm.","point":"Point to the training-target line first, then trace the new input to its predicted category.","transition":"Change the target from a category to a quantity.","sourceNote":"Classification and regression are supervised tasks, not additional learning paradigms alongside supervised learning. External targets need not be annotated manually by a person.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":14,"id":"day-1-intro-regression","sectionOne":true,"time":"60 seconds","title":"Regression predicts a quantity","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Constructed regression example: expression input predicts a numeric concentration target.\">\u003cpath d=\"M250 510 L250 95\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M250 510 L1250 510\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M300 465 L1190 150\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003ccircle cx=\"340\" cy=\"430\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"450\" cy=\"440\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"560\" cy=\"350\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"680\" cy=\"365\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"790\" cy=\"270\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"930\" cy=\"245\" r=\"15\" fill=\"#0072B2\"/>\u003ccircle cx=\"1080\" cy=\"190\" r=\"15\" fill=\"#0072B2\"/>\u003ctext x=\"760\" y=\"590\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Input: expression measurement\u003c/text>\u003ctext transform=\"translate(155 310) rotate(-90)\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\">Target: measured concentration\u003c/text>\u003ctext x=\"1360\" y=\"320\" font-size=\"39\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Predicted\u003c/text>\u003ctext x=\"1360\" y=\"385\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"600\">quantity\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Regression is the supervised task of predicting a numeric quantity. Suppose a separately measured concentration is the target and an expression measurement is an input. The fitted relationship predicts a concentration for a new input. Both classification and regression can use the same kind of input data; what changes is the target and the question. The dots and line here are invented, with no units or measured claim.","point":"Name both axes. Trace a new horizontal input position up to the line, then across to the numeric target axis.","transition":"Now set aside external targets and look for structure in the inputs.","sourceNote":"Constructed scatter and trend; this is an explanatory drawing, not a fitted biological relationship.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":15,"id":"day-1-intro-unsupervised","sectionOne":true,"time":"60 seconds","title":"Look for structure without task labels","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Expression inputs shown without state labels: seek useful structure in the data.\">\u003cpath d=\"M175.0 95.0 L175.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M175.0 500.0 L815.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"495.0\" y=\"558.0\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Marker 1 expression\u003c/text>\u003ctext transform=\"translate(122.0 297.5) rotate(-90)\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\">Marker 2 expression\u003c/text>\u003ccircle cx=\"239.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"303.0\" cy=\"459.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"303.0\" cy=\"378.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"367.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"431.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"495.0\" cy=\"297.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"559.0\" cy=\"338.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"623.0\" cy=\"257.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"687.0\" cy=\"297.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"623.0\" cy=\"176.0\" r=\"15\" fill=\"#6b757d\"/>\u003ctext x=\"1090\" y=\"205\" font-size=\"46\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">Same expression inputs\u003c/text>\u003ctext x=\"1090\" y=\"350\" font-size=\"37\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">No supplied cell-state targets\u003c/text>\u003ctext x=\"1090\" y=\"495\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">What structure is useful?\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: In unsupervised learning we do not supply the task labels used in our classifier example. The model can look for similarity, variation, or a compact representation. Unlabeled does not mean devoid of information, nor does it mean the result is automatically meaningful. Our choice of measurements and method still shapes what structure can appear.","point":"Point to the same coordinates with all label colors removed. The inputs have not changed; the supplied state targets have.","transition":"One common task is to find groups of similar examples.","sourceNote":"Unsupervised is a training-setting description; clustering and dimensionality reduction are example tasks. The point cloud remains constructed.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":16,"id":"day-1-intro-clustering","sectionOne":true,"time":"60 seconds","title":"Clustering proposes groups","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A clustering illustration surrounds similar expression profiles with two groups; no class labels are supplied.\">\u003cpath d=\"M175.0 95.0 L175.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003cpath d=\"M175.0 500.0 L815.0 500.0\" fill=\"none\" stroke=\"#e0e5e8\" stroke-width=\"3\"/>\u003ctext x=\"495.0\" y=\"558.0\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Marker 1 expression\u003c/text>\u003ctext transform=\"translate(122.0 297.5) rotate(-90)\" font-size=\"30\" fill=\"#5e6c76\" text-anchor=\"middle\">Marker 2 expression\u003c/text>\u003ccircle cx=\"239.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"303.0\" cy=\"459.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"303.0\" cy=\"378.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"367.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"431.0\" cy=\"419.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"495.0\" cy=\"297.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"559.0\" cy=\"338.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"623.0\" cy=\"257.0\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"687.0\" cy=\"297.5\" r=\"15\" fill=\"#6b757d\"/>\u003ccircle cx=\"623.0\" cy=\"176.0\" r=\"15\" fill=\"#6b757d\"/>\u003cellipse cx=\"335.0\" cy=\"419.0\" rx=\"160\" ry=\"105\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\"/>\u003cellipse cx=\"603.8\" cy=\"261.04999999999995\" rx=\"170\" ry=\"125\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\"/>\u003ctext x=\"1100\" y=\"215\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">Group by similarity\u003c/text>\u003ctext x=\"1100\" y=\"375\" font-size=\"41\" fill=\"#18344b\" text-anchor=\"start\" font-weight=\"400\">Groups need interpretation\u003c/text>\u003ctext x=\"1100\" y=\"495\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"start\" font-weight=\"400\">They are not supplied classes\u003c/text>\u003c/svg>","takeaway":"","notes":"SAY: Clustering groups examples according to their similarity in a chosen representation. These outlines illustrate one possible grouping of our inputs; they were drawn, not produced by an algorithm. A cluster is not automatically a cell type, and it is not the same thing as a supervised class. Measurements, scale, distance and clustering choices can change the result. Biological interpretation follows the grouping.","point":"Point at the outlines rather than the point colors. Compare an algorithm-proposed group with the separately measured target labels we supplied earlier.","transition":"We can also learn a simpler representation without assigning groups.","sourceNote":"The outlines are manually drawn examples, not evidence of two real populations. Clustering is an unsupervised task, not a sibling of supervised and unsupervised learning.","discussion":false,"kind":"section-one","source":"section-1-2026-11-03"},{"day":1,"local":17,"id":"day-1-intro-representation","sectionOne":true,"time":"60 seconds","title":"Learn a useful representation","subtitle":"","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Many input measurements become a compact numerical representation that preserves selected useful structure.\">\u003crect x=\"150\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.15\"/>\u003crect x=\"187\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.65\"/>\u003crect x=\"224\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.35\"/>\u003crect x=\"261\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.85\"/>\u003crect x=\"298\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.55\"/>\u003crect x=\"335\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.25\"/>\u003crect x=\"372\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.75\"/>\u003crect x=\"409\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.44999999999999996\"/>\u003crect x=\"446\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.15\"/>\u003crect x=\"483\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.65\"/>\u003crect x=\"520\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.35\"/>\u003crect x=\"557\" y=\"150\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.85\"/>\u003crect x=\"150\" y=\"199\" width=\"28\" height=\"34\" fill=\"#0072B2\" opacity=\"0.4499999
