1060\" cy=\"172\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1060\" cy=\"214\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1060\" cy=\"256\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1060\" cy=\"298\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1060\" cy=\"340\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1060\" cy=\"382\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1060\" cy=\"424\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1060\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1060\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1205\" cy=\"172\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1205\" cy=\"214\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1205\" cy=\"256\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"298\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"340\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"382\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"424\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1205\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1350\" cy=\"172\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"214\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"256\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"298\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"340\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"382\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"424\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1350\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"1495\" cy=\"172\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"214\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"256\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"298\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"340\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"382\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"424\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"1495\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ctext x=\"850\" y=\"640\" font-size=\"50\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Higher P(B) ← ranking → lower P(B)\u003c/text>\u003c/svg>","transition":"One B/A pair, then the entire list. Sweep the cutoff through this fixed ordering to draw a curve.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":12,"title":"Trace the ROC curve","id":"day-1-metrics-roc","time":"103:00–105:15 (2:15)","visible":"One ROC plot, built progressively from the threshold sweep. Label vertical axis True-positive rate (recall) and horizontal axis False-positive rate. Start with no positive calls at (0,0), mark threshold 0.5 at `(0.20, 0.60)`, and finish with all calls positive at (1,1). Show the small axis definition `FPR = FP / (FP + TN)` beside the horizontal axis.","notes":"Recall asks what fraction of B we recover; false-positive rate asks what fraction of actual A we incorrectly call B. At threshold 0.5 these are 30/50 and 10/50. Each threshold gives a point; moving it produces the ROC curve. Toward the upper left means recovering more B with fewer false alarms among A. The diagonal is a chance-ranking reference, not a guarantee that every finite random run lies on it. Tied scores move as a group.","point":"Both denominators, then the selected point. Summarize the curve's ranking information with its area.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"curve\" data-curve=\"roc\" data-area=\"0\">\u003cdiv data-live-plot>\u003c/div>\u003clabel>Cutoff \u003cinput type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\" aria-label=\"Curve decision threshold\">\u003c/label>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"Both denominators, then the selected point. Summarize the curve's ranking information with its area.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":13,"title":"Summarize ranking with ROC-AUC","id":"day-1-metrics-auc","time":"105:15–106:45 (1:30)","visible":"The same ROC curve with the area underneath shaded and `ROC-AUC = 0.784`. Briefly reveal a randomly selected B/A pair from the persistent score list.","notes":"Area under the ROC curve summarizes ranking across cutoffs. Equivalently, it measures how often a randomly selected B receives a higher score than a randomly selected A, with half credit for ties. This constructed list gives 0.784; that is not 78.4% accuracy or a result from our fitted DNA model. Perfect separation gives 1 and chance ranking has expected area 0.5. AUC does not choose a useful operating threshold or tell us the cost of errors. ROC-AUC is the course's primary validation comparison metric, chosen before fitting.","point":"The area and the B/A pair. Return to the question of how useful the selected candidate list is.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"curve\" data-curve=\"roc\" data-area=\"1\">\u003cdiv data-live-plot>\u003c/div>\u003clabel>Cutoff \u003cinput type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\" aria-label=\"Curve decision threshold\">\u003c/label>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"The area and the B/A pair. Return to the question of how useful the selected candidate list is.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":14,"title":"Keep the positive-call view","id":"day-1-metrics-pr","time":"106:45–108:15 (1:30)","visible":"A precision–recall curve from the same predictions: horizontal Recall, vertical Precision, with the 0.5 point at `(0.60, 0.75)`. A single compact readout names Average precision (AP). A gray prevalence reference is at 0.50 for this balanced teaching batch.","notes":"This view keeps our earlier questions on the axes: how many B did we find, and how many B calls were right? It is especially useful when positives are scarce. Average precision summarizes precision as recall increases, weighting each precision by the recall gained at that score cutoff. We will recognize AP as a supporting number in our reports; no derivation is needed now. It depends on the class mix, so always keep the population in mind. AP is not simply interchangeable with a trapezoidal area under this plot, and neither AP nor ROC-AUC is accuracy at 0.5.","point":"The familiar precision/recall point. Keep this as a brief orientation; use the notebook time for the core confusion counts and threshold change. If pacing is tight, explain the axes and defer AP detail to report reading in Section 5.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"curve\" data-curve=\"pr\" data-area=\"0\">\u003cdiv data-live-plot>\u003c/div>\u003clabel>Cutoff \u003cinput type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\" aria-label=\"Curve decision threshold\">\u003c/label>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"The familiar precision/recall point. Keep this as a brief orientation; use the notebook time for the core confusion counts and threshold change. If pacing is tight, explain the axes and defer AP detail to report reading in Section 5.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":15,"title":"Inspect our validation predictions","id":"day-1-metrics-notebook","time":"108:15–113:15 (5:00)","visible":"A single practical sequence: Predictions → Confusion counts → Precision / Recall → Change cutoff. Link the [Day 1 notebook on GitHub](https://github.com/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb) and [Open in Colab](https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb). Keep executable detail in the notebook and instructor notes.","notes":"We now apply the same calculations to the actual validation rows from Section 3. Reuse its fitted logistic regression and training-derived count mapping. Produce probabilities for the full validation table once, keep them attached to their observed labels, and calculate the confusion counts at 0.5. Read precision and recall from those counts, then compare them with the library calculation. Change only the cutoff to 0.8 or 0.3 and observe the new counts. The model has not learned anything new. These are exploratory validation decisions; we do not choose an official new threshold or touch test results.","point":"Suggested five-minute path: 0:30 identify the validation rows and cached probabilities; 1:00 display the 0.5 matrix; 1:00 calculate and interpret precision/recall; 1:30 change a cutoff and compare counts; 1:00 confirm unchanged scores/ROC-AUC and describe one observed consequence. Working cells and small edits support follow-along. Instructor walkthrough is the equivalent fallback. Setup must already be complete from Section 3; if not, use prepared views within this allocation rather than adding startup time. This checkpoint is implemented as the focused Section 4 cells before the paired workflow.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-practical\">\u003cp>Read TP, FP, FN and TN\u003c/p>\u003cp>Calculate precision / recall → change the cutoff\u003c/p>\u003ca href=\"https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb\">Open Day 1 in Colab ↗\u003c/a>\u003c/div>","transition":"Suggested five-minute path: 0:30 identify the validation rows and cached probabilities; 1:00 display the 0.5 matrix; 1:00 calculate and interpret precision/recall; 1:30 change a cutoff and compare counts; 1:00 confirm unchanged scores/ROC-AUC and describe one observed consequence. Working cells and small edits support follow-along. Instructor walkthrough is the equivalent fallback. Setup must already be complete from Section 3; if not, use prepared views within this allocation rather than adding startup time. This checkpoint is implemented as the focused Section 4 cells before the paired workflow.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":16,"title":"What would make this useful in your work?","id":"day-1-metrics-discussion","time":"113:15–115:00 (1:45)","visible":"One open prompt: “If you could follow up only a few predictions, what would matter to you?” A small candidate-list visual anchors the discussion.","notes":"Invite a couple of practical priorities rather than testing recall of formulas. A useful answer may involve missed candidates, follow-up cost, workload or the population we expect to encounter. There is no single correct metric without the intended use. We can now judge predictions; after the break we will try a model that asks a sequence of questions instead of adding weighted counts. It may make different mistakes, and we will compare it using the same validation framework.","point":"Listen and connect the contributions to precision, recall or a decision consequence. Take the full **115–125** break. Do not promise that a forest will improve the score.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-prompt\">\u003cp>If you could follow up only a few predictions,\u003cbr>what would matter to you?\u003c/p>\u003c/div>","transition":"Listen and connect the contributions to precision, recall or a decision consequence. Take the full **115–125** break. Do not promise that a forest will improve the score.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"day":1,"id":"day-1-break-2","kind":"section-two section-teaching","sectionTeaching":true,"sectionNumber":5,"time":"115–125","title":"Break","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Ten-minute break\">\u003ctitle>Ten-minute break\u003c/title>\u003ctext x=\"864\" y=\"340\" font-size=\"120\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">10 minutes\u003c/text>\u003c/svg>","notes":"Take the full 115–125 break. Return for Section 5.","point":"The break duration.","transition":"Resume with Section 5.","sourceNote":"Break time is separate from teaching allocations."},{"sectionNumber":5,"number":1,"title":"From one question to a forest","id":"day-1-trees-section","time":"125:00–125:15 (0:15)","visible":"Only the section title.","notes":"We keep the DNA representation and the evaluation framework. We change how the model turns those counts into a prediction.","point":"The title. Bring back the familiar count row.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"s2-title-rule\">\u003c/div>","transition":"The title. Bring back the familiar count row.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":2,"title":"Same counts, different model","id":"day-1-trees-counts","time":"125:15–126:00 (0:45)","visible":"The established selected counts `TATA = 2`, `AATG = 1`, `CGCG = 3` feed a tree-shaped model box and a P(B) output. Replace the weighted-sum box in place.","notes":"Logistic regression adds count × weight contributions and converts the score into a probability. A decision tree uses feature questions to send the same input down a path. The numerical representation has not gained any information; the prediction rule is different. The displayed counts are the same constructed sequence example, still without an assigned observed label.","point":"The unchanged input. Open the tree box to reveal its first question.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Same counts, different model\">\u003ctitle>Same counts, different model\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Counts 2, 1, 3\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Tree\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B)\u003c/text>\u003c/svg>","transition":"The unchanged input. Open the tree box to reveal its first question.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":3,"title":"Ask the first question","id":"day-1-trees-root","time":"126:00–127:30 (1:30)","visible":"One root node asks `TATA ≥ 2?`, with clearly labeled Yes and No branches. Show count 2 entering and highlight the Yes branch. Leave the remaining tree concealed.","notes":"The first rule looks at one feature, not all counts at once. Two satisfies this question, so our example follows Yes. Another example with count one would go the other way. This is applying an already fitted rule; the question does not learn or change because a new sequence arrives.","point":"Count, comparison and chosen edge. Follow the next question on that branch.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Ask the first question\">\u003ctitle>Ask the first question\u003c/title>\u003cpath d=\"M864 145 L440 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M864 145 L1200 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"570\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003ctext x=\"1110\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003crect x=\"600\" y=\"45\" width=\"528\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"107.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">TATA ≥ 2?\u003c/text>\u003ctext x=\"440\" y=\"345\" font-size=\"70\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">…\u003c/text>\u003ctext x=\"1200\" y=\"345\" font-size=\"70\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">…\u003c/text>\u003c/svg>","transition":"Count, comparison and chosen edge. Follow the next question on that branch.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":4,"title":"The next question depends on the path","id":"day-1-trees-branch","time":"127:30–128:45 (1:15)","visible":"Grow the Yes branch into `CGCG \u003c 2?`. The input has CGCG = 3, so highlight No. The earlier No branch from the root already ends at a leaf.","notes":"Which question we ask next depends on the earlier answer. Our example has three CGCG counts and follows No. Trees combine conditions along paths; a feature can matter in one part of the input space and not another. AATG is available but this small tree never uses it. We have reached a leaf.","point":"Trace the two conditions in order. Reveal the training examples that supplied the leaf estimate.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"The next question depends on the path\">\u003ctitle>The next question depends on the path\u003c/title>\u003cpath d=\"M864 145 L440 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M864 145 L1200 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"570\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003ctext x=\"1110\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003crect x=\"600\" y=\"45\" width=\"528\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"107.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">TATA ≥ 2?\u003c/text>\u003crect x=\"180\" y=\"310\" width=\"480\" height=\"110\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"420.0\" y=\"360.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.20\u003c/text>\u003ctext x=\"420.0\" y=\"417.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1 B / 4 A\u003c/text>\u003crect x=\"960\" y=\"270\" width=\"500\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1210.0\" y=\"332.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">CGCG &lt; 2?\u003c/text>\u003cpath d=\"M1210 370 L1000 510\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1210 370 L1490 510\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1020\" y=\"425\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003ctext x=\"1420\" y=\"425\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003crect x=\"780\" y=\"510\" width=\"420\" height=\"120\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"990.0\" y=\"565.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.80\u003c/text>\u003ctext x=\"990.0\" y=\"622.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">4 B / 1 A\u003c/text>\u003crect x=\"1270\" y=\"510\" width=\"420\" height=\"120\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1480.0\" y=\"565.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.25\u003c/text>\u003ctext x=\"1480.0\" y=\"622.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1 B / 3 A\u003c/text>\u003c/svg>","transition":"Trace the two conditions in order. Reveal the training examples that supplied the leaf estimate.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":5,"title":"A leaf gives a probability","id":"day-1-trees-leaf","time":"128:45–130:15 (1:30)","visible":"The reached leaf contains four training markers: one B and three A. Reveal `P(B) = 1 / 4 = 0.25`, then a class-A call at the fixed 0.5 threshold.","notes":"In an ordinary unweighted classification tree, the training class proportions in the reached leaf supply its probabilities. One of these four training examples is B, giving 0.25. The new sequence's unknown label was not used. That fraction is a model estimate, not proof that its probabilities are calibrated or that four examples establish a biological frequency. This constructed tree and the earlier constructed logistic model disagree on this sequence; without its observed label we cannot declare either correct.","point":"The one B out of four, then the decision. Try a nearby count row without changing the tree.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A leaf gives a probability\">\u003ctitle>A leaf gives a probability\u003c/title>\u003ctext x=\"320.25\" y=\"240\" font-size=\"100\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A\u003c/text>\u003ctext x=\"682.75\" y=\"240\" font-size=\"100\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A\u003c/text>\u003ctext x=\"1045.25\" y=\"240\" font-size=\"100\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B\u003c/text>\u003ctext x=\"1407.75\" y=\"240\" font-size=\"100\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A\u003c/text>\u003ctext x=\"864\" y=\"440\" font-size=\"86\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 1 / 4 = 0.25\u003c/text>\u003ctext x=\"864\" y=\"590\" font-size=\"42\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Training class proportions in this leaf\u003c/text>\u003c/svg>","transition":"The one B out of four, then the decision. Try a nearby count row without changing the tree.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":6,"title":"Explore another path","id":"day-1-trees-paths","time":"130:15–131:30 (1:15)","visible":"The complete small tree and controls for TATA and CGCG counts. Keep the original 2/3 values as Reset. The other leaves show P(B) = 0.20 and 0.80. One active path and one probability readout update together.","notes":"Keep TATA at two and change CGCG from three to one: the path now reaches the 0.80 leaf. Then set TATA to one: the first question sends us to 0.20. The changed rows are hypothetical inputs, not new observations for the original sequence. Predictions can jump at split boundaries. These are feature thresholds inside a model; the final probability cutoff of 0.5 remains a separate decision rule.","point":"Invite a suggested count change, follow the path and reset. The tree is fixed during this interaction. Now ask how training chose its questions.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live tree-live\" data-live=\"tree\">\u003cdiv data-live-plot>\u003c/div>\u003cdiv class=\"live-buttons\">\u003clabel>TATA \u003cinput data-tree-a type=\"number\" min=\"0\" max=\"20\" value=\"2\">\u003c/label>\u003clabel>CGCG \u003cinput data-tree-b type=\"number\" min=\"0\" max=\"20\" value=\"3\">\u003c/label>\u003cbutton data-reset>Reset\u003c/button>\u003c/div>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"Invite a suggested count change, follow the path and reset. The tree is fixed during this interaction. Now ask how training chose its questions.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":7,"title":"Separate classes with a question","id":"day-1-trees-fitting","time":"131:30–133:30 (2:00)","visible":"The constructed training examples appear as blue A / orange B markers on a count-space plot: horizontal TATA count, vertical CGCG count. Reveal a vertical boundary at TATA = 1.5, corresponding to `TATA ≥ 2?`, and shade the two resulting regions lightly. Label their class counts: 1 B / 4 A and 5 B / 4 A. The plot is the focal visual; retain labels and marker shapes as well as color.","notes":"The points are labeled training examples; their coordinates are two of the counts. We want a question that separates the classes into less mixed groups. This vertical boundary asks about TATA alone: the lower-count side is mostly A, while the other side contains a larger fraction of B. Neither side has to be perfectly pure. During fitting, the tree tries feature thresholds and measures their class separation; a person need not write every question. A question on CGCG would instead make a horizontal boundary. The labels guide these choices, so this is supervised learning, not clustering. This uses training class, not insertion truth, validation labels or test results. The learned model consists of the selected questions, branches and leaf proportions.","point":"Point to a class marker, the boundary and the different class mixtures on its two sides. Connect the plot's regions to the tree's two branches. Compare alternative questions using the same parent examples.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Separate classes with a question\">\u003ctitle>Separate classes with a question\u003c/title>\u003cpath d=\"M350 560 L1450 560\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M350 560 L350 70\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"450\" y=\"610\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003ctext x=\"300\" y=\"540\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">0\u003c/text>\u003ctext x=\"660\" y=\"610\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1\u003c/text>\u003ctext x=\"300\" y=\"435\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1\u003c/text>\u003ctext x=\"870\" y=\"610\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">2\u003c/text>\u003ctext x=\"300\" y=\"330\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">2\u003c/text>\u003ctext x=\"1080\" y=\"610\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">3\u003c/text>\u003ctext x=\"300\" y=\"225\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">3\u003c/text>\u003ctext x=\"1290\" y=\"610\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">4\u003c/text>\u003ctext x=\"300\" y=\"120\" font-size=\"34\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">4\u003c/text>\u003crect x=\"435\" y=\"515\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003crect x=\"435\" y=\"410\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003crect x=\"645\" y=\"305\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003crect x=\"645\" y=\"200\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003ccircle cx=\"660\" cy=\"110\" r=\"17\" fill=\"#D55E00\"/>\u003ccircle cx=\"870\" cy=\"530\" r=\"17\" fill=\"#D55E00\"/>\u003ccircle cx=\"870\" cy=\"425\" r=\"17\" fill=\"#D55E00\"/>\u003ccircle cx=\"1080\" cy=\"530\" r=\"17\" fill=\"#D55E00\"/>\u003ccircle cx=\"1080\" cy=\"425\" r=\"17\" fill=\"#D55E00\"/>\u003crect x=\"1275\" y=\"410\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003ccircle cx=\"870\" cy=\"320\" r=\"17\" fill=\"#D55E00\"/>\u003crect x=\"855\" y=\"200\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003crect x=\"1065\" y=\"200\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003crect x=\"1275\" y=\"95\" width=\"30\" height=\"30\" fill=\"#0072B2\"/>\u003cpath d=\"M765 80 L765 560\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" stroke-dasharray=\"12 8\"/>\u003ctext x=\"900\" y=\"685\" font-size=\"38\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">TATA count\u003c/text>\u003ctext x=\"180\" y=\"315\" font-size=\"36\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">CGCG\u003c/text>\u003ctext x=\"550\" y=\"45\" font-size=\"36\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">1 B / 4 A\u003c/text>\u003ctext x=\"1140\" y=\"45\" font-size=\"36\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">5 B / 4 A\u003c/text>\u003c/svg>","transition":"Point to a class marker, the boundary and the different class mixtures on its two sides. Connect the plot's regions to the tree's two branches. Compare alternative questions using the same parent examples.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":8,"title":"Choose a split that separates classes","id":"day-1-trees-split-quality","time":"133:30–135:30 (2:00)","visible":"Reveal two candidate partitions sequentially in the same space, using the same class markers. `AATG ≥ 1?` leaves both children with 3 B / 4 A. `TATA ≥ 2?` produces 1 B / 4 A and 5 B / 4 A. Make the changing class mixtures visually clear before optionally revealing a compact weighted-Gini readout, 0.490 versus 0.432. Gini arithmetic stays in notes; the visible teaching priority is class separation.","notes":"The first question leaves the same class proportions on both sides, so it gives us no useful class separation. The second makes one side predominantly A and the other richer in B. We prefer this improvement among these two candidate questions, then repeat within the branches to separate further where useful. Gini impurity quantifies how mixed the labels are; less mixed means lower impurity. Weighting by child size prevents treating a tiny pure child as the whole story. We do not need to memorize the formula. Real fitting searches many candidates greedily at each node. This comparison illustrates the criterion; it does not establish that our drawn root is the best among every possible split or globally optimal tree. Noisy or overlapping observations need not admit perfect separation, and forcing tiny pure leaves can overfit.","point":"Same parent, then the two alternative partitions. Choose the better of these two candidates and repeat inside each child.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Choose a split that separates classes\">\u003ctitle>Choose a split that separates classes\u003c/title>\u003ctext x=\"501.5\" y=\"160\" font-size=\"62\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">AATG ≥ 1?\u003c/text>\u003ctext x=\"1226.5\" y=\"160\" font-size=\"62\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">TATA ≥ 2?\u003c/text>\u003ctext x=\"501.5\" y=\"345\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">3B/4A · 3B/4A\u003c/text>\u003ctext x=\"1226.5\" y=\"345\" font-size=\"48\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">1B/4A · 5B/4A\u003c/text>\u003ctext x=\"501.5\" y=\"530\" font-size=\"48\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Same mixture\u003c/text>\u003ctext x=\"1226.5\" y=\"530\" font-size=\"48\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Less mixed children\u003c/text>\u003c/svg>","transition":"Same parent, then the two alternative partitions. Choose the better of these two candidates and repeat inside each child.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":9,"title":"Repeat within each branch","id":"day-1-trees-grow","time":"135:30–137:00 (1:30)","visible":"The constructed tree grows from its root to the CGCG split. Training counts follow their branches: root has 6 B / 8 A; root-No has 1 B / 4 A; root-Yes splits into 4 B / 1 A and 1 B / 3 A. Leaf probabilities appear last.","notes":"Training repeats the search using only the rows that reached each node. Different branches can choose different questions and finish at different depths. Prediction later follows one path through the completed tree. We can stop growing when limits are reached, a group is pure or no useful valid split remains. A tree's branch questions are learned during fitting, not manually edited for each validation row.","point":"Trace training groups into leaves, then the original inference path. What happens if we keep making smaller groups?","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Repeat within each branch\">\u003ctitle>Repeat within each branch\u003c/title>\u003cpath d=\"M864 145 L440 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M864 145 L1200 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"570\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003ctext x=\"1110\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003crect x=\"600\" y=\"45\" width=\"528\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"107.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">TATA ≥ 2?\u003c/text>\u003crect x=\"180\" y=\"310\" width=\"480\" height=\"110\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"420.0\" y=\"360.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.20\u003c/text>\u003ctext x=\"420.0\" y=\"417.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1 B / 4 A\u003c/text>\u003crect x=\"960\" y=\"270\" width=\"500\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1210.0\" y=\"332.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">CGCG &lt; 2?\u003c/text>\u003cpath d=\"M1210 370 L1000 510\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1210 370 L1490 510\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1020\" y=\"425\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003ctext x=\"1420\" y=\"425\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003crect x=\"780\" y=\"510\" width=\"420\" height=\"120\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"990.0\" y=\"565.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.80\u003c/text>\u003ctext x=\"990.0\" y=\"622.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">4 B / 1 A\u003c/text>\u003crect x=\"1270\" y=\"510\" width=\"420\" height=\"120\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1480.0\" y=\"565.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.25\u003c/text>\u003ctext x=\"1480.0\" y=\"622.0\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">1 B / 3 A\u003c/text>\u003c/svg>","transition":"Trace training groups into leaves, then the original inference path. What happens if we keep making smaller groups?","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":10,"title":"A tiny leaf can memorize a detail","id":"day-1-trees-overfit","time":"137:00–138:30 (1:30)","visible":"Zoom into a mixed leaf, then split it into tiny, purer groups. End on a one-example leaf showing a confident probability. A held-out marker remains outside the training group.","notes":"More questions can make training predictions look cleaner. But a one-example leaf estimates its class proportion from one record, so it may be very confident about an accidental detail. Overfitting means learning training-specific patterns that do not carry over to new examples. A lower training error alone does not establish a more useful predictor. The tiny-leaf picture is conceptual, not a measured training/validation result from our dataset.","point":"The shrinking number of supporting examples. Show the simplest ways to limit this behavior.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A tiny leaf can memorize a detail\">\u003ctitle>A tiny leaf can memorize a detail\u003c/title>\u003crect x=\"550\" y=\"30\" width=\"620\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"860.0\" y=\"92.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Mixed training group\u003c/text>\u003cpath d=\"M860 130 L525 245\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M860 130 L1185 245\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"525\" cy=\"245\" r=\"25\" fill=\"#0072B2\"/>\u003ccircle cx=\"1185\" cy=\"245\" r=\"25\" fill=\"#0072B2\"/>\u003cpath d=\"M525 270 L360 430\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003crect x=\"235\" y=\"430\" width=\"250\" height=\"130\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"360.0\" y=\"507.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">1 example\u003c/text>\u003ccircle cx=\"360\" cy=\"370\" r=\"18\" fill=\"#0072B2\"/>\u003cpath d=\"M525 270 L690 430\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003crect x=\"565\" y=\"430\" width=\"250\" height=\"130\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"690.0\" y=\"507.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">1 example\u003c/text>\u003ccircle cx=\"690\" cy=\"370\" r=\"18\" fill=\"#0072B2\"/>\u003cpath d=\"M1185 270 L1020 430\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003crect x=\"895\" y=\"430\" width=\"250\" height=\"130\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1020.0\" y=\"507.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">1 example\u003c/text>\u003ccircle cx=\"1020\" cy=\"370\" r=\"18\" fill=\"#D55E00\"/>\u003cpath d=\"M1185 270 L1350 430\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003crect x=\"1225\" y=\"430\" width=\"250\" height=\"130\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1350.0\" y=\"507.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">1 example\u003c/text>\u003ccircle cx=\"1350\" cy=\"370\" r=\"18\" fill=\"#0072B2\"/>\u003ctext x=\"864\" y=\"645\" font-size=\"50\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">A pure leaf can rest on one accidental detail\u003c/text>\u003c/svg>","transition":"The shrinking number of supporting examples. Show the simplest ways to limit this behavior.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":11,"title":"Limit how finely the tree divides","id":"day-1-trees-size","time":"138:30–139:45 (1:15)","visible":"The same growing tree stops at a depth boundary, then a second reveal keeps a proposed split from making too-small leaves. Label the two controls Maximum depth and Minimum leaf size.","notes":"Depth limits how many questions a path can ask; minimum leaf size limits how small the supporting training groups become. These are settings we choose before fitting, rather than parameters learned by the split search. Limits can reduce overfitting, but very restrictive limits can miss useful structure. Validation can inform development choices; the test never supplies that feedback. We are explaining the controls, not starting a parameter sweep or changing the recorded course defaults.","point":"The stopped branch and retained group. A second difficulty is that small training changes can alter the tree itself.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Limit how finely the tree divides\">\u003ctitle>Limit how finely the tree divides\u003c/title>\u003cpath d=\"M864 145 L440 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M864 145 L1200 310\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"570\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">No\u003c/text>\u003ctext x=\"1110\" y=\"205\" font-size=\"30\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Yes\u003c/text>\u003crect x=\"600\" y=\"45\" width=\"528\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"107.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">TATA ≥ 2?\u003c/text>\u003ctext x=\"440\" y=\"345\" font-size=\"70\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">…\u003c/text>\u003ctext x=\"1200\" y=\"345\" font-size=\"70\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">…\u003c/text>\u003cpath d=\"M180 265 L1580 265\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"5\" stroke-dasharray=\"\"/>\u003ctext x=\"864\" y=\"625\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Stop at a depth limit; retain enough rows per leaf\u003c/text>\u003ctext x=\"864\" y=\"240\" font-size=\"42\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Maximum depth\u003c/text>\u003crect x=\"240\" y=\"390\" width=\"500\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"490.0\" y=\"452.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Keep a larger leaf\u003c/text>\u003crect x=\"1010\" y=\"390\" width=\"500\" height=\"100\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1260.0\" y=\"452.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Minimum leaf size\u003c/text>\u003c/svg>","transition":"The stopped branch and retained group. A second difficulty is that small training changes can alter the tree itself.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":12,"title":"Small data changes can change a tree","id":"day-1-trees-instability","time":"139:45–141:00 (1:15)","visible":"A training pool is shown with one changed marker; the resulting schematic tree selects a different early split and sends a highlighted input to a different leaf.","notes":"Some candidate questions can be nearly tied. Changing a few training rows can change an early question and all the branches below it. A deep tree can therefore be unstable. This picture shows a possibility rather than a promised response to every changed row. It motivates combining several different trees instead of depending on just one.","point":"The early split and altered path. Expand from one tree to several.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Small data changes can change a tree\">\u003ctitle>Small data changes can change a tree\u003c/title>\u003crect x=\"220\" y=\"120\" width=\"460\" height=\"100\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"450.0\" y=\"182.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">TATA split\u003c/text>\u003cpath d=\"M450 220 L270 400\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M450 220 L630 400\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"270\" cy=\"400\" r=\"25\" fill=\"#0072B2\"/>\u003ccircle cx=\"630\" cy=\"400\" r=\"25\" fill=\"#0072B2\"/>\u003crect x=\"1030\" y=\"120\" width=\"460\" height=\"100\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1260.0\" y=\"182.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">CGCG split\u003c/text>\u003cpath d=\"M1260 220 L1080 400\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1260 220 L1440 400\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"1080\" cy=\"400\" r=\"25\" fill=\"#D55E00\"/>\u003ccircle cx=\"1440\" cy=\"400\" r=\"25\" fill=\"#D55E00\"/>\u003ctext x=\"864\" y=\"590\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Small training changes can alter early questions\u003c/text>\u003c/svg>","transition":"The early split and altered path. Expand from one tree to several.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":13,"title":"Build a forest","id":"day-1-trees-forest","time":"141:00–141:45 (0:45)","visible":"One training pool feeds three differently shaped trees. Their outputs are present but the combining operation is still concealed.","notes":"A random forest builds many trees and combines their predictions. Repeating exactly the same tree would add little; we need useful differences between them. We create those differences in two ways: resampling training rows and varying the features considered during split selection.","point":"The three different trees. First vary the rows.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Build a forest\">\u003ctitle>Build a forest\u003c/title>\u003crect x=\"560\" y=\"15\" width=\"600\" height=\"95\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"860.0\" y=\"74.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Same training pool\u003c/text>\u003cpath d=\"M860 110 L355 220\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"355\" y=\"205\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Tree 1\u003c/text>\u003cpath d=\"M355 255 L250 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M355 255 L460 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M460 355 L395 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M460 355 L525 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"355\" cy=\"255\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"250\" cy=\"355\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"460\" cy=\"355\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"395\" cy=\"420\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"525\" cy=\"420\" r=\"14\" fill=\"#0072B2\"/>\u003cpath d=\"M355 450 L860 560\" fill=\"none\" stroke=\"#697782\" stroke-width=\"3\" stroke-dasharray=\"\"/>\u003cpath d=\"M860 110 L865 220\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"865\" y=\"205\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Tree 2\u003c/text>\u003cpath d=\"M865 255 L760 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M865 255 L970 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M970 355 L905 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M970 355 L1035 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"865\" cy=\"255\" r=\"14\" fill=\"#D55E00\"/>\u003ccircle cx=\"760\" cy=\"355\" r=\"14\" fill=\"#D55E00\"/>\u003ccircle cx=\"970\" cy=\"355\" r=\"14\" fill=\"#D55E00\"/>\u003ccircle cx=\"905\" cy=\"420\" r=\"14\" fill=\"#D55E00\"/>\u003ccircle cx=\"1035\" cy=\"420\" r=\"14\" fill=\"#D55E00\"/>\u003cpath d=\"M865 450 L860 560\" fill=\"none\" stroke=\"#697782\" stroke-width=\"3\" stroke-dasharray=\"\"/>\u003cpath d=\"M860 110 L1375 220\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1375\" y=\"205\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Tree 3\u003c/text>\u003cpath d=\"M1375 255 L1270 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1375 255 L1480 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1480 355 L1415 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1480 355 L1545 420\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"1375\" cy=\"255\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"1270\" cy=\"355\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"1480\" cy=\"355\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"1415\" cy=\"420\" r=\"14\" fill=\"#0072B2\"/>\u003ccircle cx=\"1545\" cy=\"420\" r=\"14\" fill=\"#0072B2\"/>\u003cpath d=\"M1375 450 L860 560\" fill=\"none\" stroke=\"#697782\" stroke-width=\"3\" stroke-dasharray=\"\"/>\u003crect x=\"590\" y=\"560\" width=\"540\" height=\"110\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"860.0\" y=\"627.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Average probabilities\u003c/text>\u003c/svg>","transition":"The three different trees. First vary the rows.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":14,"title":"Resample training rows with replacement","id":"day-1-trees-bootstrap","time":"141:45–143:30 (1:45)","visible":"A miniature six-row training pool, IDs 1–6, is drawn into a same-sized bag `[1, 1, 3, 4, 4, 6]`; another tree receives `[2, 2, 3, 5, 6, 6]`. Reveal repeated IDs and omitted IDs one bag at a time.","notes":"Bootstrap sampling draws with replacement: after drawing a row, it remains available for the next draw. Each bag has six draws, so some training rows appear repeatedly and others are absent. The labels travel with their rows. These are resampled observations, not newly generated biological sequences or additional independent evidence. In the course forest, each tree draws a bag from the 720 training rows. Validation and test rows stay outside this sampling pool.","point":"A repeated ID and an omitted ID. Explain bootstrapping here as a way to make training bags, without adding a confidence-interval lesson or out-of-bag evaluation detour. Next vary the available questions.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Resample training rows with replacement\">\u003ctitle>Resample training rows with replacement\u003c/title>\u003ctext x=\"864\" y=\"140\" font-size=\"58\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Training pool: 1  2  3  4  5  6\u003c/text>\u003ctext x=\"864\" y=\"330\" font-size=\"70\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Bag 1: 1  1  3  4  4  6\u003c/text>\u003ctext x=\"864\" y=\"510\" font-size=\"70\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Bag 2: 2  2  3  5  6  6\u003c/text>\u003c/svg>","transition":"A repeated ID and an omitted ID. Explain bootstrapping here as a way to make training bags, without adding a confidence-interval lesson or out-of-bag evaluation detour. Next vary the available questions.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":15,"title":"Vary the features considered at each split","id":"day-1-trees-random-features","time":"143:30–144:45 (1:15)","visible":"A grid of k-mer feature names, with one subset highlighted for one node and a different subset highlighted for another node. Each subset feeds a feature/threshold search.","notes":"At each split, a random forest considers a random subset of candidate features and chooses a useful split among them. It is still using labels to select the question; it is not asking an arbitrary random question. The subset can change from node to node, rather than assigning each tree one permanent list of features. This helps trees differ even when some features are repeatedly strong. The course uses the square-root default for the candidate feature count.","point":"The changing subset followed by the fitted question. Now send the same new count row through all trees.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Vary the features considered at each split\">\u003ctitle>Vary the features considered at each split\u003c/title>\u003ctext x=\"180\" y=\"220\" font-size=\"40\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Node 1\u003c/text>\u003ctext x=\"180\" y=\"410\" font-size=\"40\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Node 2\u003c/text>\u003ctext x=\"480\" y=\"220\" font-size=\"58\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">TATA\u003c/text>\u003ctext x=\"480\" y=\"410\" font-size=\"58\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TATA\u003c/text>\u003ctext x=\"780\" y=\"220\" font-size=\"58\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">CGCG\u003c/text>\u003ctext x=\"780\" y=\"410\" font-size=\"58\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">CGCG\u003c/text>\u003ctext x=\"1080\" y=\"220\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">AATG\u003c/text>\u003ctext x=\"1080\" y=\"410\" font-size=\"58\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">AATG\u003c/text>\u003ctext x=\"1380\" y=\"220\" font-size=\"58\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">ACTG\u003c/text>\u003ctext x=\"1380\" y=\"410\" font-size=\"58\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">ACTG\u003c/text>\u003ctext x=\"864\" y=\"600\" font-size=\"46\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">A fresh candidate subset; then select a useful split\u003c/text>\u003c/svg>","transition":"The changing subset followed by the fitted question. Now send the same new count row through all trees.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":16,"title":"Average the tree probabilities","id":"day-1-trees-average","time":"144:45–146:15 (1:30)","visible":"The same count row enters three trees with outputs 0.25, 0.60 and 0.80. They converge on `P(B) = (0.25 + 0.60 + 0.80) / 3 = 0.55`. Reveal class B at threshold 0.5.","notes":"Each tree reaches a leaf and supplies its B probability. The scikit-learn forest averages those probabilities, then we apply the final cutoff. This teaching forest gives 0.55. It is not the fraction of trees whose individual hard decision was B: that would be two-thirds here. The first output reuses our small constructed tree; the other two are additional teaching trees. The actual course forest has 100 trees, not three.","point":"Three leaf outputs, their mean and the separate decision. Explain what averaging can and cannot improve.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Average the tree probabilities\">\u003ctitle>Average the tree probabilities\u003c/title>\u003ctext x=\"380.6666666666667\" y=\"230\" font-size=\"90\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.25\u003c/text>\u003ctext x=\"864.0\" y=\"230\" font-size=\"90\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.60\u003c/text>\u003ctext x=\"1347.3333333333333\" y=\"230\" font-size=\"90\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.80\u003c/text>\u003ctext x=\"864\" y=\"435\" font-size=\"90\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Average P(B) = 0.55\u003c/text>\u003ctext x=\"864\" y=\"595\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Apply the separate 0.5 decision cutoff\u003c/text>\u003c/svg>","transition":"Three leaf outputs, their mean and the separate decision. Explain what averaging can and cannot improve.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":17,"title":"Different trees can balance out","id":"day-1-trees-aggregation","time":"146:15–147:15 (1:00)","visible":"Several tree probability markers and their average on one 0–1 line. Use light individual markers and one clearly labeled mean.","notes":"Combining trees can reduce the variation caused by relying on a single unstable tree, especially when their errors are not identical. The trees share data and features, so they are not independent. Averaging cannot remove a bias they all share, fix leakage or recover sequence positions discarded by the count representation. Nor does it guarantee better validation performance than logistic regression.","point":"The individual outputs and their mean. We need the evaluation framework to see what actually happened.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Different trees can balance out\">\u003ctitle>Different trees can balance out\u003c/title>\u003cpath d=\"M230 355 L1500 355\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ccircle cx=\"547.5\" cy=\"355\" r=\"20\" fill=\"#0072B2\" opacity=\".5\"/>\u003ccircle cx=\"992.0\" cy=\"355\" r=\"20\" fill=\"#0072B2\" opacity=\".5\"/>\u003ccircle cx=\"1246.0\" cy=\"355\" r=\"20\" fill=\"#0072B2\" opacity=\".5\"/>\u003cpath d=\"M928.5 300 L928.5 410\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"9\" stroke-dasharray=\"\"/>\u003ctext x=\"864\" y=\"555\" font-size=\"58\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Averaging can reduce instability\u003c/text>\u003c/svg>","transition":"The individual outputs and their mean. We need the evaluation framework to see what actually happened.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":18,"title":"Compare on the same examples","id":"day-1-trees-fair-comparison","time":"147:15–148:30 (1:15)","visible":"One shared training/validation split and count mapping feed two model boxes: Logistic regression and Random forest. Their outputs join at Same validation rows / Same metrics. A detached gray test box remains closed.","notes":"To compare models, hold the data generation, split identities, fitted count vocabulary and evaluation rules constant. The training rows fit both models; the same 240 validation rows assess them. Compare validation ROC-AUC as planned, AP as supporting, and precision/recall at the common 0.5 cutoff. A model may rank better yet have a different decision tradeoff at that cutoff. We do not choose which score to emphasize after seeing who wins, or open the test to settle a disappointing comparison.","point":"The shared inputs and shared evaluation. Open the existing notebook workflow to inspect the actual comparison.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Compare on the same examples\">\u003ctitle>Compare on the same examples\u003c/title>\u003crect x=\"80\" y=\"265\" width=\"410\" height=\"150\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"285.0\" y=\"352.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Same counts\u003c/text>\u003crect x=\"680\" y=\"100\" width=\"510\" height=\"130\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"935.0\" y=\"177.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Logistic regression\u003c/text>\u003crect x=\"680\" y=\"440\" width=\"510\" height=\"130\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"935.0\" y=\"517.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Random forest\u003c/text>\u003crect x=\"1360\" y=\"265\" width=\"320\" height=\"150\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1520.0\" y=\"352.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Compare\u003c/text>\u003cpath d=\"M490 340 L680 165\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M490 340 L680 505\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1190 165 L1360 340\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M1190 505 L1360 340\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"864\" y=\"680\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Same validation rows · same metrics · cutoff 0.5\u003c/text>\u003c/svg>","transition":"The shared inputs and shared evaluation. Open the existing notebook workflow to inspect the actual comparison.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":19,"title":"Run and read the comparison","id":"day-1-trees-notebook","time":"148:30–153:30 (5:00)","visible":"One practical strip: Run paired workflow → Read validation comparison → Inspect one disagreement. Link the [existing Day 1 notebook on GitHub](https://github.com/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb) and its [Open in Colab](https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb) route.","notes":"This is the later complete stage 01 workflow that we deferred during Sections 3 and 4. It fits both models under the same defaults and writes their validation outputs. Read the actual two-row comparison and name its split and metric. Then inspect one validation sequence where their 0.5 decisions differ, if one exists. A disagreement is a concrete difference in behavior, not proof that a model is better overall. If no hard decisions disagree, inspect a probability difference instead. We leave feature-importance interpretation for Section 6.","point":"Proposed allocation: 1:00 run or open the identified saved paired workflow; 1:00 read ROC-AUC/AP; 1:00 compare precision/recall at 0.5; 1:00 inspect one aligned row; 1:00 discuss one supported conclusion. Running is a guided demonstration or optional follow-along proposal, not a coding-from-scratch exercise. Setup is already complete; use provenance-checked prepared output if execution exceeds the slot. Notebook readback cells are implemented and a paired comparison was executed locally; current evidence is recorded below.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-practical\">\u003cp>Run the paired workflow once\u003c/p>\u003cp>Read the actual comparison → inspect a disagreement\u003c/p>\u003ca href=\"https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb\">Open Day 1 in Colab ↗\u003c/a>\u003c/div>","transition":"Proposed allocation: 1:00 run or open the identified saved paired workflow; 1:00 read ROC-AUC/AP; 1:00 compare precision/recall at 0.5; 1:00 inspect one aligned row; 1:00 discuss one supported conclusion. Running is a guided demonstration or optional follow-along proposal, not a coding-from-scratch exercise. Setup is already complete; use provenance-checked prepared output if execution exceeds the slot. Notebook readback cells are implemented and a paired comparison was executed locally; current evidence is recorded below.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":5,"number":20,"title":"What changed, and what did not?","id":"day-1-trees-handoff","time":"153:30–155:00 (1:30)","visible":"One connected workflow, DNA → Counts → Model → Probability → Evaluation. Highlight only the Model box, then reveal the next prompt: “Which sequence clues are the models using?”","notes":"We changed the prediction rule from a weighted sum to branching questions and then a forest. We retained the representation and fair evaluation. Both models can make a prediction, and we now have a vocabulary for comparing their behavior. Next we will inspect why a particular sequence received its prediction and which k-mers the models rely on. A score alone does not explain that.","point":"The changed model box, then the count features. Continue straight into Section 6 at minute 155; no extra break or homework is added.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"What changed, and what did not?\">\u003ctitle>What changed, and what did not?\u003c/title>\u003ctext x=\"420\" y=\"140\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Validation ROC-AUC\u003c/text>\u003ctext x=\"1230\" y=\"140\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Validation AP\u003c/text>\u003ctext x=\"310\" y=\"300\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Logistic\u003c/text>\u003ctext x=\"680\" y=\"300\" font-size=\"82\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.608\u003c/text>\u003ctext x=\"1230\" y=\"300\" font-size=\"82\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.607\u003c/text>\u003ctext x=\"310\" y=\"490\" font-size=\"43\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Forest\u003c/text>\u003ctext x=\"680\" y=\"490\" font-size=\"82\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.612\u003c/text>\u003ctext x=\"1230\" y=\"490\" font-size=\"82\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.597\u003c/text>\u003ctext x=\"864\" y=\"650\" font-size=\"46\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Which sequence clues are the models using?\u003c/text>\u003c/svg>","transition":"The changed model box, then the count features. Continue straight into Section 6 at minute 155; no extra break or homework is added.","sourceNote":"Section 5 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. Empirical values: generated Day 1 notebook, local seed-2026 primary PPM run, 2026-11-03; 240 validation rows, threshold 0.5; instructor/verification/day1-current.json. No tuning followed."},{"sectionNumber":6,"number":1,"title":"Explain the prediction","id":"day-1-explain-section","time":"155:00–155:15 (0:15)","visible":"Only the section title.","notes":"We can compare models. Now ask which sequence clues drive their predictions, and what those clues mean.","point":"Move from performance to explanation.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"s2-title-rule\">\u003c/div>","transition":"Move from performance to explanation.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":2,"title":"One prediction or the whole model?","id":"day-1-explain-local-global","time":"155:15–156:45 (1:30)","visible":"One selected sequence beside a population of sequences; reveal Local and Global in turn.","notes":"A local explanation describes this prediction. A global summary describes the fitted model across features or examples. A coefficient and a forest importance answer different questions; neither alone is an explanation of every individual sequence.","point":"Point to the single sequence, then the population.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"One prediction or the whole model?\">\u003ctitle>One prediction or the whole model?\u003c/title>\u003crect x=\"200\" y=\"220\" width=\"580\" height=\"180\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"490.0\" y=\"322.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">One prediction\u003c/text>\u003crect x=\"950\" y=\"220\" width=\"580\" height=\"180\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1240.0\" y=\"322.0\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">The fitted model\u003c/text>\u003ctext x=\"501.5\" y=\"540\" font-size=\"49\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Local contributions\u003c/text>\u003ctext x=\"1226.5\" y=\"540\" font-size=\"49\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Global summaries\u003c/text>\u003c/svg>","transition":"Point to the single sequence, then the population.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":3,"title":"Count times weight explains a contribution","id":"day-1-explain-contributions","time":"156:45–158:15 (1:30)","visible":"The familiar counts and signed contributions: TATA +1.2, AATG +0.8, CGCG −0.6.","notes":"For this constructed logistic example, each count times its coefficient contributes to the score. Zero count gives zero contribution even when a coefficient is large. These are contributions in score/log-odds units, not independent percentage changes in probability.","point":"Trace each count through its multiplication.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Count times weight explains a contribution\">\u003ctitle>Count times weight explains a contribution\u003c/title>\u003cpath d=\"M950 85 L950 331\" fill=\"none\" stroke=\"#697782\" stroke-width=\"2\" stroke-dasharray=\"\"/>\u003ctext x=\"320\" y=\"133\" font-size=\"40\" fill=\"#18344b\" text-anchor=\"end\" font-weight=\"400\">TATA\u003c/text>\u003crect x=\"950\" y=\"105\" width=\"500.0\" height=\"40\" rx=\"5\" fill=\"#D55E00\"/>\u003ctext x=\"1468.0\" y=\"134\" font-size=\"34\" fill=\"#D55E00\" text-anchor=\"start\" font-weight=\"400\">1.20\u003c/text>\u003ctext x=\"320\" y=\"215\" font-size=\"40\" fill=\"#18344b\" text-anchor=\"end\" font-weight=\"400\">AATG\u003c/text>\u003crect x=\"950\" y=\"187\" width=\"333.33333333333337\" height=\"40\" rx=\"5\" fill=\"#0072B2\"/>\u003ctext x=\"1301.3333333333335\" y=\"216\" font-size=\"34\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\">0.80\u003c/text>\u003ctext x=\"320\" y=\"297\" font-size=\"40\" fill=\"#18344b\" text-anchor=\"end\" font-weight=\"400\">CGCG\u003c/text>\u003crect x=\"700.0\" y=\"269\" width=\"250.0\" height=\"40\" rx=\"5\" fill=\"#7B4FA3\"/>\u003ctext x=\"682.0\" y=\"298\" font-size=\"34\" fill=\"#7B4FA3\" text-anchor=\"end\" font-weight=\"400\">-0.60\u003c/text>\u003ctext x=\"864\" y=\"650\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Count × coefficient → score contribution\u003c/text>\u003c/svg>","transition":"Trace each count through its multiplication.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":4,"title":"Include the bias and the negative evidence","id":"day-1-explain-score","time":"158:15–159:15 (1:00)","visible":"A signed waterfall starts at bias −0.4, adds +1.2, +0.8 and −0.6, and ends at z=1 and p(B)≈0.731.","notes":"Explain the whole calculation, including the bias and features that lower the score. The sigmoid is nonlinear, so adding 0.6 to the score does not add 0.6 to the probability. This is the existing teaching example, not fitted DNA coefficients.","point":"Follow the waterfall from bias to score.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Include the bias and the negative evidence\">\u003ctitle>Include the bias and the negative evidence\u003c/title>\u003ctext x=\"864\" y=\"230\" font-size=\"78\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">−0.4 + 1.2 + 0.8 − 0.6 = 1\u003c/text>\u003ctext x=\"864\" y=\"440\" font-size=\"98\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">P(B) ≈ 0.731\u003c/text>\u003c/svg>","transition":"Follow the waterfall from bias to score.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":5,"title":"Coefficients summarize the fitted model","id":"day-1-explain-coefficients","time":"159:15–160:45 (1:30)","visible":"A signed coefficient chart from the actual paired run, with the selected words labeled.","notes":"A positive coefficient raises the B score as that count increases, holding the other features fixed; a negative one lowers it. A coefficient is not a local contribution until multiplied by the count. Use the full fitted vocabulary when reprod
