=\"62\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">TATA\u003c/text>\u003ctext x=\"870\" y=\"280\" font-size=\"55\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.0141\u003c/text>\u003ctext x=\"1310\" y=\"280\" font-size=\"55\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">6.30×\u003c/text>\u003ctext x=\"450\" y=\"425\" font-size=\"62\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">TACA\u003c/text>\u003ctext x=\"870\" y=\"425\" font-size=\"55\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.0085\u003c/text>\u003ctext x=\"1310\" y=\"425\" font-size=\"55\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">3.15×\u003c/text>\u003ctext x=\"450\" y=\"570\" font-size=\"62\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">GGAT\u003c/text>\u003ctext x=\"870\" y=\"570\" font-size=\"55\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">0.0074\u003c/text>\u003ctext x=\"1310\" y=\"570\" font-size=\"55\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.41×\u003c/text>\u003c/svg>","transition":"Read one actual row without presupposing agreement.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. Empirical values: generated Day 1 notebook, local seed-2026 primary PPM run, 2026-11-03; 240 validation rows, threshold 0.5; instructor/verification/day1-current.json. No tuning followed."},{"sectionNumber":6,"number":12,"title":"Overlapping words can share credit","id":"day-1-explain-correlated","time":"170:00–171:00 (1:00)","visible":"A short sequence is covered by overlapping four-base windows, with two related feature bars.","notes":"Neighboring k-mers are correlated because they overlap. Several features can describe parts of the same local pattern, so credit can move between them across fitted models. Do not add importance values and call the result a reconstructed biological mechanism.","point":"Trace the shared bases across adjacent windows.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Overlapping words can share credit\">\u003ctitle>Overlapping words can share credit\u003c/title>\u003ctext x=\"864\" y=\"180\" font-size=\"80\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">… A C G T A C …\u003c/text>\u003ctext x=\"650\" y=\"365\" font-size=\"80\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">ACGT\u003c/text>\u003ctext x=\"1000\" y=\"500\" font-size=\"80\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">CGTA\u003c/text>\u003ctext x=\"864\" y=\"650\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Shared bases → correlated features\u003c/text>\u003c/svg>","transition":"Trace the shared bases across adjacent windows.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":13,"title":"Could a shortcut explain the prediction?","id":"day-1-explain-shortcut","time":"171:00–172:00 (1:00)","visible":"Related sequences cross a training/validation boundary; then whole families remain together.","notes":"A model can use family identity or batch signals instead of the intended regulatory clue. A new sample ID need not mean a new biological family. This is a brief separate hypothetical example; the primary independent-sequence simulation does not secretly contain those families. The leakage notebook remains an extension, not another full practical here.","point":"Connect the transfer question to the split unit, then return to explanation.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Could a shortcut explain the prediction?\">\u003ctitle>Could a shortcut explain the prediction?\u003c/title>\u003ctext x=\"480\" y=\"120\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Training\u003c/text>\u003ctext x=\"1240\" y=\"120\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Validation\u003c/text>\u003cpath d=\"M860 150 L860 510\" fill=\"none\" stroke=\"#697782\" stroke-width=\"3\" stroke-dasharray=\"\"/>\u003crect x=\"220\" y=\"240\" width=\"520\" height=\"140\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"480.0\" y=\"322.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Family A · row 1\u003c/text>\u003crect x=\"980\" y=\"240\" width=\"520\" height=\"140\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1240.0\" y=\"322.0\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Family A · row 2\u003c/text>\u003ctext x=\"864\" y=\"620\" font-size=\"53\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">A new ID need not mean a new family\u003c/text>\u003c/svg>","transition":"Connect the transfer question to the split unit, then return to explanation.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":14,"title":"Explain one validation sequence","id":"day-1-explain-notebook","time":"172:00–177:00 (5:00)","visible":"A practical strip: Select a row → Inspect contributions → Check the reconstructed probability → Read global summaries. Include the existing GitHub/Open in Colab route.","notes":"Reuse the Section 3 fitted classifier and count mapping. For one actual validation row, compute all count×coefficient contributions plus bias and verify the resulting sigmoid matches predict_proba. Display the strongest contributions in both directions while retaining the full sum. Then inspect coefficients and forest importance from the paired Section 5 run, including expected internal-window word enrichment. Do not refit or inspect test labels.","point":"Allocate 1 minute to select and reconstruct, 2 to explain signed contributions, and 2 to compare one global row and its distribution clue. Instructor demonstration or follow-along fits the same slot.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-practical\">\u003cp>Select one validation row → verify the full sum\u003c/p>\u003cp>Explain contributions → compare global features\u003c/p>\u003ca href=\"https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb\">Open Day 1 in Colab ↗\u003c/a>\u003c/div>","transition":"Allocate 1 minute to select and reconstruct, 2 to explain signed contributions, and 2 to compare one global row and its distribution clue. Instructor demonstration or follow-along fits the same slot.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":15,"title":"Say what the explanation supports","id":"day-1-explain-discussion","time":"177:00–179:00 (2:00)","visible":"One open prompt: Which clue mattered here, and what would you still want to check?","notes":"Invite a description of one observed contribution or global feature and one practical limit. Accept different supported observations; this is discussion, not a metric quiz. An explanation describes the fitted predictor and its data context; causal biological claims require additional evidence.","point":"Listen, connect to a model calculation and a biological limitation.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-prompt\">\u003cp>Which clue mattered here,\u003cbr>and what would you still want to check?\u003c/p>\u003c/div>","transition":"Listen, connect to a model calculation and a biological limitation.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":6,"number":16,"title":"What if position carries the answer?","id":"day-1-explain-tomorrow","time":"179:00–180:00 (1:00)","visible":"DNA → counts → learned prediction → evaluation → explanation, then a sequence with its positions retained points toward Day 2.","notes":"Today we built a connected workflow and learned to inspect it. Tomorrow we change the representation to retain sequence position and learn local features, while preserving the evaluation framework. Leave space for final questions; no homework.","point":"Close Day 1 at minute 180.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"What if position carries the answer?\">\u003ctitle>What if position carries the answer?\u003c/title>\u003crect x=\"129.0\" y=\"250\" width=\"270.0\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"264.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">DNA\u003c/text>\u003cpath d=\"M407.0 327 L411.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"411.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"429.0\" y=\"250\" width=\"270.0\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"564.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Counts\u003c/text>\u003cpath d=\"M707.0 327 L711.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"711.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"729.0\" y=\"250\" width=\"270.0\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Prediction\u003c/text>\u003cpath d=\"M1007.0 327 L1011.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1011.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1029.0\" y=\"250\" width=\"270.0\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1164.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Evaluation\u003c/text>\u003cpath d=\"M1307.0 327 L1311.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1311.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1329.0\" y=\"250\" width=\"270.0\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1464.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Explanation\u003c/text>\u003ctext x=\"864\" y=\"575\" font-size=\"52\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Tomorrow: retain position and learn features\u003c/text>\u003c/svg>","transition":"Close Day 1 at minute 180.","sourceNote":"Section 6 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."}]</script>

<script id="day-one-interactions">
/* === DETERMINISTIC TEACHING INTERACTIONS: NO MODEL OR NETWORK CALLS === */
const lessonColors={blue:'#0072B2',orange:'#D55E00',ink:'#18344b',gray:'#697782'};
const lessonGroups=[[.95,8,2],[.85,8,2],[.75,7,3],[.65,7,3],[.45,6,4],[.35,5,5],[.25,4,6],[.15,3,7],[.08,1,9],[.02,1,9]];
const lessonScores=lessonGroups.flatMap(([p,b,a])=>Array.from({length:b+a},(_,i)=>({p,y:i<b?1:0})));
function lessonText(x,y,s,size=35,color=lessonColors.ink,anchor='middle'){return `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}">${s}</text>`;}
function lessonSVG(s,label){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 540" role="img" aria-label="${label}"><title>${label}</title>${s}</svg>`;}
function lessonLine(x1,y1,x2,y2,color=lessonColors.gray,width=3){return `<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${width}"/>`;}
function dayOneMetrics(t){let tp=0,fp=0,tn=0,fn=0;lessonScores.forEach(({p,y})=>{if(p>=t){if(y)tp++;else fp++;}else if(y)fn++;else tn++;});return{tp,fp,tn,fn,accuracy:(tp+tn)/100,precision:tp+fp?tp/(tp+fp):null,recall:tp/(tp+fn),f1:2*tp+fp+fn?2*tp/(2*tp+fp+fn):0};}
const lessonPercent=x=>x===null?'undefined':(100*x).toFixed(1)+'%';
function lessonGradientLoss(w){return [-2,-1,1,2].reduce((s,x,i)=>{const z=w*x,y=[0,1,0,1][i];return s+Math.max(z,0)+Math.log1p(Math.exp(-Math.abs(z)))-y*z;},0)/4;}
function lessonGradient(w){return [-2,-1,1,2].reduce((s,x,i)=>s+x*(1/(1+Math.exp(-w*x))-[0,1,0,1][i]),0)/4;}
function updateLesson(root){
 const mode=root.dataset.live,plot=root.querySelector('[data-live-plot]'),read=root.querySelector('[data-live-readout]');let s='';
 if(mode==='sigmoid'){
  const z=Number(root.querySelector('input').value),p=1/(1+Math.exp(-z)),X=z=>300+(z+6)/12*1100,Y=p=>450-380*p;
  s=lessonLine(300,50,300,450)+lessonLine(300,450,1400,450);
  const pts=Array.from({length:121},(_,i)=>{let z=-6+i/10;return `${X(z)},${Y(1/(1+Math.exp(-z)))}`;}).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="${lessonColors.blue}" stroke-width="7"/><circle cx="${X(z)}" cy="${Y(p)}" r="15" fill="${lessonColors.orange}"/>`;
  s+=lessonText(850,530,'Score z',32)+lessonText(160,90,'P(B)',38)+lessonText(265,85,'1',30)+lessonText(265,455,'0',30)+lessonText(300,480,'−6',28)+lessonText(850,480,'0',28)+lessonText(1400,480,'6',28);
  plot.innerHTML=lessonSVG(s,'Sigmoid maps score to class probability');read.textContent=`z = ${z.toFixed(1)} → P(B) = ${p.toFixed(3)}; P(A) = ${(1-p).toFixed(3)}`;
 }else if(mode==='gradient'){
  const k=Number(root.dataset.step||0);let w=-2;for(let i=0;i<k;i++)w-=.8*lessonGradient(w);
  const X=w=>300+(w+3)/6*1100,Y=l=>450-l*145;
  const pts=Array.from({length:121},(_,i)=>{let w=-3+i/20;return `${X(w)},${Y(lessonGradientLoss(w))}`;}).join(' ');
  s=lessonLine(300,50,300,450)+lessonLine(300,450,1400,450)+`<polyline points="${pts}" fill="none" stroke="${lessonColors.blue}" stroke-width="7"/><circle cx="${X(w)}" cy="${Y(lessonGradientLoss(w))}" r="16" fill="${lessonColors.orange}"/>`;
  s+=lessonText(850,530,'One weight w · other parameters held fixed',32)+lessonText(800,45,'Mean training loss',38)+lessonText(300,480,'−3',28)+lessonText(850,480,'0',28)+lessonText(1400,480,'3',28);
  plot.innerHTML=lessonSVG(s,'One-weight logistic training-loss gradient descent');read.textContent=`Step ${k} · w = ${w.toFixed(3)} · Mean loss = ${lessonGradientLoss(w).toFixed(3)}`;root.querySelector('[data-step]').disabled=k>=8;
 }else if(mode==='threshold'){
  const t=Number(root.querySelector('input').value),m=dayOneMetrics(t),X=p=>260+p*1150;
  lessonScores.forEach(({p,y},i)=>{const yy=90+(i%10)*29;s+=`<${y?'circle':'rect'} ${y?`cx="${X(p)}" cy="${yy}" r="10"`:`x="${X(p)-9}" y="${yy-9}" width="18" height="18"`} fill="${y?lessonColors.orange:lessonColors.blue}"/>`;});
  s+=lessonLine(260,410,1410,410)+lessonLine(X(t),50,X(t),410,lessonColors.orange,5)+lessonText(260,455,'0',30)+lessonText(835,455,'0.5',30)+lessonText(1410,455,'1',30)+lessonText(835,510,'P(B) · square A / circle B',38);
  plot.innerHTML=lessonSVG(s,'Fixed class probabilities with a movable decision cutoff');read.textContent=`TP ${m.tp} · FP ${m.fp} · FN ${m.fn} · TN ${m.tn} · Precision ${lessonPercent(m.precision)} · Recall ${lessonPercent(m.recall)}`;
 }else if(mode==='curve'){
  const t=Number(root.querySelector('input').value),m=dayOneMetrics(t),pr=root.dataset.curve==='pr',X=x=>390+x*950,Y=y=>440-y*360;
  const states=[{recall:0,precision:1,fp:0},...lessonGroups.map(([p])=>dayOneMetrics(p))];
  const xy=states.map(m=>[X(pr?m.recall:m.fp/50),Y(pr?m.precision:m.recall)]);
  const d=xy.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ');
  s=lessonLine(390,60,390,440)+lessonLine(390,440,1340,440);
  if(!pr)s+=`<path d="M390 440 L1340 80" stroke="#a9b7c1" stroke-width="3" stroke-dasharray="10 8"/>`;
  else s+=`<path d="M390 ${Y(.5)} L1340 ${Y(.5)}" stroke="#a9b7c1" stroke-width="3" stroke-dasharray="10 8"/>`;
  if(root.dataset.area==='1')s+=`<path d="${d}L1340 440Z" fill="${lessonColors.blue}" opacity=".12"/>`;
  s+=`<path d="${d}" fill="none" stroke="${lessonColors.blue}" stroke-width="6"/>`;
  if(!pr||m.precision!==null)s+=`<circle cx="${X(pr?m.recall:m.fp/50)}" cy="${Y(pr?m.precision:m.recall)}" r="15" fill="${lessonColors.orange}"/>`;
  s+=lessonText(865,515,pr?'Recall':'False-positive rate = FP / actual A',37)+lessonText(865,40,pr?'Precision':'True-positive rate (recall)',37);
  s+=lessonText(355,445,'0',28)+lessonText(355,90,'1',28)+lessonText(390,480,'0',28)+lessonText(1340,480,'1',28);
  plot.innerHTML=lessonSVG(s,pr?'Precision–recall curve of the constructed batch':'ROC curve of the constructed batch');
  read.textContent=pr?`Precision ${lessonPercent(m.precision)} · Recall ${lessonPercent(m.recall)} · AP = 0.731`:`FPR = ${(m.fp/50).toFixed(2)} · TPR = ${m.recall.toFixed(2)} · ROC-AUC = 0.784`;
 }else if(mode==='tree'){
  const a=Number(root.querySelector('[data-tree-a]').value),b=Number(root.querySelector('[data-tree-b]').value),p=a>=2?(b<2?.8:.25):.2;
  const box=(x,y,w,label,active)=>`<rect x="${x}" y="${y}" width="${w}" height="82" rx="17" fill="${active?'#FBE9D9':'#f2f6f9'}" stroke="${active?lessonColors.orange:'#c3d0d8'}" stroke-width="4"/>`+lessonText(x+w/2,y+53,label,36);
  s=lessonLine(864,118,450,225)+lessonLine(864,118,1190,225)+lessonLine(1190,307,970,425)+lessonLine(1190,307,1480,425);
  s+=box(624,36,480,'TATA ≥ 2?',true)+box(210,225,480,'P(B) = 0.20',a<2)+box(950,225,480,'CGCG < 2?',a>=2)+box(750,425,440,'P(B) = 0.80',a>=2&&b<2)+box(1260,425,440,'P(B) = 0.25',a>=2&&b>=2);
  s+=lessonText(540,180,'No',30)+lessonText(1090,180,'Yes',30)+lessonText(990,365,'Yes',30)+lessonText(1430,365,'No',30);
  plot.innerHTML=lessonSVG(s,'Interactive constructed classification tree');read.textContent=`TATA ${a} · CGCG ${b} → P(B) = ${p.toFixed(2)} → class ${p>=.5?'B':'A'}`;
 }
}
function bindDayOneInteractions(){document.querySelectorAll('[data-live]').forEach(root=>{updateLesson(root);root.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>updateLesson(root)));root.querySelector('[data-step]')?.addEventListener('click',()=>{root.dataset.step=String(Number(root.dataset.step||0)+1);updateLesson(root);});root.querySelector('[data-reset]')?.addEventListener('click',()=>{root.dataset.step='0';if(root.dataset.live==='tree'){root.querySelector('[data-tree-a]').value=2;root.querySelector('[data-tree-b]').value=3;}updateLesson(root);});});}

</script>
<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day-1-edits-v1';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            const oldEdits = JSON.parse(localStorage.getItem('ml-course-2026-day1-teaching-v3') || '{}');
            const migrated = Object.fromEntries(Object.entries(oldEdits).filter(([key]) => key.startsWith('day-1-')));
            this.edits = {...migrated, ...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = slide.id;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="${slide.anchor}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                ${slide.sectionTwo || slide.sectionTeaching ? `<h1 id="title-${index + 1}">${slide.title}</h1><div class="content">${slide.body}</div><aside class="notes" tabindex="-1" aria-label="Instructor notes"><h2>${slide.title}</h2><p class="small">Suggested allocation: ${slide.time}; Section ${slide.sectionNumber || 2} total ${[0,25,25,30,25,30,25][slide.sectionNumber || 2]} minutes (not rehearsed).</p><div class="note-heading">Say / explain</div><p>${slide.notes}</p><div class="note-heading">Pointing cue</div><p>${slide.point}</p><div class="note-heading">Transition</div><p>${slide.transition}</p><p class="small">${slide.sourceNote}</p><p class="small"><a href="story.md#section-${slide.sectionNumber || 2}">Section ${slide.sectionNumber || 2} story and scientific notes</a> · N / Escape closes notes.</p></aside>` : slide.sectionOne ? `<h1 id="title-${index + 1}">${slide.title}</h1><div class="content">${slide.body}</div><aside class="notes" tabindex="-1" aria-label="Instructor notes"><h2>${slide.title}</h2><p class="small">Suggested allocation: ${slide.time}; Section 1 total 25 minutes (not rehearsed).</p><div class="note-heading">Say / explain</div><p>${slide.notes}</p><div class="note-heading">Pointing cue</div><p>${slide.point}</p><div class="note-heading">Transition</div><p>${slide.transition}</p><p class="s1-provenance">${slide.sourceNote}</p><p class="small"><a href="story.md#1-course-and-ml-introduction--025">Day 1 story</a> · N / Escape closes notes.</p></aside>` : `
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    ${slide.cues ? '<div class="note-heading">Say / explain</div>' : ''}<p>${slide.notes}</p>
                    ${slide.cues ? `<dl class="speaker-cues">${slide.cues.ask ? `<dt>Ask the class</dt><dd>${slide.cues.ask}</dd><dt>Expected answer</dt><dd>${slide.cues.answer}</dd>` : ''}<dt>Next slide</dt><dd>${slide.cues.next}</dd></dl><p class="day1-guide-link"><a href="previous-teaching-guide.md">Day 1 speaking guide</a> · <a href="../../instructor/practicals.md">Practical instructions</a></p>` : ''}
                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../index.html">All days</a> · <a href="../../instructor/guide.md">Instructor guide</a> · <a href="../../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>`}
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo, .lesson-live')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const exact = slides.findIndex(s => '#' + s.anchor === location.hash);
        if (exact >= 0) { this.go(exact, false); return; }
        /* Legacy later-slide aliases */
        const laterAliases={"23": "day-1-break-1", "24": "day-1-lr-section", "25": "day-1-lr-supervised-fit", "26": "day-1-lr-validation", "27": "day-1-dna-test-boundary", "28": "day-1-lr-signed-contributions", "29": "day-1-lr-sigmoid", "30": "day-1-lr-threshold", "31": "day-1-lr-optimization", "32": "day-1-metrics-confusion", "33": "day-1-metrics-accuracy", "34": "day-1-metrics-precision", "35": "day-1-metrics-recall", "36": "day-1-metrics-f1", "37": "day-1-metrics-roc", "38": "day-1-metrics-pr", "39": "day-1-metrics-threshold", "40": "day-1-lr-notebook-checkpoint", "41": "day-1-explain-notebook", "42": "day-1-break-2", "43": "day-1-trees-root", "44": "day-1-trees-paths", "45": "day-1-trees-overfit", "46": "day-1-trees-average", "47": "day-1-trees-fair-comparison", "48": "day-1-trees-handoff", "49": "day-1-explain-forest-importance", "50": "day-1-explain-probability-pattern", "51": "day-1-explain-discussion", "61": "day-1-explain-tomorrow", "62": "day-1-explain-tomorrow", "52": "day-1-explain-shortcut", "53": "day-1-explain-shortcut", "54": "day-1-explain-shortcut", "55": "day-1-explain-shortcut", "56": "day-1-explain-shortcut", "57": "day-1-explain-shortcut", "58": "day-1-explain-shortcut", "59": "day-1-explain-shortcut", "60": "day-1-explain-shortcut"};
        const later=location.hash.match(/^#day-1-slide-(\d+)$/);
        if(later && laterAliases[later[1]]) { this.go(slides.findIndex(s=>s.id===laterAliases[later[1]]),false); return; }
        /* End later aliases */
        const sectionTwoAliases = ['day-1-dna-task','day-1-dna-count-vector','day-1-dna-signal','day-1-dna-signal','day-1-dna-overlapping-windows','day-1-dna-count-occurrences','day-1-dna-lost-position','day-1-dna-numeric-features','day-1-dna-bag-of-kmers','day-1-dna-ready-for-model'];
        const oldDna = location.hash.match(/^#day-1-slide-(1[3-9]|2[0-2])$/);
        if (oldDna) { this.go(slides.findIndex(s => s.id === sectionTwoAliases[Number(oldDna[1])-13]), false); return; }
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch && Number(localMatch[1]) !== 1) { location.href = `../Day_${localMatch[1]}/presentation.html${location.hash}`; return; }
        if (localMatch) { const openingAliases = [0,0,1,2,9,10,11,12,13,15,16,17]; this.go(openingAliases[Number(localMatch[2])-1] ?? 0, false); }
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        if (day === 1) this.go(0);
        else location.href = `../Day_${day}/presentation.html`;
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'day-1-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it beside presentation.html for linked course resources.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of new Set(slides.map(slide => slide.day))) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo, .lesson-live')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, .lesson-live, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
bindDayOneInteractions();
</script>
