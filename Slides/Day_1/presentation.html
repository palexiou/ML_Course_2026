6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"1192\" y=\"583\" font-size=\"48\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"700\">TAAA\u003c/text>\u003crect x=\"1335\" y=\"520\" width=\"195\" height=\"90\" rx=\"9\" fill=\"#f0f4f6\" stroke=\"none\" stroke-width=\"3\"/>\u003ctext x=\"1432\" y=\"583\" font-size=\"48\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"700\">AAAT\u003c/text>\u003ctext x=\"864\" y=\"700\" font-size=\"37\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">18 word occurrences · repeats stay in the bag\u003c/text>\u003c/svg>","notes":"A bag of k-mers is an inventory of word occurrences, with multiplicity. We no longer attach an absolute start position to each occurrence. Three CGCG tiles stay three occurrences, rather than one presence flag. Each tile still spells an ordered four-base word, and overlapping words can retain indirect context; we have not erased every trace of order.","point":"The three separate CGCG tiles, and the two TATA tiles.","transition":"Compress repeated occurrences into counts.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-count-occurrences","anchor":"day-1-dna-count-occurrences","kind":"section-two","sectionTwo":true,"time":"90 seconds · 37:30–39:00","title":"Turn repeated words into counts","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Selected counts of the constructed short string: TATA 2, AATG 1, CGCG 3; eighteen overlapping windows in total.\">\u003ctext x=\"184\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003ctext x=\"252\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"320\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003ctext x=\"388\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"456\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"524\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"592\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"660\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"728\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"796\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"864\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"932\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"1000\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"1068\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003ctext x=\"1136\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"1204\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003ctext x=\"1272\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"1340\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"1408\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"1476\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">T\u003c/text>\u003ctext x=\"1544\" y=\"120\" font-size=\"64\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">G\u003c/text>\u003ctext x=\"360\" y=\"340\" font-size=\"62\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">TATA\u003c/text>\u003ctext x=\"360\" y=\"495\" font-size=\"110\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">2\u003c/text>\u003ctext x=\"864\" y=\"340\" font-size=\"62\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">AATG\u003c/text>\u003ctext x=\"864\" y=\"495\" font-size=\"110\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">1\u003c/text>\u003ctext x=\"1368\" y=\"340\" font-size=\"62\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"700\">CGCG\u003c/text>\u003ctext x=\"1368\" y=\"495\" font-size=\"110\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">3\u003c/text>\u003ctext x=\"864\" y=\"635\" font-size=\"37\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">18 windows counted · selected columns shown\u003c/text>\u003c/svg>","notes":"TATA occurs at starts 1 and 14, AATG at start 18, and CGCG at starts 6, 8 and 10. Overlap does not stop a window from counting. The selected columns sum to six, not 18, because other words have their own counts. The full vector has a consistent column for each vocabulary word; absent words get zero. There are 4^4 = 256 possible four-base words, while a learned vocabulary may omit words absent from training. These values are only the constructed counting example.","point":"Each word header and count, preserving the order TATA, AATG, CGCG for Section 3.","transition":"What have we gained, and what information is no longer explicit?","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-lost-position","anchor":"day-1-dna-lost-position","kind":"section-two","sectionTwo":true,"time":"90 seconds · 39:00–40:30","title":"What does this representation keep?","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Bag-of-k-mers tradeoffs: fixed-size local word identity and frequency versus omitted explicit positions and full arrangement; dependence on k.\">\u003cpath d=\"M864,120 L864,580\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"410\" y=\"165\" font-size=\"51\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">What we keep\u003c/text>\u003ctext x=\"410\" y=\"300\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">local word identity\u003c/text>\u003ctext x=\"410\" y=\"390\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">and frequency\u003c/text>\u003ctext x=\"410\" y=\"535\" font-size=\"36\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">fixed-size input → simple models\u003c/text>\u003ctext x=\"1295\" y=\"165\" font-size=\"51\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"700\">What we give up\u003c/text>\u003ctext x=\"1295\" y=\"300\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">explicit start positions\u003c/text>\u003ctext x=\"1295\" y=\"390\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">and full arrangement\u003c/text>\u003ctext x=\"1295\" y=\"535\" font-size=\"36\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"400\">k changes context and vocabulary size\u003c/text>\u003ctext x=\"864\" y=\"675\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Local order inside each k-mer is retained.\u003c/text>\u003c/svg>","notes":"The benefits are a fixed-size numeric vector and access to simple models, with local pattern identity and frequency visible in each column. Counts do not explicitly store absolute positions or the complete arrangement of occurrences. But each k-mer retains order within the word and overlapping words can constrain surrounding context, so do not say all order is lost. Choosing k changes what local pattern length is visible and the possible vocabulary grows as 4^k. Bigger k can make vectors sparse and require more data; smaller k can miss longer dependencies. Day 2 revisits position.","point":"The two sides, then the local-order sentence.","transition":"Across examples, these count vectors become a table.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-count-vector","anchor":"day-1-dna-count-vector","kind":"section-two","sectionTwo":true,"time":"90 seconds · 40:30–42:00","title":"One sequence becomes one row","body":"\u003cdiv class=\"s2-table-wrap\">\u003ctable class=\"s2-table\">\u003cthead>\u003ctr>\u003cth>sample_id\u003c/th>\u003cth class=\"feature\">TATA\u003c/th>\u003cth class=\"feature\">AATG\u003c/th>\u003cth class=\"feature\">CGCG\u003c/th>\u003cth class=\"feature\">…\u003c/th>\u003cth>class label\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>…00001\u003c/td>\u003ctd class=\"feature\">2\u003c/td>\u003ctd class=\"feature\">1\u003c/td>\u003ctd class=\"feature\">1\u003c/td>\u003ctd class=\"feature\">…\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>…00002\u003c/td>\u003ctd class=\"feature\">1\u003c/td>\u003ctd class=\"feature\">0\u003c/td>\u003ctd class=\"feature\">2\u003c/td>\u003ctd class=\"feature\">…\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"s2-table-roles\">\u003cp>Tracks the row\u003c/p>\u003cp>Numbers supplied to the model\u003c/p>\u003cp>Given answer\u003cbr>during training\u003c/p>\u003c/div>\u003c/div>","notes":"We now switch from the unlabeled short counting demonstration to two actual 160-base simulated training records from the revised generator. Read across a row: the ID tracks which sequence it is and is not a predictive feature; the highlighted middle columns are sequence-derived counts; the class label at the right is the supplied answer during training. For a new prediction the model receives the sequence-derived counts, without the class answer. Full IDs are simple-2026-00001 and simple-2026-00002; the screen shortens them for space. Counts use each complete 160-base sequence, and the omitted columns have further counts. Planting flags, sampled sites, positions, groups and split metadata are not predictive inputs. These simulation labels are not measured biology.","point":"The ID, highlighted count columns, then the separated class-label column.","transition":"Before fitting any data-dependent representation, assign the data roles.","sourceNote":"Read-only regenerated seed-2026 primary training records from current SimulationConfig; counts independently obtained from full sequences. Both complete count rows sum to 157. No model fitting or evaluation was performed.","local":0},{"day":1,"id":"day-1-dna-training-validation","anchor":"day-1-dna-training-validation","kind":"section-two","sectionTwo":true,"time":"180 seconds · 42:00–45:00","title":"Three sets, three purposes","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Training learns parameters and preprocessing; validation guides choices; test evaluates only after the full workflow is frozen.\">\u003ctext x=\"864\" y=\"58\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">Split before fitting vocabulary, transforms or model\u003c/text>\u003crect x=\"65\" y=\"160\" width=\"445\" height=\"360\" rx=\"14\" fill=\"#f2f6f8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"287\" y=\"240\" font-size=\"51\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">TRAIN\u003c/text>\u003ctext x=\"287\" y=\"340\" font-size=\"37\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">Learn parameters\u003c/text>\u003ctext x=\"287\" y=\"435\" font-size=\"28\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Fit vocabulary / transforms\u003c/text>\u003crect x=\"640\" y=\"160\" width=\"445\" height=\"360\" rx=\"14\" fill=\"#f2f6f8\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"862\" y=\"240\" font-size=\"51\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">VALIDATION\u003c/text>\u003ctext x=\"862\" y=\"340\" font-size=\"37\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">Guide development choices\u003c/text>\u003ctext x=\"862\" y=\"435\" font-size=\"28\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">Model · settings · representation\u003c/text>\u003crect x=\"1215\" y=\"160\" width=\"445\" height=\"360\" rx=\"14\" fill=\"#f2f6f8\" stroke=\"#5e6c76\" stroke-width=\"3\"/>\u003ctext x=\"1437\" y=\"240\" font-size=\"51\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"700\">TEST\u003c/text>\u003ctext x=\"1437\" y=\"340\" font-size=\"37\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">Final frozen evaluation\u003c/text>\u003ctext x=\"1437\" y=\"435\" font-size=\"28\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">No feedback into development\u003c/text>\u003cpath d=\"M510,550 L1210,550\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1210,550 L1194.654558602929,559.4083701207519\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1210,550 L1194.654558602929,540.5916298792481\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"864\" y=\"630\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">Freeze the full workflow before TEST\u003c/text>\u003c/svg>","notes":"Training learns model parameters and any data-dependent vocabulary or preprocessing. Validation is where we assess development choices, including candidate models, hyperparameters and representations; threshold choices belong here too if the protocol permits them. Our course threshold remains fixed at 0.5, so this is not authorization to tune it. Distinguish an initial candidate choice from selecting among fitted candidates using validation. Split before fitting vocabulary or transforms; fit only on training rows, then apply the same mapping to held-out sequences. Test is reserved for the planned Day 3 final comparison after all compared workflows are frozen. Official test labels can be used then to calculate the final score; they cannot guide development. Course split sizes are 720 train, 240 validation, 240 test under the retained 60/20/20 design.","point":"Read the purpose of each box, then the split-before-fitting line and freeze boundary.","transition":"The test boundary deserves one unambiguous statement.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-test-boundary","anchor":"day-1-dna-test-boundary","kind":"section-two","sectionTwo":true,"time":"90 seconds · 45:00–46:30","title":"Test results never guide development","body":"\u003cdiv class=\"s2-test\">\u003cp>NO DECISION\u003cbr>EVER MADE ON TEST\u003c/p>\u003csvg viewBox=\"0 0 1728 210\" role=\"img\" aria-label=\"Frozen final evaluation leads to reporting, with no return to development\">\u003ctext x=\"490\" y=\"130\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">frozen final evaluation\u003c/text>\u003cpath d=\"M840,115 L1070,115\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1070,115 L1054.654558602929,124.40837012075187\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1070,115 L1054.654558602929,105.59162987924813\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"1250\" y=\"130\" font-size=\"47\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">report\u003c/text>\u003c/svg>\u003c/div>","notes":"No test result guides design, representation, preprocessing, model selection, hyperparameter tuning or threshold changes. A disappointing final score is still the final score: it does not grant permission to change the workflow and try the same test again. We can interpret and report the frozen result, including failure and limitations; that is different from using it to improve or select a model. The Day 3 comparison is planned and frozen before the reveal, and test performance does not select a preferred workflow afterward. Day 4 remains development-only. Opening test labels for the official final score is permitted by that gate; using them or test sequences to steer development is not.","point":"The statement, then the one-way final-evaluation-to-report arrow.","transition":"Cross-validation changes how development is checked, while leaving this boundary intact.","sourceNote":"Original course teaching diagram; conceptual illustration, not measured biological evidence. See story.md#section-2.","local":0},{"day":1,"id":"day-1-dna-cross-validation","anchor":"day-1-dna-cross-validation","kind":"section-two","sectionTwo":true,"time":"90 seconds · 46:30–48:00","title":"Rotate development folds; keep test aside","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Three development-fold rotations alternate train and validation while a separate protected test block remains untouched.\">\u003ctext x=\"180\" y=\"100\" font-size=\"41\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"700\">development data\u003c/text>\u003ctext x=\"120\" y=\"235\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">1\u003c/text>\u003crect x=\"200\" y=\"170\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#FBE9D9\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"347\" y=\"233\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">validate\u003c/text>\u003crect x=\"525\" y=\"170\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"672\" y=\"233\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003crect x=\"850\" y=\"170\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"997\" y=\"233\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003ctext x=\"120\" y=\"365\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">2\u003c/text>\u003crect x=\"200\" y=\"300\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"347\" y=\"363\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003crect x=\"525\" y=\"300\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#FBE9D9\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"672\" y=\"363\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">validate\u003c/text>\u003crect x=\"850\" y=\"300\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"997\" y=\"363\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003ctext x=\"120\" y=\"495\" font-size=\"38\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">3\u003c/text>\u003crect x=\"200\" y=\"430\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"347\" y=\"493\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003crect x=\"525\" y=\"430\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#D9EDF8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"672\" y=\"493\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">train\u003c/text>\u003crect x=\"850\" y=\"430\" width=\"295\" height=\"95\" rx=\"8\" fill=\"#FBE9D9\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"997\" y=\"493\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">validate\u003c/text>\u003cpath d=\"M1260,120 L1260,565\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003crect x=\"1340\" y=\"225\" width=\"300\" height=\"190\" rx=\"14\" fill=\"#f0f3f5\" stroke=\"#5e6c76\" stroke-width=\"3\"/>\u003ctext x=\"1490\" y=\"310\" font-size=\"55\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"700\">TEST\u003c/text>\u003ctext x=\"1490\" y=\"370\" font-size=\"34\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">untouched\u003c/text>\u003ctext x=\"690\" y=\"635\" font-size=\"38\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Fit preprocessing again inside each training fold.\u003c/text>\u003c/svg>","notes":"Cross-validation repeats the training/validation roles across development folds, so a decision depends less on a single held-out development subset. This schematic uses three folds only to make rotation visible; it is not a change to the course’s fixed split protocol and is not a license to access test data. Refit vocabulary, transforms and the model using only that fold’s training rows, then validate on the held-out fold. We can summarize those validation outcomes for choices. Cross-validation is optional depth in this 25-minute section: if questions need the time, give this one-sentence takeaway and continue. Bootstrap sampling is a different idea: postpone its mechanics to Section 5’s forests, where training rows are sampled WITH replacement. It is neither a replacement test set nor the same operation as fold rotation.","point":"The validation block moving across development folds, then the stationary test block.","transition":"We have input features and an evaluation plan. Which classifier could turn counts into a probability?","sourceNote":"Agent recommendation for brief conceptual CV coverage, not an instructor-confirmed new execution protocol. Bootstrap mechanics deferred to the existing forest explanation in Section 5; no nested-CV detour.","local":0},{"day":1,"id":"day-1-dna-ready-for-model","anchor":"day-1-dna-ready-for-model","kind":"section-two","sectionTwo":true,"time":"120 seconds · 48:00–50:00","title":"Which model can turn counts into a prediction?","body":"\u003csvg viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"The constructed count vector 2,1,3 enters a candidate classifier to obtain a class probability; next section introduces logistic regression.\">\u003ctext x=\"230\" y=\"225\" font-size=\"54\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"700\">TATA\u003c/text>\u003ctext x=\"230\" y=\"340\" font-size=\"80\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">2\u003c/text>\u003ctext x=\"500\" y=\"225\" font-size=\"54\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">AATG\u003c/text>\u003ctext x=\"500\" y=\"340\" font-size=\"80\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">1\u003c/text>\u003ctext x=\"770\" y=\"225\" font-size=\"54\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"700\">CGCG\u003c/text>\u003ctext x=\"770\" y=\"340\" font-size=\"80\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"700\">3\u003c/text>\u003ctext x=\"1000\" y=\"285\" font-size=\"64\" fill=\"#5e6c76\" text-anchor=\"middle\" font-weight=\"400\">…\u003c/text>\u003cpath d=\"M1060,285 L1170,285\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1170,285 L1154.654558602929,294.40837012075184\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1170,285 L1154.654558602929,275.59162987924816\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003crect x=\"1210\" y=\"205\" width=\"380\" height=\"160\" rx=\"14\" fill=\"#eaf3f8\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1400\" y=\"300\" font-size=\"59\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">classifier?\u003c/text>\u003cpath d=\"M1400,410 L1400,485\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1400,485 L1390.591629879248,469.6545586029289\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003cpath d=\"M1400,485 L1409.408370120752,469.6545586029289\" fill=\"none\" stroke=\"#c3d0d8\" stroke-width=\"4\"/>\u003ctext x=\"1400\" y=\"570\" font-size=\"43\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">class probability\u003c/text>\u003ctext x=\"720\" y=\"675\" font-size=\"47\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"700\">Next: logistic regression\u003c/text>\u003c/svg>","notes":"We chose a binary output first. Representation and model are joint, iterative design choices, not a universal rule that one must always come first. In this teaching story counts come first so everyone can see what enters the classifier. Logistic regression is our proposed transparent baseline for Section 3: it learns a map from the count vector to a class probability, then a fixed threshold can produce a class. Trees later use the same features; later CNNs need an ordered representation that we will teach then. Choosing this first candidate is different from comparing models or tuning using validation, and test results never make that choice. Inference means fit the model using training data, then apply the fixed fitted preprocessing and model to a new sequence. We do not learn new weights in real time merely because a new sequence arrives. The following Section 3 weights are illustrative, not measured results of the revised generator. Take the full 50–60 break.","point":"Counts, model box and probability output in that order.","transition":"After the break, restore this count row and attach signed weights in Section 3.","sourceNote":"Agent recommendation: counts first for teaching clarity, then logistic regression as an interpretable starting candidate; not a claim of superiority. Section 3 illustrative weights are independent of new dataset execution.","local":0},{"day":1,"id":"day-1-break-1","kind":"section-two section-teaching","sectionTeaching":true,"sectionNumber":3,"time":"50–60","title":"Break","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Ten-minute break\">\u003ctitle>Ten-minute break\u003c/title>\u003ctext x=\"864\" y=\"340\" font-size=\"120\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">10 minutes\u003c/text>\u003c/svg>","notes":"Take the full 50–60 break. Return for Section 3.","point":"The break duration.","transition":"Resume with Section 3.","sourceNote":"Break time is separate from teaching allocations."},{"sectionNumber":3,"number":1,"title":"From counts to class probabilities","id":"day-1-lr-section","time":"60:00–61:30 (1:30)","visible":"One count row → a Predictor box → two complementary outputs: `P(class B | counts) = p` and `P(class A | counts) = 1 − p`, with `p + (1 − p) = 1`. Label class A = 0 and class B = 1 beside the outputs.","notes":"Before the break we represented a sequence by counts. What do we need from a model? Given that representation, we want an estimate of which of our two classes the sequence came from. We will call class B the positive class, encoded as 1, and use p for its estimated probability; the remaining probability belongs to class A, encoded as 0. These are mutually exclusive, exhaustive classes in this task. The model estimates class from counts; it does not directly measure TF binding.","point":"Trace counts to the two outputs, showing that they add to one. Choose a simple predictor whose calculation we can open.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"From counts to class probabilities\">\u003ctitle>From counts to class probabilities\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">k-mer counts\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Predictor\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B), 1 − P(B)\u003c/text>\u003c/svg>","transition":"Trace counts to the two outputs, showing that they add to one. Choose a simple predictor whose calculation we can open.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":2,"title":"A simple predictor","id":"day-1-lr-baseline","time":"61:30–62:30 (1:00)","visible":"Replace Predictor with Logistic regression. Enlarge the familiar selected columns `TATA: 2`, `AATG: 1`, `CGCG: 3`, with gray omitted columns and a small Selected features caption; retain the probability output.","notes":"Logistic regression takes a numeric vector and estimates a binary class probability. It is a useful first candidate because we can follow every calculation; its name does not make this a continuous-target regression task. Our actual classifier uses the full training-fitted vocabulary. For a worked example, we use just these three nonzero-weight features, setting all omitted weights to zero. The counts come from Section 2's constructed 21-base sequence, not a sampled 15-base planted site or a fitted course result.","point":"Point to the selected features without implying that three columns are the full vector. Attach weights and work through an example.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A simple predictor\">\u003ctitle>A simple predictor\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Counts\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Weighted sum\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Probability\u003c/text>\u003c/svg>","transition":"Point to the selected features without implying that three columns are the full vector. Attach weights and work through an example.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":3,"title":"Multiply counts by weights","id":"day-1-lr-signed-contributions","time":"62:30–64:30 (2:00)","visible":"Reveal one aligned product at a time: `TATA: 2 × (+0.6) = +1.2`, `AATG: 1 × (+0.8) = +0.8`, `CGCG: 3 × (−0.2) = −0.6`. Label the columns Count, Weight and Contribution; gray the inactive products.","notes":"Multiply each count by its weight. Two occurrences with weight +0.6 contribute +1.2; three with weight −0.2 contribute −0.6. Positive and negative contributions move the score in opposite directions. In a fitted model the signed weights are learned from training examples; I chose these numbers so we can see the arithmetic. A sign describes this predictor's calculation, not biological activation or inhibition. Changing one input coordinate while holding others fixed is a statement about the model, not necessarily a possible DNA edit.","point":"Count → weight → product for each row. The next operation is a sum.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Multiply counts by weights\">\u003ctitle>Multiply counts by weights\u003c/title>\u003ctext x=\"380.6666666666667\" y=\"250\" font-size=\"60\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">2 × 0.6\u003c/text>\u003ctext x=\"864.0\" y=\"250\" font-size=\"60\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">1 × 0.8\u003c/text>\u003ctext x=\"1347.3333333333333\" y=\"250\" font-size=\"60\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"400\">3 × (−0.2)\u003c/text>\u003ctext x=\"380.6666666666667\" y=\"435\" font-size=\"82\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">+1.2\u003c/text>\u003ctext x=\"864.0\" y=\"435\" font-size=\"82\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">+0.8\u003c/text>\u003ctext x=\"1347.3333333333333\" y=\"435\" font-size=\"82\" fill=\"#7B4FA3\" text-anchor=\"middle\" font-weight=\"400\">−0.6\u003c/text>\u003c/svg>","transition":"Count → weight → product for each row. The next operation is a sum.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":4,"title":"Sum, then add the bias","id":"day-1-lr-score","time":"64:30–66:30 (2:00)","visible":"The products feed a large sum: `1.2 + 0.8 − 0.6 = 1.4`. Reveal the bias `b = −0.4`, then `z = 1.4 − 0.4 = 1.0`. One compact rule reads `z = b + Σ wⱼxⱼ`.","notes":"Sum the weighted contributions and add the bias, also called the intercept. The bias is a shared starting offset, learned alongside the weights, rather than another word count. Our example produces a score of one. The same rule applies to every column in the actual fitted vocabulary. A score can be negative or greater than one, so we still need to turn it into a probability.","point":"Trace the addition explicitly, ending at z = 1. Carry that value into the next visual.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Sum, then add the bias\">\u003ctitle>Sum, then add the bias\u003c/title>\u003ctext x=\"864\" y=\"250\" font-size=\"80\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">1.2 + 0.8 − 0.6 − 0.4\u003c/text>\u003ctext x=\"864\" y=\"450\" font-size=\"110\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">z = 1.0\u003c/text>\u003c/svg>","transition":"Trace the addition explicitly, ending at z = 1. Carry that value into the next visual.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":5,"title":"Move the score, see the probability","id":"day-1-lr-sigmoid","time":"66:30–69:00 (2:30)","visible":"One large sigmoid, horizontal axis Score z and vertical axis `p = P(B | counts)`. A score slider moves an orange point and its projection lines; update the numeric z, p and complementary `P(A | counts) = 1 − p`. Keep anchors `z = 0 → p = 0.5` and `z = 1 → p ≈ 0.731`; the only equation is `p = 1 / (1 + e^(−z))`.","notes":"The sigmoid maps our score to a number between zero and one. At z = 1, class B gets about 0.731 and class A about 0.269. Move toward zero, then toward negative scores and back: increasing z increases p, but the curve flattens near its ends. This control changes the supplied score to demonstrate the mapping; it does not train the model or alter learned weights. “Linear” describes the weighted score, while its probability mapping is curved.","point":"Invite a prediction of the direction before moving the score; show zero and restore one. Proposed interaction: labeled slider from −6 to +6, step 0.1, initial value 1, with reset and numeric readout. While the slider has focus, arrow keys adjust it without triggering slide navigation. Static fallback uses the same zero/one/negative-score states. The next operation turns a probability into a decision.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"sigmoid\">\u003cdiv data-live-plot>\u003c/div>\u003clabel>Score z \u003cinput type=\"range\" min=\"-6\" max=\"6\" step=\"0.1\" value=\"1\" aria-label=\"Logistic score\">\u003c/label>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"Invite a prediction of the direction before moving the score; show zero and restore one. Proposed interaction: labeled slider from −6 to +6, step 0.1, initial value 1, with reset and numeric readout. While the slider has focus, arrow keys adjust it without triggering slide navigation. Static fallback uses the same zero/one/negative-score states. The next operation turns a probability into a decision.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":6,"title":"A probability becomes a decision","id":"day-1-lr-threshold","time":"69:00–70:00 (1:00)","visible":"A probability line keeps the point at `p ≈ 0.731`; a separator at 0.5 labels Below: A / 0 and At or above: B / 1. Keep a separate quiet slot `Observed label: unknown`.","notes":"The course uses p at least 0.5 to predict class B; otherwise it predicts A. Our worked example therefore predicts B. A probability, a predicted category and an observed label are different things. This constructed sequence has no assigned label, so we cannot say whether the decision is correct. An optional reveal moving only a hypothetical threshold to 0.8 would change the decision to A while preserving the probability; it does not change the course's fixed 0.5 rule.","point":"Probability dot → separator → predicted category, then the unknown observed label. A simple reveal is sufficient; another interactive control is optional.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A probability becomes a decision\">\u003ctitle>A probability becomes a decision\u003c/title>\u003ctext x=\"864\" y=\"200\" font-size=\"90\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.731\u003c/text>\u003cpath d=\"M240 380 L1490 380\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M865 340 L865 420\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"6\" stroke-dasharray=\"\"/>\u003ccircle cx=\"1154\" cy=\"380\" r=\"18\" fill=\"#D55E00\"/>\u003ctext x=\"865\" y=\"480\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Cutoff 0.5\u003c/text>\u003ctext x=\"240\" y=\"480\" font-size=\"52\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A\u003c/text>\u003ctext x=\"1490\" y=\"480\" font-size=\"52\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B\u003c/text>\u003c/svg>","transition":"Probability dot → separator → predicted category, then the unknown observed label. A simple reveal is sufficient; another interactive control is optional.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":7,"title":"After fitting, apply the model","id":"day-1-lr-inference","time":"70:00–71:00 (1:00)","visible":"A small Fitting complete marker precedes one forward path: New sequence → Fitted count mapping → Fixed weights and bias → Probability. No feedback arrow returns to the parameters.","notes":"Once a model is fitted, we can use it for inference. Count the new sequence with the same fitted vocabulary and feature order, then apply the fixed weights and bias. Its label is not required to produce a probability, and ordinary inference does not update the model. So far we have supplied the weights to explain prediction; now we need to explain the learning in machine learning.","point":"Point to Fitting complete before tracing the forward path. Rewind to how those fitted parameters were obtained.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"After fitting, apply the model\">\u003ctitle>After fitting, apply the model\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">New counts\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Fitted model\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Probability\u003c/text>\u003ctext x=\"864\" y=\"530\" font-size=\"46\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Parameters stay fixed\u003c/text>\u003c/svg>","transition":"Point to Fitting complete before tracing the forward path. Rewind to how those fitted parameters were obtained.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":8,"title":"Labels provide feedback","id":"day-1-lr-supervised-fit","time":"71:00–73:00 (2:00)","visible":"Several schematic training count rows with a separately labeled `y: A = 0 / B = 1` column enter a Fit box; shared Weights and Bias emerge. Reveal a feedback connection from Training probabilities + Known labels into that box.","notes":"Learning uses many examples paired with known labels. One shared set of weights and a bias must produce useful probabilities across those examples; we do not choose a separate model for each row. Training fits the count vocabulary and the classifier using training data only. The known labels supply feedback about its current probabilities. To turn that feedback into something an optimizer can use, we need a loss function.","point":"Point first to the label column, then to the shared parameters. Use a separate labeled training example next; do not assign truth to the earlier 21-base sequence.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Labels provide feedback\">\u003ctitle>Labels provide feedback\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Training counts\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Probabilities\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Compare labels\u003c/text>\u003ctext x=\"864\" y=\"535\" font-size=\"48\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Feedback adjusts the parameters\u003c/text>\u003c/svg>","transition":"Point first to the label column, then to the shared parameters. Use a separate labeled training example next; do not assign truth to the earlier 21-base sequence.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":9,"title":"Give a prediction a loss","id":"day-1-lr-binary-loss","time":"73:00–75:00 (2:00)","visible":"One explicitly labeled training example: `Known label: B / 1`, `p(B) = 0.9` → `Loss = −log(0.9) ≈ 0.105`. Reveal the name Binary cross-entropy and a short rule: Lower probability on the known label → larger loss.","notes":"Loss is a numerical cost for a prediction given its known label. For a true B example, binary cross-entropy is minus the natural log of p. For a true A example, it is minus the log of 1 − p, because that is the probability assigned to A. Putting 0.9 probability on the known class gives a small cost, about 0.105. This uses the probability itself, before any decision threshold; we are not counting correct and incorrect categories here.","point":"Known label → probability assigned to that label → cost. Keep the label fixed and make the prediction confidently wrong.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Give a prediction a loss\">\u003ctitle>Give a prediction a loss\u003c/title>\u003ctext x=\"864\" y=\"200\" font-size=\"60\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Observed B: loss = −log P(B)\u003c/text>\u003ctext x=\"501.5\" y=\"365\" font-size=\"64\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.9\u003c/text>\u003ctext x=\"1226.5\" y=\"365\" font-size=\"64\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">P(B) = 0.1\u003c/text>\u003ctext x=\"501.5\" y=\"510\" font-size=\"64\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Loss ≈ 0.105\u003c/text>\u003ctext x=\"1226.5\" y=\"510\" font-size=\"64\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Loss ≈ 2.303\u003c/text>\u003c/svg>","transition":"Known label → probability assigned to that label → cost. Keep the label fixed and make the prediction confidently wrong.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. The plotted loss is the data-loss term. The real LogisticRegression(max_iter=2000) fit uses L-BFGS and its default L2 penalty; it does not execute the toy one-weight gradient-descent steps. Regularization/complexity is not an extra Section 3 teaching beat."},{"sectionNumber":3,"number":10,"title":"Confident mistakes cost more","id":"day-1-lr-confident-loss","time":"75:00–77:00 (2:00)","visible":"One comparison table, revealed by row: for Known B, `p(B) = 0.9 → loss 0.105` versus `p(B) = 0.1 → loss 2.303`; for Known A, the losses reverse. Column labels specify the same p(B) in both rows.","notes":"For a true B example, assigning only 0.1 probability to B costs about 2.303, much more than 0.105. If the known label is A, p(B) = 0.1 is the good prediction, because p(A) = 0.9. Confidence matters: assigning almost no probability to the known class is penalized especially strongly. These are constructed comparisons of predictions, not before-and-after fitting results. Learning seeks smaller loss across the training set, not just greater confidence in any one prediction.","point":"Read the known label before each probability. The direction reverses with the label; now combine losses from many rows.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Confident mistakes cost more\">\u003ctitle>Confident mistakes cost more\u003c/title>\u003cpath d=\"M240 560 L1500 560\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpath d=\"M240 560 L240 80\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003cpolyline points=\"272,136.32434288909565 284,200.09388350061056 296,237.3966734465617 308,263.86342411212553 320,284.39263083303285 332,301.16621405807666 344,315.3480766021844 356,327.6329647236405 368,338.46900400402774 380,348.1621714445478 392,356.9307079865457 404,364.93575466959163 416,372.299683775557 428,379.1176172136994 440,385.46496139049896 452,391.40250533515547 464,396.9799705422675 476,402.23854461554276 488,407.2127289724081 500,411.9317120560628 512,416.4204071596505 524,420.7002485980606 536,424.7898107545774 548,428.7052952811066 560,432.46091877697006 572,436.0692243870719 584,439.54133456149384 596,442.88715782521433 608,446.1155592478512 620,449.23450200201387 632,452.25116570172906 644,455.17204594667044 656,458.00303854401176 668,460.74951115378246 680,463.41636454612166 692,466.0080852270577 704,468.52879085236424 716,470.9822695839231 728,473.37201433302306 740,475.7012526675777 752,477.9729730258919 764,480.18994777116546 776,482.3547535329033 788,484.46978920957565 800,486.537291947965 812,488.55935136609236 824,490.537922246421 836,492.47483589262157 848,494.37181031527325 860,496.23045938848503 872,498.05230109973354 884,499.8387649985869 896,501.5911989358908 908,503.31087517300887 920,504.9989959304829 932,506.65669843672936 944,508.2850595298742 956,509.88509985936616 968,511.45778772842175 980,513.0040426135289 992,514.5247383930403 1004,516.020706313244 1016,517.4927377171166 1028,518.9415865581855 1040,520.3679717194942 1052,521.7725791555267 1064,523.1560638730645 1076,524.5190517652974 1088,525.8621413120435 1100,527.1859051576366 1112,528.4908915768966 1124,529.7776258385727 1136,531.0466114747476 1148,532.2983314638792 1160,533.5332493344362 1172,534.7518101954381 1184,535.9544416996345 1196,537.141554944538 1208,538.3135453160615 1220,539.4707932790927 1232,540.61366511896 1244,541.7425136374069 1256,542.8576788063826 1268,543.9594883826804 1280,545.0482584862048 1292,546.1242941444183 1304,547.1878898053172 1316,548.2393298210906 1328,549.2788889044525 1340,550.30683255948 1352,551.3234174886458 1364,552.3288919776073 1376,553.3234962591952 1388,554.307462857936 1400,555.2810169163454 1412,556.2443765041365 1424,557.1977529114068 1436,558.1413509267882 1448,559.0753691014779\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"7\"/>\u003ctext x=\"900\" y=\"650\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">P(B) when observed class is B\u003c/text>\u003ctext x=\"140\" y=\"180\" font-size=\"42\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Loss\u003c/text>\u003c/svg>","transition":"Read the known label before each probability. The direction reverses with the label; now combine losses from many rows.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. The plotted loss is the data-loss term. The real LogisticRegression(max_iter=2000) fit uses L-BFGS and its default L2 penalty; it does not execute the toy one-weight gradient-descent steps. Regularization/complexity is not an extra Section 3 teaching beat."},{"sectionNumber":3,"number":11,"title":"Average over the training examples","id":"day-1-lr-mean-loss","time":"77:00–78:30 (1:30)","visible":"Several labeled training rows each produce a small loss tile, converging on `L = (ℓ₁ + … + ℓₙ) / n`. A two-tile reveal gives `(0.105 + 2.303) / 2 ≈ 1.204`.","notes":"Calculate a loss for each training example, then average those costs. This gives one quantity that summarizes how the current parameters predict the known training labels. The two-tile arithmetic is a small constructed example; the real fit combines all training rows. An update may help some rows and hurt others, so we look at the combined objective rather than requiring every example's loss to fall. We have a cost; now we need a way to adjust the weights.","point":"Trace row losses into their average. Put a weight on one axis and that average loss on the other.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Average over the training examples\">\u003ctitle>Average over the training examples\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">0.105\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">2.303\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Mean ≈ 1.204\u003c/text>\u003ctext x=\"864\" y=\"540\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Average over the training examples\u003c/text>\u003c/svg>","transition":"Trace row losses into their average. Put a weight on one axis and that average loss on the other.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. The plotted loss is the data-loss term. The real LogisticRegression(max_iter=2000) fit uses L-BFGS and its default L2 penalty; it does not execute the toy one-weight gradient-descent steps. Regularization/complexity is not an extra Section 3 teaching beat."},{"sectionNumber":3,"number":12,"title":"Take a step downhill","id":"day-1-lr-optimization","time":"78:30–81:30 (3:00)","visible":"A separate simple loss landscape with horizontal axis One weight w and vertical axis Average training loss L. A blue curve has a finite low point; an orange current position, local slope marker and arrow show the next downhill direction. A Step button moves along a short prepared sequence and updates the loss readout; Reset returns to the start. A quiet label reads Other parameters held fixed; the compact rule is `w ← w − η × slope`.","notes":"Try a weight, compute the training probabilities and their average loss, then use the local slope to choose a direction toward lower loss. The derivative describes that slope; subtracting it moves in the opposite direction. The learning rate η sets the step size. With a suitably small step in this demonstration, the marker moves downhill. A step that is too large can overshoot; there is no promise that every update at any learning rate lowers loss. This one-weight view builds intuition: actual models adjust many weights and a bias. We seek a low objective, not a promise of zero loss; overlapping classes and noise can prevent perfect prediction.","point":"Distinguish these axes from the earlier sigmoid: here we change a parameter and recompute loss across training rows. Use two or three Step presses within the allocation, then stop. Static fallback reveals the same arrows and positions. This illustrates gradient descent; the actual course fit uses a different optimizer, specified in the notes.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"gradient\" data-step=\"0\">\u003cdiv data-live-plot>\u003c/div>\u003cdiv class=\"live-buttons\">\u003cbutton data-step>Step downhill\u003c/button>\u003cbutton data-reset>Reset\u003c/button>\u003c/div>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"Distinguish these axes from the earlier sigmoid: here we change a parameter and recompute loss across training rows. Use two or three Step presses within the allocation, then stop. Static fallback reveals the same arrows and positions. This illustrates gradient descent; the actual course fit uses a different optimizer, specified in the notes.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions. The plotted loss is the data-loss term. The real LogisticRegression(max_iter=2000) fit uses L-BFGS and its default L2 penalty; it does not execute the toy one-weight gradient-descent steps. Regularization/complexity is not an extra Section 3 teaching beat."},{"sectionNumber":3,"number":13,"title":"Fit once, then predict","id":"day-1-lr-fit-predict","time":"81:30–82:30 (1:00)","visible":"Two phases, revealed sequentially in the same space: Training counts + Labels → Fit → Fitted parameters; then New counts → Fixed fitted parameters → Probability. Only the first phase has a learning loop.","notes":"During fitting, labels and loss help an optimizer find the parameters. During inference, those parameters stay fixed and labels are unnecessary. The count mapping is also fitted on training data and then reused. scikit-learn's fit performs the optimization for us; predict_proba applies what was learned. We can inspect those operations in the existing notebook.","point":"Follow the training loop once, then remove its feedback arrow for inference. Switch to the proposed notebook checkpoint inside the next five minutes.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Fit once, then predict\">\u003ctitle>Fit once, then predict\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Train + labels\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Fit\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Fitted parameters\u003c/text>\u003ctext x=\"864\" y=\"535\" font-size=\"49\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">New counts → fixed model → probability\u003c/text>\u003c/svg>","transition":"Follow the training loop once, then remove its feedback arrow for inference. Switch to the proposed notebook checkpoint inside the next five minutes.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":14,"title":"Try one prediction","id":"day-1-lr-notebook-checkpoint","time":"82:30–87:30 (5:00)","visible":"One practical strip: Inspect a count row → Fit on TRAIN → Predict a validation row → Reproduce z, p and loss. Link the [GitHub-hosted 01_simple_signal.ipynb](https://github.com/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb) and its [Open in Colab](https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb) route. Keep code details in notes.","notes":"Yes, we have an existing Day 1 notebook; a focused Section 3 tutorial is implemented in it. The classroom route is to open that GitHub notebook in Colab. In the proposed checkpoint, inspect one feature row, fit logistic regression on training sequences and labels only, then predict probabilities for held-out validation sequences. For one row, use the actual fitted full count vector, coefficients and intercept to reproduce z and its sigmoid probability. Finally, use that row's known label to calculate its binary loss. This last comparison assesses the prediction; it does not update the model on validation data.","point":"Proposed five-minute allocation, replacing lecture time: 0:30 orient to the already-prepared Colab tutorial; 0:45 inspect a count row; 1:00 fit TRAIN-only and predict validation probabilities; 1:45 reproduce one full-vector z/p and its labeled loss; 1:00 discuss and return to slides. Instructor demonstration with optional follow-along is the pacing proposal; independent completion by every student is not assumed. Use only the focused logistic cells, leaving metric reports for Section 4 and forests for Section 5. If setup or fitting would consume the slot, show prepared views of the same operations and calculations. No extra startup block or live result is assumed.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-practical\">\u003cp>Inspect counts → fit on TRAIN\u003c/p>\u003cp>Reproduce the score, probability and loss\u003c/p>\u003ca href=\"https://colab.research.google.com/github/palexiou/ML_Course_2026/blob/main/notebooks/01_simple_signal.ipynb\">Open Day 1 in Colab ↗\u003c/a>\u003c/div>","transition":"Proposed five-minute allocation, replacing lecture time: 0:30 orient to the already-prepared Colab tutorial; 0:45 inspect a count row; 1:00 fit TRAIN-only and predict validation probabilities; 1:45 reproduce one full-vector z/p and its labeled loss; 1:00 discuss and return to slides. Instructor demonstration with optional follow-along is the pacing proposal; independent completion by every student is not assumed. Use only the focused logistic cells, leaving metric reports for Section 4 and forests for Section 5. If setup or fitting would consume the slot, show prepared views of the same operations and calculations. No extra startup block or live result is assumed.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":15,"title":"Check on held-out examples","id":"day-1-lr-validation","time":"87:30–89:00 (1:30)","visible":"Validation sequences → Fixed fitted predictor → Probabilities, meeting a separate Observed validation labels branch at Compare. A detached gray Test box reads Final frozen comparison only; test never guides choices.","notes":"Training loss describes the examples used to learn the model. Validation checks how predictions perform on held-out development examples and can support later comparisons. We do not feed validation labels back into this fit. Repeated development choices also adapt to validation, so it is not the final independent assessment. Test results never guide any representation, fitting, model, hyperparameter or threshold choice, even after the planned final frozen comparison.","point":"Bring validation predictions and labels together, keeping the optimizer absent. Do not add model-complexity plots or metric definitions.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Check on held-out examples\">\u003ctitle>Check on held-out examples\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Validation rows\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Fixed model\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Compare labels\u003c/text>\u003ctext x=\"864\" y=\"540\" font-size=\"42\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Test: final frozen comparison only\u003c/text>\u003c/svg>","transition":"Bring validation predictions and labels together, keeping the optimizer absent. Do not add model-complexity plots or metric definitions.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":3,"number":16,"title":"From one prediction to many","id":"day-1-lr-validation-handoff","time":"89:00–90:00 (1:00)","visible":"One prediction's Probability + Known label expands into several aligned prediction/label pairs, with the single question What kinds of mistakes do we make?","notes":"One prediction produces a probability. Across many labeled examples, we will count types of mistakes and describe performance. That is the next question now that we understand how the model predicts and learns. Section 4 begins with the confusion matrix; no new method is hidden in this handoff.","point":"Expand one row into several, allow a brief clarification within this minute, then continue directly to Section 4 at minute 90. There is no break between Sections 3 and 4; the next break is 115–125.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"From one prediction to many\">\u003ctitle>From one prediction to many\u003c/title>\u003crect x=\"164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">One probability\u003c/text>\u003cpath d=\"M572.0 327 L646.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"646.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"664.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"864.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Many predictions\u003c/text>\u003cpath d=\"M1072.0 327 L1146.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1146.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1164.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"1364.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Which mistakes matter?\u003c/text>\u003c/svg>","transition":"Expand one row into several, allow a brief clarification within this minute, then continue directly to Section 4 at minute 90. There is no break between Sections 3 and 4; the next break is 115–125.","sourceNote":"Section 3 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":1,"title":"What makes a prediction useful?","id":"day-1-metrics-section","time":"90:00–90:15 (0:15)","visible":"Only the section title.","notes":"We have learned to produce probabilities. Now we will compare those predictions with known outcomes, work out which mistakes matter and use the notebook to inspect them.","point":"The title. Move from one prediction to a batch of validation examples.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"s2-title-rule\">\u003c/div>","transition":"The title. Move from one prediction to a batch of validation examples.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":2,"title":"Compare predictions with observations","id":"day-1-metrics-observations","time":"90:15–91:15 (1:00)","visible":"A small excerpt from a prediction table: Sequence ID, Observed class, P(B), Predicted class. Reveal predicted class at threshold 0.5. Labels identify A = 0 and B = 1; show a correct and an incorrect example.","notes":"The observed label is supplied with the example; the predicted probability comes from the fitted model. Calling B when p is at least 0.5 gives a decision we can compare with that label. Positive means B, our class of interest, rather than a guarantee of real TF binding. The label is not the simulator's planting flag. These examples are constructed for teaching; the notebook will use our actual validation predictions. Keep each probability paired with its own sample and label.","point":"Trace one row across the columns. Group all rows by observed and predicted class.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Compare predictions with observations\">\u003ctitle>Compare predictions with observations\u003c/title>\u003ctext x=\"430\" y=\"130\" font-size=\"40\" fill=\"#697782\"
