ed B. Counts are `[[40, 10], [20, 30]]`. Introduce TN, FP, FN and TP beside their plain-language descriptions after establishing the axes.","notes":"Thirty B examples were called B: true positives. Ten A examples were called B: false positives. Twenty B examples were called A: false negatives. Forty A examples were called A: true negatives. True or false describes agreement with the observation; positive or negative describes the prediction. There are 100 examples, with 50 from each observed class. Every prediction belongs to exactly one cell.","point":"Read the actual/predicted axis labels before naming cells. Keep this matrix in place for the next metric slides.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Four possible outcomes\">\u003ctitle>Four possible outcomes\u003c/title>\u003ctext x=\"900\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Predicted\u003c/text>\u003ctext x=\"720\" y=\"150\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"1040\" y=\"150\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003ctext x=\"285\" y=\"350\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Observed\u003c/text>\u003ctext x=\"450\" y=\"280\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"450\" y=\"470\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003cg opacity=\"1\">\u003crect x=\"560\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"272\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">40\u003c/text>\u003ctext x=\"705\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"272\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">10\u003c/text>\u003ctext x=\"1025\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FP\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"560\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"462\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">20\u003c/text>\u003ctext x=\"705\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"462\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">30\u003c/text>\u003ctext x=\"1025\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TP\u003c/text>\u003c/g>\u003ctext x=\"864\" y=\"650\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">100 examples\u003c/text>\u003c/svg>","transition":"Read the actual/predicted axis labels before naming cells. Keep this matrix in place for the next metric slides.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":4,"title":"How often were we right?","id":"day-1-metrics-accuracy","time":"92:45–93:30 (0:45)","visible":"The same matrix with only the two correct cells highlighted: `Accuracy = (30 + 40) / 100 = 70%`.","notes":"Accuracy is the fraction of all examples assigned the correct class. It is easy to understand, but it treats these two kinds of mistake equally and depends on the class mix. Seventy percent correct does not tell us how many useful B candidates we missed.","point":"The diagonal and total. Change the class mix in a separate example.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"How often were we right?\">\u003ctitle>How often were we right?\u003c/title>\u003ctext x=\"900\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Predicted\u003c/text>\u003ctext x=\"720\" y=\"150\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"1040\" y=\"150\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003ctext x=\"285\" y=\"350\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Observed\u003c/text>\u003ctext x=\"450\" y=\"280\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"450\" y=\"470\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003cg opacity=\"1\">\u003crect x=\"560\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"272\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">40\u003c/text>\u003ctext x=\"705\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TN\u003c/text>\u003c/g>\u003cg opacity=\"0.22\">\u003crect x=\"880\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"272\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">10\u003c/text>\u003ctext x=\"1025\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FP\u003c/text>\u003c/g>\u003cg opacity=\"0.22\">\u003crect x=\"560\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"462\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">20\u003c/text>\u003ctext x=\"705\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"462\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">30\u003c/text>\u003ctext x=\"1025\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TP\u003c/text>\u003c/g>\u003ctext x=\"864\" y=\"650\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Accuracy = 70 / 100 = 70%\u003c/text>\u003c/svg>","transition":"The diagonal and total. Change the class mix in a separate example.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":5,"title":"A high accuracy can miss every B","id":"day-1-metrics-imbalance","time":"93:30–94:45 (1:15)","visible":"A separate 100-marker population with 95 A and 5 B. An Always predict A rule gives `95% accuracy` and `0 of 5 B found`.","notes":"This is a different constructed population, not a change to our balanced course dataset. If B is rare, always predicting A can look impressive by accuracy while missing every B. The useful question depends on what we need the predictions for. This also explains why a headline score needs the population's class balance. Do not assign a precision value here: with no positive predictions its denominator is zero.","point":"The five missed B markers. Return to the original 30/10/20/40 matrix and inspect the B calls.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A high accuracy can miss every B\">\u003ctitle>A high accuracy can miss every B\u003c/title>\u003ccircle cx=\"360\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"414\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"468\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"522\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"576\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"630\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"684\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"738\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"792\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"846\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"900\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"954\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1008\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1062\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1116\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1170\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1224\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1278\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1332\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"1386\" cy=\"150\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"360\" cy=\"215\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"414\" cy=\"215\" r=\"17\" fill=\"#0072B2\"/>\u003ccircle cx=\"468\" cy= Next highlight a row instead.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"How many B calls were right?\">\u003ctitle>How many B calls were right?\u003c/title>\u003ctext x=\"900\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Predicted\u003c/text>\u003ctext x=\"720\" y=\"150\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"1040\" y=\"150\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003ctext x=\"285\" y=\"350\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Observed\u003c/text>\u003ctext x=\"450\" y=\"280\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"450\" y=\"470\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003cg opacity=\"0.22\">\u003crect x=\"560\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"272\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">40\u003c/text>\u003ctext x=\"705\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"272\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">10\u003c/text>\u003ctext x=\"1025\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FP\u003c/text>\u003c/g>\u003cg opacity=\"0.22\">\u003crect x=\"560\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"462\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">20\u003c/text>\u003ctext x=\"705\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"462\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">30\u003c/text>\u003ctext x=\"1025\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TP\u003c/text>\u003c/g>\u003ctext x=\"864\" y=\"650\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Precision = 30 / 40 = 75%\u003c/text>\u003c/svg>","transition":"Trace the highlighted column into its denominator. Next highlight a row instead.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":7,"title":"How many actual B did we find?","id":"day-1-metrics-recall","time":"96:15–97:45 (1:30)","visible":"The same matrix, now highlighting the Observed B row: 30 true positives and 20 false negatives. `Recall = 30 / (30 + 20) = 60%`.","notes":"There were 50 actual B examples and we found 30. Recall measures how much of the positive class we recovered; it is also called sensitivity or true-positive rate. Its denominator is actual positives. Precision and recall share the same numerator but ask about different groups. Both can matter when we prioritize sequences for follow-up.","point":"Point to the row denominator, then the missed 20. Give those mistakes a practical consequence.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"How many actual B did we find?\">\u003ctitle>How many actual B did we find?\u003c/title>\u003ctext x=\"900\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Predicted\u003c/text>\u003ctext x=\"720\" y=\"150\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"1040\" y=\"150\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003ctext x=\"285\" y=\"350\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">Observed\u003c/text>\u003ctext x=\"450\" y=\"280\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">A / 0\u003c/text>\u003ctext x=\"450\" y=\"470\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">B / 1\u003c/text>\u003cg opacity=\"0.22\">\u003crect x=\"560\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"272\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">40\u003c/text>\u003ctext x=\"705\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TN\u003c/text>\u003c/g>\u003cg opacity=\"0.22\">\u003crect x=\"880\" y=\"195\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"272\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">10\u003c/text>\u003ctext x=\"1025\" y=\"339\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FP\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"560\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#0072B2\" fill-opacity=\".10\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"705\" y=\"462\" font-size=\"68\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">20\u003c/text>\u003ctext x=\"705\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">FN\u003c/text>\u003c/g>\u003cg opacity=\"1\">\u003crect x=\"880\" y=\"385\" width=\"290\" height=\"165\" rx=\"18\" fill=\"#D55E00\" fill-opacity=\".10\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1025\" y=\"462\" font-size=\"68\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">30\u003c/text>\u003ctext x=\"1025\" y=\"529\" font-size=\"33\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">TP\u003c/text>\u003c/g>\u003ctext x=\"864\" y=\"650\" font-size=\"48\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">Recall = 30 / 50 = 60%\u003c/text>\u003c/svg>","transition":"Point to the row denominator, then the missed 20. Give those mistakes a practical consequence.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":8,"title":"Different mistakes have different costs","id":"day-1-metrics-error-costs","time":"97:45–98:45 (1:00)","visible":"Two branches from the same prediction workflow: False positive → unnecessary follow-up; False negative → missed candidate. Keep the biological scenario hypothetical.","notes":"A false positive and a false negative can have very different practical consequences. A small experimental budget may make wasted follow-up costly; an early discovery screen may put more weight on recovering candidates. Neither priority automatically gives a universal best metric. We should state the intended use before choosing how to judge or act on predictions.","point":"Follow both branches. Introduce one common summary of precision and recall.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Different mistakes have different costs\">\u003ctitle>Different mistakes have different costs\u003c/title>\u003crect x=\"289.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#0072B2\" fill-opacity=\".08\" stroke=\"#0072B2\" stroke-width=\"3\"/>\u003ctext x=\"489.0\" y=\"339.5\" font-size=\"40\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">False positive\u003c/text>\u003cpath d=\"M697.0 327 L1021.0 327\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" stroke-dasharray=\"\"/>\u003ctext x=\"1021.0\" y=\"340\" font-size=\"48\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">›\u003c/text>\u003crect x=\"1039.0\" y=\"250\" width=\"400\" height=\"155\" rx=\"22\" fill=\"#D55E00\" fill-opacity=\".08\" stroke=\"#D55E00\" stroke-width=\"3\"/>\u003ctext x=\"1239.0\" y=\"339.5\" font-size=\"40\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Unnecessary follow-up\u003c/text>\u003ctext x=\"864\" y=\"570\" font-size=\"58\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">False negative → missed candidate\u003c/text>\u003c/svg>","transition":"Follow both branches. Introduce one common summary of precision and recall.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":9,"title":"F1 combines precision and recall","id":"day-1-metrics-f1","time":"98:45–99:45 (1:00)","visible":"Precision 0.75 and recall 0.60 feed a single F1 readout: `F1 = 2PR / (P + R) ≈ 0.667`. Reveal the equivalent count form `2TP / (2TP + FP + FN)` in the same space.","notes":"F1 is their harmonic mean: a low value for either precision or recall pulls the summary down. It is not their ordinary arithmetic average. Here it is two-thirds. It ignores true negatives and does not encode the actual cost of mistakes, so it is a summary with a particular focus rather than an automatic choice for every problem. Understanding what it combines matters more than memorizing the formula.","point":"The two inputs and one summary. All these decision metrics depend on where we set the cutoff.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"F1 combines precision and recall\">\u003ctitle>F1 combines precision and recall\u003c/title>\u003ctext x=\"501.5\" y=\"220\" font-size=\"62\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\">Precision 0.75\u003c/text>\u003ctext x=\"1226.5\" y=\"220\" font-size=\"62\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\">Recall 0.60\u003c/text>\u003ctext x=\"864\" y=\"430\" font-size=\"70\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"400\">F1 = 2PR / (P + R) ≈ 0.667\u003c/text>\u003ctext x=\"864\" y=\"590\" font-size=\"40\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\">True negatives are outside this summary\u003c/text>\u003c/svg>","transition":"The two inputs and one summary. All these decision metrics depend on where we set the cutoff.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":10,"title":"Move the threshold","id":"day-1-metrics-threshold","time":"99:45–101:45 (2:00)","visible":"Fixed probability markers and a movable threshold, with the same confusion matrix updating alongside a compact precision/recall readout. Start at 0.5, then show 0.8 and 0.3. Use one integrated figure; move the readout between states rather than adding three panels. Static fallback uses three successive reveals.","notes":"No weights or probabilities change here. We only change the rule turning a probability into a call. At 0.5, precision is 75% and recall 60%. At 0.8 we make fewer positive calls: precision is 80% and recall 32% in this example. At 0.3 we recover more positives: precision is about 68.3% and recall 82%. Raising the threshold cannot increase positive-call count or recall on the same records, but precision need not improve at every step. These thresholds illustrate consequences; our recorded course comparison stays at the prespecified 0.5.","point":"Move 0.5 → 0.8 → 0.3, then reset to 0.5. Keep the probability ordering in view.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003cdiv class=\"lesson-live\" data-live=\"threshold\">\u003cdiv data-live-plot>\u003c/div>\u003clabel>Cutoff \u003cinput type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\" aria-label=\"Decision threshold\">\u003c/label>\u003cp data-live-readout>\u003c/p>\u003c/div>","transition":"Move 0.5 → 0.8 → 0.3, then reset to 0.5. Keep the probability ordering in view.","sourceNote":"Section 4 story and source notes govern this slide. Teaching constructions and current paired-run values are distinguished there. Validation only; no test-guided decisions."},{"sectionNumber":4,"number":11,"title":"A ranking comes before a cutoff","id":"day-1-metrics-ranking","time":"101:45–103:00 (1:15)","visible":"The same examples sorted by P(B), with actual B and A markers. Remove the decision boundary, then reveal it again without moving any scores.","notes":"The model gives an ordering as well as a probability estimate. We can ask whether B examples tend to appear above A examples across the list, or ask which examples pass one particular cutoff. These are different properties. A new cutoff changes decisions while preserving the ordering. A ranking score alone does not tell us whether a numerical probability is well calibrated; calibration is outside this short section.","point":"One B/A pair, then the entire list. Sweep the cutoff through this fixed ordering to draw a curve.","day":1,"kind":"section-two section-teaching","sectionTeaching":true,"body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"A ranking comes before a cutoff\">\u003ctitle>A ranking comes before a cutoff\u003c/title>\u003ccircle cx=\"190\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"172\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"214\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"256\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"298\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"340\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"382\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"424\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"190\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"190\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"335\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"172\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"214\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"256\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"298\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"340\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"382\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"424\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"335\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"335\" cy=\"508\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"480\" cy=\"130\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"172\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"214\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"256\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"298\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"340\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"382\" r=\"13\" fill=\"#D55E00\"/>\u003ccircle cx=\"480\" cy=\"424\" r=\"13\" fill=\"#0072B2\"/>\u003ccircle cx=\"480\" cy=\"466\" r=\"13\" fill=\"#0072B2\"/>\u0
