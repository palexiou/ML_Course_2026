390.00,518.21 1393.00,518.42 1396.00,518.63 1399.00,518.84 1402.00,519.04 1405.00,519.24 1408.00,519.43 1411.00,519.62 1414.00,519.80 1417.00,519.98 1420.00,520.16 1423.00,520.33 1426.00,520.50 1429.00,520.66 1432.00,520.83 1435.00,520.98 1438.00,521.14 1441.00,521.29 1444.00,521.44 1447.00,521.58 1450.00,521.72 1453.00,521.86 1456.00,521.99 1459.00,522.13 1462.00,522.26 1465.00,522.38 1468.00,522.51 1471.00,522.63 1474.00,522.74 1477.00,522.86 1480.00,522.97 1483.00,523.08 1486.00,523.19 1489.00,523.30 1492.00,523.40 1495.00,523.50 1498.00,523.60 1501.00,523.70 1504.00,523.79 1507.00,523.88 1510.00,523.97 1513.00,524.06 1516.00,524.15 1519.00,524.23 1522.00,524.32 1525.00,524.40 1528.00,524.48 1531.00,524.55 1534.00,524.63 1537.00,524.70 1540.00,524.78\" fill=\"none\" stroke=\"#adc4d2\" stroke-width=\"7\" stroke-linejoin=\"round\"/>\u003cg data-chart-overlay>\u003c/g>\u003c/g>\u003ctext x=\"100\" y=\"540\" font-size=\"44\" fill=\"#697782\" text-anchor=\"start\" font-weight=\"400\" >Then: how should we give it DNA?\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"Invite observations or questions about prediction changes, loss, unstable steps, validation behavior or compute cost. There is no required answer order or scored check. Revisit the distinction between computing a gradient and applying an update if needed. End by returning to the DNA input: we now understand how weights learn, but what numbers should we give the model so that sequence order remains available?","point":"Let the audience lead the discussion. Keep a static overview of the learning trace available if it helps answer a question.","transition":"Take ten minutes; then encode DNA in position and build a local detector.\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-break","anchor":"day-2-s2-break","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"Break","time":"50–60 · 10 minutes","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Ten-minute break\">\u003ctitle>Ten-minute break\u003c/title>\u003ctext x=\"864\" y=\"350\" font-size=\"120\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >10 minutes\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"Return in ten minutes. Next: encode DNA while preserving sequence order.","point":"Take the full break.","transition":"From learning weights to reading DNA in position.","sourceNote":"The break is separate from the 25-minute Section 2 teaching allocation."},{"day":2,"time":"40–50 · one-hot DNA","title":"Keep the bases in their places.","subtitle":"One-hot encoding · A, C, G, T channels","body":"\u003cpre>\u003ccode>         A  C  G  T\nA        1  0  0  0\nC        0  1  0  0\nG        0  0  1  0\nT        0  0  0  1\u003c/code>\u003c/pre>\u003cdiv class=\"story-statement\">One sequence: 4 × 160\u003c/div>\u003cp class=\"story-caption\">Columns are positions. Rows are base channels.\u003c/p>","takeaway":"One-hot encoding preserves order; it does not learn features.","notes":"Use instructor/practicals.md Day 2 snippet. Expected channel order A,C,G,T. Course inputs contain only unambiguous uppercase bases; do not invent an unknown-base encoding. Optional faster-student extension: count the number of ones per position and per sequence.","kind":"","reference":{"title":"One-hot DNA preserves each position","subtitle":"A fixed alphabet encoding is not yet a learned representation.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Encoding A C G T\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Channel / position\u003c/th>\u003cth scope=\"col\">A\u003c/th>\u003cth scope=\"col\">C\u003c/th>\u003cth scope=\"col\">G\u003c/th>\u003cth scope=\"col\">T\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Connect shape to code\u003c/h2>\u003cul>\u003cli>One sequence: \u003ccode>(4, 160)\u003c/code>.\u003c/li>\u003cli>A batch: \u003ccode>(batch, 4, 160)\u003c/code>.\u003c/li>\u003cli>Unlike A=0, C=1, G=2, T=3, one-hot does not imply numeric distances between bases.\u003c/li>\u003cli>Pair task: encode \u003ccode>ACGT\u003c/code> and identify the position axis.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"One-hot preserves order; convolution learns which local patterns matter."},"local":5,"anchor":"day-2-slide-5"},{"day":2,"time":"60–73 · convolution","title":"Slide one detector across the DNA.","subtitle":"Convolution reuses the same learned weights at each position.","body":"\u003cpre>\u003ccode>… A C G T A C G T A C …\n    [ detector ]\n      [ detector ]\n        [ detector ]\u003c/code>\u003c/pre>\u003cp class=\"story-question\">Why reuse the weights?\u003c/p>","takeaway":"The filters are learned from data; a strong activation is not proof of motif function.","notes":"Explain padding preserves length in this implementation. Slide equation suppresses padding indexing for readability. Two convolutions with ReLU are the actual filters, not a generic single-layer cartoon. Ask what the same filter can do at two positions: reuse weights.","kind":"","reference":{"title":"A convolution applies one local detector repeatedly","subtitle":"Shared weights scan the position axis; different filters can detect different patterns.","body":"\u003cdiv class=\"equation\">h\u003csub>f,t\u003c/sub> = ReLU(b\u003csub>f\u003c/sub> + Σ\u003csub>c,j\u003c/sub> W\u003csub>f,c,j\u003c/sub>x\u003csub>c,t+j\u003c/sub>)\u003csmall>f: filter · c: base channel · j: local offset · t: sequence position\u003c/small>\u003c/div>\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>One-hot DNA\u003c/b>4 channels × 160 positions\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>16 filters\u003c/b>Width 7, padding 3\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>16 filters\u003c/b>Width 5, padding 2\u003c/div>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>What is learned?\u003c/h2>\u003cp>Filter weights, not a supplied motif list. A high activation can indicate a useful local feature, but is not automatically a calibrated motif match or a causal binding event.\u003c/p>\u003c/div>","takeaway":"Weight sharing provides a local-pattern bias; the final architecture determines what happens to position."},"local":7,"anchor":"day-2-slide-7"},{"day":2,"time":"73–84 · architecture","title":"Notice a pattern. Remember where.","subtitle":"This CNN deliberately preserves position.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Convolutions\u003c/b>Local features\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Two branches\u003c/b>Flatten + global max\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Classifier\u003c/b>Combine evidence\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>Flatten\u003c/h2>\u003cp>Which feature, at which position?\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Global max\u003c/h2>\u003cp>How strongly did each feature appear anywhere?\u003c/p>\u003c/div>\u003c/div>","takeaway":"Global max alone would discard the position cue used in our control.","notes":"Show course_inference.SequenceCNN if asked; forward concatenates features.flatten(1) and features.amax(dim=2). No dropout or generic pooling-only model should be described here. Position sensitivity is useful in this construction and can be a limitation when deployment shifts motifs.","kind":"","reference":{"title":"This CNN deliberately keeps position","subtitle":"Flattened convolution map plus global max features → a small classifier.","body":"\u003cdiv class=\"flow\">\u003cdiv class=\"node\">\u003cb>Convolution map\u003c/b>16 × 160\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Concatenate\u003c/b>Flatten: 2,560\u003cbr>Global max: 16\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"node\">\u003cb>Classifier\u003c/b>2,576 → 32 → 1\u003cbr>ReLU then logit\u003c/div>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel teal\">\u003ch2>Flattened map\u003c/h2>\u003cp>Retains which activation occurred at each fixed position. The classifier can assign different weights to base-32 and base-80 neighborhoods.\u003c/p>\u003c/div>\u003cdiv class=\"panel \">\u003ch2>Global max branch\u003c/h2>\u003cp>Keeps the strongest activation per channel without its location. Global max alone would discard the position cue this teaching construction uses.\u003c/p>\u003c/div>\u003c/div>","takeaway":"The interaction result depends on a position-aware architecture, not “CNN” as a label."},"local":8,"anchor":"day-2-slide-8"},{"day":2,"time":"84–100 · practical","title":"Will learning features help here?","subtitle":"First, try the same simple-signal task.","body":"\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Inspect the one-hot shape. Train the supplied CNN. Read its validation result.\u003c/p>\u003ca href=\"../../notebooks/03_representations.ipynb\">Open code 03 ↗\u003c/a>\u003c/div>\u003cp class=\"story-question\">Make a prediction before running it.\u003c/p>","takeaway":"Use the same variants and split identities as the classical baselines.","notes":"Protect the full 16 minutes for running and interpreting. Use supplied completed code for slow students. Optional extension only: count learned parameters or inspect activations. Expected: no guaranteed advantage; model capacity and optimization differ, and validation can deteriorate while training improves. Local run timings are not a Colab classroom estimate.","kind":"","reference":{"title":"Train the supplied CNN; inspect the boundary","subtitle":"Complete a small step, not an architecture from scratch.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Run and inspect\u003c/h2>\u003cul>\u003cli>Use \u003ca href=\"../../notebooks/03_representations.ipynb\">completed notebook 03\u003c/a> and \u003ca href=\"../../instructor/practicals.md\">the Day 2 snippet\u003c/a>.\u003c/li>\u003cli>Inspect one-hot shape and the two representation branches.\u003c/li>\u003cli>Run the simple-signal training and inspect validation predictions.\u003c/li>\u003cli>Track saved epoch, seed, metric, and sample IDs.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Before looking at results\u003c/h2>\u003cul>\u003cli>Should a larger model necessarily beat the 4-mer baseline on 720 training samples?\u003c/li>\u003cli>What would overfitting look like?\u003c/li>\u003cli>If training is slow, inspect identified saved outputs rather than silently changing settings.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"A successful training loop is an engineering result; held-out prediction is a separate result."},"local":9,"anchor":"day-2-slide-9"},{"day":2,"time":"100–110 · break","title":"Break · 10 minutes","subtitle":"Next: construct a problem the bag cannot solve.","body":"\u003cdiv class=\"story-statement\">Can more trees recover missing information?\u003c/div>","takeaway":"Return at minute 110.","notes":"Use the full ten minutes. Check the next practical cell before students return. If behind schedule, shorten optional model detail, not the evaluation discussion.","kind":"break","reference":{"title":"Break · 10 minutes","subtitle":"Step away. Return at the time shown in the session plan.","body":"\u003cdiv class=\"eyebrow\">After the break\u003c/div>\u003ch2>A controlled fixed-position motif-order experiment\u003c/h2>\u003cp>Leave model settings unchanged. Keep protected test results closed.\u003c/p>","takeaway":"Questions and interpretation are protected teaching time."},"local":10,"anchor":"day-2-slide-10"},{"day":2,"time":"110–123 · interaction construction","title":"Two sequences. Same ingredients.","subtitle":"Interaction-signal variant · an engineered fixed-position order control","body":"\u003cdiv class=\"sequence-pair\" role=\"img\" aria-label=\"Class 1 has motif A at position 38 and B at 86; class 0 reverses them. Shared backgrounds and matching flanks give identical 4-mer bags.\">\u003cdiv class=\"sequence-axis\">\u003cspan>\u003c/span>\u003cspan>motif start 38\u003c/span>\u003cspan>motif start 86\u003c/span>\u003c/div>\u003cdiv>\u003cb>Class 1\u003c/b>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003c/div>\u003cdiv>\u003cb>Class 0\u003c/b>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"story-caption\">Shared background · matching flanks · each pair stays in one split\u003c/p>","takeaway":"This construction tests representation, not realistic promoter grammar.","notes":"The diagram abbreviates the second block; explain that both flanks are present at both positions. The code positions refer to the start of the flank+motif+flank block, not the motif itself. Do not imply realistic promoter architecture, learned spacing rules, or arbitrary long-range interactions.","kind":"","reference":{"title":"Same ingredients; different fixed-position order","subtitle":"Interaction-signal variant · 240 independent pairs · 480 sequences · paired splits","body":"\u003cdiv class=\"panel blue\">\u003ch2>Illustrative pair · shared background within a pair\u003c/h2>\u003cdiv class=\"dna\">\u003cspan class=\"position\">Class 1 · block 32\u003c/span>\u003cspan>GGGGGG\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003cspan>CCCCCC\u003c/span>\u003cspan>…\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003c/div>\u003cdiv class=\"dna\">\u003cspan class=\"position\">Class 0 · block 32\u003c/span>\u003cspan>GGGGGG\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003cspan>CCCCCC\u003c/span>\u003cspan>…\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003c/div>\u003cp class=\"small\">The second full block starts at 80. Both blocks have six Gs before and six Cs after the motif. Starts 32 and 80 are zero-based block starts; motif starts are 38 and 86.\u003c/p>\u003c/div>\u003cul>\u003cli>Swap the motifs between the two fixed blocks, leaving shared background unchanged.\u003c/li>\u003cli>Both members of each pair stay in one partition: 144 / 48 / 48 pairs in train / validation / test.\u003c/li>\u003c/ul>","takeaway":"This is engineered fixed-position motif order, not a general biological grammar task."},"local":11,"anchor":"day-2-slide-11"},{"day":2,"time":"123–132 · representation proof","title":"The bag sees the same input twice.","subtitle":"Matching flanks preserve every 4-mer count when the motifs swap.","body":"\u003cdiv class=\"equation\">4-mer bag(sequence₀) = 4-mer bag(sequence₁)\u003c/div>\u003cdiv class=\"story-statement\">Same vector → same score\u003c/div>\u003cp class=\"story-caption\">Yet the two sequences have opposite labels.\u003c/p>\u003cp class=\"story-question\">Would a thousand more trees help?\u003c/p>","takeaway":"No classifier can recover a distinction that its input representation removed.","notes":"Ask students whether adding more trees can distinguish identical vectors: no. This exact equality relies on the construction, not all motif swaps. The paired balanced test structure is the mathematical control; do not inspect protected labels in class to check it.","kind":"","reference":{"title":"Identical feature vectors force identical scores","subtitle":"A controlled impossibility result for any classifier using only these 4-mer bags.","body":"\u003cdiv class=\"equation\">φ\u003csub>4-mer\u003c/sub>(sequence\u003csub>0\u003c/sub>) = φ\u003csub>4-mer\u003c/sub>(sequence\u003csub>1\u003c/sub>)\u003csmall>Matching flanks preserve boundary windows when the equal-length motif blocks are swapped.\u003c/small>\u003c/div>\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Why the bag cannot solve it\u003c/h2>\u003cp>Each pair supplies the same vector with opposite labels. A deterministic classifier of that vector must assign the same score to both members.\u003c/p>\u003cp>The balanced paired evaluation therefore yields chance ROC-AUC.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Why this CNN can distinguish them\u003c/h2>\u003cp>Flattened activations retain fixed positions. A dense layer can use “motif A near the first block” versus “motif A near the second block.”\u003c/p>\u003cp>That does not show position-invariant reasoning.\u003c/p>\u003c/div>\u003c/div>","takeaway":"No hyperparameter search can recover information that the representation removed."},"local":12,"anchor":"day-2-slide-12"},{"day":2,"time":"132–140 · observed validation","title":"The winner depends on the question.","subtitle":"Recorded local validation · ROC-AUC · identical split identities","body":"\u003cdiv class=\"chart-legend\">\u003cspan>\u003ci style=\"background:#234e70\">\u003c/i>Simple-signal\u003c/span>\u003cspan>\u003ci style=\"background:#216869\">\u003c/i>Interaction-signal\u003c/span>\u003c/div>\u003csvg class=\"score-chart\" viewBox=\"0 0 1640 450\" role=\"img\" aria-label=\"Recorded local validation ROC-AUC, on a zero-to-one axis. 4-mer logistic regression: Simple-signal 0.802, Interaction-signal 0.500; 4-mer random forest: Simple-signal 0.907, Interaction-signal 0.500; Position-aware CNN: Simple-signal 0.564, Interaction-signal 1.000\">\u003cline x1=\"1025\" x2=\"1025\" y1=\"8\" y2=\"402\" stroke=\"#8c9ba8\" stroke-width=\"2\" stroke-dasharray=\"7 7\"/>\u003ctext x=\"0\" y=\"50\" class=\"chart-label\">4-mer logistic regression\u003c/text>\u003crect x=\"500\" y=\"20\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"20\" width=\"842.0412\" height=\"30\" rx=\"6\" fill=\"#234e70\"/>\u003ctext x=\"1354.0412000000001\" y=\"45\" class=\"chart-value\">0.802\u003c/text>\u003crect x=\"500\" y=\"63\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"63\" width=\"525\" height=\"30\" rx=\"6\" fill=\"#216869\"/>\u003ctext x=\"1037\" y=\"88\" class=\"chart-value\">0.500\u003c/text>\u003ctext x=\"0\" y=\"176\" class=\"chart-label\">4-mer random forest\u003c/text>\u003crect x=\"500\" y=\"146\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"146\" width=\"952.1463\" height=\"30\" rx=\"6\" fill=\"#234e70\"/>\u003ctext x=\"1464.1462999999999\" y=\"171\" class=\"chart-value\">0.907\u003c/text>\u003crect x=\"500\" y=\"189\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"189\" width=\"525\" height=\"30\" rx=\"6\" fill=\"#216869\"/>\u003ctext x=\"1037\" y=\"214\" class=\"chart-value\">0.500\u003c/text>\u003ctext x=\"0\" y=\"302\" class=\"chart-label\">Position-aware CNN\u003c/text>\u003crect x=\"500\" y=\"272\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"272\" width=\"592.5213\" height=\"30\" rx=\"6\" fill=\"#234e70\"/>\u003ctext x=\"1104.5212999999999\" y=\"297\" class=\"chart-value\">0.564\u003c/text>\u003crect x=\"500\" y=\"315\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#edf1f5\"/>\u003crect x=\"500\" y=\"315\" width=\"1050\" height=\"30\" rx=\"6\" fill=\"#216869\"/>\u003ctext x=\"1562\" y=\"340\" class=\"chart-value\">1.000\u003c/text>\u003ctext x=\"500\" y=\"435\" class=\"chart-axis\">0\u003c/text>\u003ctext x=\"1025\" y=\"435\" text-anchor=\"middle\" class=\"chart-axis\">0.5 · chance ranking\u003c/text>\u003ctext x=\"1550\" y=\"435\" text-anchor=\"end\" class=\"chart-axis\">1.0\u003c/text>\u003c/svg>","takeaway":"The CNN solves our engineered position control, but struggles on the noisy simple-signal run.","notes":"These are supplied default local results, not fabricated examples or test results. If rerun changes configuration, clearly distinguish the new run. Ask students to explain why the CNN column does not invalidate the classical baseline or prove biological utility.","kind":"","reference":{"title":"The same comparison tells two different stories","subtitle":"Actual default validation ROC-AUC · fixed split identities · no promised ranking","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Method\u003c/th>\u003cth scope=\"col\">Simple-signal\u003c/th>\u003cth scope=\"col\">Interaction-signal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4-mer logistic regression\u003c/td>\u003ctd>0.801944\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4-mer random forest\u003c/td>\u003ctd>0.906806\u003c/td>\u003ctd>0.500000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Position-aware CNN\u003c/td>\u003ctd>0.564306\u003c/td>\u003ctd>1.000000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Interpret both columns\u003c/h2>\u003cp>The CNN is weak on the noisy simple-signal run yet solves the engineered fixed-position control. The comparison demonstrates a representation distinction, not universal superiority.\u003c/p>\u003c/div>","takeaway":"A controlled result can be informative without being a realistic biological benchmark."},"local":13,"anchor":"day-2-slide-13"},{"day":2,"time":"140–150 · controlled changes","title":"Swap the motifs. Predict the response.","subtitle":"A controlled change tests an explanation.","body":"\u003cdiv class=\"sequence-pair\" role=\"img\" aria-label=\"Class 1 has motif A at position 38 and B at 86; class 0 reverses them. Shared backgrounds and matching flanks give identical 4-mer bags.\">\u003cdiv class=\"sequence-axis\">\u003cspan>\u003c/span>\u003cspan>motif start 38\u003c/span>\u003cspan>motif start 86\u003c/span>\u003c/div>\u003cdiv>\u003cb>Class 1\u003c/b>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003c/div>\u003cdiv>\u003cb>Class 0\u003c/b>\u003cspan class=\"motif second\">CGGACGTC\u003c/span>\u003cspan class=\"motif\">TATAAATG\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"story-caption\">Shared background · matching flanks · each pair stays in one split\u003c/p>\u003cdiv class=\"story-task\">\u003cspan class=\"eyebrow\">Try it together\u003c/span>\u003cp>Check equal 4-mer vectors. Compare the fitted models’ predictions.\u003c/p>\u003ca href=\"../../instructor/practicals.md\">Open the Day 2 exercise ↗\u003c/a>\u003c/div>","takeaway":"Observed sensitivity supports a claim about this predictor, not biological causality.","notes":"Use instructor/completed/day2_representation.py for the focused activity. Ask whether a CNN response proves a motif is biologically functional: no. Keep unperformed moves, deletions, and randomizations labeled hypothetical. Any new experiment remains validation-only.","kind":"","reference":{"title":"Probe model behavior, not only its score","subtitle":"Predict a response before running a controlled change.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel \">\u003ch2>Use the Day 2 activity\u003c/h2>\u003cul>\u003cli>Swap the two motif blocks in the paired construction.\u003c/li>\u003cli>Verify that the 4-mer vectors remain equal.\u003c/li>\u003cli>Compare predicted probabilities for the pair.\u003c/li>\u003cli>Inspect which position-aware signal the CNN could exploit.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"panel blue\">\u003ch2>Separate experiment from speculation\u003c/h2>\u003cul>\u003cli>Expected control: same 4-mer input implies the same baseline score.\u003c/li>\u003cli>Observed CNN response is evidence about this fitted predictor.\u003c/li>\u003cli>New motif positions are an optional distribution-shift question, not a reported result.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","takeaway":"A prediction-change experiment can challenge an explanation; it does not establish biological causality."},"local":14,"anchor":"day-2-slide-14"},{"day":2,"time":"150–180 · synthesis and buffer","title":"Which representation would you choose?","subtitle":"Explain the information you need before choosing the model.","body":"\u003cdiv class=\"columns\">\u003cdiv class=\"panel blue\">\u003ch2>Count words\u003c/h2>\u003cp>Cheap, direct features. Position is lost.\u003c/p>\u003c/div>\u003cdiv class=\"panel teal\">\u003ch2>Learn local features\u003c/h2>\u003cp>Position can survive. Training and interpretation cost more.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"story-question\">Could we borrow features learned somewhere else?\u003c/p>","takeaway":"Tomorrow: reuse a pretrained representation.","notes":"Suggested 8 minutes pairs, 10 debrief, 7 recap, 5 buffer. Expected preferences include cost, reproducibility, fewer samples, and transparent feature assumptions. Do not promise pretrained embeddings will improve tomorrow’s results. Protect interpretation over extra optimizer or transformer theory.","kind":"","reference":{"title":"Choose an inductive bias you can defend","subtitle":"Discuss in pairs, report one limitation, then take questions.","body":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Choice\u003c/th>\u003cth scope=\"col\">Exposes / retains\u003c/th>\u003cth scope=\"col\">Limit to remember\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4-mer bag\u003c/td>\u003ctd>Local composition; cheap, direct features\u003c/td>\u003ctd>Fixed-position order is absent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One-hot + this CNN\u003c/td>\u003ctd>Local detectors and position-aware combination\u003c/td>\u003ctd>Data/optimization cost; fixed-position reliance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tomorrow’s frozen embeddings\u003c/td>\u003ctd>A representation learned before our task\u003c/td>\u003ctd>Transfer is not guaranteed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"panel teal\">\u003ch2>Exit discussion\u003c/h2>\u003cp>When would you prefer the simple model even if a flexible model can fit a constructed task? Which evidence would justify collecting biological data rather than trying another architecture?\u003c/p>\u003c/div>","takeaway":"The scientific question and the information available determine what “better” means."},"local":15,"anchor":"day-2-slide-15"}]</script>

<script id="day-two-opening-interactions">
/* Inlined by build_day2_section1.py; deterministic teaching examples only. */
function bindDayTwoOpening() {
    const relu = document.querySelector('[data-relu]');
    const input = relu.querySelector('input');
    function updateRelu() {
        const count = Number(input.value);
        const z = 1.6 - 0.2 * count, h = Math.max(0, z);
        const x = 440 + (z + 3) / 6 * 900, y = 420 - h / 3 * 365;
        const point = relu.querySelector('[data-relu-point]');
        point.querySelector('path').setAttribute('d', `M${x} 420 L${x} ${y}`);
        point.querySelector('circle').setAttribute('cx', x);
        point.querySelector('circle').setAttribute('cy', y);
        relu.querySelector('[data-relu-readout]').textContent = `CGCG = ${count} → z = ${z.toFixed(1)} → h = ${h.toFixed(1)}`;
        input.setAttribute('aria-valuetext', `${count} CGCG occurrences; score ${z.toFixed(1)}; activation ${h.toFixed(1)}`);
    }
    input.addEventListener('input', updateRelu);
    relu.querySelectorAll('[data-count]').forEach(button => button.addEventListener('click', () => {
        input.value = button.dataset.count;
        updateRelu();
    }));
    updateRelu();

    const hidden = document.querySelector('[data-hidden-layer]');
    hidden.querySelectorAll('[data-unit]').forEach(button => button.addEventListener('click', () => {
        const index = Number(button.dataset.unit);
        hidden.querySelectorAll('[data-unit-path]').forEach(path => path.style.opacity = Number(path.dataset.unitPath) === index ? 1 : .16);
        hidden.querySelectorAll('[data-unit]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        hidden.querySelector('[data-unit-weights]').textContent = ['0.6, 0.8, −0.2','−0.3, 0.2, 0.5','0.2, −0.5, 0.1'][index];
        hidden.querySelector('[data-unit-bias]').textContent = ['bias −0.4','bias −0.1','bias −0.4'][index];
        hidden.querySelector('[data-unit-activation]').textContent = ['h₁ = ReLU(1.0) = 1.0','h₂ = ReLU(1.0) = 1.0','h₃ = ReLU(−0.2) = 0.0'][index];
        hidden.querySelector('[data-unit-readout]').textContent = `h${['₁','₂','₃'][index]}: own weights + own bias → ReLU → ${[1,1,0][index].toFixed(1)}`;
    }));

    const forward = document.querySelector('[data-forward]');
    const next = forward.querySelector('[data-forward-next]');
    let stage = 0;
    const descriptions = [
        'Start with one sequence’s counts.',
        'Hidden features: h₁ = 1, h₂ = 1, h₃ = 0.',
        'Output score: 1.2 × 1 − 0.7 × 1 + 0.5 × 0 − 0.2 = 0.3.',
        'Sigmoid(0.3) ≈ 0.574 → P(B).',
    ];
    function updateForward() {
        forward.querySelectorAll('[data-unit-path]').forEach(path => path.style.opacity = stage >= 1 ? 1 : .12);
        forward.querySelector('[data-forward-part="output"]').style.opacity = stage >= 2 ? 1 : .12;
        forward.querySelector('[data-forward-part="probability"]').style.opacity = stage >= 3 ? 1 : .12;
        forward.querySelector('[data-forward-readout]').textContent = descriptions[stage];
        next.textContent = ['Trace the prediction', 'Combine the features', 'Apply sigmoid', 'Prediction complete'][stage];
        next.disabled = stage === 3;
    }
    next.addEventListener('click', () => { stage = Math.min(3, stage + 1); updateForward(); });
    forward.querySelector('[data-forward-reset]').addEventListener('click', () => { stage = 0; updateForward(); });
    updateForward();
    // Print every stage at full contrast, restoring the teaching state afterwards.
    addEventListener('beforeprint', () => forward.querySelectorAll('[data-unit-path], [data-forward-part]').forEach(part => {
        part.dataset.screenOpacity = part.style.opacity;
        part.style.opacity = 1;
    }));
    addEventListener('afterprint', () => forward.querySelectorAll('[data-unit-path], [data-forward-part]').forEach(part => {
        part.style.opacity = part.dataset.screenOpacity;
    }));
}

</script>
<script id="day-two-learning-interactions">
/* Deterministic teaching constructions. No model fitting or external requests. */
function bindDayTwoLearning() {
    const panels = Object.fromEntries([...document.querySelectorAll('[data-learning]')].map(p => [p.dataset.learning, p]));
    const q = (panel, selector) => panel.querySelector(selector);
    const read = (panel, value) => { const node = q(panel, '[data-learning-readout]'); if (node) node.textContent = value; };
    const sigmoid = z => 1 / (1 + Math.exp(-z));
    const ns = 'http://www.w3.org/2000/svg';
    function shape(parent, tag, attrs) {
        const node = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        parent.append(node);
        return node;
    }
    function overlay(panel, key) {
        const chart = q(panel, `[data-chart="${key}"]`), d = Object.fromEntries(Object.entries(chart.dataset).map(([k,v]) => [k, Number(v)]));
        const group = q(chart, '[data-chart-overlay]');
        group.replaceChildren();
        return { group, x: v => d.x + (v - d.xmin) / (d.xmax - d.xmin) * d.w, y: v => d.y + d.h - (v - d.ymin) / (d.ymax - d.ymin) * d.h, bottom: d.y + d.h };
    }
    function dot(plot, x, y, color = '#0072B2', radius = 13) {
        shape(plot.group, 'circle', {cx: plot.x(x), cy: plot.y(y), r: radius, fill: color, stroke: 'white', 'stroke-width': 3});
    }
    function path(plot, points, color, width = 5, dash = '') {
        shape(plot.group, 'polyline', {points: points.map(([x,y]) => `${plot.x(x)},${plot.y(y)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': width, 'stroke-dasharray': dash});
    }

    const parameter = panels.parameters;
    q(parameter, '[data-parameter="bias"]').style.opacity = .12;
    parameter.querySelectorAll('[data-parameter-select]').forEach(button => button.addEventListener('click', () => {
        parameter.querySelectorAll('[data-parameter]').forEach(group => group.style.opacity = group.dataset.parameter === button.dataset.parameterSelect ? 1 : .12);
        parameter.querySelectorAll('[data-parameter-select]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
    q(panels.forward, '[data-label-reveal]').addEventListener('click', event => {
        q(panels.forward, '[data-observed-label]').style.opacity = 1;
        event.currentTarget.disabled = true;
    });

    const loss = panels.loss;
    function lossPoint(probability) {
        const value = -Math.log(probability), plot = overlay(loss, 'loss');
        shape(plot.group, 'path', {d: `M${plot.x(probability)} ${plot.bottom} L${plot.x(probability)} ${plot.y(value)}`, fill: 'none', stroke: '#0072B2', 'stroke-width': 3, 'stroke-dasharray': '8 8'});
        dot(plot, probability, value);
        read(loss, `P(B) ≈ ${probability.toFixed(3)} → loss ≈ ${value.toFixed(3)} · observed B / y = 1`);
    }
    loss.querySelectorAll('[data-probability]').forEach(button => button.addEventListener('click', () => lossPoint(button.dataset.probability === 'current' ? sigmoid(.3) : Number(button.dataset.probability))));
    lossPoint(sigmoid(.3));

    const gradient = panels.gradient, weight = q(gradient, 'input');
    function weightPoint() {
        const v = Number(weight.value), value = Math.log1p(Math.exp(.9 - v)), g = sigmoid(v - .9) - 1, plot = overlay(gradient, 'weight');
        const left = Math.max(.8,v-.07), right = Math.min(1.6,v+.07);
        path(plot, [[left, value+(left-v)*g], [right, value+(right-v)*g]], '#0072B2', 5);
        dot(plot, v, value);
        weight.setAttribute('aria-valuetext', `Output weight ${v.toFixed(2)}, loss ${value.toFixed(3)}, gradient ${g.toFixed(3)}`);
        read(gradient, `v₁ = ${v.toFixed(2)} → loss ≈ ${value.toFixed(3)} · local gradient ≈ ${g.toFixed(3)}`);
    }
    weight.addEventListener('input', weightPoint);
    gradient.querySelectorAll('[data-weight]').forEach(button => button.addEventListener('click', () => { weight.value = button.dataset.weight; weightPoint(); }));
    weightPoint();

    const backprop = panels.backprop;
    let backwardStage = 0;
    function backward() {
        ['output','hidden','earlier'].forEach((key, index) => q(backprop, `[data-backward="${key}"]`).style.opacity = backwardStage > index ? 1 : .08);
        const next = q(backprop, '[data-backward-next]');
        next.disabled = backwardStage === 3;
        next.textContent = ['Trace loss sensitivity','Reach the hidden layer','Reach earlier parameters','Gradients computed'][backwardStage];
    }
    q(backprop, '[data-backward-next]').addEventListener('click', () => { backwardStage = Math.min(3, backwardStage + 1); backward(); });
    q(backprop, '[data-backward-reset]').addEventListener('click', () => { backwardStage = 0; backward(); });
    backward();

    const update = panels.update, initial = 1.2, g = sigmoid(.3) - 1, moved = initial - .1*g;
    let stepped = false;
    function updatePoint() {
        const plot = overlay(update, 'update'), value = v => Math.log1p(Math.exp(.9-v));
        dot(plot, initial, value(initial), '#0072B2', 12);
        if (stepped) {
            path(plot, [[initial,value(initial)],[moved,value(moved)]], '#D55E00', 5, '9 7');
            dot(plot, moved, value(moved), '#D55E00', 15);
        }
        const v = stepped ? moved : initial;
        q(update, '[data-weight-step]').disabled = stepped;
        read(update, `v₁ = ${v.toFixed(3)} → P(B) ≈ ${sigmoid(v-.9).toFixed(3)} → loss ≈ ${value(v).toFixed(3)}`);
    }
    q(update, '[data-weight-step]').addEventListener('click', () => { stepped = true; updatePoint(); });
    q(update, '[data-weight-reset]').addEventListener('click', () => { stepped = false; updatePoint(); });
    updatePoint();

    const rate = panels.rate;
    let rateStep = 0;
    function ratePaths() {
        for (const [key, eta, color] of [['small',.2,'#0072B2'],['large',1.1,'#D55E00']]) {
            const plot = overlay(rate, key), points = [];
            let w = 3;
            for (let i=0; i<=rateStep; i++) { points.push([w,(w-1)**2]); w -= eta*2*(w-1); }
            path(plot, points, color, 4, '8 5');
            points.forEach(([x,y]) => dot(plot, x, y, color, 8));
            dot(plot, ...points[points.length-1], color, 12);
        }
        q(rate, '[data-rate-next]').disabled = rateStep === 6;
        read(rate, `Same starting weight, different step sizes · step ${rateStep} of 6`);
    }
    q(rate, '[data-rate-next]').addEventListener('click', () => { rateStep = Math.min(6, rateStep + 1); ratePaths(); });
    q(rate, '[data-rate-reset]').addEventListener('click', () => { rateStep = 0; ratePaths(); });
    ratePaths();

    const epoch = panels.epoch;
    let pass = 1, batch = 0;
    function epochView() {
        epoch.querySelectorAll('[data-epoch-batch]').forEach(group => {
            const index = Number(group.dataset.epochBatch);
            group.classList.toggle('done', index < batch);
            group.classList.toggle('current', index === batch && batch < 12);
            const first = index*64;
            q(group, '[data-epoch-rows]').textContent = pass === 1 ? `Rows ${first+1}–${Math.min(720,first+64)}` : `${(first*31+(pass-1)*137)%720+1}, ${((first+1)*31+(pass-1)*137)%720+1}, …`;
        });
        q(epoch, '[data-epoch-next]').textContent = batch === 12 ? 'Begin next epoch' : 'Next update';
        const examples = Math.min(720, batch*64);
        read(epoch, `Epoch ${pass} · ${batch} / 12 updates · ${examples} / 720 examples${pass > 1 ? ' · reshuffled row order' : ''}`);
    }
    q(epoch, '[data-epoch-next]').addEventListener('click', () => { if (batch === 12) { pass++; batch = 0; } else batch++; epochView(); });
    q(epoch, '[data-epoch-reset]').addEventListener('click', () => { pass = 1; batch = 0; epochView(); });
    epochView();

    const code = panels.code;
    let codeLine = 0;
    const operations = ['Clear old gradients before the next minibatch.','Forward: compute logits using the current weights.','Loss: compare logits with this minibatch’s labels.','Backward: compute gradients, keeping weights unchanged.','Step: Adam uses the gradients to update parameters.'];
    function codeView() {
        code.querySelectorAll('[data-code-line]').forEach(line => line.classList.toggle('current', Number(line.dataset.codeLine) === codeLine));
        q(code, '[data-code-next]').disabled = codeLine === 4;
        read(code, operations[codeLine]);
    }
    q(code, '[data-code-next]').addEventListener('click', () => { codeLine = Math.min(4,codeLine+1); codeView(); });
    q(code, '[data-code-reset]').addEventListener('click', () => { codeLine = 0; codeView(); });
    codeView();

    const validation = panels.validation, epochs = [1,8,16,24], scores = [.62,.66,.64,.63];
    let selected = false;
    function checkpoint() {
        const best = scores.reduce((best, score, index) => score > scores[best] ? index : best, 0);
        for (const [key, values, color] of [['train',[.66,.61,.54,.48],'#0072B2'],['validation',scores,'#D55E00']]) {
            const plot = overlay(validation,key);
            epochs.forEach((x,index) => dot(plot,x,values[index],color,9));
            if (selected) {
                shape(plot.group, 'path', {d: `M${plot.x(epochs[best])} ${plot.bottom} L${plot.x(epochs[best])} ${plot.y(values[best])}`, fill:'none',stroke:'#D55E00','stroke-width':4,'stroke-dasharray':'10 8'});
                dot(plot,epochs[best],values[best],'#D55E00',16);
            }
        }
        if (selected) read(validation,`Selected epoch ${epochs[best]} · highest validation ROC-AUC ${scores[best].toFixed(2)} · training still runs to epoch 24`);
        q(validation,'[data-select-checkpoint]').disabled = selected;
    }
    q(validation,'[data-select-checkpoint]').addEventListener('click', () => { selected = true; checkpoint(); });
    checkpoint();

    let saved;
    addEventListener('beforeprint', () => {
        saved = {backwardStage,stepped,rateStep,pass,batch,selected,opacity:[]};
        document.querySelectorAll('.day-two-learning [data-parameter], .day-two-learning [data-observed-label]').forEach(part => { saved.opacity.push([part,part.style.opacity]); part.style.opacity = 1; });
        backwardStage=3; stepped=true; rateStep=6; batch=12; selected=true;
        backward(); updatePoint(); ratePaths(); epochView(); checkpoint();
    });
    addEventListener('afterprint', () => {
        if (!saved) return;
        ({backwardStage,stepped,rateStep,pass,batch,selected} = saved);
        saved.opacity.forEach(([part,opacity]) => part.style.opacity = opacity);
        backward(); updatePoint(); ratePaths(); epochView(); checkpoint();
        if (!selected) read(validation,'Training improves; validation does not keep improving.');
    });
}

</script>
<script id="presentation-controller">
class SlidePresentation {
    constructor() {
        this.stage = document.getElementById('stage');
        this.index = 0;
        this.editing = false;
        this.notesOpen = false;
        this.storageKey = 'ml-course-2026-day-2-edits-v1';
        this.edits = {};
        const embedded = document.getElementById('saved-edits');
        if (embedded) this.edits = JSON.parse(embedded.textContent);
        try {
            const oldEdits = JSON.parse(localStorage.getItem('ml-course-2026-day1-teaching-v3') || '{}');
            const migrated = Object.fromEntries(Object.entries(oldEdits).filter(([key]) => key.startsWith('day-2-')));
            this.edits = {...migrated, ...this.edits, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}')};
        } catch (error) {
            this.status('Local autosave is unavailable; use Save HTML to preserve edits.');
        }
        const dayCounts = {};
        slides.forEach(slide => {
            slide.local = (dayCounts[slide.day] || 0) + 1;
            dayCounts[slide.day] = slide.local;
            slide.anchor = slide.id || slide.anchor || `day-${slide.day}-slide-${slide.local}`;
        });
        this.dayCounts = dayCounts;
        this.render();
        this.bind();
        this.fitStage();
        this.readHash();
    }
    status(message) {
        document.getElementById('saveStatus').textContent = message;
    }
    render() {
        this.stage.innerHTML = slides.map((slide, index) => `
            <section class="slide ${slide.kind}" id="slide-${index + 1}" data-day="${slide.day}" data-local="${slide.local}" role="group" aria-roledescription="slide" aria-label="Day ${slide.day}, slide ${slide.local} of ${this.dayCounts[slide.day]}" aria-labelledby="title-${index + 1}">
                <div class="slide-top"><span>Day ${slide.day} · ${['', 'Define & evaluate', 'Learn the representation', 'Reuse pretrained features', 'Specify, delegate & audit'][slide.day]}</span><span class="timing">${slide.time} &nbsp; | &nbsp; D${slide.day} · ${slide.local}/${this.dayCounts[slide.day]}</span></div>
                <h1 id="title-${index + 1}">${slide.title}</h1><p class="subtitle">${slide.subtitle}</p>
                <div class="content">${slide.body}</div>
                <footer class="takeaway"><strong>Key point</strong><span>${slide.takeaway}</span></footer>
                <aside class="notes" tabindex="-1" aria-label="Instructor notes">
                    <h2>Day ${slide.day} · Slide ${slide.local} · ${slide.title}</h2>
                    ${slide.sectionOne || slide.sectionLearning ? `<p><strong>SAY:</strong> ${slide.notes}</p><p><strong>POINT:</strong> ${slide.point}</p><p><strong>TRANSITION:</strong> ${slide.transition}</p><p class="small"><strong>Timing:</strong> ${slide.time}</p><p class="small">${slide.sourceNote}</p><p><a href="story.md#section-${slide.sectionLearning ? 2 : 1}">Section ${slide.sectionLearning ? 2 : 1} story</a></p>` : `<p>${slide.notes}</p>`}

                    ${slide.reference ? `<details><summary>Technical reference · original teaching detail</summary><div class="reference"><h3>${slide.reference.title}</h3><p>${slide.reference.subtitle}</p>${slide.reference.body}<p><strong>Teaching point:</strong> ${slide.reference.takeaway}</p></div></details>` : ''}
                    <div class="note-heading">Teaching resources</div><p><a href="../index.html">All days</a> · <a href="../../instructor/guide.md">Instructor guide</a> · <a href="../../instructor/answers.md">Exercise answers</a></p><p class="small">N closes notes. Timings are suggested allocations; pause on practical slides while students work.</p>
                </aside>
            </section>`).join('');
        this.sections = [...this.stage.querySelectorAll('.slide')];
        this.sections.forEach((section, slideIndex) => {
            const editable = section.querySelectorAll('h1, .subtitle, .content h2, .content p:not(:has(a)), .content li:not(:has(a)), .content td, .content th, .takeaway span');
            [...editable].filter(element => !element.closest('.d1-demo, .d2-live')).forEach((element, elementIndex) => {
                const key = `${slides[slideIndex].anchor}-${elementIndex}`;
                element.dataset.edit = key;
                if (Object.hasOwn(this.edits, key)) element.textContent = this.edits[key];
                element.addEventListener('input', () => {
                    this.edits[key] = element.textContent;
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.edits));
                        this.status('Text saved on this browser. Save HTML for a portable copy.');
                    } catch (error) {
                        this.status('Autosave failed. Use Save HTML before closing.');
                    }
                });
            });
        });
    }
    fitStage() {
        const chromeHeight = document.querySelector('.deck-controls').getBoundingClientRect().height + 16;
        const availableHeight = Math.max(1, innerHeight - chromeHeight);
        const scale = Math.min(innerWidth / 1920, availableHeight / 1080);
        const left = (innerWidth - 1920 * scale) / 2;
        const top = (availableHeight - 1080 * scale) / 2;
        this.stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }
    readHash() {
        const openingAliases = {"#day-2-slide-1": "day-2-s1-welcome", "#day-2-slide-2": "day-2-s1-weighted-sum", "#day-2-slide-3": "day-2-s2-loss", "#day-2-slide-4": "day-2-s2-update", "#day-2-slide-6": "day-2-s2-break"};
        const target = openingAliases[location.hash] || location.hash.slice(1);
        const exact = slides.findIndex(slide => slide.anchor === target);
        if (exact >= 0) { this.go(exact, false); return; }
        const localMatch = location.hash.match(/^#day-([1-4])-slide-(\d+)$/);
        const dayMatch = location.hash.match(/^#day-([1-4])$/);
        const slideMatch = location.hash.match(/^#slide-(\d+)$/);
        if (localMatch && Number(localMatch[1]) !== 2) { location.href = `../Day_${localMatch[1]}/presentation.html${location.hash}`; return; }
        if (localMatch) this.go(Math.max(0, slides.findIndex(s => s.day === Number(localMatch[1]) && s.local === Number(localMatch[2]))), false);
        else if (dayMatch) this.goDay(Number(dayMatch[1]));
        else this.go(slideMatch ? Number(slideMatch[1]) - 1 : 0, false);
    }
    go(index, updateHash = true) {
        this.index = Math.max(0, Math.min(this.sections.length - 1, index));
        this.sections.forEach((section, sectionIndex) => {
            const active = sectionIndex === this.index;
            section.classList.toggle('active', active);
            section.setAttribute('aria-hidden', String(!active));
            section.inert = !active;
            section.querySelector('.notes').classList.toggle('show', active && this.notesOpen);
        });
        document.getElementById('counter').textContent = `${this.index + 1}/${this.sections.length}`;
        document.getElementById('progressBar').style.width = `${(this.index + 1) / this.sections.length * 100}%`;
        document.getElementById('daySelect').value = slides[this.index].day;
        document.getElementById('slideSelect').value = this.index;
        document.getElementById('announcement').textContent = `Day ${slides[this.index].day}, slide ${this.index + 1} of ${this.sections.length}: ${this.sections[this.index].querySelector('h1').textContent}`;
        if (updateHash) history.replaceState(null, '', `#${slides[this.index].anchor}`);
    }
    goDay(day) {
        if (day === 2) this.go(0);
        else location.href = `../Day_${day}/presentation.html`;
    }
    toggleNotes() {
        this.notesOpen = !this.notesOpen;
        document.getElementById('notesToggle').setAttribute('aria-pressed', String(this.notesOpen));
        this.go(this.index);
        if (this.notesOpen) this.sections[this.index].querySelector('.notes').focus();
        else document.getElementById('notesToggle').focus();
    }
    toggleEditing() {
        this.editing = !this.editing;
        document.body.classList.toggle('editing', this.editing);
        this.stage.querySelectorAll('[data-edit]').forEach(element => {
            if (this.editing) element.setAttribute('contenteditable', 'plaintext-only');
            else element.removeAttribute('contenteditable');
        });
        const button = document.getElementById('editToggle');
        button.classList.toggle('active', this.editing);
        button.setAttribute('aria-pressed', String(this.editing));
        this.status(this.editing ? 'Editing: click outlined text. Escape exits. Edits autosave locally.' : 'Editing off.');
    }
    saveHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#stage').replaceChildren();
        clone.querySelector('body').classList.remove('editing', 'controls-expanded');
        clone.querySelector('#saveStatus').textContent = '';
        clone.querySelector('#saved-edits')?.remove();
        const saved = document.createElement('script');
        saved.id = 'saved-edits';
        saved.type = 'application/json';
        saved.textContent = JSON.stringify(this.edits).replaceAll('<', '\\u003c');
        clone.querySelector('#presentation-controller').before(saved);
        const blob = new Blob(['<!doctype html>\n', clone.outerHTML], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'day-2-edited.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status('HTML exported with edits. Keep it beside presentation.html for linked course resources.');
    }
    bind() {
        const jump = document.getElementById('slideSelect');
        jump.replaceChildren();
        for (const day of new Set(slides.map(slide => slide.day))) {
            const group = document.createElement('optgroup');
            group.label = `Day ${day}`;
            slides.forEach((slide,index) => {
                if (slide.day !== day) return;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${slide.local}. ${slide.title}`;
                group.append(option);
            });
            jump.append(group);
        }
        jump.addEventListener('change', () => this.go(Number(jump.value)));
        addEventListener('resize', () => this.fitStage());
        addEventListener('hashchange', () => this.readHash());
        document.getElementById('previous').addEventListener('click', () => this.go(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.go(this.index + 1));
        document.getElementById('daySelect').addEventListener('change', event => this.goDay(Number(event.target.value)));
        document.getElementById('notesToggle').addEventListener('click', () => this.toggleNotes());
        document.getElementById('editToggle').addEventListener('click', () => this.toggleEditing());
        document.getElementById('moreToggle').addEventListener('click', event => {
            const expanded = document.body.classList.toggle('controls-expanded');
            event.currentTarget.setAttribute('aria-expanded', String(expanded));
            this.fitStage();
        });
        document.getElementById('export').addEventListener('click', () => this.saveHtml());
        document.getElementById('fullscreen').addEventListener('click', async () => {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (error) { this.status(`Full screen unavailable: ${error.message}`); }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (this.editing) this.toggleEditing();
                else if (this.notesOpen) this.toggleNotes();
                return;
            }
            if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
            if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
            if (this.notesOpen) {
                if (event.key.toLowerCase() === 'n') this.toggleNotes();
                return;
            }
            if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.go(this.index + 1); }
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.go(this.index - 1); }
            if (event.key === 'Home') { event.preventDefault(); this.go(0); }
            if (event.key === 'End') { event.preventDefault(); this.go(this.sections.length - 1); }
            if (/^[1-4]$/.test(event.key)) this.goDay(Number(event.key));
            if (event.key.toLowerCase() === 'n') this.toggleNotes();
            if (event.key.toLowerCase() === 'e') this.toggleEditing();
        });
        let lastWheel = 0;
        document.addEventListener('wheel', event => {
            if (this.editing || this.notesOpen || event.ctrlKey || Math.abs(event.deltaY) < 12 || event.target.closest('.deck-controls, .d1-demo, .d2-live')) return;
            event.preventDefault();
            if (performance.now() - lastWheel < 550) return;
            lastWheel = performance.now();
            this.go(this.index + Math.sign(event.deltaY));
        }, {passive:false});
        let touchStart = null;
        this.stage.addEventListener('touchstart', event => { touchStart = event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null; }, {passive:true});
        this.stage.addEventListener('touchend', event => {
            if (!touchStart || this.editing || this.notesOpen || event.target.closest('a, button, input, select, .d1-demo, .d2-live, [contenteditable]')) return;
            const horizontal = event.changedTouches[0].clientX - touchStart.x;
            const vertical = event.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(horizontal) > 45 && Math.abs(horizontal) > Math.abs(vertical)) this.go(this.index + (horizontal < 0 ? 1 : -1));
            touchStart = null;
        }, {passive:true});
        const hotzone = document.getElementById('editHotzone');
        const toggle = document.getElementById('editToggle');
        let hideTimeout;
        [hotzone, toggle].forEach(element => {
            element.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); toggle.classList.add('show'); });
            element.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!this.editing) toggle.classList.remove('show'); }, 400); });
        });
        hotzone.addEventListener('click', () => this.toggleEditing());
    }
}
window.presentation = new SlidePresentation();
bindDayTwoOpening();
bindDayTwoLearning();
</script>
