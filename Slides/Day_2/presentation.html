:root{--ink:#14213d;--muted:#536476;--line:#dbe3ea;--soft:#f7f9fb;--accent:#234e70;--teal:#216869;--slide-bg:#fff;--stage-bg:#e8eef3;--radius:18px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{transition:none!important;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:Inter,sans-serif;color:var(--ink)}
.slide{padding:64px 90px 112px;background:linear-gradient(135deg,#fff 65%,#f5f9fc);border-top:10px solid var(--accent)}
.slide-top{display:flex;justify-content:space-between;align-items:center;height:42px;margin-bottom:28px;color:var(--accent);font-size:21px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.slide-top .timing{font-size:19px;letter-spacing:.5px;color:var(--muted)}
h1{font-size:70px;line-height:1.09;letter-spacing:-2.4px;max-width:1650px;margin:0 0 22px;font-weight:760}.subtitle{font-size:30px;line-height:1.4;color:var(--muted);margin:0 0 28px;max-width:1630px}.content{height:650px;display:flex;flex-direction:column;gap:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.panel{padding:28px 32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);min-width:0}.panel.blue{background:#edf5fb;border-color:#bfd3e3}.panel.teal{background:#edf7f5;border-color:#b7d8d1}.panel.warning{background:#fff6e9;border-color:#e9cc9d}
h2{font-size:34px;letter-spacing:-.6px;line-height:1.2;margin:0 0 18px;color:var(--accent)}p,li{font-size:29px;line-height:1.43;margin:0 0 17px}ul,ol{margin:0;padding-left:35px}li:last-child,p:last-child{margin-bottom:0}strong{font-weight:750}.small{font-size:24px;color:var(--muted);line-height:1.4}.eyebrow{font-size:23px;color:var(--teal);font-weight:750;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.equation{padding:28px 32px;font-size:42px;line-height:1.4;border-left:6px solid var(--teal);background:#edf7f5;border-radius:0 15px 15px 0}.equation small{display:block;font-size:26px;margin-top:10px;color:var(--muted)}
code,pre,.dna{font-family:Consolas,monospace}code{font-size:.9em;color:#174d74;background:#edf3f7;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}pre{font-size:27px;line-height:1.5;background:#142c43;color:#fff;border-radius:16px;padding:28px 32px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}pre code{background:none;color:inherit;padding:0;font-size:inherit}table{border-collapse:collapse;width:100%;font-size:28px;line-height:1.4}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}th{color:var(--accent);background:#edf3f7;font-weight:750}td strong{color:var(--teal)}
.takeaway{position:absolute;left:90px;right:90px;bottom:42px;border-top:2px solid var(--line);padding-top:16px;display:grid;grid-template-columns:145px 1fr;gap:20px;font-size:25px;line-height:1.35}.takeaway strong{color:var(--accent)}.flow{display:flex;align-items:stretch;gap:18px}.flow .node{flex:1;padding:28px 22px;background:#edf5fb;border:1px solid #bfd3e3;border-radius:16px;text-align:center;font-size:29px;line-height:1.4;min-width:0}.flow .arrow{align-self:center;color:var(--teal);font-size:40px}.node b{display:block;color:var(--accent);margin-bottom:12px}.node span{font-size:24px;color:var(--muted)}
.break h1{font-size:126px;max-width:1350px}.break .subtitle{font-size:42px}.break .content{justify-content:center;height:600px}.break{background:linear-gradient(110deg,#edf5fb,#fff 75%)}.dna{display:flex;align-items:center;gap:12px;font-size:28px;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.motif{padding:9px 14px;background:#d9ece7;color:#164f45;border-radius:8px;font-weight:750}.motif.second{background:#d9e9f6;color:#1d4e73}.position{font:22px Inter,sans-serif;color:var(--muted)}
.notes{display:none;position:absolute;inset:40px;z-index:10;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:55px;overflow:auto}.notes.show{display:block}.notes h2{font-size:46px}.notes p{font-size:32px;line-height:1.55}.notes .note-heading{font-size:24px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:750;margin-top:30px}
.deck-controls{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#fff;border:1px solid #c5d3df;border-radius:14px;box-shadow:0 6px 22px #14213d1c;max-width:calc(100vw - 12px);bottom:8px;white-space:nowrap}button,select{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:36px;padding:6px 10px}button:hover,select:hover{background:#edf3f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #216869;outline-offset:2px}button[aria-pressed=true]{background:#d9ece7}#counter{font-size:12px;min-width:46px;text-align:center;color:var(--muted)}#daySelect{width:88px}
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:70px;z-index:1002}.edit-toggle{position:fixed;left:12px;top:12px;z-index:1003;opacity:0;pointer-events:none;border:1px solid var(--line);transition:opacity .2s}.edit-toggle.show,.edit-toggle.active,.edit-toggle:focus{opacity:1;pointer-events:auto}.editing [data-edit]{outline:2px dashed #216869;outline-offset:3px;cursor:text}.save-status{position:fixed;top:12px;right:12px;background:#fff;padding:8px 15px;border-radius:8px;color:#234e70;font-size:13px;z-index:1001}.save-status:empty{display:none}.progress{position:fixed;bottom:0;left:0;width:100%;height:4px;background:#dbe3ea;z-index:1001}.progress div{height:100%;background:var(--accent);transition:width .15s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:#175c8e;text-decoration-thickness:2px;text-underline-offset:5px}.toolbar-extra{display:none}body.controls-expanded .toolbar-extra{display:inline-block}
@media(max-width:600px){.deck-controls{gap:1px;padding:4px}button,select{padding:4px 6px;min-height:34px;font-size:12px}#daySelect{width:69px}#counter{min-width:36px;font-size:10px}}
@media print{.slide{background:#fff}.notes,.edit-hotzone,.edit-toggle,.save-status,.progress,.sr-only{display:none!important}@page{size:20in 11.25in;margin:0}}
.node span{display:block;margin-top:10px}.takeaway{bottom:90px}.slide[data-day="4"]:last-child .content{gap:18px}.slide[data-day="4"]:last-child .content .panel{padding:22px 28px}.deck-controls{flex-wrap:wrap;width:max-content;justify-content:center}

/* Story scenes: one question or visual, with teaching depth in Notes. */
.slide{display:flex;flex-direction:column;padding:58px 90px 54px}
.slide-top{flex-shrink:0;margin-bottom:30px}
h1{font-size:82px;line-height:1.06;letter-spacing:-2.8px;margin-bottom:18px}
.subtitle{font-size:29px;line-height:1.35;margin-bottom:22px;flex-shrink:0}
.content{height:auto;min-height:0;flex:1;justify-content:center;gap:30px}
.takeaway{position:static;flex-shrink:0;margin-top:28px;font-size:25px;padding-top:18px}
.story-question{font-size:58px;line-height:1.2;letter-spacing:-1.5px;font-weight:650;color:var(--teal);max-width:1600px;margin:0}
.story-statement{font-size:74px;line-height:1.2;letter-spacing:-2px;font-weight:680;color:var(--accent)}
.story-caption{font-size:28px;color:var(--muted);margin:0;line-height:1.45}
.story-task{border-left:6px solid var(--teal);padding:18px 30px;background:#edf7f5;border-radius:0 14px 14px 0}
.story-task p{font-size:33px;margin-bottom:15px;max-width:1480px}.story-task a,.story-links{font-size:27px}
.content .panel{padding:30px 34px}.content .panel p{font-size:34px;line-height:1.4}.content .panel h2{font-size:31px}
.content .flow .node{padding:34px 24px;font-size:32px}.content .node b{font-size:34px}
.content pre{font-size:36px;line-height:1.5}.content .equation{font-size:48px;padding:24px 30px}
.sequence-pair{display:flex;flex-direction:column;gap:26px}.sequence-pair>div{display:grid;grid-template-columns:220px 1fr 1fr;gap:40px;align-items:center;padding:15px 0;font-size:36px}
.sequence-pair .motif{text-align:center;font:600 50px Consolas,monospace;padding:26px 20px}.sequence-pair .sequence-axis{font-size:26px;color:var(--muted);text-align:center;padding:0}
.score-chart{width:100%;max-height:510px;overflow:visible;flex-shrink:1;min-height:0}.chart-label{font:500 29px Inter,sans-serif;fill:#14213d}.chart-value{font:600 25px Inter,sans-serif;fill:#14213d}.chart-axis{font:400 24px Inter,sans-serif;fill:#536476}
.chart-legend{display:flex;gap:34px;font-size:27px;color:var(--muted)}.chart-legend span{display:flex;align-items:center;gap:12px}.chart-legend i{width:25px;height:16px;border-radius:3px}
.break .content{height:auto}.break h1{font-size:110px}.break .subtitle{font-size:36px}.break .story-statement{font-size:64px}
.notes h2{font-size:38px}.notes p{font-size:29px}.notes details{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.notes summary{font-size:28px;color:var(--accent);font-weight:650;cursor:pointer}.reference{margin-top:24px}.reference p,.reference li{font-size:27px}.reference .flow{margin:22px 0}.reference .panel{margin-bottom:22px}.reference h3{font-size:30px}.reference .equation{font-size:34px}.reference pre{font-size:25px}.reference .dna{white-space:normal;flex-wrap:wrap}
.slide[data-day="4"]:last-child .content{gap:30px}.slide[data-day="4"]:last-child .content .panel{padding:30px 34px}
@media print{*,*::before,*::after{transition:none!important;animation:none!important}.slide{display:flex!important}.notes{display:none!important}}

size=\"88\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >h₁\u003c/text>\u003ctext x=\"1050\" y=\"575\" font-size=\"43\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >ReLU\u003c/text>\u003ctext x=\"1515\" y=\"575\" font-size=\"40\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Feature value\u003c/text>\u003ctext x=\"864\" y=\"680\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >The output becomes an input to the next calculation\u003c/text>\u003c/svg>","notes":"A hidden unit computes a weighted combination and an activation. Its value becomes an input to a later calculation. It need not correspond to a named motif, and hidden does not mean mysterious or inaccessible: we can inspect its computation.\n","point":"Follow counts through the weighted sum and ReLU to h₁. The arrow continues: this number is an input for the next stage.","transition":"One new feature is useful; several can capture different combinations.","sourceNote":"Constructed teaching example, not a fitted model or empirical result. The 21-base Day 1 sequence has 18 overlapping four-base windows; only TATA=2, AATG=1 and CGCG=3 are displayed. Suggested Section 1 pacing totals 25 minutes; not rehearsed."},{"day":2,"id":"day-2-s1-hidden-layer","anchor":"day-2-s1-hidden-layer","sectionOne":true,"kind":"day-two-opening","time":"13:15–15:45 (2:30)","title":"Several units learn different combinations","subtitle":"","takeaway":"","body":"\u003cdiv class=\"d2-live\" data-hidden-layer>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 600\" role=\"img\" aria-label=\"Three hidden neurons receive the same counts, each through its own weights\">\u003ctitle>Three hidden neurons receive the same counts, each through its own weights\u003c/title>\u003cg data-unit-path=\"0\" opacity=\"1\">\u003cpath d=\"M278 180 L662 180\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"3\" />\u003cpath d=\"M278 350 L662 180\" fill=\"none\" stroke= " text-anchor=\"middle\" font-weight=\"400\" >h₁\u003c/text>\u003ccircle cx=\"720\" cy=\"350\" r=\"58\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" data-hidden-node=\"1\"/>\u003ctext x=\"720\" y=\"364.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >h₂\u003c/text>\u003ccircle cx=\"720\" cy=\"520\" r=\"58\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" data-hidden-node=\"2\"/>\u003ctext x=\"720\" y=\"534.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >h₃\u003c/text>\u003ctext x=\"230\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Counts\u003c/text>\u003ctext x=\"720\" y=\"85\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Hidden features\u003c/text>\u003ctext x=\"1260\" y=\"160\" font-size=\"36\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Own weights\u003c/text>\u003ctext x=\"1260\" y=\"255\" font-size=\"55\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" data-unit-weights>0.6, 0.8, −0.2\u003c/text>\u003ctext x=\"1260\" y=\"365\" font-size=\"43\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-unit-bias>bias −0.4\u003c/text>\u003ctext x=\"1260\" y=\"495\" font-size=\"45\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" data-unit-activation>h₁ = ReLU(1.0) = 1.0\u003c/text>\u003c/svg>\u003cdiv class=\"d2-controls\" role=\"group\" aria-label=\"Highlight a hidden unit\">\u003cbutton type=\"button\" data-unit=\"0\" aria-pressed=\"true\">h₁\u003c/button>\u003cbutton type=\"button\" data-unit=\"1\" aria-pressed=\"false\">h₂\u003c/button>\u003cbutton type=\"button\" data-unit=\"2\" aria-pressed=\"false\">h₃\u003c/button>\u003c/div>\u003cp data-unit-readout aria-live=\"polite\">h₁: own weights + own bias → ReLU → 1.0\u003c/p>\u003c/div>","notes":"Units in the same layer receive the same inputs but have their own weights and biases. They can respond to different combinations of counts. This fully connected example is an explanatory bridge; our later CNN will use local connections and share weights.\n","point":"Select h₁, h₂, then h₃. Inputs stay fixed; the highlighted incoming connections belong to the selected neuron.","transition":"Combine the hidden features into the final output.","sourceNote":"Constructed teaching example, not a fitted model or empirical result. The 21-base Day 1 sequence has 18 overlapping four-base windows; only TATA=2, AATG=1 and CGCG=3 are displayed. Suggested Section 1 pacing totals 25 minutes; not rehearsed. Hidden weights: h₁=ReLU(0.6×2+0.8×1−0.2×3−0.4)=1; h₂=ReLU(−0.3×2+0.2×1+0.5×3−0.1)=1; h₃=ReLU(0.2×2−0.5×1+0.1×3−0.4)=0. Output weights 1.2, −0.7, 0.5, bias −0.2 give z=0.3 and sigmoid(z)=0.574443. Independent invented weights for illustration; not a fitted biological explanation."},{"day":2,"id":"day-2-s1-output","anchor":"day-2-s1-output","sectionOne":true,"kind":"day-two-opening","time":"15:45–18:15 (2:30)","title":"Combine the features into a probability","subtitle":"","takeaway":"","body":"\u003cdiv class=\"d2-live\" data-forward>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 600\" role=\"img\" aria-label=\"Forward pass: counts 2, 1, 3 produce hidden features 1, 1, 0, a logit of 0.3 and probability 0.574\">\u003ctitle>Forward pass: counts 2, 1, 3 produce hidden features 1, 1, 0, a logit of 0.3 and probability 0.574\u003c/title>\u003cg data-unit-path=\"0\" opacity=\"1\">\u003cpath d=\"M278 180 L662 180\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"3\" />\u003cpath d=\"M278 350 L662 180\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"3\" />\u003cpath d=\"M278 520 L662 180\" fill=\"none\" stroke=\"#7B4FA3\" stroke-width=\"3\" />\u003c/g>\u003cg data-unit-path=\"1\" opacity=\"1\">\u003cpath d=\"M278 180 L662 350\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"3\" />\u003cpath d=\"M278 350 L662 350\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"3\" />\u003cpath d= le cx=\"1102\" cy=\"425\" r=\"32\" fill=\"#D55E00\" fill-opacity=\".09\"/>\u003ctext x=\"1102\" y=\"440\" font-size=\"46\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ccircle cx=\"1170\" cy=\"425\" r=\"32\" fill=\"#D55E00\" fill-opacity=\".09\"/>\u003ctext x=\"1170\" y=\"440\" font-size=\"46\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ccircle cx=\"1238\" cy=\"425\" r=\"32\" fill=\"#D55E00\" fill-opacity=\".09\"/>\u003ctext x=\"1238\" y=\"440\" font-size=\"46\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"1306\" y=\"440\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"1374\" y=\"440\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"1442\" y=\"440\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ctext x=\"1510\" y=\"440\" font-size=\"46\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003ctext x=\"864\" y=\"650\" font-size=\"54\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >How could the weights learn to notice it?\u003c/text>\u003c/svg>","notes":"Invite ideas: a related sequence pattern, its position, combinations, or alternatives. There is no answer key. Use the suggestions to separate what an input makes available from what training might learn, then ask how the weights are actually obtained.","point":"Invite several suggestions, then point to the weights as the next unanswered question. There is no expected-answer checklist.","transition":"Next: how do labeled examples change all these weights?","sourceNote":"Constructed teaching example, not a fitted model or empirical result. The 21-base Day 1 sequence has 18 overlapping four-base windows; only TATA=2, AATG=1 and CGCG=3 are displayed. Suggested Section 1 pacing totals 25 minutes; not rehearsed."},{"day":2,"id":"day-2-s2-section","anchor":"day-2-s2-section","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"Learning changes the weights","time":"25:00–25:15 (0:15)","body":"\u003cdiv class=\"learning-section-title\">\u003c/div>","subtitle":"","takeaway":"","notes":"We can now follow a prediction through a network. We chose the previous weights so that we could understand the calculation. Training uses labeled examples to adjust those weights and biases.","point":"Pause on the title; connect directly to Section 1’s final question about how weights are obtained.","transition":"Which parts of the network are actually learned?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-parameters","anchor":"day-2-s2-parameters","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"The connections contain th 3c/button>\u003c/div>\u003c/div>","subtitle":"","takeaway":"","notes":"A connection has a weight; each neuron also has a bias. Hidden and output parameters are fitted together. In an actual network, weights generally start from randomized values and biases follow the initialization scheme. The input encoding, architecture and training settings remain choices made by us. Labels do not directly install named biological detectors.","point":"Touch one weight and its receiving neuron’s bias before showing the wider set. Keep parameter numbers in Notes rather than labeling every edge.","transition":"Before changing a parameter, use the current values to make a prediction.\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-forward","anchor":"day-2-s2-forward","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"First, make a predicti on applies the chain rule through the operations already used in the forward pass. It computes loss derivatives for hidden parameters as well as output parameters, reusing intermediate calculations. It does not adjust weights by itself; the optimizer performs that next operation. Some derivatives can be zero—for example, through an inactive ReLU on this example. These are computational sensitivities, not biological explanations or causal attributions.","point":"Reveal the output sensitivity first, then extend backward into one hidden unit. Avoid a separate, reversed copy of the network or a full derivative tree.","transition":"Now we have gradients. How are they used to change the parameters?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-update","anchor":"day-2-s2-update","sectionLearning":true,"kind":"day-two-opening day-two-learning","title \u003c/text>\u003ctext x=\"180\" y=\"230\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ctext x=\"225\" y=\"230\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"270\" y=\"230\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ctext x=\"315\" y=\"230\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003cpath d=\"M70 365 L335 365\" fill=\"none\" stroke=\"#c4d0d9\" stroke-width=\"3\" />\u003ctext x=\"90\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ctext x=\"135\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ctext x=\"180\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003ctext x=\"225\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ctext x=\"270\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ctext x=\"315\" y=\"335\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003cpath d=\"M70 470 L335 470\" fill=\"none\" stroke=\"#c4d0d9\" stroke-width=\"3\" />\u003ctext x=\"90\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >G\u003c/text>\u003ctext x=\"135\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"180\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >T\u003c/text>\u003ctext x=\"225\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >A\u003c/text>\u003ctext x=\"270\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ctext x=\"315\" y=\"440\" font-size=\"35\" fill=\"#18344b\" text-anchor=\"middle\" font-weight=\"600\" >C\u003c/text>\u003ctext x=\"245\" y=\"560\" font-size=\"35\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >One minibatch: up to 64 examples\u003c/text>\u003cpath d=\"M435 300 L620 300\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M620 300 L604.2035138859733 308.62965969487567\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M620 300 L604.2035138859733 291.37034030512433\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003ccircle cx=\"765\" cy=\"300\" r=\"100\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"765\" y=\"311.2\" font-size=\"35\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Mean loss\u003c/text>\u003cpath d=\"M880 300 L1030 300\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M1030 300 L1014.2035138859733 308.62965969487567\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M1030 300 L1014.2035138859733 291.37034030512433\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003ccircle cx=\"1150\" cy=\"300\" r=\"90\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1150\" y=\"320.8\" font-size=\"65\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >∇L\u003c/text>\u003cpath d=\"M1255 300 L1405 300\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M1405 300 L1389.2035138859733 308.62965969487567\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003cpath d=\"M1405 300 L1389.2035138859733 291.37034030512433\" fill=\"none\" stroke=\"#697782\" stroke-width=\"4\" />\u003ccircle cx=\"1510\" cy=\"300\" r=\"82\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1510\" y=\"313.44\" font-size=\"42\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Step\u003c/text>\u003ctext x=\"1150\" y=\"485\" font-size=\"35\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Combined gradient\u003c/text>\u003ctext x=\"1510\" y=\"485\" font-size=\"35\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >One update\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"Instead of updating separately for every example or waiting for the entire dataset, this workflow averages loss over a minibatch of up to 64 examples. Its gradient therefore combines their signals. Different examples can push a weight in different directions. One minibatch produces one optimizer step here; the next batch sees the updated weights. Batch size 64 is a chosen setting, not a requirement of neural networks.","point":"Keep individual sequence letters visible; avoid portraying a batch as one merged DNA sequence. Put batch size next to the group, not on each sequence.","transition":"When have we made one pass through the training set?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-epoch","anchor":"day-2-s2-epoch","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"An epoch is one pass through the data","time":"39:00–40:30 (1:30)","body":"\u003cdiv class=\"d2-live learning-live\" data-learning=\"epoch\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 600\" role=\"img\" aria-label=\"Day 2 learning: epoch\">\u003ctitle>Day 2 learning: epoch\u003c/title>\u003ctext x=\"864\" y=\"35\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >720 training examples\u003c/text>\u003cg data-epoch-batch=\"0\">\u003ccircle cx=\"180\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"180\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"180\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 1\u003c/text>\u003ctext x=\"180\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 1–64\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"1\">\u003ccircle cx=\"450\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"450\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"450\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 2\u003c/text>\u003ctext x=\"450\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 65–128\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"2\">\u003ccircle cx=\"720\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"720\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"720\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 3\u003c/text>\u003ctext x=\"720\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 129–192\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"3\">\u003ccircle cx=\"990\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"990\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"990\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 4\u003c/text>\u003ctext x=\"990\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 193–256\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"4\">\u003ccircle cx=\"1260\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1260\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"1260\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 5\u003c/text>\u003ctext x=\"1260\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 257–320\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"5\">\u003ccircle cx=\"1530\" cy=\"190\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1530\" y=\"204.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"1530\" y=\"300\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 6\u003c/text>\u003ctext x=\"1530\" y=\"345\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 321–384\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"6\">\u003ccircle cx=\"180\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"180\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"180\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 7\u003c/text>\u003ctext x=\"180\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 385–448\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"7\">\u003ccircle cx=\"450\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"450\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"450\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 8\u003c/text>\u003ctext x=\"450\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 449–512\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"8\">\u003ccircle cx=\"720\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"720\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"720\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 9\u003c/text>\u003ctext x=\"720\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 513–576\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"9\">\u003ccircle cx=\"990\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"990\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"990\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 10\u003c/text>\u003ctext x=\"990\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 577–640\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"10\">\u003ccircle cx=\"1260\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1260\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >64\u003c/text>\u003ctext x=\"1260\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 11\u003c/text>\u003ctext x=\"1260\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 641–704\u003c/text>\u003c/g>\u003cg data-epoch-batch=\"11\">\u003ccircle cx=\"1530\" cy=\"420\" r=\"65\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1530\" y=\"434.4\" font-size=\"45\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >16\u003c/text>\u003ctext x=\"1530\" y=\"530\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Batch 12\u003c/text>\u003ctext x=\"1530\" y=\"575\" font-size=\"25\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" data-epoch-rows>Rows 705–720\u003c/text>\u003c/g>\u003c/svg>\u003cdiv class=\"d2-controls\">\u003cbutton type=\"button\" data-epoch-next >Next update\u003c/button>\u003cbutton type=\"button\" data-epoch-reset >Reset\u003c/button>\u003c/div>\u003cp data-learning-readout aria-live=\"polite\">Epoch 1 · 0 / 12 updates · 0 / 720 examples\u003c/p>\u003c/div>","subtitle":"","takeaway":"","notes":"An epoch is one pass through all training examples. With 720 primary training rows and batch size 64, the final batch has 16 examples, so each epoch has twelve updates. The code reshuffles training order each epoch and runs 24 epochs by default. An update and an epoch are different units. The paired order-control dataset has a different training count, so its number of batches differs.","point":"Follow one marker over all twelve groups, then return to the start in a different order. Keep the twelve groups simple so the diagram remains readable.","transition":"We can now recognize those operations in the working training code.\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed. Epoch row labels illustrate positions within a training set, not real sample IDs. Subsequent passes show a deterministic permutation for visual explanation rather than Torch&#x27;s actual shuffled order."},{"day":2,"id":"day-2-s2-walkthrough","anchor":"day-2-s2-walkthrough","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"Find the operations in the code","time":"40:30–43:30 (3:00)","body":"\u003cdiv class=\"d2-live learning-live learning-code\" data-learning=\"code\">\u003cpre aria-label=\"One minibatch training step\">\u003ccode>\u003cdiv data-code-line=\"0\" class=\"current\">optimizer.zero_grad()\u003c/div>\u003cdiv data-code-line=\"1\" class=\"\">logits = model(inputs[indices])\u003c/div>\u003cdiv data-code-line=\"2\" class=\"\">loss = nn.functional.binary_cross_entropy_with_logits(logits, labels[indices])\u003c/div>\u003cdiv data-code-line=\"3\" class=\"\">loss.backward()\u003c/div>\u003cdiv data-code-line=\"4\" class=\"\">optimizer.step()\u003c/div>\u003c/code>\u003c/pre>\u003cdiv class=\"d2-controls\">\u003cbutton type=\"button\" data-code-next >Next operation\u003c/button>\u003cbutton type=\"button\" data-code-reset >Reset\u003c/button>\u003c/div>\u003cp data-learning-readout aria-live=\"polite\">Clear old gradients before the next minibatch.\u003c/p>\u003c/div>","subtitle":"","takeaway":"","notes":"Trace one already-selected minibatch; its enclosing loop and tensor setup stay in Notes. Clearing old gradients prevents unintended accumulation. The model computes logits; the logits-based binary cross-entropy handles the sigmoid relationship internally, so do not sigmoid these logits before this loss call. Backward computes gradients; step applies the optimizer update. Ask the audience to point to the line matching each operation, conversationally. This static excerpt is sufficient; running the full workflow is reserved for Section 5.","point":"Highlight forward, then loss, then backward, then update. Finally revisit zero_grad as preparation for the next batch. The canonical source combines the forward and loss calls on one line; separating them here changes presentation only.","transition":"If training loss keeps falling, should we automatically keep the last set of weights?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-validation","anchor":"day-2-s2-validation","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"Keep the checkpoint that validates best","time":"43:30–46:00 (2:30)","body":"\u003cdiv class=\"d2-live learning-live\" data-learning=\"validation\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 560\" role=\"img\" aria-label=\"Day 2 learning: validation\">\u003ctitle>Day 2 learning: validation\u003c/title>\u003ctext x=\"420\" y=\"35\" font-size=\"43\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Training loss\u003c/text>\u003cg data-chart=\"train\" data-x=\"140\" data-y=\"90\" data-w=\"580\" data-h=\"335\" data-xmin=\"1\" data-xmax=\"24\" data-ymin=\"0.4\" data-ymax=\"0.7\">\u003cpath d=\"M140 425 L745 425\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M745 425 L729.2035138859733 433.62965969487567\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M745 425 L729.2035138859733 416.37034030512433\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M140 425 L140 70\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M140 70 L148.62965969487564 85.7964861140267\" fill=\"none\" stroke=\"#a9bdc \" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1570 425 L1554.2035138859733 433.62965969487567\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1570 425 L1554.2035138859733 416.37034030512433\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M965 425 L965 70\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M965 70 L973.6296596948756 85.7964861140267\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M965 70 L956.3703403051244 85.7964861140267\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M965.0 425 L965.0 435\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"2\" />\u003ctext x=\"965.0\" y=\"476\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >1\u003c/text>\u003cpath d=\"M1141.5217391304348 425 L1141.5217391304348 435\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"2\" />\u003ctext x=\"1141.5217391304348\" y=\"476\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >8\u003c/text>\u003cpath d=\"M1343.2608695652175 425 L1343.2608695652175 435\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"2\" />\u003ctext x=\"1343.2608695652175\" y=\"476\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >16\u003c/text>\u003cpath d=\"M1545.0 425 L1545.0 435\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"2\" />\u003ctext x=\"1545.0\" y=\"476\" font-size=\"29\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >24\u003c/text>\u003ctext x=\"940\" y=\"435.0\" font-size=\"29\" fill=\"#697782\" text-anchor=\"end\" font-weight=\"400\" >0.5\u003c/text>\u003ctext x=\"940\" y=\"100.0\" font-size=\"29\" fill=\"#697782\" text-anchor=\"end\" font-weight=\"400\" >0.7\u003c/text>\u003cpolyline points=\"965.00,224.00 1141.52,157.00 1343.26,190.50 1545.00,207.25\" fill=\"none\" stroke=\"#D55E00\" stroke-width=\"7\" stroke-linejoin=\"round\"/>\u003ctext x=\"1255.0\" y=\"530\" font-size=\"35\" fill=\"#697782\" text-anchor=\"middle\" font-weight=\"400\" >Epoch\u003c/text>\u003cg data-chart-overlay>\u003c/g>\u003c/g>\u003c/svg>\u003cdiv class=\"d2-controls\">\u003cbutton type=\"button\" data-select-checkpoint >Select the checkpoint\u003c/button>\u003c/div>\u003cp data-learning-readout aria-live=\"polite\">Training improves; validation does not keep improving.\u003c/p>\u003c/div>","subtitle":"","takeaway":"","notes":"Training loss alone cannot tell us whether predictions improve on held-out examples. Loss and ROC-AUC measure different things, so their numerical heights and any apparent crossing are not comparable. Our workflow evaluates validation ROC-AUC after each epoch, saves an improving checkpoint and restores the highest-scoring one, keeping the earlier epoch on a tie. It still runs the declared 24 epochs; checkpoint selection is not early stopping. Validation labels guide this selection, but never enter backpropagation. Test results remain outside development and every tuning decision.","point":"Read the training panel first, then the validation panel, then identify the chosen checkpoint. Suggested construction: epochs 1/8/16/24, training loss 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; select epoch 8. Store this provenance in Notes, with no claim that it is an observed course result.","transition":"Once we select the weights, what happens when a new sequence arrives?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-inference","anchor":"day-2-s2-inference","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"Fitting ends; inference applies","time":"46:00–47:30 (1:30)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Training updates parameters using labels; inference applies the selected weights without updates\">\u003ctitle>Training updates parameters using labels; inference applies the selected weights without updates\u003c/title>\u003ctext x=\"445\" y=\"60\" font-size=\"55\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Training\u003c/text>\u003ctext x=\"1280\" y=\"60\" font-size=\"55\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Inference\u003c/text>\u003cpath d=\"M170 210 L400 245\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M170 210 L400 355\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M170 300 L400 245\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M170 300 L400 355\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M170 390 L400 245\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M170 390 L400 355\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M400 245 L630 300\" fill=\"none\" stroke=\"#b4c7d 003cpath d=\"M1235 245 L1465 300\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003cpath d=\"M1235 355 L1465 300\" fill=\"none\" stroke=\"#b4c7d4\" stroke-width=\"4\" />\u003ccircle cx=\"1005\" cy=\"210\" r=\"27\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1005\" y=\"224.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ccircle cx=\"1005\" cy=\"300\" r=\"27\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1005\" y=\"314.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ccircle cx=\"1005\" cy=\"390\" r=\"27\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1005\" y=\"404.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ccircle cx=\"1235\" cy=\"245\" r=\"27\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1235\" y=\"259.08\" font-size=\"44\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ccircle cx=\"1235\" cy=\"355\" r=\"27\" fill=\"white\" stroke=\"#D55E00\" stroke-width=\"5\" />\u003ctext x=\"1235\" y=\"369.08\" font-size=\"44\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ccircle cx=\"1465\" cy=\"300\" r=\"27\" fill=\"white\" stroke=\"#0072B2\" stroke-width=\"5\" />\u003ctext x=\"1465\" y=\"314.08\" font-size=\"44\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >\u003c/text>\u003ctext x=\"400\" y=\"570\" font-size=\"38\" fill=\"#0072B2\" text-anchor=\"middle\" font-weight=\"400\" >Weights change with updates\u003c/text>\u003ctext x=\"1250\" y=\"570\" font-size=\"38\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >Selected weights stay fixed\u003c/text>\u003cpath d=\"M630 350 Q700 500 400 480 Q190 480 170 390\" stroke=\"#0072B2\" stroke-width=\"5\" stroke-dasharray=\"12 10\" fill=\"none\"/>\u003cpath d=\"M200 410 L170 390\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M170 390 L187.93034484678407 391.582003057963\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003cpath d=\"M170 390 L178.3565969945751 405.9426248362764\" fill=\"none\" stroke=\"#0072B2\" stroke-width=\"4\" />\u003ctext x=\"1290\" y=\"670\" font-size=\"49\" fill=\"#D55E00\" text-anchor=\"middle\" font-weight=\"400\" >New input → P(B)\u003c/text>\u003c/svg>","subtitle":"","takeaway":"","notes":"Inference applies the learned computation to new inputs. It does not run loss.backward or optimizer.step. Our prediction function uses eval mode and a no-gradient inference context, then applies sigmoid to its output logits. Eval mode and disabling gradient tracking have different jobs; neither is itself a learning step. A normal prediction does not change the learned weights. Validation prediction also uses fixed weights during that evaluation, although its labels are then used to score and select a checkpoint.","point":"Keep the probability-producing path the same in both illustrations. Remove the label/loss/update branch from the inference side.","transition":"Which part of this process would you want to inspect before trusting the result?\n","sourceNote":"Constructed teaching figures, not fitted-model results. Carry forward counts (2,1,3), hidden features (1,1,0), output weights (1.2,−0.7,0.5), bias −0.2. Thus z=0.3, sigmoid(z)=0.5744425, and positive-label loss=0.5543552. Holding other parameters fixed gives z=v₁−0.9. At v₁=1.1/1.2/1.3, losses are 0.598139/0.554355/0.513015. Its derivative at 1.2 is (p−1)h₁=−0.4255575. A plain descent step with rate 0.1 gives v₁=1.2425557, p=0.5848112, loss=0.5364662. This is one example and one weight, not Adam training. The separate bowl uses L(w)=(w−1)², start w=3, rates 0.2 and 1.1. Checkpoint curves use epochs 1/8/16/24, losses 0.66/0.61/0.54/0.48, validation ROC-AUC 0.62/0.66/0.64/0.63; choose epoch 8. These are synthetic curves, not an executed course run. Actual code: course_code/03_representations.py fit_cnn; Adam lr=0.002, mean logits-based binary cross-entropy, batch size 64, shuffled epochs, 24 default epochs, earliest highest validation ROC-AUC checkpoint restored after training. Shared predict_cnn uses eval plus inference_mode then sigmoid. Test results never guide development. Suggested Section 2 pacing is 25 minutes, not rehearsed."},{"day":2,"id":"day-2-s2-discussion","anchor":"day-2-s2-discussion","sectionLearning":true,"kind":"day-two-opening day-two-learning","title":"What would you check during learning?","time":"47:30–50:00 (2:30)","body":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1728 720\" role=\"img\" aria-label=\"Open discussion about what to inspect during learning, then transition to positional DNA\">\u003ctitle>Open discussion about what to inspect during learning, then transition to positional DNA\u003c/title>\u003ctext x=\"100\" y=\"120\" font-size=\"62\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\" >What would you want to watch\u003c/text>\u003ctext x=\"100\" y=\"210\" font-size=\"62\" fill=\"#0072B2\" text-anchor=\"start\" font-weight=\"400\" >while this model learns?\u003c/text>\u003cg data-chart=\"discussion\" data-x=\"1000\" data-y=\"330\" data-w=\"540\" data-h=\"220\" data-xmin=\"0\" data-xmax=\"1\" data-ymin=\"0\" data-ymax=\"1\">\u003cpath d=\"M1000 550 L1565 550\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1565 550 L1549.2035138859733 558.6296596948756\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1565 550 L1549.2035138859733 541.3703403051244\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1000 550 L1000 310\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1000 310 L1008.6296596948756 325.7964861140267\" fill=\"none\" stroke=\"#a9bdca\" stroke-width=\"3\" />\u003cpath d=\"M1000 310 L991.3703403051244 325.7964861140267\" fill=\"none\" stroke=\"#a9bdc
